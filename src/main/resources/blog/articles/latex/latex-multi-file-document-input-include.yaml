sections:
  - id: 'why-modular'
    title: 'Зачем делить большой проект на отдельные файлы'
    html: |2-
                              <p>Дипломная работа, магистерская диссертация или монография содержит от
      60 до 200+ страниц, сотни формул, рисунков и таблиц. Вести такой объем в одном файле
      <code>main.tex</code> неудобно: поиск нужного абзаца превращается в бесконечный скроллинг, а
      случайная ошибка в одном месте ломает компиляцию всей работы.</p>
                              <p>Модульная архитектура разбивает проект на логические части: введение,
      отдельные главы, заключение, список литературы и приложения лежат в изолированных файлах,
      собираемых главным корневым документом.</p>
  - id: 'input-vs-include'
    title: "Разница между командами \\input и \\include"
    html: |2-
                              <p>В LaTeX существует две директивы подключения внешних файлов, имеющие
      принципиальные различия (это особенно важно при <a
      href="/blog/diploma-appendices-listings-diagrams-gost">выносе приложений и листингов в дипломной
      работе</a>):</p>
                              <ul>
                                  <li><code>\input{путь/к/файлу}</code> — буквально вставляет
      содержимое файла в текущее место документа «как есть». Не создает разрывов страниц. Идеально для
      преамбулы (<code>\input{preamble.tex}</code>), таблиц или фрагментов текста внутри раздела.</li>
                                  <li><code>\include{путь/к/файлу}</code> — вставляет файл,
      <strong>всегда предваряя и завершая его командой \clearpage</strong> (начиная новую страницу).
      Создает собственный вспомогательный файл <code>.aux</code>, что позволяет использовать механизм
      выборочной компиляции. Идеально для крупных глав (<code>chapter</code>).</li>
                              </ul>
  - id: 'diploma-structure'
    title: 'Разбить диплом на несколько файлов latex: эталонная иерархия папок'
    html: |2-
                              <p>Вот проверенная академическая структура проекта (<strong>разбить
      диплом на несколько файлов latex</strong>), рекомендованная при <a
      href="/blog/latex-diploma-gost">оформлении диплома по ГОСТ в LaTeX</a>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Структура файлов</span></div>
                                  <pre><code>my-diploma/
      ├── main.tex             % Главный файл со сборкой
      ├── preamble.tex         % Все пакеты и настройки ГОСТ
      ├── biblio.tex           % Список литературы (thebibliography)
      ├── chapters/            % Папка с главами работы
      │   ├── 00-intro.tex     % Введение
      │   ├── 01-analysis.tex  % Глава 1: Анализ предметной области
      │   ├── 02-design.tex    % Глава 2: Проектирование системы
      │   ├── 03-impl.tex      % Глава 3: Реализация и тестирование
      │   └── 04-concl.tex     % Заключение
      └── appendices/          % Приложения с кодом
          └── app-a-code.tex</code></pre>
                              </div>
                              <p>В главном файле <code>main.tex</code> сборка выглядит компактно и
      наглядно:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">main.tex</span></div>
                                  <pre><code>\documentclass[a4paper,14pt]{extreport}
      \input{preamble} % Подключаем преамбулу

      \begin{document}
      \include{chapters/00-intro}
      \include{chapters/01-analysis}
      \include{chapters/02-design}
      \include{chapters/03-impl}
      \include{chapters/04-concl}

      \input{biblio} % Список литературы: окружение thebibliography
      \end{document}</code></pre>
                              </div>
                              <p>Класс <code>extreport</code> нужен для кегля 14 пт: стандартный
      <code>report</code> эту опцию игнорирует. Список литературы лежит в <code>biblio.tex</code> в
      виде окружения <code>thebibliography</code>: BibTeX и Biber в Labkeeper пока не запускаются, а
      <code>gost-numeric</code> — стиль biblatex, а не BibTeX, поэтому связка
      <code>\bibliographystyle{gost-numeric}</code> и <code>\bibliography{biblio}</code> не сработает
      даже локально.</p>
  - id: 'includeonly-speed'
    title: 'Команда include latex и выборочная компиляция через includeonly'
    html: |2-
                              <p>Когда вы работаете над конкретной главой, нет смысла каждый раз
      перекомпилировать весь стостраничный документ. <strong>Команда include latex</strong>
      поддерживает волшебную директиву <code>\includeonly</code> в преамбуле:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>% Компилировать только главу 2: номера и ссылки других глав
      % берутся из .aux-файлов прошлой полной сборки
      \includeonly{chapters/02-design}</code></pre>
                              </div>
                              <p>Благодаря отдельным <code>.aux</code>-файлам LaTeX сохранит верные
      перекрестные ссылки и сквозные номера из других глав, если перед этим документ собирался
      целиком, а сборка станет заметно быстрее. В Labkeeper служебные файлы между сборками сохраняются
      не всегда, поэтому перед финальной сборкой уберите <code>\includeonly</code> и соберите документ
      целиком.</p>
  - id: 'subfiles-pkg'
    title: 'Продвинутый подход: пакет subfiles для автономной компиляции глав'
    html: |2-
                              <p>Пакет <code>subfiles</code> позволяет компилировать каждую главу
      <strong>как автономный независимый документ</strong>, так и в составе единого проекта
      <code>main.tex</code> без изменения кода. Автономная сборка главы работает при локальной
      установке LaTeX: в Labkeeper собирается весь проект целиком, отдельный файл собрать нельзя.</p>
tips:
  - title: 'Не указывайте расширение .tex'
    html: |2-
      <p>При вызове <code>\include{chapters/intro}</code> не дописывайте расширение <code>.tex</code>:
      LaTeX подставит его автоматически.</p>
  - title: 'Запрет вложенных include'
    html: |2-
      <p>Внутри файла, подключенного через <code>\include</code>, нельзя вызывать другой
      <code>\include</code>. Для вложенных подфайлов используйте команду <code>\input</code>.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[english,russian]{babel}
    \usepackage{amsmath,graphicx}
    \begin{filecontents*}[overwrite]{blog-section.tex}
    This paragraph is read from a separate file created by this example.
    \end{filecontents*}
    \begin{document}
    \section{Shared content}\input{blog-section.tex}
    \end{document}
