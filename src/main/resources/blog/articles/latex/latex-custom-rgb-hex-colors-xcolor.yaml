sections:
  - id: 'intro'
    title: 'Почему стандартных 8 цветов недостаточно'
    html: |2-
                              <p>Базовый TeX предоставляет всего несколько примитивных цветов: red,
      green, blue, cyan, magenta, yellow, black, white. В реальных проектах — презентациях Beamer,
      корпоративных гайдах, дипломных плакатах — требуются точные оттенки из брендбуков или
      дизайн-макетов Figma.</p>
                              <p>В дополнение к базовым функциям <a
      href="/blog/latex-xcolor-text-background">работы с цветом текста и фона в xcolor</a>,
      расширенный пакет снимает любые колористические ограничения, позволяя объявлять собственные
      именованные оттенки в цветовых пространствах HTML-HEX, RGB (дробном и 255) и полиграфическом
      CMYK.</p>
  - id: 'hex-define'
    title: 'Свой цвет hex в latex xcolor: директива definecolor'
    html: |2-
                              <p>Самый удобный способ для веб-разработчиков и дизайнеров задать
      <strong>свой цвет hex в latex xcolor</strong> — использовать модель <code>HTML</code>
      (шестнадцатеричный код без решетки):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage{xcolor}

      % Задание цветов по HEX-коду:
      \definecolor{BrandBlue}{HTML}{1A73E8}
      \definecolor{DarkSlate}{HTML}{2D3748}
      \definecolor{WarningAmber}{HTML}{D97706}
      \definecolor{EmeraldGreen}{HTML}{059669}</code></pre>
                              </div>
                              <p>После объявления в преамбуле новые цвета используются стандартными
      командами: <code>\textcolor{BrandBlue}{Фирменный текст}</code>.</p>
  - id: 'rgb-define'
    title: 'Цвет RGB в LaTeX xcolor: модели дробного и целочисленного RGB'
    html: |2-
                              <p>Чтобы задать <strong>цвет RGB в LaTeX xcolor</strong>, в пакете
      предусмотрены две разновидности модели:</p>
                              <ul>
                                  <li><strong>Дробный <code>rgb</code> (значения каналов от 0.0 до
      1.0):</strong>
                                      <pre><code>\definecolor{DeepPurple}{rgb}{0.45, 0.15, 0.72}</code></pre>
                                  </li>
                                  <li><strong>Целочисленный <code>RGB</code> (заглавные буквы,
      значения от 0 до 255):</strong>
                                      <pre><code>\definecolor{BrightCoral}{RGB}{255, 112, 67}</code></pre>
                                      Этот формат совпадает с обычными значениями Photoshop и CSS
      <code>rgb(255, 112, 67)</code>.
                                  </li>
                              </ul>
  - id: 'usage-examples'
    title: 'Применение кастомных цветов: текст, фон, рамки и ссылки'
    html: |2-
                              <p>Примеры комплексного оформления документа объявленными оттенками
      (такие цветовые палитры часто применяют при <a
      href="/blog/latex-tcolorbox-theorems-callouts">оформлении цветных блоков и теорем в
      tcolorbox</a>):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>% Окраска фрагмента текста
      \textcolor{DarkSlate}{Основной строгий текст} и \textcolor{EmeraldGreen}{\textbf{успешный статус}}.

      % Блок в рамке с кастомным фоном
      \fcolorbox{BrandBlue}{BrandBlue!10}{Важное примечание на мягком голубом фоне.}

      % Цветные математические формулы
      \begin{equation}
          \textcolor{BrandBlue}{E} = \textcolor{WarningAmber}{m} \cdot \textcolor{EmeraldGreen}{c^2}
      \end{equation}</code></pre>
                              </div>
  - id: 'cmyk-print'
    title: 'Особенности подготовки к полиграфической печати (CMYK)'
    html: |2-
                              <p>Если документ планируется отдавать в профессиональную типографию на
      офсетную печать, объявляйте цвета в четырехкрасочной модели:
      <code>\definecolor{PrintCyan}{cmyk}{1.0, 0.0, 0.0, 0.0}</code>, чтобы избежать цветовых
      искажений при конвертации из экранного RGB.</p>
tips:
  - title: 'Плавное осветление цвета'
    html: |2-
      <p>Синтаксис <code>BrandBlue!30</code> создает цвет, состоящий на 30% из BrandBlue и на 70% из
      белого, что идеально для фона таблиц и плашек.</p>
  - title: 'Интеграция с hyperref'
    html: |2-
      <p>Задайте кастомный цвет для всех веб-ссылок в преамбуле: <code>\hypersetup{colorlinks=true,
      urlcolor=BrandBlue, linkcolor=DarkSlate}</code>.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[english,russian]{babel}
    \usepackage{amsmath,graphicx}
    \usepackage{xcolor}\definecolor{brand}{HTML}{4469E0}\definecolor{accent}{RGB}{220,235,255}
    \begin{document}
    \textcolor{brand}{Custom HEX color}
    \par\colorbox{accent}{Custom RGB background}
    \end{document}
