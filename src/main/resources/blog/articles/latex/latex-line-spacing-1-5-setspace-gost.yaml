sections:
  - id: 'gost-spacing-rule'
    title: 'Требования ГОСТ: почему именно полуторный интервал'
    html: |2-
                              <p>Согласно ГОСТ 7.32-2017 и методическим указаниям большинства
      российских вузов (МГУ, СПбГУ, МГТУ им. Баумана, ВШЭ), основной текст курсовых, дипломов и
      диссертаций должен быть набран с <strong>междустрочным интервалом 1.5</strong> (в сочетании с
      правильной <a href="/blog/latex-geometry-margins-gost">настройкой полей страницы geometry в
      LaTeX</a>). При этом текст сносок, подписей к рисункам и содержимое таблиц должно оставаться с
      одинарным интервалом.</p>
  - id: 'linespread-problem'
    title: "Почему команда \\linespread{1.5} портит документ"
    html: |2-
                              <p>Многие начинающие пользователи пишут в преамбуле команду
      <code>\linespread{1.5}</code>. Это грубая ошибка: в базовой типографике TeX множитель 1.5
      умножает базовый интервал шрифта и визуально дает не полуторный, а почти <strong>двойной
      интервал</strong>! Кроме того, <code>\linespread</code> уродует интервалы в сносках и
      математических формулах.</p>
  - id: 'setspace-solution'
    title: 'Полуторный интервал в LaTeX через setspace: правильный метод'
    html: |2-
                              <p>Единственно верный способ — использовать специализированный пакет
      <code>setspace</code>. Правильная настройка, реализующая <strong>полуторный интервал в latex
      setspace</strong>, выглядит так:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage{setspace}
      \onehalfspacing</code></pre>
                              </div>
                              <p>Команда <code>\onehalfspacing</code> точно учитывает кегль шрифта
      (12pt или 14pt) и выставляет именно те 1.5 интервала, которые ожидает увидеть вузовский
      нормоконтроль, сохраняя эталонное <a
      href="/blog/justified-text-spacing-hyphenation-latex-vs-word">выравнивание текста по ширине без
      огромных пробелов</a>.</p>
  - id: 'tables-and-footnotes'
    title: 'Сохранение одинарного интервала в таблицах и сносках'
    html: |2-
                              <p>Главное преимущество пакета <code>setspace</code> заключается в том,
      что он автоматически возвращает одинарный интервал (single spacing) в сносках на нижнем поле
      страницы и подрисуночных подписях, что в точности соответствует ГОСТ.</p>
                              <p>Если внутри большой таблицы вам требуется принудительно сжать строки,
      используйте локальное окружение:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{table}[ht]
        \begin{singlespace}
          % Код таблицы с одинарным интервалом
        \end{singlespace}
      \end{table}</code></pre>
                              </div>
tips:
  - title: 'Размер шрифта 14pt для дипломов'
    html: |2-
      <p>Если в документе используется шрифт 14pt (<code>\documentclass[14pt]{extreport}</code>),
      команда <code>\onehalfspacing</code> автоматически подстроится под увеличенный кегль.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[english,russian]{babel}
    \usepackage{amsmath,graphicx}
    \usepackage{setspace}\onehalfspacing
    \begin{document}
    \section*{Line spacing}
    This paragraph uses one-and-a-half line spacing. Add several lines of text to compare the
    distance between baselines.
    \begin{singlespace}This paragraph uses single spacing. The change is local to this
    environment.\end{singlespace}
    \end{document}
