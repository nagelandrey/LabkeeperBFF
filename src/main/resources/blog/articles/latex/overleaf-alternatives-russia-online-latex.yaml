sections:
  - id: 'context'
    title: 'Почему российские исследователи ищут замену Overleaf'
    html: |2-
                              <p>Долгие годы британский сервис Overleaf оставался де-факто стандартом
      совместной верстки научных публикаций. Однако с 2022 года пользователи из РФ столкнулись с
      блокировками премиум-подписок, невозможностью оплаты российскими картами МИР, а также
      периодическими сбоями доступа к веб-интерфейсу.</p>
                              <p>Технически зарубежные сервисы не уступают: у Overleaf полный
      дистрибутив TeX Live, в том числе пакет biblatex-gost. Для исследователей из России важнее
      другое — стабильный доступ к сервису, оплата российскими картами в рублях, русский интерфейс и
      ИИ-агент, которому можно писать по-русски.</p>
  - id: 'overleaf-issues'
    title: 'Overleaf альтернативы в россии: доступность, платежи и пинг'
    html: |2-
                              <p>При поиске надежной <strong>overleaf альтернативы в россии</strong>
      исследователи и кафедры оценивают ключевые факторы (включая предустановленные кириллические
      гарнитуры и быструю <a href="/blog/latex-sans-serif-fonts">настройку шрифтов без засечек в
      LaTeX</a>):</p>
                              <ul>
                                  <li><strong>Юридическая безопасность и стабильность
      доступа:</strong> уверенность, что доступ к диссертации или годовому отчету не пропадет за день
      до защиты.</li>
                                  <li><strong>Скорость компиляции:</strong> сколько секунд занимает
      сборка PDF и какой лимит времени отведен на одну сборку.</li>
                                  <li><strong>Оплата в рублях:</strong> возможность платить
      российскими картами МИР и через СБП — в Labkeeper это пакеты токенов без подписки.</li>
                              </ul>
  - id: 'labkeeper-features'
    title: 'Онлайн редактор latex без блокировок: возможности Labkeeper'
    html: |2-
                              <p><strong>Labkeeper</strong> создавался как современный <strong>онлайн
      редактор latex без блокировок</strong>, специально адаптированный под потребности студентов,
      аспирантов и ученых РФ (а перенести документ из Word поможет наше <a
      href="/blog/latex-word-to-latex">руководство по переходу с Word на LaTeX</a>):</p>
                              <ul>
                                  <li><strong>Примеры по ГОСТ:</strong> примеры дипломных работ и
      лабораторных в витрине — их можно клонировать; оформление по ГОСТ разобрано в статьях
      блога.</li>
                                  <li><strong>Гибридный режим Markdown + LaTeX:</strong> возможность
      вести заметки в быстром Markdown и компилировать их в полиграфический PDF со сложными
      TeX-формулами.</li>
                                  <li><strong>Полный TeX Live 2025:</strong> кириллица без
      дополнительной настройки (T2A, babel) и сборка PDF через pdfLaTeX за несколько секунд.</li>
                                  <li><strong>AI-помощник:</strong> встроенный интеллектуальный
      ассистент помогает исправлять ошибки синтаксиса и переводить статьи на академический английский
      язык.</li>
                              </ul>
  - id: 'desktop-alternatives'
    title: 'Локальные редакторы: VS Code, TeXstudio и сложности их настройки'
    html: |2-
                              <p>Автономный путь — установка дистрибутива TeX Live / MiKTeX на
      домашний компьютер в связке с TeXstudio или VS Code (плагин LaTeX Workshop). Главные минусы
      такого подхода: объем дистрибутива свыше 8 Гб, сложные конфликты версий Perl/Python для minted и
      отсутствие синхронизации между домашним ПК и рабочим ноутбуком.</p>
  - id: 'comparison-table'
    title: 'Сравнительная таблица платформ для научной работы'
    html: |2-
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Сравнение платформ</span></div>
                                  <pre><code>Критерий            | Overleaf (Free)   | Локальный TeXstudio | Labkeeper
      --------------------|-------------------|---------------------|------------------
      Доступность в РФ    | Риски сбоев       | 100% офлайн         | Доступен онлайн
      Шаблоны ГОСТ / ВАК  | Требуют доработки | Настраивать вручную | Примеры для клонирования
      Поддержка Markdown  | Нет               | Нет                 | Нативная (MathJax)
      Сложность старта    | Низкая            | Высокая             | Сразу в браузере
      Оплата картами РФ   | Недоступна        | Бесплатно           | Доступна (МИР, СБП)</code></pre>
                              </div>
tips:
  - title: 'Перенос из Overleaf'
    html: |2-
      <p>Скачайте проект из Overleaf, распакуйте архив на компьютере и загрузите в Labkeeper
      .tex-файлы и картинки. Импорта проекта одним архивом нет, поэтому папки создайте в файловом
      менеджере проекта.</p>
  - title: 'Облачное автосохранение'
    html: |2-
      <p>У вошедшего пользователя правки в Labkeeper сохраняются автоматически примерно через секунду,
      поэтому случайное закрытие вкладки или обновление страницы их не сотрёт. Истории версий, как в
      Overleaf, нет: отменить можно только правки текущей сессии.</p>
