sections:
  - id: 'intro'
    title: 'Почему пакет forest вытеснил qtree и чистый TikZ'
    html: |2-
                              <p>Создание иерархических древовидных структур в классическом TikZ
      требует ручного задания координат каждого узла и постоянного подбора отступов, чтобы ветви не
      накладывались друг на друга (для сравнения ознакомьтесь с <a
      href="/blog/latex-tikz-automata-graphs">построением графов и автоматов в TikZ</a>). Устаревший
      пакет <code>qtree</code> прост, но ограничен в возможностях оформления.</p>
                              <p>Пакет <strong>forest</strong> объединяет простоту скобочной нотации с
      интеллектуальным алгоритмом упаковки узлов: он автоматически минимизирует площадь дерева,
      сохраняя равные расстояния между листьями и предотвращая пересечение связей.</p>
  - id: 'syntax'
    title: 'Нарисовать дерево в latex пакет forest: базовый синтаксис скобок'
    html: |2-
                              <p>Подключите пакет: <code>\usepackage{forest}</code>. Чтобы быстро
      <strong>нарисовать дерево в latex пакет forest</strong>, используется окружение
      <code>forest</code>, где каждый узел заключается в квадратные скобки <code>[...]</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{forest}
      [Корень
          [Левый потомок
              [Лист 1]
              [Лист 2]
          ]
          [Правый потомок
              [Лист 3]
          ]
      ]
      \end{forest}</code></pre>
                              </div>
                              <p>Вложенность скобок автоматически определяет глубину дерева в иерархии
      без необходимости прописывать связи вручную.</p>
  - id: 'linguistics'
    title: 'Синтаксическое дерево latex онлайн: лингвистический разбор'
    html: |2-
                              <p>В лингвистике и компьютерной филологии постоянно строится
      <strong>синтаксическое дерево latex онлайн</strong> (дерево составляющих или зависимостей):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>% В преамбуле: \usepackage[linguistics]{forest}
      \begin{forest}
      [S
          [NP [Студент, roof]]
          [VP
              [V [пишет]]
              [NP
                  [Adj [отличный]]
                  [N [отчет]]
              ]
          ]
      ]
      \end{forest}</code></pre>
                              </div>
                              <p>Опция <code>roof</code> превращает ветвь в аккуратный треугольник над
      группой слов, что является общепринятым стандартом лингвистических публикаций. Она входит в
      библиотеку <code>linguistics</code>: подключите пакет как
      <code>\usepackage[linguistics]{forest}</code> или добавьте
      <code>\useforestlibrary{linguistics}</code>. Без библиотеки сборка остановится с ошибкой <code>I
      do not know the key '/tikz/roof'</code>.</p>
  - id: 'genealogy'
    title: 'Генеалогические древа и деревья решений'
    html: |2-
                              <p>Для генеалогических исследований или деревьев принятия решений в
      машинном обучении (а также сопутствующих <a
      href="/blog/algorithm-flowcharts-gost-markdown-latex">блок-схем алгоритмов по ГОСТ</a>) узлам
      задают рамки, заливку и подписи условий на дугах:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{forest}
      for tree={
          draw,
          rounded corners,
          edge={-latex},
          font=\small,
          l sep=12mm
      }
      [Влажность > 70\%
          [Дождь?, edge label={node[midway,left]{Да}}
              [Сидеть дома, fill=red!20]
              [Гулять, fill=green!20]
          ]
          [Идти в парк, edge label={node[midway,right]{Нет}}, fill=green!20]
      ]
      \end{forest}</code></pre>
                              </div>
                              <p>Директива <code>for tree={...}</code> применяет стили глобально ко
      всем узлам дерева: форму рамок, геометрию стрелок и расстояние между уровнями <code>l
      sep</code>.</p>
  - id: 'styling'
    title: 'Стилизация узлов: цвета, рамки и стрелки'
    html: |2-
                              <p>Основные параметры форматирования пакета forest:</p>
                              <ul>
                                  <li><code>grow'=east</code> — ориентация дерева слева направо вместо
      классического сверху вниз.</li>
                                  <li><code>s sep=5mm</code> — минимальное расстояние между соседними
      узлами одного уровня (sibling separation).</li>
                                  <li><code>tier=уровень</code> — принудительное выравнивание
      разнородных листьев по одной горизонтальной линии.</li>
                              </ul>
tips:
  - title: 'Кириллица внутри формул в узлах'
    html: |2-
      <p>Если узел содержит математическую формулу, используйте стандартные знаки доллара: <code>[$x_1
      + x_2$, draw]</code>.</p>
  - title: 'Перенос строк внутри узла'
    html: |2-
      <p>Для многострочного текста внутри плашки добавьте параметр <code>align=center</code>:
      <code>[Длинный текст\\вторая строка, align=center, draw]</code>.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[english,russian]{babel}
    \usepackage{amsmath,graphicx}
    \usepackage{forest}
    \begin{document}
    \begin{forest}for tree={draw,rounded corners}
    [Document [Introduction] [Methods [Model] [Experiment]] [Results]]
    \end{forest}
    \end{document}
