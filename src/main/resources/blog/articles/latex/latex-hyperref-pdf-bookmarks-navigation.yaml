sections:
  - id: 'why-navigation'
    title: 'Зачем нужны интерактивные закладки в научных документах'
    html: |2-
                              <p>Когда вы отправляете дипломную работу, диссертацию или отчет в
      электронную среду университета или рецензенту журнала, первое, на что обращает внимание читатель
      — это удобство навигации в PDF-ридере (Adobe Acrobat, Chrome PDF Viewer, Preview). Если боковая
      панель закладок (Bookmarks / Outline) пуста, ориентироваться в 100-страничном труде крайне
      мучительно.</p>
                              <p>Пакет <strong>hyperref</strong> превращает статический документ в
      интерактивный гипертекст: оглавление становится кликабельным, номера формул и рисунков ведут к
      соответствующим объектам, а слева формируется аккуратное многоуровневое дерево разделов. Это
      один из главных аргументов при <a
      href="/blog/word-formatting-issues-diploma-lightweight-markup-alternative">переходе с Word на
      профессиональную верстку</a>.</p>
  - id: 'hyperref-setup'
    title: 'Закладки в PDF LaTeX hyperref: эталонная конфигурация'
    html: |2-
                              <p>Чтобы правильно сгенерировать <strong>закладки в pdf latex
      hyperref</strong>, подключите пакет <em>в самом конце преамбулы</em> (за редким исключением
      пакетов вроде <code>cleveref</code> или <code>bookmark</code>):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Конфигурация hyperref</span></div>
                                  <pre><code>\usepackage{xcolor}
      \usepackage[
          unicode=true,
          pdfstartview={FitH},
          bookmarks=true,
          bookmarksnumbered=true,
          bookmarksopen=true,
          colorlinks=true,
          linkcolor=blue,
          citecolor=teal,
          urlcolor=magenta
      ]{hyperref}</code></pre>
                              </div>
                              <p>Параметры:</p>
                              <ul>
                                  <li><code>unicode=true</code> — корректная обработка кириллических
      заголовков в метаданных PDF;</li>
                                  <li><code>bookmarksnumbered=true</code> — отображение номеров глав
      (1, 1.1, 1.2) в боковом меню закладок;</li>
                                  <li><code>bookmarksopen=true</code> — дерево закладок сразу открыто
      в развернутом виде при первом открытии файла;</li>
                                  <li><code>colorlinks=true</code> — ссылки выделяются цветом вместо
      некрасивых рамок вокруг текста.</li>
                              </ul>
                              <div class="article-note">
                                  <strong>⚠️ В Labkeeper:</strong> если в проекте нет своей преамбулы,
      Labkeeper подставляет автоматическую, где <code>hyperref</code> уже подключён. Второй
      <code>\usepackage[…]{hyperref}</code> в такой преамбуле даёт ошибку <code>Option clash for
      package hyperref</code>. Настраивайте ссылки командой <code>\hypersetup{…}</code> с теми же
      параметрами или допишите их в уже существующую строку <code>\usepackage{hyperref}</code> —
      второй <code>\usepackage{hyperref}</code> не нужен.
                              </div>
  - id: 'cyrillic-encoding'
    title: 'Формулы в заголовках и закладки PDF'
    html: |2-
                              <p>Если в заголовках глав содержатся математические формулы (например,
      <code>\section{Анализ функции $f(x) = x^2$}</code>), в боковых закладках PDF может появиться
      предупреждение <code>Token not allowed in a PDF string</code>.</p>
                              <p>Для таких случаев в hyperref предусмотрена команда
      <code>\texorpdfstring</code>, которая выводит формулу в тексте, а в закладку отправляет чистый
      текст:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Заголовок с формулой</span></div>
                                  <pre><code>\section{Исследование уравнения \texorpdfstring{$E = mc^2$}{E = mc\textasciicircum 2}}</code></pre>
                              </div>
                              <p>Также рекомендуется дополнительно подключить современный пакет
      <code>\usepackage{bookmark}</code> сразу после <code>hyperref</code> — он обновляет закладки за
      один проход компилятора вместо двух.</p>
  - id: 'toc-navigation'
    title: 'Навигация по оглавлению PDF LaTeX: ссылки на формулы и рисунки'
    html: |2-
                              <p>Полноценная <strong>навигация по оглавлению pdf latex</strong>
      охватывает не только содержание, но и перекрестные ссылки в тексте. Используйте связку
      <code>\label{...}</code> и <code>\ref{...}</code> / <code>\eqref{...}</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Ссылки</span></div>
                                  <pre><code>Как показано на рисунке~\ref{fig:schema}, выходной сигнал...
      В соответствии с формулой~\eqref{eq:motion}, скорость нарастает линейно.</code></pre>
                              </div>
                              <p>Клик по номеру рисунка или формулы в PDF переместит читателя к
      соответствующему объекту. Те же правила перекрестных ссылок действуют и при <a
      href="/blog/latex-russian-cyrillic-code-listings-minted">оформлении листингов кода в LaTeX без
      ошибок</a>.</p>
  - id: 'print-vs-screen'
    title: 'Черно-белые ссылки для печати против цветных для экрана'
    html: |2-
                              <p>Для бумажной версии диплома нормоконтроль часто требует, чтобы текст
      был строго черным, без синих ссылок. Чтобы сохранить кликабельность в PDF, но сделать цвет
      черным, используйте настройку:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Печатная версия</span></div>
                                  <pre><code>\hypersetup{
          colorlinks=true,
          linkcolor=black,
          citecolor=black,
          urlcolor=black
      }</code></pre>
                              </div>
tips:
  - title: 'Подключайте hyperref последним'
    html: |2-
      <p>Почти всегда <code>hyperref</code> должен быть последним пакетом в преамбуле документа, иначе
      другие пакеты могут переопределить макросы ссылок и сломать переход по страницам.</p>
  - title: 'Готовая навигация в Labkeeper'
    html: |2-
      <p>В автоматической преамбуле Labkeeper пакет hyperref уже подключён: внутренние ссылки в
      просмотрщике PDF прокручивают документ к нужному месту, а внешние открываются в новой вкладке. В
      собственной преамбуле подключите hyperref сами.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[english,russian]{babel}
    \usepackage{amsmath,graphicx}
    \usepackage[unicode,colorlinks=true,linkcolor=blue,urlcolor=blue]{hyperref}
    \begin{document}
    \tableofcontents
    \section{Introduction}\label{intro}
    Visit \href{{{publicUrl}}}{Labkeeper}.
    \newpage\section{Results}Back to Section~\ref{intro}.
    \end{document}
