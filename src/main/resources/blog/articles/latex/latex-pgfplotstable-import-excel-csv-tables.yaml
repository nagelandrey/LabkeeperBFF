sections:
  - id: 'why-automate'
    title: 'Почему ручной перенос таблиц из Excel в LaTeX — это тупик'
    html: |2-
                              <p>В ходе научных исследований и инженерных расчетов данные непрерывно
      меняются: провели новую серию измерений, пересчитали формулу в Excel — и вся таблица из 50 строк
      изменилась. Если переносить каждую ячейку в LaTeX вручную через амперсанды <code>&amp;</code> и
      слэши <code>\\</code>, вы потратите часы и неизбежно допустите опечатки.</p>
                              <p>Идеальный инженерный подход — связать файл данных напрямую с
      документом LaTeX. При обновлении расчетов документ пересобирается автоматически с новыми
      числами. А чтобы строки данных не выглядели тесно, используйте макрос для <a
      href="/blog/latex-arraystretch-table-row-height-spacing">настройки высоты строк в
      таблицах</a>.</p>
  - id: 'csv-export'
    title: 'Подготовка данных: экспорт из Microsoft Excel в формат CSV'
    html: |2-
                              <p>В Excel сохраните нужный лист через меню <em>«Сохранить как» &rarr;
      «CSV (разделители — запятые)»</em> или <em>«Текстовый файл с разделителями табуляции»</em>. В
      русскоязычной версии Excel разделителем столбцов традиционно выступает точка с запятой
      <code>;</code>, а десятичным разделителем — запятая <code>,</code>.</p>
  - id: 'pgfplotstable-setup'
    title: 'Конвертировать Excel в таблицу LaTeX: базовый вызов pgfplotstable'
    html: |2-
                              <p>Для чтения данных подключите пакет <strong>pgfplotstable</strong> (он
      входит в состав TeX Live и надстраивается над pgfplots):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Преамбула</span></div>
                                  <pre><code>\usepackage{pgfplotstable}
      \usepackage{booktabs}
      \pgfplotsset{compat=1.18}</code></pre>
                              </div>
                              <p>Теперь, чтобы <strong>конвертировать excel в таблицу latex</strong>,
      достаточно одной строки:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Вставка</span></div>
                                  <pre><code>\pgfplotstabletypeset[col sep=semicolon]{measurements.csv}</code></pre>
                              </div>
                              <p>Если числа в файле записаны с десятичной запятой, добавьте опцию
      <code>read comma as period</code> — подробнее в следующем разделе.</p>
                              <p>Если импортируемый массив данных слишком широк для книжной страницы,
      оберните его в окружение для <a
      href="/blog/latex-rotating-package-sidewaystable-rotate-90">вращения широких таблиц
      sidewaystable</a>.</p>
  - id: 'reading-csv'
    title: 'Pgfplotstable чтение CSV: разделители, кодировка и русская запятая'
    html: |2-
                              <p>При использовании <strong>pgfplotstable чтение csv</strong> можно
      настроить с ювелирной точностью под российские стандарты:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Тонкая настройка</span></div>
                                  <pre><code>\pgfplotstabletypeset[
          col sep=semicolon,               % Разделитель колонок (точка с запятой из Excel)
          string type,                     % Если в колонках есть текст
          every head row/.style={
              before row=\toprule,
              after row=\midrule
          },
          every last row/.style={
              after row=\bottomrule
          }
      ]{data.csv}</code></pre>
                              </div>
                              <p>Если в CSV содержатся вещественные числа, которые нужно автоматически
      округлить до 2 знаков после запятой и заменить десятичную точку на русскую запятую по ГОСТу:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Округление и ГОСТ запятая</span></div>
                                  <pre><code>\pgfplotstabletypeset[
          col sep=comma,
          every numeric column/.style={
              precision=2,
              fixed,
              dec sep align,
              /pgf/number format/use comma, % десятичная запятая при выводе
              set thousands separator={\,}
          }
      ]{experiment.csv}</code></pre>
                              </div>
                              <p>Без опции <code>use comma</code> pgfplotstable выводит десятичную
      точку: <code>1.23</code> вместо <code>1,23</code>.</p>
                              <p>Главная ловушка русского Excel — числа в самом файле записаны с
      запятой («2,5»), а pgfplotstable ждёт точку. При <code>col sep=semicolon</code> такой файл
      останавливает сборку с ошибкой <code>Could not parse input '2,5' as a floating point
      number</code>. Опция <code>read comma as period</code> читает запятую как десятичный
      разделитель, а <code>use comma</code> возвращает её при выводе:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX CSV из русского Excel</span></div>
                                  <pre><code>\pgfplotstabletypeset[col sep=semicolon, read comma as period,
        /pgf/number format/use comma]{data.csv}</code></pre>
                              </div>
  - id: 'styling-booktabs'
    title: 'Профессиональная стилизация: шапка, границы и округление'
    html: |2-
                              <p>Вы можете переименовывать столбцы таблицы прямо в LaTeX, не меняя
      заголовки в самом файле CSV:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Переименование столбцов</span></div>
                                  <pre><code>\pgfplotstabletypeset[
          col sep=semicolon,
          columns/time/.style={column name={Время $t$, с}},
          columns/voltage/.style={column name={Напряжение $U$, В}},
          columns/current/.style={column name={Ток $I$, мА}}
      ]{measurements.csv}</code></pre>
                              </div>
tips:
  - title: 'Храните CSV рядом с исходником .tex'
    html: |2-
      <p>Поместите файл <code>data.csv</code> в ту же папку проекта, что и основной файл
      <code>main.tex</code>, чтобы компилятор сразу находил его по относительному пути.</p>
  - title: 'Интеграция в Labkeeper'
    html: |2-
      <p>В онлайн-редакторе Labkeeper загрузите CSV в файловый менеджер проекта (файлы доступны после
      входа) и нажмите «Выполнить»: таблица появится в PDF после сборки. Промежуточные суммы
      pgfplotstable сам не считает — их нужно описать в коде или подготовить заранее. Для расчётов
      удобен вычислительный сегмент Labkeeper: функция <code>load_csv</code> читает колонки файла в
      массивы, а <code>table</code> выводит результат таблицей.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[english,russian]{babel}
    \usepackage{amsmath,graphicx}
    \usepackage{pgfplotstable}\pgfplotsset{compat=1.18}
    \begin{document}
    \pgfplotstabletypeset[col sep=semicolon,read comma as period,/pgf/number format/use
    comma,columns/t/.style={column name={$t$, с}},columns/U/.style={column name={$U$, В}}]{
    t;U
    1;2,5
    2;4,75
    3;5,5
    }
    \end{document}
