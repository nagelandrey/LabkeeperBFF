sections:
  - id: 'cramped-problem'
    title: 'Проблема «тесных» таблиц в стандартном LaTeX'
    html: |2-
                              <p>По умолчанию стандартные окружения <code>tabular</code> и
      <code>array</code> в LaTeX используют довольно плотные межстрочные интервалы. Если в ячейках
      таблицы содержится только простой текст, это выглядит приемлемо. Однако стоит добавить в ячейку
      математическую дробь (<code>\frac{a}{b}</code>), верхний индекс или прописную букву с
      диакритикой, как элементы начинают буквально «прилипать» к горизонтальным линиям
      <code>\hline</code>.</p>
                              <p>Таблица теряет академическую эстетику и становится трудночитаемой. К
      счастью, в LaTeX есть элегантное и простое решение — переопределение масштабного коэффициента
      высоты строк. А если таблица не помещается по ширине страницы, на помощь приходит окружение для
      <a href="/blog/latex-rotating-package-sidewaystable-rotate-90">поворота широких таблиц на 90
      градусов</a>.</p>
  - id: 'arraystretch-command'
    title: 'Увеличить высоту строки в таблице LaTeX: макрос arraystretch'
    html: |2-
                              <p>Самый быстрый и надежный способ <strong>увеличить высоту строки в
      таблице latex</strong> — использовать команду:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Команда</span></div>
                                  <pre><code>\renewcommand{\arraystretch}{1.3}</code></pre>
                              </div>
                              <p>Значение <code>1.0</code> соответствует стандартной плотности.
      Установка коэффициента <code>1.2–1.4</code> делает таблицу просторной, воздушной и визуально
      гармоничной. Для таблиц с крупными математическими формулами рекомендуется значение
      <code>1.5</code>.</p>
  - id: 'local-vs-global'
    title: 'Arraystretch настройка интервала: локальное против глобального применения'
    html: |2-
                              <p>Грамотная <strong>arraystretch настройка интервала</strong> должна
      быть <em>локальной</em>. Если объявить <code>\renewcommand{\arraystretch}{1.4}</code> в
      преамбуле, растянутся не только обычные таблицы, но и все математические матрицы
      (<code>pmatrix</code>, <code>bmatrix</code>), что испортит формульный аппарат.</p>
                              <p>Применяйте настройку строго внутри окружения <code>table</code> или
      оборачивайте в фигурные скобки:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Локальное применение</span></div>
                                  <pre><code>\begin{table}[htbp]
      \centering
      \renewcommand{\arraystretch}{1.35} % Действует только на эту таблицу!
      \caption{Экспериментальные параметры колебательного контура}
      \label{tab:rlc}
      \begin{tabular}{|l|c|r|}
      \hline
      Параметр & Формула & Значение \\
      \hline
      Индуктивность & $L = \frac{\Phi}{I}$ & $2.5\text{ мГн}$ \\
      Емкость & $C = \frac{q}{U}$ & $100\text{ пФ}$ \\
      Резонансная частота & $f_0 = \frac{1}{2\pi\sqrt{LC}}$ & $0{,}32\text{ МГц}$ \\
      \hline
      \end{tabular}
      \end{table}</code></pre>
                              </div>
                              <p>Если вы автоматизируете расчеты, то можете комбинировать arraystretch
      при <a href="/blog/latex-pgfplotstable-import-excel-csv-tables">импорте таблиц из Excel через
      pgfplotstable</a>, получая идеальные отступы между строками данных.</p>
  - id: 'booktabs-alternative'
    title: 'Пакет booktabs и микро-отступы aboverulesep / belowrulesep'
    html: |2-
                              <p>В современных научных статьях высокого уровня вместо сплошных линий
      <code>\hline</code> используется профессиональный пакет <code>booktabs</code> (команды
      <code>\toprule</code>, <code>\midrule</code>, <code>\bottomrule</code>). Пакет автоматически
      добавляет эстетичные отступы сверху и снизу от линий, которые можно тонко настраивать:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX booktabs</span></div>
                                  <pre><code>\usepackage{booktabs}
      \setlength{\aboverulesep}{0.8ex}
      \setlength{\belowrulesep}{0.8ex}</code></pre>
                              </div>
  - id: 'struts-method'
    title: 'Использование невидимых распорок (struts) для единичных ячеек'
    html: |2-
                              <p>Если вам нужно увеличить высоту только одной конкретной строки
      (например, шапки таблицы), не меняя остальные строки, используйте невидимую вертикальную
      распорку — команду <code>\rule{0pt}{высота}</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Распорка strut</span></div>
                                  <pre><code>\hline
      \rule{0pt}{3ex} Высокая ячейка шапки & Значение \\[1ex]
      \hline</code></pre>
                              </div>
tips:
  - title: 'Коэффициент 1.25–1.3 для отчетов'
    html: |2-
      <p>Для отчетов и дипломных работ коэффициент от 1.25 до 1.3, например
      <code>\renewcommand{\arraystretch}{1.3}</code>, — оптимальный баланс между компактностью и
      читаемостью.</p>
  - title: 'booktabs в автоматической преамбуле Labkeeper'
    html: |2-
      <p>Если в проекте Labkeeper нет своей преамбулы, пакеты <code>booktabs</code> и
      <code>longtable</code> уже подключены в автоматической: команды <code>\toprule</code>,
      <code>\midrule</code> и <code>\bottomrule</code> работают сразу.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[english,russian]{babel}
    \usepackage{amsmath,graphicx}

    \begin{document}
    \renewcommand{\arraystretch}{1.6}
    \begin{tabular}{|l|r|}\hline Item & Value\\\hline
    Voltage & 12\\Current & 2\\Power & 24\\\hline\end{tabular}
    \end{document}
