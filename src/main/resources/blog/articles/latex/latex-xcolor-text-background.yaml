sections:
  - id: 'intro'
    title: 'Возможности пакета xcolor'
    html: |2-
                              <p>По умолчанию LaTeX ориентирован на монохромную полиграфию. Однако в
      презентациях (Beamer), отчетах по грантам, методических материалах и цветных публикациях
      использование акцентных цветов помогает структурировать внимание читателя (особенно если вы
      используете палитры для <a href="/blog/latex-tcolorbox-theorems-callouts">оформления блоков и
      теорем в tcolorbox</a>).</p>
                              <p>Стандартом для работы с цветом является пакет
      <strong>xcolor</strong>. Он позволяет окрашивать отдельные слова, целые блоки, фоны абзацев, а
      также создавать контрастные цветные таблицы с автоматическим чередованием строк.</p>
  - id: 'setup'
    title: 'Подключение и опции пакета'
    html: |2-
                              <p>Чтобы получить доступ к расширенным палитрам и поддержке таблиц,
      пакет подключается со специальными опциями:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage[table,dvipsnames]{xcolor}</code></pre>
                              </div>
                              <p>Опция <code>table</code> загружает вспомогательный модуль для работы
      со средами <code>tabular</code> и <code>longtable</code>, а <code>dvipsnames</code> добавляет
      более 60 выразительных именных оттенков (NavyBlue, ForestGreen, Maroon, BurntOrange).</p>
  - id: 'text-color'
    title: 'Как изменить цвет текста в latex xcolor: основные команды'
    html: |2-
                              <p>Существует два базовых способа, <strong>как изменить цвет текста в
      latex xcolor</strong>:</p>
                              <ul>
                                  <li><code>\textcolor{имя_цвета}{текст}</code> — окрашивает только
      фрагмент текста внутри фигурных скобок.</li>
                                  <li><code>{\color{имя_цвета} текст}</code> — переключает текущий
      цвет для всей локальной группы.</li>
                              </ul>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>Это обычный текст, а это \textcolor{red}{важное предупреждение}.

      \colorbox{yellow}{\textbf{Внимание:}} данный параметр необратим!

      \fcolorbox{blue}{lightgray}{Текст в цветной рамке на сером фоне.}</code></pre>
                              </div>
                              <p>Команда <code>\colorbox</code> заливает фон под текстом, а
      <code>\fcolorbox</code> дополнительно создает цветную границу вокруг выделенного блока.</p>
  - id: 'table-color'
    title: 'Цветная таблица latex онлайн: фон ячеек и зебра строк'
    html: |2-
                              <p>С помощью опции <code>table</code> создается удобная для восприятия
      <strong>цветная таблица latex онлайн</strong> с эффектом «зебры» (чередующиеся строки) или
      выделением итоговых значений.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{table}[htbp]
          \centering
          \rowcolors{2}{gray!15}{white} % Начиная со строки 2, чередовать светлый серый и белый
          \begin{tabular}{|l|c|r|}
              \hline
              \rowcolor{NavyBlue} % Заливка строки заголовка
              \textcolor{white}{\textbf{Параметр}} & \textcolor{white}{\textbf{Значение}} & \textcolor{white}{\textbf{Статус}} \\
              \hline
              Напряжение & 220 В & В норме \\
              Сила тока & 4.8 А & В норме \\
              Температура & \cellcolor{red!25} 92 $^\circ$C & \textbf{Перегрев} \\
              Сопротивление & 45.8 Ом & В норме \\
              \hline
          \end{tabular}
          \caption{Журнал телеметрии стенда}
      \end{table}</code></pre>
                              </div>
                              <p>Команда <code>\cellcolor{цвет}</code> красит отдельную ячейку, а
      запись вида <code>red!25</code> означает смесь: 25% насыщенного красного и 75% белого цвета
      (пастельный оттенок).</p>
  - id: 'custom-colors'
    title: 'Создание собственных оттенков: RGB, CMYK и HTML-HEX'
    html: |2-
                              <p>Если корпоративный стиль или требования журнала предписывают
      конкретные оттенки, объявите их в преамбуле командой <code>\definecolor</code>, например
      <code>\definecolor{BrandBlue}{HTML}{1A73E8}</code>, и используйте наравне со стандартными:
      <code>\textcolor{BrandBlue}{Фирменный текст}</code>. Модели HTML-HEX, RGB и CMYK подробно
      разобраны в материале о <a href="/blog/latex-custom-rgb-hex-colors-xcolor">пользовательских
      цветах RGB и HEX в LaTeX</a>.</p>
  - id: 'faq'
    title: 'Советы по подготовке к черно-белой печати'
    html: |2-
                              <p>Если работа будет распечатываться на монохромном принтере:</p>
                              <ul>
                                  <li>Избегайте слишком светлых шрифтов (желтый, салатовый), они
      станут невидимыми на белой бумаге.</li>
                                  <li>Для заливок фона используйте процентные градации серого:
      <code>gray!10</code> или <code>gray!20</code>.</li>
                                  <li>Проверяйте контрастность: темный текст должен находиться
      исключительно на светлом фоне, а белый — на плотно залитом фоне.</li>
                              </ul>
tips:
  - title: 'Устранение конфликта с пакетом tabularx'
    html: |2-
      <p>Всегда подключайте <code>\usepackage[table]{xcolor}</code> <em>до</em> пакетов
      <code>tabularx</code> или <code>colortbl</code>, чтобы избежать ошибки <code>Option clash for
      package xcolor</code>.</p>
  - title: 'Прозрачность и смешивание'
    html: |2-
      <p>Синтаксис <code>blue!40!red</code> создает плавное смешивание 40% синего и 60% красного цвета
      без необходимости высчитывать RGB вручную.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[english,russian]{babel}
    \usepackage{amsmath,graphicx}
    \usepackage[table]{xcolor}
    \begin{document}
    \textcolor{blue}{Blue text}\par\colorbox{yellow!30}{Highlighted text}
    \begin{tabular}{cc}\rowcolor{blue!15}Item & Value\\A & 10\\B & 20\end{tabular}
    \end{document}
