sections:
  - id: 'intro'
    title: 'Обзор подходов к набору систем уравнений'
    html: |2-
                              <p>Набор систем алгебраических и дифференциальных уравнений — одна из
      самых частых задач в
                                  точных науках (базовые правила математического режима и дробей
      подробно разобраны в нашем <a
                                      href="/blog/latex-formulas">гайде по формулам и пакету
      amsmath</a>). В зависимости от
                                  цели (кусочно-заданная функция, система уравнений с выравниванием по
      знаку «=» или
                                  независимая нумерация строк) в LaTeX используются разные
      конструкции.</p>
                              <p>Ниже детально разобрано, <strong>как написать систему уравнений в
      LaTeX cases</strong> и
                                  получить идеальную <strong>систему уравнений с фигурной скобкой
      LaTeX онлайн</strong>.</p>
  - id: 'cases'
    title: 'Окружение cases для кусочных функций'
    html: |2-
                              <p>Для математических выражений с условиями (например, модуль числа или
      функция знака)
                                  используется окружение <code>cases</code> из пакета
      <code>amsmath</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{equation}
      |x| = \begin{cases}
          x,  &amp; \text{если } x \ge 0, \\
          -x, &amp; \text{если } x &lt; 0.
      \end{cases}
      \end{equation}</code></pre>
                              </div>
                              <p>Символ <code>&amp;</code> отделяет формулу от текстового пояснения, а
      две косые черты
                                  <code>\\</code> выполняют перенос на новую строку.</p>
  - id: 'aligned'
    title: "Связка \\left\\{ и aligned для систем уравнений"
    html: |2-
                              <p>Когда требуется решить систему уравнений с выравниванием по знакам
      равно или плюс/минус,
                                  лучше использовать связку <code>\left\{ \begin{aligned} ...
      \end{aligned} \right.</code>:
                              </p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{equation}
      \left\{
      \begin{aligned}
          2x + 3y - z &amp;= 7 \\
          x - 2y + 4z &amp;= -3 \\
          -3x + y + 2z &amp;= 4
      \end{aligned}
      \right.
      \end{equation}</code></pre>
                              </div>
                              <div class="article-note">
                                  <strong>💡 Совет:</strong> Обратите внимание на <code>\right.</code>
      в конце — точка
                                  указывает LaTeX, что закрывающая скобка отсутствует.
                              </div>
  - id: 'mathtools'
    title: 'Пакет mathtools: окружения dcases и rcases'
    html: |2-
                              <p>В стандартном <code>cases</code> дроби внутри строк отображаются в
      компактном текстовом
                                  размере (как <code>\tfrac</code>). Пакет <code>mathtools</code>
      решает эту проблему
                                  окружением <code>dcases</code> (display cases):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage{mathtools}

      % Дроби в полный размер (dcases):
      \begin{equation}
      f(x) = \begin{dcases}
          \frac{\sin x}{x}, &amp; x \neq 0, \\
          1,                &amp; x = 0.
      \end{dcases}
      \end{equation}

      % Фигурная скобка справа (rcases):
      \begin{equation}
      \begin{rcases}
          a + b = 10 \\
          a - b = 2
      \end{rcases} \implies a = 6, \ b = 4
      \end{equation}</code></pre>
                              </div>
  - id: 'subequations'
    title: 'Нумерация отдельных уравнений системы (subequations)'
    html: |2-
                              <p>Если каждому уравнению системы нужен свой буквенный индекс (например,
      (1a), (1b)), оберните
                                  код в <code>subequations</code>, а фигурную скобку добавьте
      окружением <code>empheq</code>
                                  (при формулировке условий теорем используйте также <a
      href="/blog/latex-amsthm">пакет amsthm
                                      для определений и лемм</a>). Обычный <code>align</code> внутри
      <code>\left\{ … \right.</code>
                                  не компилируется: LaTeX выдаёт ошибки <code>Missing $
      inserted</code> и
                                  <code>\begin{align} allowed only in paragraph mode</code>.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage{empheq} % в преамбуле; пакет сам загружает mathtools

      \begin{subequations}\label{eq:maxwell}
      \begin{empheq}[left=\empheqlbrace]{align}
          \nabla \cdot \mathbf{E} &amp;= \frac{\rho}{\varepsilon_0} \label{eq:maxwell_gauss} \\
          \nabla \cdot \mathbf{B} &amp;= 0 \label{eq:maxwell_mag} \\
          \nabla \times \mathbf{E} &amp;= -\frac{\partial \mathbf{B}}{\partial t} \label{eq:maxwell_faraday} \\
          \nabla \times \mathbf{B} &amp;= \mu_0 \mathbf{J} + \mu_0 \varepsilon_0 \frac{\partial \mathbf{E}}{\partial t} \label{eq:maxwell_ampere}
      \end{empheq}
      \end{subequations}</code></pre>
                              </div>
                              <p>Теперь на уравнение Фарадея можно сослаться через
      <code>\eqref{eq:maxwell_faraday}</code>, а
                                  на всю систему — через <code>\eqref{eq:maxwell}</code>.</p>
                              <div class="article-note">
                                  <strong>💡 Нумерация в Labkeeper:</strong> если в проекте нет своей
      преамбулы, Labkeeper
                                  подставляет автоматическую с пакетом <code>mathtools</code> в режиме
                                  <code>showonlyrefs</code>. В этом режиме номер получает только
      формула, на которую есть
                                  ссылка через <code>\eqref</code>. Чтобы нумеровались все формулы,
      соберите документ со своей
                                  преамбулой — от <code>\documentclass</code> до
      <code>\begin{document}</code>.
                              </div>
  - id: 'tips'
    title: 'Практические советы'
    html: |2-
                              <div class="article-tips">
                                  <div class="article-tip">
                                      <div class="article-tip__number">1</div>
                                      <div class="article-tip__content">
                                          <h3>Текст внутри условий</h3>
                                          <p>Всегда используйте <code>\text{ при }</code> или
      <code>\quad\text{if }</code> для
                                              разделения формулы и текстового условия, чтобы сохранить
      естественные интервалы
                                              шрифта.</p>
                                      </div>
                                  </div>
                                  <div class="article-tip">
                                      <div class="article-tip__number">2</div>
                                      <div class="article-tip__content">
                                          <h3>Физические единицы в уравнениях</h3>
                                          <p>Если в системе присутствуют размерные величины или вы
      готовите практический
                                              расчет, используйте <a href="/blog/latex-siunitx">пакет
      siunitx</a> и следуйте
                                              нашему <a href="/blog/latex-lab-reports">руководству по
      оформлению лабораторных
                                                  работ</a>.</p>
                                      </div>
                                  </div>
                              </div>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[english,russian]{babel}
    \usepackage{amsmath,graphicx}

    \begin{document}
    \[\begin{cases}2x+y=5\\x-y=1\end{cases}
    \quad\Longrightarrow\quad x=2,\ y=1.\]
    \[\begin{pmatrix}2&1\\1&-1\end{pmatrix}
    \begin{pmatrix}x\\y\end{pmatrix}=\begin{pmatrix}5\\1\end{pmatrix}\]
    \end{document}
