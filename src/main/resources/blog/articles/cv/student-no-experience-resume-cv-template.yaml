sections:
  - id: 'paradox'
    title: 'Парадокс первой работы: как найти опыт без опыта'
    html: |2-
                              <p>Главная головная боль каждого студента и выпускника: <em>«Чтобы
      устроиться на работу, нужен опыт, а чтобы получить опыт, нужна работа»</em>. Однако нанимающие
      менеджеры стажировок и Junior-позиций прекрасно понимают эту ситуацию. От вас не ждут 5 лет
      коммерческой разработки высоконагруженных систем.</p>
                              <p>Их ключевая цель — увидеть технический потенциал, горящие глаза,
      инженерное мышление и умение доводить учебные проекты до работающего результата. При отклике
      решающую роль часто играет правильное <a
      href="/blog/how-to-write-it-cover-letter-structure-template">сопроводительное письмо Cover
      Letter для стажировок</a>, объясняющее вашу мотивацию.</p>
  - id: 'what-to-write'
    title: 'Что писать в CV если нет опыта: 5 источников реальной практики'
    html: |2-
                              <p>Если вы задаетесь вопросом, <strong>что писать в cv если нет
      опыта</strong>, обратите внимание на следующие блоки, которые есть практически у каждого
      активного студента:</p>
                              <ol>
                                  <li><strong>Пет-проекты (Pet-projects):</strong> телеграм-боты,
      парсеры сайтов, собственный мини-блог, интерактивные веб-приложения на React или FastAPI с
      ссылками на деплой;</li>
                                  <li><strong>Курсовые и лабораторные работы:</strong> опишите их как
      инженерные кейсы («Реализовал симуляцию физических процессов на C++ с многопоточностью...»).
      Навыки подготовки <a href="/blog/ideal-lab-report-template-gost-online">отчетов по учебным
      лабораторным работам</a> показывают умение структурировать данные;</li>
                                  <li><strong>Хакатоны и кейс-чемпионаты:</strong> участие в командных
      соревнованиях (даже без первого места) демонстрирует умение работать в спринтах и
      дедлайнах;</li>
                                  <li><strong>Open-source контрибьюции:</strong> исправление багов в
      библиотеках, улучшение документации популярных проектов на GitHub;</li>
                                  <li><strong>Академические достижения:</strong> победы в олимпиадах,
      высокий средний балл (выше 4,5), научные публикации и доклады на конференциях.</li>
                              </ol>
  - id: 'structure'
    title: 'Анатомия студенческого резюме: проекты на первом месте'
    html: |2-
                              <p>В отличие от резюме сеньора, где во главе угла стоит раздел «Опыт
      работы», в студенческом резюме блоки меняются местами:</p>
                              <ul>
                                  <li><strong>Контакты и цель:</strong> ФИО, город, готовность к
      стажировке или part-time 20–30 часов;</li>
                                  <li><strong>Технические навыки (Skills):</strong> перечень реальных
      технологий, с которыми вы умеете работать;</li>
                                  <li><strong>Проекты (Projects):</strong> самый большой и подробный
      раздел (2–3 проекта с задачами, стеком и результатами);</li>
                                  <li><strong>Образование (Education):</strong> вуз, факультет,
      специальность, ожидаемый год выпуска;</li>
                                  <li><strong>Дополнительное образование:</strong> курсы (Яндекс
      Практикум, Stepik, ШАД) и сертификаты.</li>
                              </ul>
  - id: 'student-template'
    title: 'Шаблон резюме для студента без опыта работы в Markdown'
    html: |2-
                              <p>Используйте этот готовый <strong>шаблон резюме для студента без опыта
      работы</strong> для откликов на IT-стажировки:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown CV Студента</span></div>
                                  <pre><code># Михаил Васильев
      **Junior Python / Backend Developer**
      Telegram: @mikhail_dev | GitHub: github.com/mikhail-dev | Email: mikhail@example.com | Москва (готов к удаленной работе)

      ## Обо мне
      Студент 3-го курса МГТУ им. Баумана (ИУ7). Ищу позицию Junior Python разработчика или стажера (готов уделять 30+ часов в неделю). Увлечен бэкендом, проектированием реляционных баз данных и написанием чистого кода.

      ## Навыки
      - **Языки:** Python 3.12, SQL, базовый C++
      - **Фреймворки & Библиотеки:** FastAPI, Django, SQLAlchemy, Alembic, Pydantic, Aiogram
      - **Базы данных & Инструменты:** PostgreSQL, Redis, Docker, Git, Linux (Ubuntu), Pytest

      ## Проекты

      ### 1. Telegram-бот для автоматизации записи на услуги (FastAPI + Aiogram + PostgreSQL)
      - Разработал асинхронный бэкенд для бронирования слотов с защитой от двойного бронирования.
      - Настроил авторизацию через JWT и автоматические пуш-напоминания через Redis Pub/Sub.
      - Стек: Python, FastAPI, Aiogram 3, PostgreSQL, Docker Compose.
      - Ссылка на код: [github.com/mikhail-dev/booking-bot](https://github.com/mikhail-dev/booking-bot)

      ### 2. Курсовой проект: Система распознавания рукописных символов
      - Обучил сверточную нейросеть (CNN) на датасете MNIST, добившись точности 98,4 %.
      - Реализовал веб-интерфейс для загрузки и визуализации предсказаний.
      - Стек: PyTorch, NumPy, Flask.

      ## Образование
      **МГТУ им. Н. Э. Баумана** *(2023 — 2027)*  
      Факультет «Информатика и системы управления», специальность «Программная инженерия». Средний балл: 4,8.</code></pre>
                              </div>
  - id: 'github-portfolio'
    title: 'Как оформить GitHub и ссылки на проекты'
    html: |2-
                              <p>Для студента репозиторий на GitHub — это главное доказательство
      компетенций. Сделайте так, чтобы он выглядел профессионально:</p>
                              <ul>
                                  <li>Каждый репозиторий должен содержать понятный файл
      <code>README.md</code> с описанием задачи, скриншотами и инструкцией запуска через Docker;</li>
                                  <li>Удалите мусорные учебные репозитории с названиями
      <code>lab1</code>, <code>test123</code>;</li>
                                  <li>Пишите осмысленные сообщения коммитов на английском языке
      (<code>feat: add user authentication</code> вместо <code>commit final 2</code>).</li>
                              </ul>
tips:
  - title: 'Не скрывайте статус студента'
    html: |2-
      <p>Честно укажите, на каком курсе учитесь и сколько часов можете уделять работе (например, 25–30
      ч/нед). Компании ценят прозрачность при планировании стажировок.</p>
  - title: 'Верстка в Labkeeper'
    html: |2-
      <p>В Markdown-проекте Labkeeper поля и шрифт не настраиваются: печать браузера выводит страницу
      такой, как в превью. Если резюме не помещается на одну страницу, перенесите его в LaTeX-проект и
      задайте поля пакетом <code>geometry</code>.</p>
