sections:
  - id: 'why-cover-letter'
    title: 'Зачем разработчику Cover Letter в 2026 году'
    html: |2-
                              <p>В эпоху высокой конкуренции на рынке труда и тысяч автоматических
      откликов на одну позицию стандартное резюме часто пролистывается за 6 секунд. Качественное
      персонализированное сопроводительное письмо (Cover Letter) — это ваш главный инструмент
      выделиться из общей массы и сразу привлечь внимание нанимающего менеджера (Hiring Manager) или
      техлида.</p>
                              <p>Особенно критично сопроводительное письмо при откликах в зарубежные
      компании, стартапы и продуктовые IT-гиганты, где культура коммуникации ценится наравне с умением
      писать чистый код. Оно обязательно должно гармонировать с основным документом — вашим <a
      href="/blog/frontend-backend-developer-resume-tech-stack-ats">резюме с четким стеком
      технологий</a>.</p>
  - id: 'structure'
    title: 'Структура сопроводительного письма IT: формула из 4 абзацев'
    html: |2-
                              <p>Правильная <strong>структура сопроводительного письма it</strong>
      исключает «воду» и строго фокусируется на пользе кандидата для конкретного проекта. Идеальный
      объем — 250–350 слов:</p>
                              <ol>
                                  <li><strong>Приветствие и хук (Hook):</strong> персональное
      обращение (по имени тимлида или HR) и четкое указание вакансии. Упомяните, что именно вас
      зацепило в продукте компании (например: «Слежу за вашим релизом новой системы распределенного
      хранения...»).</li>
                                  <li><strong>Почему вы идеальный кандидат (Why You):</strong> 2–3
      ключевых инженерных достижения с цифрами и бизнес-метриками, напрямую перекликающиеся со стеком
      вакансии.</li>
                                  <li><strong>Почему именно эта компания (Why Them):</strong>
      демонстрация того, что вы изучили цели и технологические вызовы компании, а не отправляете спам
      по 100 вакансиям.</li>
                                  <li><strong>Призыв к действию (Call to Action):</strong> вежливое
      предложение созвониться или обсудить решение конкретной архитектурной задачи на интервью.</li>
                              </ol>
  - id: 'english-template'
    title: 'Шаблон cover letter на английском онлайн для зарубежных откликов'
    html: |2-
                              <p>Используйте этот проверенный <strong>шаблон cover letter на
      английском онлайн</strong>, адаптируя его под свою квалификацию:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown Cover Letter Template</span></div>
                                  <pre><code># Alex Ivanov — Software Engineer
      [LinkedIn](https://linkedin.com) | [GitHub](https://github.com) | alex@example.com

      Dear [Hiring Manager Name / Engineering Team],

      I am excited to apply for the **Senior Backend Engineer** role at [Company Name]. Having followed [Company Name]'s recent scaling challenges with high-throughput stream processing, I am eager to bring my 5+ years of experience in distributed systems and Go/Kubernetes to your infrastructure team.

      In my current role at [Previous Company], I led the redesign of our real-time payment processing gateway:
      - **Reduced API latency by 45%** (from 220ms to 120ms p99) by optimizing PostgreSQL indexing and introducing Redis distributed caching.
      - **Architected event-driven microservices** with Apache Kafka handling 35,000+ RPS with zero downtime during peak seasonal events.
      - **Mentored 4 junior engineers** and established CI/CD automated linting pipelines, decreasing deployment rollbacks by 30%.

      What excites me most about [Company Name] is your commitment to open-source tooling and your mission to democratize developer tooling. I believe my hands-on background in fault-tolerant architecture will directly support your roadmap for the upcoming EU market expansion.

      I would welcome the opportunity to discuss how my technical skills and architectural mindset can contribute to [Company Name]'s growth. Thank you for your time and consideration.

      Best regards,  
      Alex Ivanov</code></pre>
                              </div>
                              <p>Если в вакансии указаны строгие требования к коммуникации на
      английском языке, убедитесь, что в резюме грамотно указан ваш <a
      href="/blog/resume-language-skills-cefr-scale-a1-c2">уровень владения иностранными языками по
      шкале CEFR</a>.</p>
  - id: 'metrics'
    title: 'Как формулировать достижения через формулу XYZ'
    html: |2-
                              <p>Для описания опыта в Cover Letter используйте формулу Google (XYZ
      formula): <em>«Достиг [X], измеренное [Y], за счет того, что сделал [Z]»</em>.</p>
                              <ul>
                                  <li><strong>Плохо:</strong> «Писал тесты и делал фронтенд
      быстрее».</li>
                                  <li><strong>Отлично:</strong> «Увеличил тестовое покрытие с 40% до
      85% с помощью Vitest/Cypress, сократив число критических багов в продакшене в 2 раза».</li>
                              </ul>
  - id: 'bad-habits'
    title: 'Топ-5 фраз, которые отправляют отклик в корзину'
    html: |2-
                              <ul>
                                  <li><em>«To Whom It May Concern»</em> — устаревший канцелярский
      шаблон; найдите имя тимлида или напишите «Dear [Company] Engineering Team»;</li>
                                  <li><em>«Я стрессоустойчивый, коммуникабельный и быстро
      обучаемый»</em> — пустые клише, которые игнорируют все рекрутеры;</li>
                                  <li><em>«Все подробности есть в моем резюме»</em> — Cover Letter
      должно дополнять CV контекстом, а не дублировать его тезисы;</li>
                                  <li><em>Копипаст без смены названия компании:</em> непростительная
      ошибка при массовых рассылках.</li>
                              </ul>
tips:
  - title: 'Экспорт в едином стиле с резюме'
    html: |2-
      <p>Сохраняйте резюме и Cover Letter в одном дизайнерском стиле, с одинаковым шрифтом заголовков
      и цветом акцентов — это выглядит подчеркнуто профессионально.</p>
  - title: 'Верстка в Labkeeper'
    html: |2-
      <p>В Labkeeper Cover Letter удобно писать в Markdown: кнопка «Сохранить в PDF» открывает печать
      браузера. Chrome сохраняет ссылки на GitHub и портфолио кликабельными, а колонтитулы в диалоге
      печати выключите, чтобы на листе не было адреса страницы и даты.</p>
editorExample:
  markdown: |2-
    # Cover letter

    Dear hiring team,

    I am applying for the Backend Engineer role. In my current project I reduced API latency by 30%
    and added automated integration tests.

    Your focus on reliable data services matches my experience with Python and PostgreSQL.

    I would welcome an opportunity to discuss the role.

    Anna Petrova
