sections:
  - id: 'ats-reality'
    title: 'Как алгоритмы ATS и HR сканируют резюме программистов'
    html: |2-
                              <p>В большинстве технологических компаний отклик на вакансию сначала
      проходит через <strong>ATS (Applicant Tracking System)</strong> — автоматическую систему
      первичного скрининга (Greenhouse, Lever, Workday, Taleo). ATS парсит текст резюме, извлекает
      сущности и сопоставляет ключевые навыки с требованиями вакансии.</p>
                              <p>Если резюме сверстано в сложный графический макет со звездочками,
      диаграммами и невидимыми таблицами, парсер часто превращает его в кашу, и кандидат отсеивается
      автоматически. Чтобы увеличить шансы на отклик, всегда прикрепляйте персонализированное <a
      href="/blog/how-to-write-it-cover-letter-structure-template">сопроводительное письмо Cover
      Letter</a>.</p>
  - id: 'stack-grouping'
    title: 'Группировка стека: языки, фреймворки, БД и протоколы'
    html: |2-
                              <p>Список навыков через запятую на 5 строк выглядит нечитаемо.
      Разделяйте технологии по логическим блокам:</p>
                              <ul>
                                  <li><strong>Languages:</strong> TypeScript, JavaScript, Python, Go,
      SQL;</li>
                                  <li><strong>Frontend:</strong> React 19, Next.js (App Router), Vue
      3, Tailwind CSS, Redux Toolkit, Zustand;</li>
                                  <li><strong>Backend &amp; DB:</strong> Node.js, Express, PostgreSQL,
      Redis, ClickHouse, Prisma ORM;</li>
                                  <li><strong>DevOps &amp; Tools:</strong> Docker, Kubernetes, GitHub
      Actions, AWS (S3, Lambda), Grafana, Prometheus;</li>
                                  <li><strong>Architecture &amp; Protocols:</strong> REST API,
      GraphQL, gRPC, WebSocket, Microservices.</li>
                              </ul>
  - id: 'frontend-example'
    title: 'CV frontend разработчика: пример в Markdown'
    html: |2-
                              <p>Ниже представлен выверенный <strong>cv frontend разработчика пример
      markdown</strong> с акцентом на современные технологии:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown Frontend CV</span></div>
                                  <pre><code># Dmitry Sokolov — Senior Frontend Engineer
      **Email:** dmitry@example.dev | **Telegram:** @dmitry_frontend | **GitHub:** github.com/dmitry-dev

      ## Skills
      - **Core:** TypeScript, JavaScript (ES2024), HTML5, CSS3/SCSS
      - **Frameworks & Libraries:** React 19, Next.js, TanStack Query, Redux Toolkit, Tailwind CSS
      - **Testing & Tooling:** Vitest, Playwright, Jest, Webpack, Vite, Git, Docker
      - **Performance:** Web Vitals optimization, SSR/SSG, Code Splitting, Bundle size analysis

      ## Experience

      ### Senior Frontend Developer — SaaS FinTech Platform *(2023 — Present)*
      - Architected and delivered client-facing analytics dashboard using Next.js 14 and TanStack Table, improving page load speed by 40% (LCP reduced to 1.1s).
      - Refactored legacy Redux architecture to modular Zustand stores, cutting bundle size by 65 KB.
      - Implemented automated E2E testing suite with Playwright, decreasing regression bugs by 35%.

      ### Frontend Developer — E-Commerce Project *(2021 — 2023)*
      - Developed responsive UI checkout flow handling 50k daily active shoppers.
      - Integrated payment gateways and optimized Core Web Vitals to achieve 95+ score on mobile Lighthouse.</code></pre>
                              </div>
                              <p>Для кандидатов с богатой карьерной историей рекомендуем ознакомиться
      с правилами верстки <a
      href="/blog/one-page-resume-cv-template-condensing-experience">одностраничного резюме
      One-Pager</a>, позволяющими компактно упаковать многолетний опыт.</p>
  - id: 'backend-example'
    title: 'Резюме backend: шаблон с оптимизацией под ATS'
    html: |2-
                              <p>Готовый <strong>резюме backend шаблон ats</strong> ориентированный на
      надежность, базы данных и высокие нагрузки:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown Backend ATS CV</span></div>
                                  <pre><code># Sergey Morozov — Senior Backend Developer (Go / Python)
      **Location:** Remote / Worldwide | **LinkedIn:** linkedin.com/in/smorozov | **GitHub:** github.com/smorozov

      ## Technical Summary
      - **Languages:** Go (Golang), Python, Bash, SQL
      - **Frameworks:** Gin, Chi, FastAPI, Django
      - **Databases:** PostgreSQL, MySQL, Redis, MongoDB, Elasticsearch
      - **Cloud & DevOps:** Docker, Kubernetes, Helm, Terraform, Kafka, RabbitMQ, CI/CD

      ## Professional Experience

      ### Lead Backend Engineer — Highload Stream Analytics *(2022 — Present)*
      - Designed event-driven data ingestion pipeline processing 25,000 requests/sec using Go, Apache Kafka, and PostgreSQL.
      - Optimized slow analytical SQL queries and configured connection pooling (PgBouncer), reducing database CPU load by 50%.
      - Migrated monolith services to Kubernetes microservices with 99.98% uptime SLA.

      ### Backend Engineer — Logistics API Service *(2020 — 2022)*
      - Built RESTful and gRPC microservices in Go and Python FastAPI for tracking delivery shipments across 12 countries.
      - Configured automated CI/CD pipelines in GitLab CI, reducing release deployment cycles from 2 hours to 15 minutes.</code></pre>
                              </div>
  - id: 'mistakes'
    title: 'Ошибки: графики скиллов в процентах и двухколоночные таблицы'
    html: |2-
                              <p>Чего категорически нельзя делать в резюме разработчика:</p>
                              <ul>
                                  <li><strong>Шкалы владения в процентах («Python 85%»):</strong> это
      не несет никакой информации и выглядит нелепо в глазах технического интервьюера.</li>
                                  <li><strong>Сложные двухколоночные таблицы:</strong> парсеры ATS
      читают текст построчно слева направо, перемешивая дату из левой колонки с описанием компании из
      правой.</li>
                                  <li><strong>Отсутствие ссылок на GitHub / Pet-проекты:</strong>
      реальный код скажет о вас в 10 раз больше, чем список технологий.</li>
                              </ul>
tips:
  - title: 'Проверяйте читаемость текста в PDF'
    html: |2-
      <p>Экспортируя резюме в PDF, выделите весь текст мышью и скопируйте в блокнот. Если слова
      скопировались в правильном порядке без разрывов, ATS, скорее всего, тоже прочитает резюме
      корректно.</p>
  - title: 'Сохранение в PDF в Labkeeper'
    html: |2-
      <p>В Markdown-проекте Labkeeper резюме сохраняется в PDF через печать браузера: текст в таком
      PDF остается текстом, и ATS может его прочитать. Перед печатью выключите колонтитулы, иначе
      браузер добавит на лист адрес страницы и дату. Если нужен PDF с точными полями, соберите резюме
      в LaTeX-проекте.</p>
