sections:
  - id: 'why-cefr'
    title: 'Почему субъективные описания языков больше не работают'
    html: |2-
                              <p>Фразы вроде <em>«английский базовый»</em>, <em>«читаю техническую
      литературу со словарем»</em> или <em>«свободный разговорный»</em> вызывают у профессиональных
      рекрутеров лишь недоумение. Для одного кандидата «свободный» означает способность поддержать
      беседу о погоде, а для другого — проведение часовых переговоров с техническими директорами из
      США.</p>
                              <p>Чтобы избежать двусмысленности, международные компании и топовые
      российские работодатели используют единый мировой стандарт — <strong>Общеевропейскую шкалу
      языковой компетенции CEFR (Common European Framework of Reference)</strong>. Особенно важно
      точно сформулировать владение языком при отправке отклика с <a
      href="/blog/how-to-write-it-cover-letter-structure-template">сопроводительным письмом Cover
      Letter на английском</a>.</p>
  - id: 'cefr-breakdown'
    title: 'Оформление языков в резюме A1 C2: подробная расшифровка уровней'
    html: |2-
                              <p>Грамотное <strong>оформление языков в резюме a1 c2</strong> требует
      точного понимания градаций:</p>
                              <ul>
                                  <li><strong>A1 (Beginner) / A2 (Elementary):</strong> элементарное
      владение. Понимание базовых табличек и простых фраз. В профессиональном IT-резюме обычно не
      указывается (исключение — дополнительный язык вроде немецкого или японского, если его знание
      полезно для вакансии и вы его активно учите);</li>
                                  <li><strong>B1 (Intermediate):</strong> пороговый уровень.
      Способность понимать техническую документацию, переписываться в Slack и Jira с
      онлайн-переводчиком, участвовать в простых синхронах;</li>
                                  <li><strong>B2 (Upper-Intermediate):</strong> уверенный рабочий
      уровень (Professional Working Proficiency). Свободное участие в ежедневных митингах, защита
      архитектурных решений, прохождение технических интервью на английском языке. Золотой стандарт
      для найма в международные команды;</li>
                                  <li><strong>C1 (Advanced):</strong> профессиональное владение.
      Способность вести сложные переговоры, шутить, понимать акценты и писать научные статьи без
      помощи редакторов;</li>
                                  <li><strong>C2 (Proficiency):</strong> владение на уровне
      образованного носителя языка (Near-native);</li>
                                  <li><strong>Native / Bilingual:</strong> родной язык.</li>
                              </ul>
  - id: 'template-snippet'
    title: 'Уровень владения языком в CV: шаблон в Markdown и тексте'
    html: |2-
                              <p>Используйте этот лаконичный <strong>уровень владения языком в cv
      шаблон</strong> для раздела навыков:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown Секция языков</span></div>
                                  <pre><code>## Languages
      - **Russian:** Native
      - **English:** B2 — Upper-Intermediate (Fluent technical & conversational, daily international team standups)
      - **German:** A2 — Elementary (Basic comprehension, actively learning)</code></pre>
                              </div>
                              <p>Если вы оптимизируете свое <a
      href="/blog/frontend-backend-developer-resume-tech-stack-ats">резюме разработчика под
      ATS-фильтры</a>, то компактный маркированный список языков распознается поисковыми алгоритмами
      без малейших искажений.</p>
                              <p>Если в вашем резюме используется двухколоночная таблица навыков:</p>
                              <div class="article-table-wrapper">
                                  <table class="article-table">
                                      <thead>
                                          <tr>
                                              <th>Язык</th>
                                              <th>Уровень по CEFR</th>
                                              <th>Пояснение</th>
                                          </tr>
                                      </thead>
                                      <tbody>
                                          <tr>
                                              <td>Русский</td>
                                              <td>Native</td>
                                              <td>Родной язык</td>
                                          </tr>
                                          <tr>
                                              <td>Английский</td>
                                              <td>B2 (Upper-Intermediate)</td>
                                              <td>Свободное ведение деловой и технической
      переписки</td>
                                          </tr>
                                          <tr>
                                              <td>Французский</td>
                                              <td>B1 (Intermediate)</td>
                                              <td>Чтение специализированной литературы</td>
                                          </tr>
                                      </tbody>
                                  </table>
                              </div>
  - id: 'certificates'
    title: 'Международные языковые сертификаты: IELTS, TOEFL, Cambridge'
    html: |2-
                              <p>Если вы сдавали официальные стандартизированные тесты, обязательно
      укажите балл и год сдачи:</p>
                              <ul>
                                  <li><code>English: C1 — Advanced (IELTS Academic 7.5,
      2023)</code>;</li>
                                  <li><code>English: B2 (TOEFL iBT 92, 2024)</code>;</li>
                                  <li><code>German: B2 (Goethe-Zertifikat B2)</code>.</li>
                              </ul>
                              <p>Наличие сертификата мгновенно снимает любые сомнения рекрутера в
      вашей языковой квалификации.</p>
  - id: 'it-english'
    title: 'Специфика Technical English для IT-специалистов'
    html: |2-
                              <p>Для разработчиков часто допустима формулировка <em>«Working Technical
      Proficiency»</em>, если вы читаете исходники и RFC документацию без затруднений, но устная речь
      требует небольшой практики. Честность на скрининге всегда ценится выше завышенных ожиданий.</p>
tips:
  - title: 'Не завышайте свой реальный уровень'
    html: |2-
      <p>Если вы укажете уровень C1, англоязычный HR может без предупреждения переключить
      собеседование на английский язык с первой секунды звонка.</p>
  - title: 'Верстка резюме в Labkeeper'
    html: |2-
      <p>В Labkeeper раздел языков — обычный маркированный список или таблица Markdown, как в шаблонах
      выше: дополнительного оформления для него не нужно.</p>
editorExample:
  markdown: |2-
    # Languages

    | Language | CEFR | Working context |
    |:---------|:-----|:----------------|
    | English | C1 | Technical presentations |
    | German | B1 | Everyday communication |
    | Russian | Native | Professional writing |
