    // Ток, мА, и напряжение, В
    I = [10, 20, 30, 40] # 0.5
    U = [1.2, 2.3, 3.6, 4.8] # 0.1
    least_squares(I, U, x_name="I", y_name="U")
    k = a
    a = a # 0
    b = b # 0
    Uf = a * I + b
    plot(title="ВАХ резистора", x_name="I, мА", y_name="U, В", x_1=I, y_1=U, name_1="опыт", x_2=I,
    y_2=Uf, type_2="line", name_2="МНК")
  latex: |2-
    \section*{Вольт-амперная характеристика}
    Наклон прямой по МНК: $k = ${k}$~В/мА.
