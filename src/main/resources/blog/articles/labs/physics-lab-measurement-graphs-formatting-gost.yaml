sections:
  - id: 'intro'
    title: 'Почему преподаватели снижают баллы за графики'
    html: |2-
                              <p>График экспериментальных измерений в физическом практикуме — это не
      просто иллюстрация, а полноценный вычислительный инструмент. По наклону прямой определяют
      ускорение свободного падения, постоянную Планка или удельную теплоемкость. Однако многие
      студенты теряют баллы на защите из-за типичных ошибок: отсутствия единиц величин на осях,
      неверного масштаба или соединения точек ломаной «змейкой».</p>
                              <p>В этом руководстве мы разберем базовые <strong>графики для
      лабораторной работы правила</strong> и детально рассмотрим эталонное <strong>оформление осей
      графика в отчете</strong> согласно методическим требованиям вузов. Общие правила построения
      диаграмм в технической документации задают рекомендации Р 50-77-88 «Правила выполнения
      диаграмм»: они заменили ГОСТ 2.319-81 с 1 января 1989 года. А о том, как учесть доверительные
      интервалы в математической модели, читайте в нашем материале о <a
      href="/blog/indirect-measurement-error-calculation-lab-report">расчете погрешностей косвенных
      измерений</a>.</p>
  - id: 'rules'
    title: 'Графики для лабораторной работы: ключевые правила оформления'
    html: |2-
                              <p>Чтобы график принял даже строгий преподаватель, соблюдайте правила,
      которые встречаются в большинстве методичек:</p>
                              <ol>
                                  <li><strong>График должен занимать полезную площадь:</strong> точки
      эксперимента должны заполнять не менее 70–80% плоскости координатной сетки. Недопустимо, когда
      все точки сжаты в маленьком уголке, а остальное пространство пустует.</li>
                                  <li><strong>Правило «1, 2, 5»:</strong> шаг координатной сетки
      должен быть кратен $1$, $2$ или $5$ (например, $0{,}1$, $0{,}2$, $0{,}5$, $1$, $2$, $5$, $10$,
      $20$). Масштабы вида $1\text{ см} = 3{,}3\text{ единицы}$ использовать не стоит: они делают
      невозможным быстрое чтение координат.</li>
                                  <li><strong>Подавление нуля (разрыв шкалы):</strong> если значения
      величины лежат в узком диапазоне от $180$ до $220$, вовсе не обязательно начинать ось с нуля.
      Начните шкалу со $170$, чтобы детально отобразить динамику процесса.</li>
                                  <li><strong>Наличие подрисуночной подписи:</strong> снизу
      обязательно пишется обозначение по ГОСТ: <em>«Рисунок 2 — Зависимость периода колебаний маятника
      от длины нити T(L)»</em>.</li>
                              </ol>
  - id: 'axes'
    title: 'Оформление осей графика в отчете: подписи, стрелки и единицы'
    html: |2-
                              <p>Грамотное <strong>оформление осей графика в отчете</strong> требует
      единообразия. На концах координатных осей указывается буквенное обозначение физической величины
      и ее размерность в системе СИ через запятую или в квадратных скобках:</p>
                              <ul>
                                  <li>Рекомендуемый академический стандарт: <code>$I$, мА</code> или
      <code>$U$, В</code>;</li>
                                  <li>Допустимый стандарт: <code>$I$ [мА]</code>, <code>$t$
      [с]</code>, <code>$T$ [К]</code>;</li>
                                  <li>При наличии масштабного множителя: <code>$R \times 10^3$,
      Ом</code> или <code>$R$, кОм</code>.</li>
                              </ul>
                              <p>Стрелки на концах осей ставятся только тогда, когда это предусмотрено
      стилем методички (в классических научных графиках чаще используется замкнутая прямоугольная
      рамка со шкалами со всех четырех сторон).</p>
  - id: 'points-errorbars'
    title: 'Экспериментальные точки и кресты погрешностей'
    html: |2-
                              <p>Реальный физический опыт всегда сопровождается случайными и
      приборными погрешностями. Поэтому каждая точка на графике наносится не просто незаметной точкой,
      а четким маркером с <strong>крестом погрешностей (error bars)</strong>:</p>
                              <ul>
                                  <li>Горизонтальная перекладина креста равна удвоенной абсолютной
      погрешности аргумента: $\pm \Delta x$;</li>
                                  <li>Вертикальная перекладина равна удвоенной погрешности функции:
      $\pm \Delta y$;</li>
                                  <li>Если погрешность по одной из осей меньше размера самого маркера
      точки, об этом делается пометка в описании к графику.</li>
                              </ul>
  - id: 'approximation'
    title: 'Аппроксимирующая линия против соединения точек ломаной'
    html: |2-
                              <p><strong>Главная ошибка первокурсников:</strong> соединять точки опыта
      последовательными отрезками, получая зубчатую пилу. Так делать нельзя!</p>
                              <p>В физике измеряется плавная непрерывная закономерность. Линия графика
      строится как <em>гладкая кривая</em> или <em>прямая</em> методом наименьших квадратов (МНК):</p>
                              <ul>
                                  <li>Прямая проводится так, чтобы экспериментальные точки
      располагались равномерно по обе стороны от неё;</li>
                                  <li>Прямая обязана проходить через доверительные интервалы (кресты)
      большинства точек;</li>
                                  <li>Точки-выбросы (грубые промахи) исключаются из обработки с
      обязательным обоснованием в расчетах.</li>
                              </ul>
                              <p>Грамотно построенная аппроксимация позволяет сразу перейти к
      финальному этапу — составлению <a
      href="/blog/how-to-write-lab-report-conclusion-examples">грамотного вывода к лабораторной
      работе</a> на основе углового коэффициента прямой.</p>
  - id: 'tools'
    title: 'Инструменты: миллиметровка, Python, Excel и pgfplots в Labkeeper'
    html: |2-
                              <p>Хотя миллиметровая бумага все еще встречается на младших курсах,
      современный стандарт отчета — компьютерная графика. Вы можете подготовить график в Python
      (Matplotlib/Seaborn), OriginPro или прямо в LaTeX через пакет <code>pgfplots</code>.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX pgfplots пример</span></div>
                                  <pre><code>\begin{tikzpicture}
      \begin{axis}[
          xlabel={$I$, мА},
          ylabel={$U$, В},
          grid=both,
          width=9cm, height=6cm
      ]
      \addplot+[only marks, error bars/.cd, y dir=both, y explicit]
          coordinates {
              (10, 1.2) +- (0, 0.1)
              (20, 2.3) +- (0, 0.15)
              (30, 3.6) +- (0, 0.12)
              (40, 4.8) +- (0, 0.2)
          };
      \addplot[thick, red, domain=10:40] {0.12*x};
      \end{axis}
      \end{tikzpicture}</code></pre>
                              </div>
                              <p>В LaTeX-проекте Labkeeper этот код собирается в векторный график.
      Пакет <code>pgfplots</code> подключается в преамбуле, поэтому проект начинают со своей
      преамбулы.</p>
                              <p>Главное отличие Labkeeper для лабораторных — вычислительный сегмент.
      Данные с погрешностями задаются прямо в проекте, функция <code>least_squares</code> считает
      коэффициенты прямой МНК, а <code>plot</code> рисует точки с крестами погрешностей и линию. В
      LaTeX-проекте график встает в PDF, а коэффициент подставляется в текст через
      <code>${k}</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Вычислительный сегмент</span></div>
                                  <pre><code>// Ток, мА, и напряжение, В
      I = [10, 20, 30, 40] # 0.5
      U = [1.2, 2.3, 3.6, 4.8] # 0.1
      least_squares(I, U, x_name="I", y_name="U")
      k = a
      a = a # 0
      b = b # 0
      Uf = a * I + b
      plot(title="ВАХ резистора", x_name="I, мА", y_name="U, В", x_1=I, y_1=U, name_1="опыт", x_2=I, y_2=Uf, type_2="line", name_2="МНК")</code></pre>
                              </div>
                              <p>Погрешности после знака <code>#</code> задают кресты по обеим осям.
      Коэффициент <code>k</code> сохраняет погрешность наклона, а у линии МНК погрешность
      коэффициентов обнулена (<code>a = a # 0</code>), чтобы прямая не выглядела ломаной из-за
      округления. Пример в редакторе открывает этот код вместе с LaTeX-сегментом.</p>
tips:
  - title: 'Никогда не соединяйте точки «змейкой»'
    html: |2-
      <p>Всегда проводите усредненную теоретическую кривую или прямую МНК. Ломаная линия допустима
      только при регистрации непрерывных осциллограмм.</p>
  - title: 'Векторный экспорт графиков'
    html: |2-
      <p>При вставке графиков из Python или Excel в LaTeX-проект сохраняйте их в векторном PDF или в
      PNG высокого разрешения, чтобы при печати линии и цифры оставались четкими. Формат SVG pdfLaTeX
      не вставляет.</p>
editorExample:
