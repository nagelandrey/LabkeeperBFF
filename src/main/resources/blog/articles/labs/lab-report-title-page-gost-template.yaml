sections:
  - id: 'requirements'
    title: 'ГОСТ и требования кафедры: какой образец использовать'
    html: |2-
      <p>Титульный лист лабораторной работы обычно содержит название вуза и кафедры,
      дисциплину, номер и тему работы, данные студента и преподавателя, город и год.
      Возьмите образец из методички кафедры и замените его поля своими данными. Ниже приведен
      готовый LaTeX-шаблон, который можно адаптировать под этот образец.</p>
      <p>Запрос «титульный лист лабораторной работы по ГОСТ» не означает, что для всех вузов
      существует один обязательный бланк. <a href="https://protect.gost.ru/gost/details/7d280e43-7036-4a69-8e6e-d15867028343">ГОСТ 7.32-2017</a>
      устанавливает требования к отчетам о научно-исследовательской работе; кафедра может
      использовать его положения в своей методичке. Состав реквизитов учебной лабораторной
      уточняйте по требованиям преподавателя.</p>
      <div class="article-note"><strong>💡 Совет:</strong> Не переносите в лабораторную
      гриф допуска к защите ВКР, УДК и регистрационный номер НИР только потому, что они есть
      в чужом образце. Добавляйте их, если этого требует ваш бланк.</div>
      <p>Структура остальных разделов разобрана в статье про
      <a href="/blog/ideal-lab-report-template-gost-online">шаблон отчета по лабораторной работе</a>.
      Для курсовой и диплома используйте отдельное руководство по
      <a href="/blog/latex-titlepage">титульному листу в LaTeX</a>.</p>
  - id: 'fields'
    title: 'Что написать на титульном листе лабораторной'
    html: |2-
      <p>Разделите страницу на четыре блока. Так легче сверить ее с образцом и сохранить
      выравнивание, когда название работы занимает несколько строк.</p>
      <ol>
          <li><strong>Шапка:</strong> полное название учебного заведения, институт или факультет,
          кафедра. Название министерства добавьте, если оно есть в образце кафедры.</li>
          <li><strong>Название работы:</strong> «Отчет по лабораторной работе № 1», дисциплина
          «Физика», тема «Проверка закона Ома».</li>
          <li><strong>Сведения об исполнителе и проверяющем:</strong> ФИО студента, группа,
          ФИО и должность преподавателя. При групповой работе укажите всех исполнителей.</li>
          <li><strong>Нижняя строка:</strong> город и год выполнения работы.</li>
      </ol>
      <p>Поля «Вариант», «Дата выполнения», «Дата защиты», «Оценка» и строки подписей
      зависят от методички. Не заполняйте оценку и подпись преподавателя самостоятельно.</p>
  - id: 'template'
    title: 'Готовый шаблон титульного листа в LaTeX'
    html: |2-
      <p>Скопируйте полный код в LaTeX-сегмент Labkeeper. Пример содержит собственную
      преамбулу: класс <code>extarticle</code> поддерживает кегль 14 pt, пакет
      <code>tempora</code> задает шрифт семейства Times, а <code>geometry</code> — поля страницы.
      Эти настройки служат исходным образцом; сверьте их с методичкой.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \newcommand{\university}{Название университета}
      \newcommand{\department}{Кафедра физики}
      \newcommand{\discipline}{Физика}
      \newcommand{\labnumber}{1}
      \newcommand{\labtopic}{Проверка закона Ома}
      \newcommand{\studentname}{Иванов Иван Иванович}
      \newcommand{\studentgroup}{Ф-101}
      \newcommand{\teachername}{доцент Петров Петр Петрович}
      \newcommand{\workcity}{Москва}
      \newcommand{\workyear}{2026}
      \begin{document}
      \begin{titlepage}
          \centering
          \university\par
          \department\par
          \vfill
          {\bfseries ОТЧЕТ\par}
          по лабораторной работе №~\labnumber\par
          по дисциплине «\discipline»\par
          \medskip
          Тема: «\labtopic»\par
          \vfill
          \begin{flushright}
              \begin{tabular}{p{0.65\textwidth}}
                  Выполнил: студент группы \studentgroup \\
                  \studentname \\[12pt]
                  Проверил: \teachername \\[12pt]
                  Подпись: \rule{3cm}{0.4pt}
              \end{tabular}
          \end{flushright}
          \vfill
          \workcity{} --- \workyear\par
      \end{titlepage}
      \setcounter{page}{2}
      \section*{Цель работы}
      Проверить зависимость силы тока от напряжения.
      \end{document}</code></pre>
      </div>
      <p>Команда <code>\vfill</code> распределяет свободное место между блоками.
      В отличие от пустых строк и пробелов такая разметка сохраняется при замене темы или ФИО.</p>
  - id: 'customization'
    title: 'Как заменить данные и настроить оформление'
    html: |2-
      <p>Измените значения команд в начале шаблона: <code>\university</code>,
      <code>\department</code>, <code>\discipline</code>, <code>\labnumber</code>,
      <code>\labtopic</code> и сведения об участниках. Если нужен факультет,
      добавьте строку после названия университета.</p>
      <p>При длинном названии кафедры или темы LaTeX перенесет текст внутри доступной ширины.
      Если титульный лист перестал помещаться на одну страницу, сначала проверьте лишние
      строки и отступы. Не уменьшайте шрифт вопреки методичке ради сохранения чужой разметки.</p>
      <p>Поля меняются в параметрах <code>geometry</code>; подробности есть в
      <a href="/blog/latex-geometry-margins-gost">руководстве по настройке полей страницы</a>.
      Логотип и рамка нужны только по требованию кафедры: для технических бланков смотрите
      статью про <a href="/blog/latex-eskd">рамки и штампы ЕСКД</a>.</p>
      <p>Кнопка «Просмотреть пример» открывает полный шаблон, приведенный выше,
      с командами для замены данных. После проверки титула
      добавьте цель, ход работы, расчеты и выводы перед <code>\end{document}</code>.</p>
  - id: 'numbering'
    title: 'Номер страницы на титульном листе'
    html: |2-
      <p>Если методичка следует ГОСТ 7.32-2017, титульный лист входит в общую нумерацию,
      но номер на нем не печатают. В приведенном шаблоне окружение <code>titlepage</code>
      скрывает номер титула, а команда <code>\setcounter{page}{2}</code> после него
      задает номер следующей страницы.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\end{titlepage}
      \setcounter{page}{2}
      \section*{Цель работы}</code></pre>
      </div>
      <p>Для других классов документа и более сложной структуры проверьте результат в PDF.
      Отдельные случаи рассмотрены в статье про
      <a href="/blog/diploma-page-numbering-second-page">нумерацию страниц со второго листа</a>.</p>
  - id: 'checklist'
    title: 'Чек-лист перед сдачей отчета'
    html: |2-
      <ul>
          <li>Название вуза и кафедры совпадает с актуальным образцом.</li>
          <li>Номер, тема и дисциплина соответствуют выполненной лабораторной.</li>
          <li>Указаны нужные исполнители, группа и преподаватель.</li>
          <li>Поля, шрифт и строки подписей сверены с методичкой.</li>
          <li>Титульный лист занимает одну страницу, длинные строки не выходят за поля.</li>
          <li>В PDF на титуле нет номера, а следующая страница имеет нужный номер.</li>
      </ul>
      <p>После титульного листа проверьте содержательную часть: в
      <a href="/blog/how-to-write-lab-report-conclusion-examples">выводе по лабораторной работе</a>
      должны быть результаты опыта и ответ на поставленную цель.</p>
tips:
  - title: 'Сохраните шаблон для следующих работ'
    html: |2-
      <p>После входа сохраните проект с проверенным титульным листом. Для следующей лабораторной
      склонируйте его и замените номер, тему и содержание отчета.</p>
  - title: 'Проверяйте именно PDF'
    html: |2-
      <p>Проверьте переносы длинных названий и место для подписей в собранном PDF.
      Не используйте пробелы для выравнивания: для блока исполнителей в шаблоне есть таблица.</p>
