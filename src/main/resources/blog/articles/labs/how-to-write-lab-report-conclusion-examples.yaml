tips:
  - title: 'Всегда сопоставляйте вывод с целью'
    html: |2-
      <p>Простой лайфхак: перечитайте формулировку цели из начала отчета («Цель: определить...»).
      Вывод должен начинаться как прямой ответ на этот пункт: «Определено, что...».</p>
  - title: 'Округление погрешности'
    html: |2-
      <p>Погрешность округляется до одной значащей цифры (или до двух, если первая цифра 1 или 2), а
      сам результат — до того же десятичного разряда. Если результат считает вычислительный сегмент
      Labkeeper, учтите, что новый проект по умолчанию оставляет три значащие цифры. Режим округления
      по первой значащей цифре погрешности в настройках проекта оставляет у погрешности одну цифру;
      если она начинается с 1 или 2, вторую цифру сохраните вручную.</p>
editorExample:
  compute: |2-
    // Напряжение, В, и ток, А
    U = 4.95 # 0.05
    I = 0.097 # 0.002
    R = U / I
  latex: |2-
    \section*{Вывод}
    Измерено сопротивление проводника: $R = (${R})$~Ом. Результат согласуется с номиналом 51~Ом в
    пределах погрешности. Основной источник неопределенности --- измерение тока.
