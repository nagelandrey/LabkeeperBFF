      единицами СИ</td>
                                          </tr>
                                          <tr>
                                              <td>«g = 9,81452398 м/с²»</td>
                                              <td>Запись избыточных бессмысленных знаков после
      запятой</td>
                                              <td>Округлить результат в соответствии с величиной
      погрешности: $(9{,}81 \pm 0{,}04)\text{ м/с}^2$</td>
                                          </tr>
                                          <tr>
                                              <td>«Прибор плохой, поэтому не сошлось»</td>
                                              <td>Ненаучный язык</td>
                                              <td>«Превышение погрешности обусловлено классом точности
      вольтметра 1,5 и дрейфом нуля»</td>
