    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[russian]{babel}
    \usepackage{tikz}
    \usetikzlibrary{shapes.geometric,shapes.misc,positioning}
    \begin{document}
    \begin{tikzpicture}[node distance=8mm,b/.style={draw,align=center,minimum width=28mm,minimum
    height=8mm}]
    \node[b,rounded rectangle] (s) {Начало};
    \node[b,trapezium,trapezium left angle=70,trapezium right angle=110,below=of s] (i) {Ввод A, B};
    \node[b,diamond,aspect=2,below=of i] (d) {A > B?};
    \node[b,below left=8mm and 2mm of d] (y) {Max := A};
    \node[b,below right=8mm and 2mm of d] (n) {Max := B};
    \draw[->] (s)--(i);
    \draw[->] (i)--(d);
    \draw[->] (d.west) -| node[above] {Да} (y);
    \draw[->] (d.east) -| node[above] {Нет} (n);
    \end{tikzpicture}
    \end{document}
