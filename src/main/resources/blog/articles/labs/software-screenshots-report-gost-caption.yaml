sections:
  - id: 'gost-status'
    title: 'Статус скриншота в ГОСТ 7.32-2017: это всегда «Рисунок»'
    html: |2-
                              <p>В академических и инженерных стандартах РФ не существует терминов
      «скриншот», «снимок экрана» или «иллюстрация интерфейса». Любое графическое изображение — будь
      то фото осциллографа, окно веб-браузера или консоль Linux — именуется строго словом
      <strong>«Рисунок»</strong>.</p>
                              <p>Нельзя писать <em>«Скриншот 1»</em> или <em>«Снимок экрана
      программы»</em>. Слово «Скриншот» в подписи — типичная ошибка, из-за которой нормоконтроль
      возвращает работу на исправление.</p>
  - id: 'numbering-rules'
    title: 'Нумерация скриншотов в отчете гост: сквозная и по разделам'
    html: |2-
                              <p>Каноническая <strong>нумерация скриншотов в отчете гост</strong>
      подчиняется общим правилам <a href="/blog/figure-double-numbering-chapters-gost">двойной
      нумерации рисунков по главам по ГОСТ</a>:</p>
                              <ul>
                                  <li><strong>Основной вариант по ГОСТ 7.32-2017</strong> (п. 6.5.4) —
      сквозная нумерация арабскими цифрами: <em>Рисунок 1</em>, <em>Рисунок 2</em>, <em>Рисунок
      3</em>.</li>
                                  <li><strong>Нумерация в пределах раздела допускается</strong> (п.
      6.5.6): <em>Рисунок 2.1</em> (первый рисунок второго раздела), <em>Рисунок 2.2</em>, <em>Рисунок
      3.1</em>. Такой вариант часто требуют методички к дипломам и ВКР.</li>
                                  <li>На каждый скриншот в предшествующем тексте обязана
      присутствовать ссылка: <em>«Внешний вид окна аутентификации приведен на рисунке 2.3»</em>.</li>
                              </ul>
  - id: 'caption-format'
    title: 'Подпись под рисунком со скриншотом: точка, тире и кавычки'
    html: |2-
                              <p>Правильная <strong>подпись под рисунком со скриншотом</strong>
      центрируется под изображением и оформляется строго по ГОСТ:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Эталон подписи</span></div>
                                  <pre><code>Рисунок 2.4 — Главное окно программного модуля расчета траектории</code></pre>
                              </div>
                              <p>Обратите внимание на детали:</p>
                              <ul>
                                  <li>Слово «Рисунок» пишется полностью (не «Рис.»);</li>
                                  <li>После номера ставится тире с пробелами <code> — </code>;</li>
                                  <li>Название пишется с заглавной буквы;</li>
                                  <li><strong>В конце подписи точка НЕ ставится</strong>.</li>
                              </ul>
  - id: 'screenshot-hygiene'
    title: 'Культура скриншотов: что категорически запрещено показывать'
    html: |2-
                              <p>Правила профессиональной подготовки изображений для отчетов (для
      программного кода не используйте скриншоты — применяйте <a
      href="/blog/programming-lab-report-code-listings-gost">оформление листингов кода в лабораторных
      по ГОСТ</a>):</p>
                              <ul>
                                  <li><strong>Обрезайте панель задач Windows/macOS:</strong> часы,
      значки Telegram, торренты и вкладки браузера на скриншоте выглядят крайне неряшливо.
      Захватывайте только рабочее окно программы (сочетание Alt + PrintScreen).</li>
                                  <li><strong>Используйте светлую тему оформления:</strong> скриншоты
      в черной теме IDE расходуют картридж принтера и превращаются на бумаге в нечитаемое черное
      пятно.</li>
                                  <li><strong>Масштаб шрифта:</strong> если текст в консоли или
      таблице не читается при масштабе 100% на листе А4, увеличьте шрифт в программе перед созданием
      снимка.</li>
                              </ul>
  - id: 'latex-figure-snippet'
    title: 'Шаблон вставки скриншота в LaTeX с рамкой'
    html: |2-
                              <p>Если фон скриншота белый, он может визуально сливаться с белым листом
      бумаги. Оберните его в тонкую рамку через команду <code>\fbox</code>. С пакетом babel подпись по
      умолчанию выходит в виде «Рис. 1:», поэтому в преамбуле слово «Рисунок» и тире задают явно:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>% Преамбула
      \usepackage{caption}
      \DeclareCaptionLabelSeparator{emdash}{\ --- }
      \captionsetup[figure]{labelsep=emdash}
      \addto\captionsrussian{\renewcommand{\figurename}{Рисунок}}

      % Текст
      \begin{figure}[htbp]
          \centering
          \setlength{\fboxsep}{1pt}
          \setlength{\fboxrule}{0.5pt}
          \fbox{\includegraphics[width=0.85\textwidth]{gui-window.png}}
          \caption{Интерфейс модуля визуализации телеметрии}
          \label{fig:gui-telemetry}
      \end{figure}</code></pre>
                              </div>
                              <p>Получится подпись «Рисунок 1 — Интерфейс модуля визуализации
      телеметрии» по центру под рисунком. Файл скриншота загрузите в файлы проекта Labkeeper: загрузка
      доступна после входа. В LaTeX-сегменте размер задает <code>\includegraphics</code>, а в
      Markdown-сегменте превью оставит картинке её размер и ужмёт только то, что шире колонки.</p>
tips:
  - title: 'Формат без сжатия PNG'
    html: |2-
      <p>Всегда сохраняйте скриншоты в формате PNG. Формат JPEG сжимает текст с артефактами и «мылом»
      вокруг букв.</p>
  - title: 'Стрелки и акценты'
    html: |2-
      <p>Если нужно обратить внимание преподавателя на кнопку, используйте красную стрелку или
      аккуратную рамку толщиной 2–3 пикселя.</p>
