sections:
  - id: 'gost-standard'
    title: 'Требования ГОСТ 7.32-2017 к студенческим отчетам'
    html: |2-
                              <p>Отчет по лабораторной работе — это официальный научно-технический
      документ, подтверждающий выполнение учебного плана студентом. Базовые требования к оформлению
      регламентируются <strong>ГОСТ 7.32-2017</strong> (Отчет о научно-исследовательской работе) и
      ГОСТ 2.105-2019:</p>
                              <ul>
                                  <li><strong>Поля страницы:</strong> левое — 30 мм (для подшивки),
      правое — 15 мм, верхнее и нижнее — по 20 мм;</li>
                                  <li><strong>Шрифт:</strong> Times New Roman, размер 12 или 14 pt,
      цвет строго черный. В pdfLaTeX сам Times New Roman недоступен: в шаблоне ниже подключён пакет
      <code>tempora</code>, близкий к Times и с кириллицей;</li>
                                  <li><strong>Межстрочный интервал:</strong> полуторный (1.5),
      абзацный отступ («красная строка») — ровно 1.25 см;</li>
                                  <li><strong>Выравнивание текста:</strong> строго по ширине листа с
      включенным автоматическим переносом слов.</li>
                              </ul>
  - id: 'full-structure'
    title: 'Обязательные разделы образцового отчета'
    html: |2-
                              <p>Качественный отчет состоит из следующих логических элементов:</p>
                              <ol>
                                  <li><strong>Титульный лист:</strong> название вуза, кафедры,
      дисциплины, номер и тема лабораторной работы, данные студента и преподавателя;</li>
                                  <li><strong>Цель работы и используемое оборудование:</strong>
      приборы с указанием класса точности и цены деления шкалы;</li>
                                  <li><strong>Краткая теоретическая часть:</strong> основные
      физические законы и расчетные формулы;</li>
                                  <li><strong>Схема экспериментальной установки:</strong>
      электрическая схема или чертеж прибора;</li>
                                  <li><strong>Таблицы экспериментальных данных:</strong> результаты
      прямых измерений;</li>
                                  <li><strong>Расчетная часть:</strong> вычисление искомых величин и
      погрешностей (абсолютной и относительной);</li>
                                  <li><strong>Графики зависимостей:</strong> иллюстрации с нанесенными
      доверительными интервалами;</li>
                                  <li><strong>Выводы по работе:</strong> сопоставление полученных
      величин с теорией;</li>
                                  <li><strong>Ответы на контрольные вопросы:</strong> обязательный
      раздел для большинства технических вузов.</li>
                              </ol>
                              <p>Для корректного математического оформления расчетной части
      рекомендуем использовать <a
      href="/blog/indirect-measurement-error-calculation-lab-report">расчет погрешностей косвенных
      измерений по ГОСТ</a>.</p>
  - id: 'latex-template'
    title: 'Шаблон лабораторной работы ГОСТ онлайн: готовый код для LaTeX'
    html: |2-
                              <p>Ниже — <strong>шаблон лабораторной работы гост онлайн</strong>:
      скопируйте код в LaTeX-сегмент проекта Labkeeper и замените данные своими. Свои поля и шрифт
      задает преамбула, поэтому стандартная преамбула Labkeeper здесь не используется.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Шаблон отчета ГОСТ</span></div>
                                  <pre><code>\documentclass[a4paper,14pt]{extarticle} % класс article не знает кегль 14pt
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \usepackage{setspace}
      \onehalfspacing
      \usepackage{indentfirst}
      \setlength{\parindent}{1.25cm}
      \usepackage{amsmath,amssymb}
      \usepackage{graphicx}
      \usepackage{booktabs}

      \begin{document}

      % Титульный лист
      \begin{titlepage}
      \centering
      {\small МИНИСТЕРСТВО НАУКИ И ВЫСШЕГО ОБРАЗОВАНИЯ РФ \\
      НАЦИОНАЛЬНЫЙ ИССЛЕДОВАТЕЛЬСКИЙ УНИВЕРСИТЕТ}\\
      \vspace{3cm}
      {\bfseries Кафедра общей физики}\\
      \vspace{2cm}
      {\Large\bfseries ОТЧЕТ ПО ЛАБОРАТОРНОЙ РАБОТЕ № 3}\\
      {\large «Исследование свободных колебаний струны»}\\
      \vspace{4cm}
      \begin{flushright}
      Выполнил: студент гр. БПИ-231\\
      Иванов И. И.\\
      Проверил: доцент, к.ф.-м.н.\\
      Петров П. П.
      \end{flushright}
      \vfill
      Москва --- 2026
      \end{titlepage}
      \setcounter{page}{2} % titlepage сбросил счетчик страниц на 1

      \section*{Цель работы}
      Экспериментальное исследование стоячих волн в струне и определение скорости распространения поперечных волн.

      \section*{Приборы и принадлежности}
      Струна натяжная, звуковой генератор Г3-112, электромагнитный датчик, линейка (цена деления 1 мм).

      \section*{Результаты измерений}
      % Таблица данных и формулы

      \section*{Выводы}
      В ходе работы измерены резонансные частоты гармоник...
      \end{document}</code></pre>
                              </div>
                              <p>В финальной части работы пригодятся проверенные фразы и академические
      <a href="/blog/how-to-write-lab-report-conclusion-examples">клише для написания выводов</a>.</p>
  - id: 'markdown-workflow'
    title: 'Оформление отчета по лабораторной онлайн в Markdown'
    html: |2-
                              <p>Если для вашей специальности не требуется сложная верстка в LaTeX,
      современное <strong>оформление отчета по лабораторной онлайн</strong> можно выполнить в
      легковесном Markdown с формулами MathJax: превью обновляется при наборе, а PDF сохраняется через
      печать браузера. Это обычно быстрее, чем настройка стилей в Word. Если же нужны поля по ГОСТ и
      сноски внизу страницы, пишите тот же Markdown в сегментах LaTeX-проекта.</p>
  - id: 'computations'
    title: 'Вычисления с погрешностями, подстановка результатов и графики'
    html: |2-
                              <p>Главное отличие Labkeeper для лабораторных — вычислительный сегмент.
      Прямые измерения записываются вместе с погрешностью через знак <code>#</code>, и при расчете
      косвенной величины погрешность считается автоматически. Результат подставляется в текст отчета
      конструкцией <code>${R}</code>, поэтому после замены данных цифры в выводе обновятся сами:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Вычислительный сегмент</span></div>
                                  <pre><code>// Напряжение, В, и ток, А
      U = 5.00 # 0.05
      I = 0.100 # 0.002
      R = U / I</code></pre>
                              </div>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX-сегмент</span></div>
                                  <pre><code>\subsection*{Вывод}
      Получено $R = (${R})$~Ом.</code></pre>
                              </div>
                              <p>В том же сегменте функция <code>plot</code> строит график с крестами
      погрешностей, а <code>least_squares</code> проводит прямую по методу наименьших квадратов —
      подробности в статье о <a href="/blog/physics-lab-measurement-graphs-formatting-gost">графиках
      измерений в лабораторной</a>. В настройках сегмента можно включить показ общей формулы
      погрешности и формулы с подставленными числами, а в настройках проекта — округление по первой
      значащей цифре погрешности.</p>
  - id: 'check-list'
    title: 'Чек-лист успешной сдачи работы преподавателю'
    html: |2-
                              <ul>
                                  <li>Все физические величины снабжены размерностями в системе
      СИ;</li>
                                  <li>Погрешность рассчитана корректно и согласована с количеством
      знаков результата;</li>
                                  <li>Графики содержат подписи осей и не соединены ломаными
      отрезками;</li>
                                  <li>В выводе есть конкретные цифры, а не просто абстрактные
      слова.</li>
                              </ul>
tips:
  - title: 'Храните исходники в облаке'
    html: |2-
      <p>Сохраняйте отчеты в проектах Labkeeper (после входа): для следующей работы склонируйте проект
      и замените цифры в таблице измерений.</p>
  - title: 'Сдавайте отчет в PDF'
    html: |2-
      <p>Всегда сдавайте преподавателю электронный отчет в формате PDF, чтобы исключить искажение
      формул и таблиц на чужом компьютере.</p>
