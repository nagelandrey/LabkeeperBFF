sections:
  - id: 'purpose'
    title: 'Что означает допуск к лабораторной'
    html: |2-
      <p>Бланк допуска к выполнению лабораторной работы помогает зафиксировать проверку
      подготовки студента: знает ли он цель, понимает ли схему опыта и порядок измерений,
      подготовил ли требуемые расчеты. Ниже — учебный образец такой формы с пустыми
      полями. Он не содержит решения о допуске конкретного студента.</p>
      <p>Сначала запросите образец у преподавателя. Допуск может оформляться на первой
      странице рабочего протокола, в отдельном листе или другим способом, принятым
      на кафедре. Например, в
      <a href="https://physics.spbstu.ru/userfiles/files/how_to_make_labs_and_reports.pdf">инструкции кафедры физики СПбПУ</a>
      подготовка включает заполнение первой страницы протокола, а решение после
      собеседования подтверждает преподаватель. Это порядок конкретной кафедры,
      а не универсальный бланк для всех вузов.</p>
      <div class="article-note"><strong>💡 Совет:</strong> Здесь речь об учебной проверке
      готовности к конкретной работе. Инструктаж, проверка знаний требований безопасности
      и их регистрация выполняются по правилам вашей лаборатории. Этот лист не заменяет
      соответствующие документы и не дает самостоятельного разрешения работать с оборудованием.</div>
      <p>Не ищите обязательный для всех дисциплин «бланк допуска по ГОСТ»: для заполнения
      используйте действующую форму кафедры. Предложенный шаблон подходит как основа,
      если преподаватель согласовал такой вариант.</p>
  - id: 'fields'
    title: 'Какие поля включить в бланк'
    html: |2-
      <p>Поля должны связывать проверку с определенной работой и студентом. Названия
      дисциплины и темы перепишите из задания, а перечень оборудования — из методички.</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Поле</th><th>Что указать</th></tr></thead>
              <tbody>
                  <tr><td>Вуз и кафедра</td><td>Наименования по принятому образцу.</td></tr>
                  <tr><td>Дисциплина, номер и тема</td><td>Сведения о конкретной лабораторной работе.</td></tr>
                  <tr><td>Студент и группа</td><td>ФИО и учебная группа без вымышленных данных.</td></tr>
                  <tr><td>Оборудование</td><td>Приборы, установка или программная среда по заданию.</td></tr>
                  <tr><td>Подготовка</td><td>Теория, схема, предварительные расчеты и ссылки на подготовленные материалы.</td></tr>
                  <tr><td>Контрольные вопросы</td><td>Номера вопросов, краткие ответы или место для отметок проверяющего.</td></tr>
                  <tr><td>Решение и замечания</td><td>Заполняет преподаватель после проверки.</td></tr>
                  <tr><td>Преподаватель, подпись, дата</td><td>ФИО проверяющего и фактическое подтверждение решения.</td></tr>
              </tbody>
          </table>
      </div>
      <p>Не превращайте бланк в полный отчет. Если ответы и расчеты занимают несколько
      страниц, приложите их отдельно и укажите, где они находятся. Для самого отчета
      используйте <a href="/blog/ideal-lab-report-template-gost-online">шаблон лабораторной работы</a>,
      а для его первой страницы —
      <a href="/blog/lab-report-title-page-gost-template">образец титульного листа</a>.</p>
  - id: 'preparation'
    title: 'Что подготовить до проверки'
    html: |2-
      <p>Уточните объем подготовки в методических указаниях. Для учебного эксперимента
      можно начать со следующей последовательности:</p>
      <ol>
          <li>Прочитайте цель, задание и описание установки.</li>
          <li>Разберите используемые величины, единицы измерения и основные зависимости.</li>
          <li>Подготовьте схему, таблицу наблюдений и расчеты, которые требуются до начала работы.</li>
          <li>Ответьте на контрольные вопросы и отметьте непонятные места для обсуждения.</li>
          <li>Предъявите материалы преподавателю в установленном порядке.</li>
      </ol>
      <p>В поле «Подготовка» можно записать, например: «Схема — на листе 2;
      предварительный расчет — в тетради; вопросы 1–4 — на листе 3».
      Это пример записи, а не утверждение о выполненной подготовке.
      Указывайте только материалы, которые действительно подготовлены.</p>
      <p>Заполнение таблицы само по себе не означает допуска. Вопросы о запуске
      установки и действиях с приборами обсудите с преподавателем до начала опыта.</p>
  - id: 'template'
    title: 'Шаблон LaTeX и файл для скачивания'
    html: |2-
      <p>Ниже — самостоятельный документ с заголовком, таблицей подготовки и отдельным
      блоком решения. Шрифт 14 пт и поля 30 мм слева, 15 мм справа, 20 мм сверху и снизу
      служат настройками образца: измените их, если кафедра требует другое оформление.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora,tabularx,array}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \pagestyle{empty}
      \setlength{\parindent}{0pt}
      \renewcommand{\arraystretch}{1.3}
      \newcommand{\blank}{\rule{0pt}{10mm}}
      \begin{document}
      \begin{center}
          Университет: \rule{9cm}{0.4pt}\\[6pt]
          Кафедра: \rule{10cm}{0.4pt}\\[14pt]
          \textbf{БЛАНК ДОПУСКА}\\[4pt]
          к выполнению лабораторной работы
      \end{center}
      \medskip
      \begin{tabularx}{\linewidth}{|>{\raggedright\arraybackslash}p{0.32\linewidth}|X|}
          \hline
          Дисциплина &amp; \blank \\ \hline
          Номер работы &amp; \blank \\ \hline
          Тема работы &amp; \rule{0pt}{14mm} \\ \hline
          ФИО студента &amp; \blank \\ \hline
          Группа &amp; \blank \\ \hline
          Оборудование &amp; \rule{0pt}{14mm} \\ \hline
          Подготовка: теория, схема, расчеты &amp; \rule{0pt}{18mm} \\ \hline
          Контрольные вопросы &amp; \rule{0pt}{18mm} \\ \hline
      \end{tabularx}\par
      \vspace{6mm}

      \textbf{Заполняет преподаватель после проверки}

      Решение: \rule{10cm}{0.4pt}\\[10pt]
      Варианты: допущен / требуется подготовка / не допущен.\\[10pt]
      Замечания: \rule{11cm}{0.4pt}\\[10pt]
      Преподаватель (ФИО): \rule{8cm}{0.4pt}\\[10pt]
      Подпись: \rule{4cm}{0.4pt}\hfill Дата: \rule{4cm}{0.4pt}

      \medskip
      {\small Учебный образец. Форму и порядок допуска уточните на кафедре.
      Бланк не заменяет документы об инструктаже.}
      \end{document}</code></pre>
      </div>
      <p><a href="/assets/examples/lab-work-admission-form.tex" download>Скачать полный бланк в формате .tex</a>.
      Откройте файл в LaTeX-редакторе или вставьте код в LaTeX-сегмент Labkeeper,
      заполните сведения о работе и соберите PDF. Кнопка «Просмотреть пример» открывает
      полный бланк, приведенный выше и доступный для скачивания.</p>
      <p>В таблице <code>tabularx</code> правая колонка занимает оставшуюся ширину листа,
      а <code>\rule{0pt}{18mm}</code> оставляет высоту для записей.
      Если нужны развернутые ответы, увеличьте высоту строки или приложите отдельный лист.
      После изменения формы проверьте PDF: таблица и блок подписи должны оставаться читаемыми.</p>
  - id: 'decision'
    title: 'Как оформить решение преподавателя'
    html: |2-
      <p>Оставьте поля решения, замечаний, подписи и даты пустыми до проверки.
      В шаблоне перечислены возможные формулировки: «допущен», «требуется подготовка»,
      «не допущен». Ни одна из них заранее не выбрана. Окончательную запись делает
      преподаватель по принятому на кафедре порядку.</p>
      <p>Не переносите подпись из другого документа и не печатайте положительное решение
      как часть образца. Для бумажного бланка оставлено место под фактическую подпись;
      если кафедра использует электронное подтверждение, следуйте ее процедуре.</p>
      <p>Если требуется дополнительная подготовка, уточните замечания и порядок повторной
      проверки. Отметка о допуске к опыту не подтверждает, что работа выполнена или отчет
      защищен: это следующие этапы, которые преподаватель оценивает отдельно.</p>
  - id: 'checklist'
    title: 'Проверка бланка и дальнейшая работа'
    html: |2-
      <ul>
          <li>Форма и способ оформления согласованы с преподавателем.</li>
          <li>Дисциплина, номер и тема совпадают с заданием.</li>
          <li>ФИО, группа и перечень оборудования заполнены без ошибок.</li>
          <li>Указанные расчеты, схема и ответы действительно подготовлены.</li>
          <li>Решение, подпись и дата оставлены для преподавателя.</li>
          <li>PDF проверен на переносы строк, разрывы таблицы и достаточное место для записей.</li>
      </ul>
      <p>После проверки и выполнения установленных в лаборатории условий приступайте
      к работе по указаниям преподавателя. Результаты измерений, расчеты и выводы
      оформите в отчете. Для следующего этапа используйте
      <a href="/blog/lab-report-defense-preparation">памятку по подготовке к защите лабораторной</a>:
      допуск к выполнению и защита отчета решают разные учебные задачи.</p>
tips:
  - title: 'Оставьте место для конкретных замечаний'
    html: |2-
      <p>Если преподаватель проверяет несколько вопросов, удобнее отвести место для их
      номеров и коротких замечаний, чем ограничиваться одной общей строкой.</p>
