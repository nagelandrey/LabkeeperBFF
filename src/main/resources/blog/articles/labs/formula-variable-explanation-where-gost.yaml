sections:
  - id: 'rules'
    title: 'Что требует ГОСТ 7.32-2017 к блоку пояснений'
    html: |2-
                              <p>В научно-технических отчетах и дипломных работах каждая введенная
      формула должна сопровождаться расшифровкой входящих в нее буквенных обозначений, если они не
      были пояснены ранее в тексте.</p>
                              <blockquote>
                                  «Пояснение значений символов и числовых коэффициентов следует
      приводить непосредственно под формулой в той же последовательности, в которой они представлены в
      формуле. Значение каждого символа и числового коэффициента необходимо приводить с новой строки.
      Первую строку пояснения начинают со слова „где“ <strong>без двоеточия</strong> с абзаца» (ГОСТ
      7.32-2017, п. 6.8.2).
                              </blockquote>
                              <p>Похожее требование есть и в ГОСТ 2.105 для текстовых конструкторских
      документов, поэтому правило одинаково для отчетов, курсовых и пояснительных записок.</p>
  - id: 'how-to-write'
    title: 'Как писать пояснения к формуле гост: классический синтаксис'
    html: |2-
                              <p>Запомните главное правило того, <strong>как писать пояснения к
      формуле гост</strong> (наряду с требованиями к <a
      href="/blog/formula-numbering-lab-reports-gost">нумерации формул в лабораторных
      отчетах</a>):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Эталонный образец</span></div>
                                  <pre><code>Расчет давления газа производится по формуле:
      P = (n * R * T) / V,                                                     (2.1)
      где P — абсолютное давление газа, Па;
          n — количество вещества, моль;
          R — универсальная газовая постоянная, равная 8,314 Дж/(моль·К);
          T — термодинамическая температура, К;
          V — объем сосуда, м³.</code></pre>
                              </div>
                              <p>Слово «где» пишется строчными буквами с красной строки, после него
      двоеточие <strong>не ставится</strong>, а сами переменные идут строго в том порядке, в каком они
      появляются в числителе и знаменателе формулы слева направо.</p>
  - id: 'formatting-details'
    title: 'Оформление расшифровки формул в отчете: знаки препинания и точки с запятой'
    html: |2-
                              <p>Правильное <strong>оформление расшифровки формул в отчете</strong>
      включает следующие микродетали:</p>
                              <ul>
                                  <li>Между символом переменной и его словесным описанием ставится
      длинное тире <code> — </code>;</li>
                                  <li>В конце каждого пояснения ставится запятая перед единицей
      измерения, а в конце строки — точка с запятой <code>;</code>;</li>
                                  <li>В самом последнем пункте перечисления ставится точка
      <code>.</code>;</li>
                                  <li>Если переменная уже расшифровывалась выше по тексту, повторно
      вносить ее в блок «где» не требуется.</li>
                              </ul>
  - id: 'latex-snippets'
    title: 'Готовые шаблоны в LaTeX (список description и таблица tabular)'
    html: |2-
                              <p>В LaTeX для аккуратного выравнивания тире в столбик используют
      компактную таблицу <code>tabular</code> без рамок (а для набора размерностей рекомендуем
      использовать <a href="/blog/latex-siunitx">пакет siunitx для физических величин</a>):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{equation}
          F = G \frac{m_1 m_2}{r^2},
          \label{eq:gravity}
      \end{equation}

      где~\begin{tabular}[t]{@{}l@{ — }p{0.8\textwidth}@{}}
      $F$   & сила гравитационного взаимодействия, Н;\\
      $G$   & гравитационная постоянная, $G \approx 6{,}674 \cdot 10^{-11}$~м$^3$/(кг$\cdot$с$^2$);\\
      $m_1, m_2$ & массы взаимодействующих тел, кг;\\
      $r$   & расстояние между центрами масс тел, м.
      \end{tabular}</code></pre>
                              </div>
                              <p>Конструкция <code>@{}l@{ — }p{...}</code> автоматически ставит
      длинное тире между колонками и обеспечивает аккуратный перенос длинного текста расшифровки.
      Пустая строка после формулы начинает новый абзац, поэтому слово «где» получает абзацный отступ,
      как требует ГОСТ; команда <code>\noindent</code> здесь не нужна.</p>
  - id: 'frequent-errors'
    title: 'Топ-5 ошибок, на которых срезают на нормоконтроле'
    html: |2-
                              <p>Самые частые замечания проверяющих:</p>
                              <ol>
                                  <li>Двоеточие после слова «где» (<em>«где:»</em> — грубая
      ошибка!);</li>
                                  <li>Слово «Где» с заглавной буквы (должно быть со строчной:
      «где»);</li>
                                  <li>Отсутствие запятой после формулы (формула вместе с пояснением
      «где» — часть одного предложения!);</li>
                                  <li>Перечисление переменных в случайном алфавитном порядке вместо
      порядка появления в уравнении;</li>
                                  <li>Пропуск размерностей (единиц измерения СИ).</li>
                              </ol>
tips:
  - title: 'Неразрывный пробел после «где»'
    html: |2-
      <p>Пишите <code>где~\begin{tabular}...</code>: тильда — неразрывный пробел, и строка не
      разорвется между словом «где» и таблицей пояснений.</p>
  - title: 'Единицы измерения по ГОСТ 8.417'
    html: |2-
      <p>Для набора размерностей используйте прямое начертание шрифта: <code>м/с</code> или
      <code>\text{кг}</code>, а не математический курсив <em>kg</em>.</p>
editorExample:
  latex: |2-
    Скорость находят по формуле
    \begin{equation}
    v=\frac{s}{t},
    \label{eq:v}
    \end{equation}

    где~\begin{tabular}[t]{@{}l@{ --- }l@{}}
    $v$ & скорость, м/с;\\
    $s$ & путь, м;\\
    $t$ & время, с.
    \end{tabular}

    По формуле~\eqref{eq:v} при $s=100$~м и $t=20$~с получаем $v=5$~м/с.
