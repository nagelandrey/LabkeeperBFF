sections:
  - id: 'intro'
    title: 'Зачем список литературы в обычном студенческом отчете'
    html: |2-
                              <p>Многие студенты пренебрегают списком источников в отчетах по
      лабораторным и расчетно-графическим работам (РГР). Однако в <strong>ГОСТ 7.32-2017</strong>
      «Список использованных источников» — один из структурных элементов отчета, и методички к
      лабораторным обычно его требуют.</p>
                              <p>Сами записи составляют по правилам библиографического описания. ГОСТ
      7.1-2003, на который ссылаются многие методички, в России заменен <strong>ГОСТ Р
      7.0.100-2018</strong>: примеры ниже составлены по новому стандарту. Главные отличия касаются
      электронных ресурсов (вместо «[Электронный ресурс]» пишут область «— Текст : электронный») и
      сокращений.</p>
                              <p>Наличие корректно составленного списка показывает преподавателю, на
      какие теоретические формулы и паспортные данные оборудования вы опирались при расчетах, и
      защищает отчет от претензий нормоконтролера.</p>
  - id: 'examples'
    title: 'Литература для лабораторной работы пример: книги, методички, ГОСТы'
    html: |2-
                              <p>Ниже представлены эталонные библиографические записи для трех самых
      популярных типов источников (<strong>литература для лабораторной работы пример</strong> по ГОСТ
      Р 7.0.100-2018; чем запись в списке отличается от ссылки по ГОСТ Р 7.0.5-2008, разобрано в
      статье о <a href="/blog/lab-report-bibliography-gost-2008">библиографических ссылках по ГОСТ
      2008</a>):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Примеры библиографических записей</span></div>
                                  <pre><code>% 1. Книга / Учебник одного или двух авторов:
      Савельев, И. В. Курс общей физики : учеб. пособие для втузов. В 3 т. Т. 1. Механика. Молекулярная физика / И. В. Савельев. — 3-е изд., испр. — М. : Наука, 1987. — 432 с.

      % 2. Методические указания кафедры:
      Исследование характеристик полупроводникового диода : метод. указания к лаб. работе № 4 по курсу «Общая физика» / сост.: А. Н. Иванов, П. С. Сидоров. — СПб. : Изд-во СПбПУ, 2024. — 24 с.

      % 3. Государственный стандарт:
      ГОСТ Р 8.736-2011. Государственная система обеспечения единства измерений. Измерения прямые многократные. Методы обработки результатов измерений. Основные положения. — М. : Стандартинформ, 2013. — 20 с.</code></pre>
                              </div>
  - id: 'student-sources'
    title: 'Список источников для отчета студента: структура и правила описания'
    html: |2-
                              <p>Грамотный <strong>список источников для отчета студента</strong>
      обычно содержит 3–6 пунктов и формируется в одном из двух порядков:</p>
                              <ul>
                                  <li><strong>В порядке упоминания в тексте (рекомендуется):</strong>
      номер источника [1], [2] присваивается в момент первой ссылки на него в тексте отчета.</li>
                                  <li><strong>В алфавитном порядке:</strong> авторы упорядочиваются от
      А до Я, сначала русскоязычные, затем зарубежные издания на латинице.</li>
                              </ul>
  - id: 'latex-thebibliography'
    title: 'Реализация через окружение thebibliography в LaTeX'
    html: |2-
                              <p>Для коротких списков отчетов проще всего использовать стандартное
      окружение <code>thebibliography</code> без подключения внешних баз BibTeX:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{thebibliography}{9}
          \bibitem{savelev}
          Савельев, И.~В. Курс общей физики. Т.~1. Механика / И.~В.~Савельев. --- М.~: Наука, 1987. --- 432~с.

          \bibitem{metodichka}
          Исследование эффекта Холла~: метод. указания / сост. В.~А.~Петров. --- М.~: МГТУ им. Н.Э.~Баумана, 2023. --- 18~с.
      \end{thebibliography}</code></pre>
                              </div>
                              <p>Аргумент <code>{9}</code> задает ширину метки, а не число источников:
      образец из одной цифры подходит для списка до 9 записей, а для списков от 10 до 99 источников
      передают <code>{99}</code>.</p>
  - id: 'rules'
    title: 'Типичные ошибки: косые черты, тире и сокращения'
    html: |2-
                              <p>Частые замечания нормоконтролеров:</p>
                              <ul>
                                  <li><strong>Одна или две косые черты:</strong> одинарный слэш
      <code>/</code> отделяет заголовок от авторов и редакторов, двойной слэш <code>//</code> ставится
      перед названием сборника, журнала или сайта, где опубликована статья.</li>
                                  <li><strong>Длинное тире с пробелами:</strong> разделитель областей
      библиографического описания — это длинное тире, отбитое пробелами с двух сторон: <code> —
      </code> (для сайтов и онлайн-документов смотрите руководство по <a
      href="/blog/electronic-resources-bibliography-gost-7-0-100">оформлению электронных ресурсов по
      ГОСТ 7.0.100</a>).</li>
                                  <li><strong>Буква «с»:</strong> строчная в записи <code>432
      с.</code> означает общий объем книги; прописная в записи <code>С. 45–48</code> указывает
      страницы статьи в журнале или сборнике.</li>
                              </ul>
tips:
  - title: 'Неразрывные пробелы в инициалах'
    html: |2-
      <p>Всегда связывайте инициалы неразрывным пробелом: <code>И.~В.~Савельев</code>, чтобы инициалы
      не оторвались от фамилии на другую строку.</p>
  - title: 'Ссылка в тексте отчета'
    html: |2-
      <p>В тексте отсылка оформляется квадратными скобками: <code>«Согласно методическим
      указаниям~\cite{metodichka}, схема собирается...»</code>.</p>
editorExample:
  latex: |2-
    Схема собрана по~\cite[с.~8]{metod}, теория --- в~\cite{savelev}.
    \begin{thebibliography}{9}
    \bibitem{metod} Исследование характеристик полупроводникового диода : метод. указания к~лаб.
    работе №~4 / сост. А.~Н.~Иванов. --- СПб. : Изд-во СПбПУ, 2024. --- 24~с.
    \bibitem{savelev} Савельев, И.~В. Курс общей физики. Т.~1. Механика / И.~В.~Савельев. --- М. :
    Наука, 1987. --- 432~с.
    \end{thebibliography}
