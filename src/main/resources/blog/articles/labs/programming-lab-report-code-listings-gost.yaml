sections:
  - id: 'requirements'
    title: 'Требования нормоконтроля к исходному коду'
    html: |2-
                              <p>В отчетах по программированию, вычислительной математике и системному
      администрированию листинг программы является главным доказательством работоспособности
      выполненного задания. ГОСТ 7.32-2017 листинги отдельно не регулирует, поэтому правила задает
      методичка кафедры, а для программной документации — ГОСТ 19.401-78 «Текст программы». Типичные
      требования методичек:</p>
                              <ul>
                                  <li>Код оформляется моноширинным шрифтом (Courier New, Consolas)
      меньшего кегля (10–12 пт при основном тексте 14 пт).</li>
                                  <li>Каждый листинг должен иметь порядковый номер и содержательное
      название: например, <em>«Листинг 1.1 — Функция быстрой сортировки массива»</em>.</li>
                                  <li>Длинные фрагменты кода (свыше 1–2 страниц) обязательно выносятся
      в <a href="/blog/diploma-appendices-listings-diagrams-gost">приложения диплома или курсовой
      работы</a>, а в основном тексте отчета остаются только ключевые функции и алгоритмы.</li>
                              </ul>
  - id: 'template'
    title: 'Отчет по лабораторной программирование шаблон: структура документа'
    html: |2-
                              <p>Классический <strong>отчет по лабораторной программирование
      шаблон</strong> содержит следующие обязательные разделы:</p>
                              <ol>
                                  <li>Титульный лист (кафедра, дисциплина, вариант, ФИО студента и
      преподавателя).</li>
                                  <li>Цель работы и техническое задание.</li>
                                  <li>Описание архитектуры и алгоритма решения (с блок-схемой).</li>
                                  <li>Ключевые листинги программного кода.</li>
                                  <li><a
      href="/blog/software-screenshots-report-gost-caption">Скриншоты работы программы по ГОСТ</a> и
      тестовые наборы данных.</li>
                                  <li>Выводы по проделанной работе.</li>
                              </ol>
  - id: 'listings-config'
    title: 'Оформление листингов в отчете: пакет listings и кириллица'
    html: |2-
                              <p>Правильное <strong>оформление листингов в отчете</strong>
      настраивается через пакет <code>listings</code> в преамбуле LaTeX документа:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage{listings}
      \usepackage{xcolor}
      \usepackage{caption}

      \lstset{
          basicstyle=\ttfamily\small,       % Моноширинный шрифт меньшего кегля
          numbers=left,                     % Нумерация строк слева
          numberstyle=\tiny\color{gray},     % Стиль номеров строк
          stepnumber=1,
          numbersep=8pt,
          frame=single,                     % Тонкая рамка вокруг листинга
          tabsize=4,
          breaklines=true,                  % Автоматический перенос длинных строк
          keywordstyle=\color{blue}\bfseries,
          commentstyle=\color{teal}\itshape,
          stringstyle=\color{red},
          escapeinside={(*@}{@*)},          % Русский текст внутри кода
          captionpos=t                      % Подпись над листингом, как в методичках
      }
      \renewcommand{\lstlistingname}{Листинг}
      \captionsetup[lstlisting]{labelsep=endash,singlelinecheck=false}</code></pre>
                              </div>
                              <p>В тексте программы фрагмент вставляется через окружение
      <code>lstlisting</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{lstlisting}[language=Python, caption={Функция вычисления факториала}]
      def factorial(n: int) -> int:
          # (*@\textit{Вычисление факториала числа n}@*)
          if n <= 1:
              return 1
          return n * factorial(n - 1)
      \end{lstlisting}</code></pre>
                              </div>
                              <p>В pdfLaTeX пакет listings не понимает кириллицу внутри кода: русская
      строка или docstring без настройки ломает сборку. Поэтому русский комментарий выше обернут в
      разделители <code>(*@ … @*)</code> из параметра <code>escapeinside</code> — такой текст набирает
      уже LaTeX. Если русского текста в коде много, подключите таблицу <code>literate</code> из статьи
      о <a href="/blog/latex-russian-cyrillic-code-listings-minted">русском языке в листингах
      кода</a>.</p>
  - id: 'external-files'
    title: 'Импорт кода напрямую из файлов программ'
    html: |2-
                              <p>Вместо копирования кода вручную через буфер обмена гораздо надежнее
      подключать файлы проекта напрямую через команду <code>\lstinputlisting</code>. Файлы
      <code>.cpp</code> и <code>.py</code> загрузить можно. Если удобнее один формат для листинга,
      сохраните код как <code>.txt</code> и загрузите в файлы проекта:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>% Вставка всего файла с кодом (main.cpp сохранен как main.txt)
      \lstinputlisting[language=C++, caption={Главный модуль main.cpp}]{src/main.txt}

      % Вставка только диапазона строк с 15 по 45
      \lstinputlisting[language=C++, firstline=15, lastline=45, caption={Алгоритм Дейкстры}]{src/graph.txt}</code></pre>
                              </div>
                              <p>При таком подходе изменения в коде попадают в отчет при очередной
      сборке — достаточно заменить файл.</p>
  - id: 'minted-alternative'
    title: 'Современная альтернатива: пакет minted'
    html: |2-
                              <p>Если требуется подсветка синтаксиса полиграфического уровня,
      используют пакет <code>minted</code> на базе библиотеки Pygments. Он подсвечивает сотни языков
      (Rust, Go, Kotlin, Swift, SQL) и нормально работает с русскими комментариями.</p>
                              <p>Но minted запускает внешнюю программу (Python с Pygments) и требует
      флага <code>-shell-escape</code>, поэтому работает только при локальной сборке. В Labkeeper
      серверная сборка запрещает внешние программы, и minted не собирается: онлайн используйте
      listings с настройками выше.</p>
tips:
  - title: 'Русские комментарии в listings'
    html: |2-
      <p>Параметр <code>extendedchars=true</code> сам по себе кириллицу в коде не чинит. Русские
      комментарии оформляйте через <code>escapeinside</code>, как в примере выше, или подключите
      таблицу <code>literate</code> из статьи о <a
      href="/blog/latex-russian-cyrillic-code-listings-minted">русском языке в листингах кода</a>.</p>
  - title: 'Слово «Листинг» в заголовке'
    html: |2-
      <p>Чтобы заменить английское слово «Listing» на русское по ГОСТ, добавьте строчку:
      <code>\renewcommand{\lstlistingname}{Листинг}</code>.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[russian]{babel}
    \usepackage{listings,xcolor,caption}
    \lstset{basicstyle=\ttfamily\small,numbers=left,frame=single,keywordstyle=\color{blue}\bfseries,escapeinside={(*@}{@*)}}
    \renewcommand{\lstlistingname}{Листинг}
    \captionsetup[lstlisting]{labelsep=endash,singlelinecheck=false}
    \begin{document}
    \begin{lstlisting}[language=Python,caption={Среднее значение}]
    values = [2, 4, 6]  # (*@\textit{данные опыта}@*)
    print(sum(values) / len(values))
    \end{lstlisting}
    \end{document}
