sections:
  - id: 'preparation'
    title: 'Что подготовить до защиты'
    html: |2-
      <p>На защите лабораторной нужно объяснить, какую задачу вы решали, как получили
      данные и чем обоснован вывод. Начните с требований преподавателя: формат ответа,
      порядок допуска и перечень контрольных вопросов могут различаться.</p>
      <ul>
          <li><strong>Повторите цель и модель.</strong> Назовите измеряемую величину,
          основную зависимость и условия, при которых ее можно применять.</li>
          <li><strong>Проследите путь одного результата.</strong> Найдите исходную запись,
          перевод единиц, подстановку в формулу и строку итоговой таблицы.</li>
          <li><strong>Разберите установку.</strong> Умейте показать, что измеряет каждый
          прибор, как он подключен и откуда взята оценка его неопределенности.</li>
          <li><strong>Подготовьте материалы.</strong> Возьмите отчет, исходные записи
          и методические указания в разрешенном преподавателем виде.</li>
      </ul>
      <p>Если структура отчета еще не собрана, используйте
      <a href="/blog/ideal-lab-report-template-gost-online">шаблон лабораторного отчета</a>.
      Перед защитой проверяйте содержание расчетов вместе с оформлением.</p>
  - id: 'oral-report'
    title: 'Как построить короткий доклад'
    html: |2-
      <p>Подготовьте связный ответ по цепочке «цель → метод → данные → результат → вывод».
      Длительность согласуйте с требованиями занятия. Не пересказывайте весь отчет:
      выберите действия и числа, которые объясняют результат.</p>
      <div class="article-quote">
          <p>«Мы определяли сопротивление резистора по напряжению и силе тока.
          Измерили 5 В и 0,1 А, затем использовали отношение $R=U/I$ и получили 50 Ом.
          При заданных независимых стандартных неопределенностях напряжения 0,05 В
          и тока 0,002 А стандартная неопределенность сопротивления составляет около
          1,12 Ом. Это оценка сопротивления при данных условиях измерения;
          одной точки недостаточно для проверки линейности зависимости тока от напряжения».</p>
      </div>
      <p>После такого вступления можно показать таблицу или график и ответить на уточнения.
      Для серии измерений объясните, что означают оси, точки и линия аппроксимации:
      подробнее — в статье об
      <a href="/blog/physics-lab-measurement-graphs-formatting-gost">оформлении графиков измерений</a>.</p>
  - id: 'method-and-uncertainty'
    title: 'Как объяснить метод и неопределенность результата'
    html: |2-
      <p>В учебном примере $U=5$ В, $I=0{,}1$ А, $u_U=0{,}05$ В и $u_I=0{,}002$ А.
      Здесь $u_U$ и $u_I$ уже заданы как <strong>стандартные неопределенности</strong>,
      а входные величины считаются независимыми. Для малых относительных неопределенностей
      используем распространение неопределенности в первом приближении:</p>
      <p>$$R=\frac{U}{I}=50\text{ Ом},\qquad
      u_R=\sqrt{\left(\frac{u_U}{I}\right)^2+
      \left(\frac{Uu_I}{I^2}\right)^2}\approx1{,}118\text{ Ом}.$$</p>
      <p>Относительная стандартная неопределенность равна
      $100u_R/R\approx2{,}236\%$. Вклад тока здесь больше вклада напряжения:
      $Uu_I/I^2=1$ Ом против $u_U/I=0{,}5$ Ом. Это помогает объяснить, какое
      измерение сильнее влияет на точность результата.</p>
      <p>Предельная погрешность прибора и стандартная неопределенность — разные
      характеристики. Если в паспорте указана граница допустимой ошибки, сначала
      определите способ перехода к стандартной неопределенности по принятой модели.
      Запись $R\pm u_R$ сама по себе не означает доверительную вероятность 95%.
      Различие стандартной и расширенной неопределенности поясняет
      <a href="https://physics.nist.gov/cuu/Uncertainty/coverage.html">руководство NIST</a>;
      формулы для независимых входов разобраны в статье о
      <a href="/blog/indirect-measurement-error-calculation-lab-report">погрешностях косвенных измерений</a>.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Вычислительный сегмент</span></div>
          <pre><code>U = 5
      I = 0.1
      uU = 0.05
      uI = 0.002
      R = U / I
      uR = sqrt((uU / I)^2 + (U * uI / I^2)^2)
      relative = 100 * uR / R</code></pre>
      </div>
      <p>Здесь неопределенность вычисляется отдельной формулой, поэтому ее значение
      видно на каждом шаге. В Labkeeper также можно задать стандартные неопределенности
      оператором <code>#</code>: <code>U = 5 # 0.05</code>,
      <code>I = 0.1 # 0.002</code>, затем вычислить <code>R = U / I</code>.
      Этот вариант автоматически переносит неопределенности независимых входов;
      синтаксис описан в <a href="/wiki/language/syntax.html">вики вычислительного языка</a>.</p>
      <p>Кнопка «Просмотреть пример» открывает вариант с явной формулой и LaTeX-документом.
      Вычислительный сегмент скрыт из вывода; исходные данные и результаты подставляются
      в документ. Новый проект выводит три значащие цифры: $u_R$ будет около 1,12 Ом,
      относительная неопределенность — 2,24%. Правило окончательного округления согласуйте
      с методическими указаниями; это округление вывода, а не изменение исходных данных.</p>
  - id: 'questions'
    title: 'Частые вопросы и содержательные ответы'
    html: |2-
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Вопрос</th><th>Как построить ответ</th></tr></thead>
              <tbody>
                  <tr><td>Почему выбрана эта формула?</td><td>Назвать модель и ее условия.
                  Для $R=U/I$ напряжение должно относиться к исследуемому элементу,
                  а ток — к той же ветви цепи; влияние приборов нужно оценить.</td></tr>
                  <tr><td>Что изменится при увеличении напряжения?</td><td>Для омического
                  элемента при неизменной температуре ток растет пропорционально напряжению.
                  Нагрев может изменить сопротивление и нарушить это условие.</td></tr>
                  <tr><td>Зачем повторять измерения?</td><td>Чтобы оценить разброс и проверить
                  повторяемость результатов. Повторение само по себе не устраняет смещение прибора.</td></tr>
                  <tr><td>Почему здесь складываются квадраты?</td><td>Потому что приняты
                  независимые стандартные неопределенности. При корреляции входов
                  нужна формула с ковариационным членом.</td></tr>
                  <tr><td>Что показывает ваш результат?</td><td>Оценку сопротивления
                  и ее неопределенность при принятых условиях. Для проверки закона Ома
                  потребуется серия точек и анализ зависимости.</td></tr>
              </tbody>
          </table>
      </div>
      <p>Используйте эти ответы как образец рассуждения. Подставьте особенности своей
      установки и будьте готовы найти подтверждающую запись в отчете.</p>
  - id: 'discrepancy'
    title: 'Что делать, если результат расходится с ожидаемым'
    html: |2-
      <p>Сначала проверьте единицы, переписанные значения, диапазоны приборов,
      подключение и подстановку в формулу. Затем сравните условия опыта с условиями
      справочного значения: например, сопротивление зависит от температуры.</p>
      <p>Если справочное значение равно 51 Ом, разность с нашей оценкой составляет 1 Ом.
      Она меньше полученной стандартной неопределенности 1,118 Ом, но это само по себе
      не доказывает совпадение или корректность всей методики. Для формального сравнения
      нужны неопределенность эталонного значения, возможная корреляция и выбранный критерий.</p>
      <div class="article-quote">
          <p>«Возможная причина расхождения — нагрев резистора. Это гипотеза:
          для проверки нужно повторить серию при меньшей мощности и контролировать температуру».</p>
      </div>
      <p>Отделяйте найденную ошибку от предполагаемой причины. Исправление расчета
      должно прослеживаться по исходным данным; неподтвержденную причину укажите как
      ограничение или предложите проверку. Примеры формулировок есть в статье
      <a href="/blog/how-to-write-lab-report-conclusion-examples">о выводах к лабораторной работе</a>.</p>
  - id: 'checklist'
    title: 'Проверка перед сдачей'
    html: |2-
      <ul>
          <li>Могу сформулировать цель и объяснить используемую модель.</li>
          <li>Знаю назначение приборов, диапазоны и источник оценок неопределенности.</li>
          <li>Могу воспроизвести один расчет с единицами по своим исходным данным.</li>
          <li>Понимаю обозначения, оси графика и принятые правила округления.</li>
          <li>Вывод отвечает цели и содержит результат с ограничениями метода.</li>
          <li>Проверил требования преподавателя к файлу, исходным записям и порядку сдачи.</li>
      </ul>
      <p>Проведите репетицию: объясните результат по отчету, затем ответьте без чтения
      на один вопрос о методе и один — о неопределенности. Если объяснение обрывается,
      вернитесь к соответствующему шагу расчета.</p>
tips:
  - title: 'Связывайте ответ с данными'
    html: |2-
      <p>Вместо фразы «получилась небольшая погрешность» назовите величину,
      способ оценки и то, как она ограничивает ваш вывод.</p>
