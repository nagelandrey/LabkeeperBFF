sections:
  - id: 'standard-difference'
    title: 'Особенности ГОСТ Р 7.0.5-2008 по сравнению с ГОСТ 7.1'
    html: |2-
                              <p>Номера стандартов часто путают. <strong>ГОСТ Р 7.0.5-2008</strong>
      («Библиографическая ссылка. Общие требования и правила составления») описывает ссылки: отсылки
      вида [1] в тексте, подстрочные и затекстовые ссылки. Записи в списке литературы составляют по
      правилам библиографического описания: раньше это был ГОСТ 7.1-2003, сейчас действует
      <strong>ГОСТ Р 7.0.100-2018</strong> (подробнее — в статье о <a
      href="/blog/lab-report-bibliography-gost-7-1">списке литературы по ГОСТ 7.1 в отчетах</a>).</p>
                              <p>Поэтому фраза «список по ГОСТ 2008» в методичке обычно означает:
      отсылки в тексте оформляют по ГОСТ Р 7.0.5-2008, а записи в списке — по ГОСТ Р 7.0.100-2018.
      Ссылочный стандарт допускает краткие записи: например, знак «точка и тире» между областями можно
      заменять точкой, а часть сведений об ответственности опускать. В записях по ГОСТ Р 7.0.100-2018
      вместо обозначения «[Электронный ресурс]» из примеров 2008 года указывают область «— Текст :
      электронный».</p>
  - id: 'how-to-format'
    title: 'Как оформить источники в лабораторной: базовые правила'
    html: |2-
                              <p>Разберем практические шаги, <strong>как оформить источники в
      лабораторной</strong> на отлично:</p>
                              <ol>
                                  <li><strong>Объем списка:</strong> для стандартного лабораторного
      отчета достаточно от 2 до 5 источников (методические указания к работе + базовый учебник
      физики/программирования + ГОСТ на используемую методику или <a
      href="/blog/electronic-resources-bibliography-gost-7-0-100">электронные ресурсы по ГОСТ
      7.0.100</a>).</li>
                                  <li><strong>Порядок следования:</strong> строго в порядке первого
      упоминания в тексте отчета.</li>
                                  <li><strong>Связь с текстом:</strong> каждый пункт списка обязан
      иметь минимум одну отсылку в квадратных скобках <code>[1]</code> внутри теоретической или
      расчетной части отчета.</li>
                              </ol>
  - id: 'examples-2008'
    title: 'Список литературы гост 2008 онлайн: образцы записей'
    html: |2-
                              <p>Эталонный <strong>список литературы гост 2008 онлайн</strong> для
      типичного отчета:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Примеры по ГОСТ Р 7.0.5-2008</span></div>
                                  <pre><code>1. Методические указания к лабораторной работе № 3 «Изучение затухающих колебаний» / сост. В. И. Петров, А. С. Кузнецов. — СПб. : Изд-во Политехн. ун-та, 2024. — 16 с.

      2. Трофимова, Т. И. Курс физики : учеб. пособие для вузов. — 11-е изд., стер. — М. : Академия, 2006. — 560 с.

      3. ГОСТ Р 8.736-2011. ГСИ. Измерения прямые многократные. Методы обработки результатов измерений. Основные положения. — М. : Стандартинформ, 2013.

      4. Python 3.12 Documentation. — Текст : электронный // Python : [сайт]. — URL: https://docs.python.org/3/ (дата обращения: 01.09.2026).</code></pre>
                              </div>
  - id: 'citation-styles'
    title: 'Оформление отсылок в тексте ([1], [1, с. 15])'
    html: |2-
                              <p>В тексте отчета ссылка заключается в квадратные скобки без слова
      «источник»:</p>
                              <ul>
                                  <li><code>...в соответствии с теорией [2]...</code> — общая ссылка
      на учебник;</li>
                                  <li><code>...согласно формуле (3.14) в [1, с. 8]...</code> — точная
      ссылка с указанием страницы;</li>
                                  <li><code>...в работах [1, 3, 5]...</code> — группа независимых
      источников через запятую.</li>
                              </ul>
  - id: 'latex-ready'
    title: 'Готовый шаблон списка thebibliography в LaTeX'
    html: |2-
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{thebibliography}{9}
          \bibitem{metod}
          Методические указания к~лабораторной работе №~3 / сост. В.~И.~Петров. --- СПб.~: СПбПУ, 2024. --- 16~с.

          \bibitem{trofimova}
          Трофимова, Т.~И. Курс физики~: учеб. пособие. --- М.~: Академия, 2006. --- 560~с.
      \end{thebibliography}</code></pre>
                              </div>
tips:
  - title: 'Не ставьте пустой список'
    html: |2-
      <p>Преподаватели снижают балл, если в списке литературы указаны книги, на которые нет ни одной
      ссылки в тексте отчета.</p>
  - title: 'Свежесть источников'
    html: |2-
      <p>Для лабораторных по IT-дисциплинам проверяйте, чтобы документация и книги были не старше 3–5
      лет.</p>
editorExample:
  latex: |2-
    Методика описана в~\cite[с.~8]{metod}, теория --- в~\cite{trofimova}.
    \begin{thebibliography}{9}
    \bibitem{metod} Методические указания к~лабораторной работе №~3 / сост. В.~И.~Петров. --- СПб.~:
    СПбПУ, 2024. --- 16~с.
    \bibitem{trofimova} Трофимова, Т.~И. Курс физики~: учеб. пособие / Т.~И.~Трофимова. --- М.~:
    Академия, 2006. --- 560~с.
    \end{thebibliography}
