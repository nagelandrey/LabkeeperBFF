sections:
  - id: 'rules'
    title: 'Правила ГОСТ 7.32 к нумерации уравнений'
    html: |2-
                              <p>По ГОСТ 7.32-2017 (п. 6.8.3) формулы располагают посередине строки, а
      номер арабскими цифрами в круглых скобках ставят в крайнем правом положении на строке; основной
      вариант — сквозная нумерация по всему отчету. Нумеровать <strong>только те формулы, на которые
      есть ссылки в тексте</strong>, — распространенная традиция и требование многих методичек, а не
      норма самого стандарта.</p>
                              <p>Если методичка требует такой подход, формулы, вынесенные на отдельную
      строку для наглядности, но не цитируемые далее по тексту, не нумеруют (для них в LaTeX
      используют окружение со звездочкой: <code>equation*</code> или <code>align*</code>).</p>
                              <p>В Labkeeper без своей преамбулы так и происходит: стандартная
      преамбула ставит номер только формуле, на которую есть ссылка через <code>\eqref</code>, а
      обычная ссылка <code>\ref</code> номер не включает.</p>
  - id: 'single-vs-section'
    title: 'Сквозная нумерация против нумерации по разделам'
    html: |2-
                              <p>Стандарт допускает два способа маркировки:</p>
                              <ul>
                                  <li><strong>Сквозная нумерация:</strong> арабскими цифрами по всему
      тексту отчета: (1), (2), (3)... Используется в небольших отчетах по лабораторным работам (до
      15–20 страниц).</li>
                                  <li><strong>Нумерация по разделам:</strong> номер раздела и
      порядковый номер формулы через точку: (1.1), (1.2), (2.1)... ГОСТ 7.32 ее допускает, а методички
      часто выбирают для дипломных работ, ВКР и многоглавных пояснительных записок.</li>
                              </ul>
  - id: 'latex-setup'
    title: 'Как нумеровать формулы в лабораторной: базовый amsmath и equation'
    html: |2-
                              <p>Разберем практически, <strong>как нумеровать формулы в
      лабораторной</strong> с помощью пакета <code>amsmath</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage{amsmath}

      Расчет кинетической энергии выполняется по формуле:
      \begin{equation}
          E_k = \frac{m \cdot v^2}{2},
          \label{eq:kinetic-energy}
      \end{equation}
      где $m$ --- масса тела, $v$ --- линейная скорость.</code></pre>
                              </div>
                              <p>Метка <code>\label{eq:...}</code> фиксирует символьное имя формулы,
      что исключает ошибки при изменении порядка уравнений в ходе доработки работы. Обратите внимание
      на <a href="/blog/formula-variable-explanation-where-gost">правила оформления пояснения
      переменных «где» по ГОСТ</a> непосредственно под формулой.</p>
  - id: 'section-numbering'
    title: 'Нумерация формул по разделам гост: команда numberwithin'
    html: |2-
                              <p>Чтобы активировалась <strong>нумерация формул по разделам
      гост</strong>, добавьте в преамбулу команду <code>\numberwithin</code> из пакета amsmath (по
      схожему принципу настраивается и <a href="/blog/figure-double-numbering-chapters-gost">двойная
      нумерация рисунков по главам</a>):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>% Для документов класса report или book (привязка к главам chapter)
      \numberwithin{equation}{chapter}

      % Для документов класса article (привязка к разделам section)
      \numberwithin{equation}{section}</code></pre>
                              </div>
                              <p>После этого в разделе 2 первая формула автоматически получит номер
      <code>(2.1)</code>, а при переходе к разделу 3 счетчик формул автоматически сбросится на единицу
      <code>(3.1)</code>.</p>
                              <p>В стандартной преамбуле Labkeeper разделы не нумеруются, поэтому
      <code>\numberwithin{equation}{section}</code> даст номера <code>(0.1)</code>,
      <code>(0.2)</code>. Для нумерации по разделам начните проект со своей преамбулы, как в примере в
      редакторе.</p>
  - id: 'references'
    title: 'Правильные перекрестные ссылки через eqref'
    html: |2-
                              <p>Для ссылки на формулу в тексте используйте макрос
      <code>\eqref{...}</code> вместо <code>\ref{...}</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>Подставляя начальные условия в выражение~\eqref{eq:kinetic-energy}, получаем...</code></pre>
                              </div>
                              <p>Команда <code>\eqref</code> автоматически оборачивает номер в круглые
      скобки и превращает его в кликабельную гиперссылку в PDF.</p>
tips:
  - title: 'Знаки препинания в формулах'
    html: |2-
      <p>По правилам русского языка математическая формула является частью предложения. В конце
      выключной формулы обязательно ставится точка или запятая, отделенная от формулы небольшим
      пробелом <code>\,</code>.</p>
  - title: 'Нумерация групп формул (subequations)'
    html: |2-
      <p>Для системы связанных уравнений используйте окружение <code>\begin{subequations}</code>,
      которое присвоит уравнениям индексы (1a), (1b), (1c).</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[russian]{babel}
    \usepackage{amsmath}
    \numberwithin{equation}{section}
    \begin{document}
    \section{Закон Ома}
    \begin{equation}U=IR,\label{eq:ohm}\end{equation}

    где $U$ --- напряжение, $I$ --- ток, $R$ --- сопротивление.
    \section{Мощность}
    \begin{equation}P=UI=I^2R.\label{eq:p}\end{equation}
    Формула~\eqref{eq:p} следует из~\eqref{eq:ohm}.
    \end{document}
