sections:
  - id: 'direct-vs-indirect'
    title: 'Прямые и косвенные измерения: в чем разница'
    html: |2-
                              <p>В лабораторном практикуме большинство физических величин невозможно
      измерить одним прибором напрямую. При <strong>прямом измерении</strong> значение считывается со
      шкалы прибора (длина линейкой, время секундомером, масса весами). При <strong>косвенном
      измерении</strong> искомая величина $y$ вычисляется по известной математической зависимости из
      нескольких напрямую измеренных аргументов: $y = f(x_1, x_2, \dots, x_n)$.</p>
                              <p>Поскольку каждый аргумент $x_i$ содержит свою погрешность $\Delta
      x_i$, итоговая погрешность результата накапливается по строгому закону переноса ошибок. Эти
      значения затем наглядно иллюстрируются на <a
      href="/blog/physics-lab-measurement-graphs-formatting-gost">графиках измерений с крестами
      погрешностей</a>.</p>
  - id: 'math-theory'
    title: 'Формула полного дифференциала и метод частных производных'
    html: |2-
                              <p>Если независимые случайные погрешности аргументов малы, абсолютная
      погрешность косвенного измерения рассчитывается через <strong>квадратичную сумму частных
      производных</strong>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Формула погрешности</span></div>
                                  <pre><code>\Delta y = \sqrt{ \left( \frac{\partial f}{\partial x_1} \Delta x_1 \right)^2 + \left( \frac{\partial f}{\partial x_2} \Delta x_2 \right)^2 + \dots + \left( \frac{\partial f}{\partial x_n} \Delta x_n \right)^2 }</code></pre>
                              </div>
                              <p>Если погрешности не являются случайными, а представляют собой
      предельные приборные погрешности, используют линейную сумму модулей производных: $\Delta y =
      \sum_{i=1}^n \left| \frac{\partial f}{\partial x_i} \right| \Delta x_i$.</p>
  - id: 'log-trick'
    title: 'Лайфхак логарифмирования для формул-произведений'
    html: |2-
                              <p>Если расчетная формула состоит только из произведений, дробей и
      степеней (например, $y = \frac{a^2 \cdot b}{\sqrt{c}}$), расчет через производные громоздок.
      Гораздо проще сначала найти <strong>относительную погрешность $\varepsilon_y$ через натуральный
      логарифм</strong>:</p>
                              <ol>
                                  <li>Прологарифмировать выражение: $\ln y = 2\ln a + \ln b -
      \frac{1}{2}\ln c$;</li>
                                  <li>Для предельной погрешности заменить минусы на плюсы:
      $\varepsilon_y = 2\varepsilon_a + \varepsilon_b + \frac{1}{2}\varepsilon_c$. Для случайных
      независимых погрешностей знаки и так пропадают под квадратами: $\varepsilon_y =
      \sqrt{(2\varepsilon_a)^2 + \varepsilon_b^2 + \left(\frac{1}{2}\varepsilon_c\right)^2}$;</li>
                                  <li>Найти абсолютную погрешность умножением: $\Delta y = y \cdot
      \varepsilon_y$.</li>
                              </ol>
  - id: 'step-by-step'
    title: 'Косвенные измерения погрешности: шаблон расчета плотности цилиндра'
    html: |2-
                              <p>Рассмотрим эталонный образец, демонстрирующий <strong>косвенные
      измерения погрешности шаблон</strong> на примере вычисления плотности твердого тела:</p>
                              <div class="article-quote">
                                  <p><strong>Пример расчета:</strong><br>
                                  Формула плотности цилиндра: $\rho = \frac{m}{V} = \frac{4m}{\pi d^2
      h}$, где масса $m = (124{,}50 \pm 0{,}05)\text{ г}$, диаметр $d = (20{,}12 \pm 0{,}02)\text{
      мм}$, высота $h = (50{,}34 \pm 0{,}05)\text{ мм}$.<br><br>
                                  1. Среднее значение плотности: $\rho = \frac{4 \cdot 0{,}1245}{\pi
      \cdot (0{,}02012)^2 \cdot 0{,}05034} \approx 7778{,}8\text{ кг/м}^3$.<br>
                                  2. Относительная погрешность:<br>
                                  $$\varepsilon_\rho = \sqrt{\left(\frac{\Delta m}{m}\right)^2 +
      \left(2\frac{\Delta d}{d}\right)^2 + \left(\frac{\Delta h}{h}\right)^2} = \sqrt{(0{,}000402)^2 +
      (0{,}001988)^2 + (0{,}000993)^2} \approx 0{,}00226$$ ($0{,}23\%$).<br>
                                  3. Абсолютная погрешность: $\Delta \rho = \rho \cdot
      \varepsilon_\rho \approx 7778{,}8 \cdot 0{,}00226 \approx 17{,}6\text{ кг/м}^3$.</p>
                              </div>
                              <p>Итоговую расчетную запись переносят в соответствующий раздел в нашем
      <a href="/blog/ideal-lab-report-template-gost-online">шаблоне отчета по лабораторной
      работе</a>.</p>
                              <p>В примере для редактора эти данные переведены в СИ и вынесены в
      вычислительный сегмент. Оператор <code>#</code> задает стандартную неопределенность исходных
      величин, а погрешность плотности вычисляется автоматически для независимых измерений. Измените
      исходные данные и запустите расчет: значения в LaTeX-документе обновятся через подстановки.
      Новый проект округляет значение и погрешность до трех значащих цифр, поэтому редактор покажет
      результат вида <code>7780 ± 17.6</code>. Режим округления по первой значащей цифре погрешности
      даст <code>7780 ± 20</code>, а запись с двумя значащими цифрами погрешности по правилу из
      следующего раздела оформите вручную. Подробнее о синтаксисе: <a
      href="/wiki/language/syntax.html">вики вычислительного языка</a>.</p>
  - id: 'report-formatting'
    title: 'Как оформлять расчет погрешностей в отчете: правила округления по ГОСТ'
    html: |2-
                              <p>Изучая, <strong>как оформлять расчет погрешностей в отчете</strong>,
      соблюдайте правило округления, которое методички приводят со ссылкой на рекомендацию МИ 1317 и
      учебную традицию. ГОСТ 8.207-76 отменен: обработку прямых многократных измерений сейчас
      описывает ГОСТ Р 8.736-2011.</p>
                              <ul>
                                  <li>Погрешность $\Delta y$ округляется до <strong>одной значащей
      цифры</strong> (если первая цифра от 3 до 9) или до <strong>двух значащих цифр</strong> (если
      первая цифра 1 или 2). В нашем примере: $\Delta \rho \approx 17{,}6 \approx 18\text{
      кг/м}^3$;</li>
                                  <li>Сам результат округляется до того же десятичного разряда, что и
      погрешность: $\rho = (7779 \pm 18)\text{ кг/м}^3$;</li>
                                  <li>Обязательно приводится относительная погрешность в процентах:
      $\varepsilon = 0{,}23\%$.</li>
                              </ul>
tips:
  - title: 'Сначала вычисляйте формулу в общем виде'
    html: |2-
      <p>Преподаватели требуют сначала вывести символьную формулу погрешности через производные, и
      только затем подставлять численные значения измерений. В Labkeeper это умеет сам вычислительный
      сегмент: в его настройках включите показ общей формулы погрешности и формулы погрешности с
      подставленными числами.</p>
  - title: 'Оформление формул в Labkeeper'
    html: |2-
      <p>В Labkeeper вы можете быстро набрать многоэтажные формулы погрешностей через окружение
      <code>align*</code> с автоматическим выравниванием по знаку равенства.</p>
editorExample:
  compute: |2-
    // Масса, кг; диаметр и высота, м
    m = 0.12450 # 0.00005
    d = 0.02012 # 0.00002
    h = 0.05034 # 0.00005
    rho = 4 * m / (pi * d^2 * h)
  latex: |2-
    \section*{Плотность цилиндра}
    \[\rho=\frac{4m}{\pi d^2h}\]
    $\rho = ${rho}$~кг/м\textsuperscript{3}.
