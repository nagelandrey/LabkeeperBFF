sections:
  - id: 'can-we-use-html'
    title: 'Можно ли писать HTML в Markdown: официальная спецификация'
    html: |2-
                              <p>Один из самых частых вопросов у новичков — <strong>можно ли писать
      html в markdown</strong> напрямую? Ответ: однозначно да. Создатель Markdown Джон Грубер
      изначально спроектировал формат как надстройку над HTML. HTML-теги могут присутствовать в
      <code>.md</code> файле, но что из них останется, решает конкретная платформа.</p>
                              <ul>
                                  <li><strong>GitHub</strong> очищает HTML: атрибуты
      <code>style</code>, теги <code>&lt;iframe&gt;</code> и скрипты вырезаются.</li>
                                  <li><strong>Markdown-проект Labkeeper</strong> показывает HTML-теги
      в превью, а при сохранении в PDF через печать браузера они попадают на лист такими же.</li>
                                  <li><strong>LaTeX-проект Labkeeper</strong> переводит
      Markdown-сегменты в LaTeX, и сырой HTML при этом теряет оформление. Блок без пустой строки
      внутри Pandoc выбрасывает целиком. С пустой строкой, о которой сказано ниже, тело остаётся
      обычным текстом, а обёртка тега пропадает.</li>
                              </ul>
  - id: 'common-use-cases'
    title: 'Вставка HTML тегов в Markdown: популярные сценарии'
    html: |2-
                              <p>Прямая <strong>вставка html тегов в markdown</strong> требуется там,
      где базового синтаксиса недостаточно:</p>
                              <ul>
                                  <li>Вставка видео и аудио: теги <code>&lt;video&gt;</code>,
      <code>&lt;iframe&gt;</code>;</li>
                                  <li>Подстрочные и надстрочные индексы химических элементов:
      <code>H&lt;sub&gt;2&lt;/sub&gt;O</code> &rarr; H<sub>2</sub>O;</li>
                                  <li>Центрирование подписей к рисункам и таблицам: <code>&lt;p
      align="center"&gt;Рисунок 1&lt;/p&gt;</code>;</li>
                                  <li>Управление шириной и высотой изображений: <code>&lt;img
      src="img.png" width="300" /&gt;</code> — так работает GitHub, а превью Labkeeper оставляет
      картинке её размер и учитывает атрибут width, пока она не упрётся в ширину колонки (подробнее
      см. руководство по <a href="/blog/markdown-image-size-width-height">настройке размеров картинок
      в Markdown</a>).</li>
                              </ul>
  - id: 'text-align-color'
    title: 'Выравнивание по ширине/центру и цветной шрифт'
    html: |2-
                              <p>Для создания цветных предупреждающих рамок (а также при <a
      href="/blog/markdown-table-merge-cells-rowspan-colspan">объединении ячеек таблиц через rowspan и
      colspan</a>) используйте обычные блочные элементы со встроенными стилями:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">HTML / Markdown</span></div>
                                  <pre><code>&lt;div style="background-color: #f0f7ff; border-left: 4px solid #0066cc; padding: 12px;"&gt;
        &lt;strong style="color: #0066cc;"&gt;Внимание!&lt;/strong&gt; Результаты действительны только при стандартном давлении.
      &lt;/div&gt;</code></pre>
                              </div>
                              <p>Браузер по умолчанию не печатает фон: чтобы цветная рамка сохранилась
      в PDF, включите в диалоге печати параметр «Фоновая графика».</p>
  - id: 'security-markdown-rules'
    title: 'Правила вложенности Markdown внутри блочных HTML-тегов'
    html: |2-
                              <p>Важное правило: если вы открыли блочный тег (например,
      <code>&lt;div&gt;</code>), многие парсеры перестают обрабатывать Markdown-синтаксис внутри него.
      Чтобы внутри HTML-блока продолжали работать звездочки или решетки, отделяйте содержимое пустой
      строкой от открывающего и закрывающего тегов.</p>
                              <p>Атрибут <code>markdown="1"</code> встречается в инструкциях, но это
      синтаксис Markdown Extra и kramdown: в GitHub Flavored Markdown и в Labkeeper он не
      работает.</p>
tips:
  - title: 'Не злоупотребляйте сложными стилями'
    html: |2-
      <p>Используйте HTML точечно, только когда стандартных средств Markdown не хватает. Избыточный
      HTML лишает исходник его главного преимущества — легкости чтения.</p>
editorExample:
  markdown: |2-
    # Markdown + HTML

    A normal **Markdown** paragraph.

    <table>
    <tr><th>Sensor</th><th>Value</th></tr>
    <tr><td>A</td><td>10.2</td></tr>
    </table>

    <details><summary>Notes</summary>Calibrated before measurement.</details>
