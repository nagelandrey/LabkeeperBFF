sections:
  - id: 'basics'
    title: 'Как сделать таблицу в Markdown: стандартный синтаксис GFM'
    html: |2-
                              <p>В спецификации GitHub Flavored Markdown (GFM) таблицы строятся с
      помощью вертикальных черт <code>|</code> для разделения колонок и дефисов <code>-</code> для
      отделения строки заголовка от тела таблицы. Если вы ищете способ, <strong>как сделать таблицу в
      markdown</strong>, достаточно освоить базовую конструкцию:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown Таблица</span></div>
                                  <pre><code>| Параметр | Значение | Единица измерения |
      | --- | --- | --- |
      | Напряжение | 220 | В |
      | Сила тока | 4,5 | А |
      | Сопротивление | 48,9 | Ом |</code></pre>
                              </div>
                              <p><em>Совет:</em> крайние вертикальные черты ставить не обязательно, но
      их наличие делает исходный код заметно аккуратнее и облегчает чтение в текстовом редакторе. Если
      ячейки содержат степени или химические формулы, применяйте <a
      href="/blog/markdown-superscript-subscript-indices">надстрочные и подстрочные индексы</a>.</p>
  - id: 'alignment'
    title: 'Выравнивание текста в колонках (влево, по центру, вправо)'
    html: |2-
                              <p>По умолчанию текст в ячейках выравнивается по левому краю. Чтобы
      изменить выравнивание, используйте двоеточия <code>:</code> во второй строке-разделителе:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Синтаксис выравнивания</span></div>
                                  <pre><code>| По левому краю | По центру | По правому краю (числа) |
      | :--- | :---: | ---: |
      | Процессор Intel Core i7 | 8 ядер | 34 500 руб. |
      | Оперативная память DDR5 | 32 ГБ | 12 800 руб. |
      | Накопитель NVMe SSD | 1 ТБ | 8 200 руб. |</code></pre>
                              </div>
                              <p>Числовые колонки с ценами, массами и датами по академическим
      стандартам всегда принято выравнивать <strong>по правому краю</strong>, чтобы разряды единиц и
      десятков находились друг под другом.</p>
  - id: 'multiline'
    title: 'Многострочный текст, списки и формулы внутри ячеек'
    html: |2-
                              <p>Классический Markdown воспринимает перевод строки как завершение
      строки таблицы. Чтобы разместить несколько строк текста внутри одной ячейки, используйте
      HTML-тег принудительного переноса <code>&lt;br&gt;</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Переносы строк и формулы</span></div>
                                  <pre><code>| Модуль | Описание функционала | Формула расчета |
      | :--- | :--- | :---: |
      | Сервис авторизации | 1. Проверка JWT токена&lt;br&gt;2. Валидация прав доступа&lt;br&gt;3. Сессионный кэш в Redis | $T_{auth} &lt; 15\text{ мс}$ |
      | Расчет тарифа | Базовая ставка с учетом&lt;br&gt;коэффициента загрузки | $Cost = B \times (1 + k)$ |</code></pre>
                              </div>
                              <p>В превью Markdown-проекта Labkeeper тег <code>&lt;br&gt;</code>
      работает. В LaTeX-проекте HTML-теги из Markdown-сегментов выбрасываются, и строки ячейки
      сольются в одну; для PDF с многострочными ячейками используйте таблицу в LaTeX-сегменте.</p>
  - id: 'complex-html'
    title: 'Объединение ячеек (colspan / rowspan) через теги HTML'
    html: |2-
                              <p>Если таблица содержит составную шапку или объединенные ячейки по
      горизонтали и вертикали, стандартный синтаксис бессилен. В этом случае Markdown позволяет
      вставить чистые теги <code>&lt;table&gt;</code> с атрибутами <code>colspan</code> и
      <code>rowspan</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">HTML-таблица в Markdown</span></div>
                                  <pre><code>&lt;table&gt;
        &lt;tr&gt;
          &lt;th rowspan="2"&gt;Студент&lt;/th&gt;
          &lt;th colspan="2"&gt;Результаты тестирования&lt;/th&gt;
        &lt;/tr&gt;
        &lt;tr&gt;
          &lt;th&gt;Теория&lt;/th&gt;
          &lt;th&gt;Практика&lt;/th&gt;
        &lt;/tr&gt;
        &lt;tr&gt;
          &lt;td&gt;Алексей Смирнов&lt;/td&gt;
          &lt;td&gt;95&lt;/td&gt;
          &lt;td&gt;88&lt;/td&gt;
        &lt;/tr&gt;
      &lt;/table&gt;</code></pre>
                              </div>
                              <p>Такой подход избавляет от типичных проблем со съезжающей сеткой при
      <a href="/blog/word-formatting-issues-diploma-lightweight-markup-alternative">переходе с Word на
      легковесную разметку</a> в дипломных проектах. Учтите, что HTML-таблица видна только в превью
      Markdown-проекта: в LaTeX-проекте она выбрасывается целиком, и объединенные ячейки там делают
      командами <code>\multicolumn</code> и <code>\multirow</code>.</p>
  - id: 'generator-tools'
    title: 'Генератор таблиц Markdown онлайн: автоматизация рутины'
    html: |2-
                              <p>Набивать таблицу из 10 столбцов и 30 строк вручную расстановкой
      палочек крайне утомительно. Для этого есть внешние сервисы — <strong>генератор таблиц markdown
      онлайн</strong> (например, Tables Generator): вставляете ячейки из Excel или Google Таблиц и
      копируете готовый синтаксис Markdown в документ. Визуального редактора таблиц в Labkeeper нет —
      таблица остается текстом сегмента.</p>
                              <p>Для таблиц измерений в Labkeeper есть путь удобнее: сохраните данные
      из Excel в CSV, загрузите файл в файлы проекта (загрузка доступна после входа) и выведите его
      вычислительным сегментом. Функция <code>load_csv</code> создает массивы с именами колонок файла,
      а <code>table</code> рисует из них таблицу:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Вычислительный сегмент</span></div>
                                  <pre><code>// В файле data.csv первая строка: U,I
      load_csv("data.csv")
      table(U, I, name_1="U, В", name_2="I, мА")</code></pre>
                              </div>
                              <p>Таблица пересчитывается при каждом нажатии «Выполнить», поэтому после
      замены CSV ее не нужно переписывать.</p>
tips:
  - title: 'Экранирование вертикальной черты'
    html: |2-
      <p>Если внутри текста ячейки требуется написать сам символ вертикальной черты (например,
      логическое ИЛИ <code>||</code> или модуль числа), экранируйте его обратным слэшем:
      <code>\|</code>.</p>
  - title: 'Таблицы в LaTeX-проекте'
    html: |2-
      <p>В LaTeX-проекте Markdown-таблица из сегмента превращается в таблицу longtable и переносится
      на следующую страницу. HTML-таблицы и теги <code>&lt;br&gt;</code> при этом выбрасываются,
      поэтому сложные таблицы для PDF набирайте в LaTeX-сегменте.</p>
editorExample:
  markdown: |2-
    ## Таблица измерений

    | Датчик | Значение | Примечание |
    |:-------|------:|:---|
    | A | 10,2 | Калибровка<br> до опыта |
    | B | $10{,}4 \pm 0{,}3$ | Без калибровки |

    Числа выровнены по правому краю, текст — по левому.
