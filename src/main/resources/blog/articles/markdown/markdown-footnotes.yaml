sections:
  - id: 'intro'
    title: 'Зачем нужны сноски в Markdown'
    html: |2-
                              <p>В академических отчетах, статьях и технической документации часто
      требуется дать уточнение, ссылку на источник или комментарий автора, не перегружая основной
      текст. В классической типографике для этого используются <strong>сноски внизу страницы
      Markdown</strong> (footnotes). Если же вы готовите курсовую или дипломную работу по праву или
      истории, ознакомьтесь также с правилами <a
      href="/blog/footnotes-bottom-page-law-history-coursework-gost">оформления постраничных сносок по
      ГОСТ</a>.</p>
                              <p>Оригинальная спецификация Markdown Джона Грубера не содержала
      встроенного механизма для примечаний, но большинство современных диалектов — включая
      <strong>Markdown Extra</strong>, <strong>GitHub Flavored Markdown (GFM)</strong> и
      онлайн-редактор <strong>Labkeeper</strong> — поддерживают стандартный механизм сносок с
      автоматической нумерацией и двусторонней навигацией (клик ведет к примечанию, а стрелка возврата
      — обратно в текст).</p>
                              <p>В Labkeeper текст делится на сегменты, и каждый Markdown-сегмент
      обрабатывается отдельно: маркер и определение сноски должны стоять в одном сегменте, а нумерация
      в превью начинается заново в каждом сегменте.</p>
  - id: 'basic-syntax'
    title: 'Как сделать сноски footnote в Markdown: базовый синтаксис'
    html: |2-
                              <p>Разберем детально, <strong>как сделать сноски footnote в
      Markdown</strong> с помощью стандартных маркеров. Для этого требуются два связанных элемента:
      <em>маркер вызова в тексте</em> и <em>определение самого примечания</em>.</p>
                              <p>Маркер оформляется квадратными скобками со знаком каретки:
      <code>[^идентификатор]</code>. Расшифровка начинается с новой строки тем же маркером с
      двоеточием:</p>
                              <div class="article-code">
                                  <div class="article-code__header">
                                      <span class="article-code__lang">Markdown</span>
                                  </div>
                                  <pre><code>По данным недавнего исследования[^1], скорость сходимости алгоритма увеличилась в два раза.

      [^1]: Результаты численного эксперимента приведены в сводном отчете лаборатории за 2026 год.</code></pre>
                              </div>
                              <p><strong>Что происходит при рендеринге:</strong></p>
                              <ul>
                                  <li>В месте маркера <code>[^1]</code> браузер отобразит аккуратную
      верхнюю цифру-ссылку <sup>1</sup>.</li>
                                  <li>Текст примечания автоматически переместится в блок сносок в
      конце текста (в Labkeeper — в конце того же сегмента).</li>
                                  <li>В конце текста сноски автоматически генерируется ссылка возврата
      <code>&#8617;</code>, возвращающая читателя точно к прочитанному абзацу.</li>
                              </ul>
  - id: 'named-footnotes'
    title: 'Именованные сноски (текстовые метки)'
    html: |2-
                              <p>При написании больших научных документов неудобно вручную отслеживать
      порядковые номера <code>[^1]</code>, <code>[^2]</code>, <code>[^3]</code>. Гораздо удобнее
      использовать смысловые текстовые метки на латинице:</p>
                              <div class="article-code">
                                  <div class="article-code__header">
                                      <span class="article-code__lang">Markdown</span>
                                  </div>
                                  <pre><code>Мы использовали стандартный метод оптимизации[^adam] для обучения нейронной сети.
      Также была применена регуляризация весов[^weight-decay].

      [^adam]: Kingma D. P., Ba J. Adam: A Method for Stochastic Optimization. ICLR, 2015.
      [^weight-decay]: Значение коэффициента затухания было зафиксировано на уровне 1e-4.</code></pre>
                              </div>
                              <p>Парсер автоматически заменит метки <code>[^adam]</code> и
      <code>[^weight-decay]</code> на строгие порядковые номера <code>1</code> и <code>2</code> в
      порядке их первого упоминания в документе.</p>
  - id: 'multiline'
    title: 'Многострочные сноски и списки внутри сноски'
    html: |2-
                              <p>Если примечание состоит из нескольких абзацев, содержит маркированный
      список или блок исходного кода, все последующие строки блока должны иметь <strong>отступ в 4
      пробела</strong> (или один Tab):</p>
                              <div class="article-code">
                                  <div class="article-code__header">
                                      <span class="article-code__lang">Markdown</span>
                                  </div>
                                  <pre><code>Основной вывод эксперимента описан в протоколе[^protocol].

      [^protocol]: Первый абзац подробного примечания.

          Второй абзац сноски обязательно имеет отступ в 4 пробела,
          чтобы парсер понимал, что он относится к текущей сноске.

          * Пункт 1 в сноске
          * Пункт 2 в сноске</code></pre>
                              </div>
  - id: 'bottom-page'
    title: 'Сноски внизу страницы Markdown: правила переноса и рендеринг в PDF'
    html: |2-
                              <p>В браузере все примечания собираются единым блоком в конце текста. В
      Markdown-проекте Labkeeper так же: сноски стоят в конце сегмента, а при сохранении в PDF через
      печать браузера этот блок остаётся в конце, а не переносится вниз каждого листа (подробнее о
      печати читайте в инструкции по <a href="/blog/markdown-to-pdf-export">сохранению Markdown в
      PDF</a>).</p>
                              <p>Если для курсовой, диплома или отчета нужны настоящие <strong>сноски
      внизу страницы Markdown</strong>, создайте в Labkeeper LaTeX-проект и пишите текст в
      Markdown-сегменте. При сборке сервер переводит Markdown в LaTeX: каждая сноска <code>[^1]</code>
      становится командой <code>\footnote</code>, и pdfLaTeX ставит примечание внизу того листа, где
      стоит маркер, под короткой разделительной линией. Нумерация в PDF идёт сквозная по всему
      документу. Требования к сноскам в курсовых по праву и истории разобраны в статье о <a
      href="/blog/footnotes-bottom-page-law-history-coursework-gost">постраничных сносках по
      ГОСТ</a>.</p>
  - id: 'faq'
    title: 'Частые ошибки при наборе сносок'
    html: |2-
                              <ul>
                                  <li><strong>Пробел внутри скобок:</strong> <code>[^ 1]</code> —
      синтаксическая ошибка. Знак вставки и идентификатор пишутся слитно: <code>[^1]</code>.</li>
                                  <li><strong>Отсутствие двоеточия:</strong> В определении сноски
      двоеточие строго обязательно: <code>[^1]: Текст</code>.</li>
                                  <li><strong>Кириллические символы в метках:</strong> Чтобы избежать
      конфликтов кодировок в компиляторах, используйте в метках латиницу, цифры и дефис:
      <code>[^source-2026]</code>.</li>
                              </ul>
tips:
  - title: 'Правильное размещение знака препинания'
    html: |2-
      <p>В русской типографике знак сноски ставят перед точкой или запятой: <code>формула[^1],</code>
      или <code>формула[^1].</code> Знак после точки — норма английских текстов, в русском отчете он
      выглядит ошибкой.</p>
  - title: 'Группировка определений в конце файла'
    html: |2-
      <p>Чтобы исходный Markdown-текст оставался чистым и удобным для редактирования, храните все
      расшифровки <code>[^1]: ...</code> в самом конце смыслового подраздела или в подвале
      документа.</p>
editorExample:
  markdown: |2-
    # Протокол измерений

    Значение исправлено после калибровки[^kalibrovka]. Погрешность взята из паспорта прибора[^1].

    [^kalibrovka]: Калибровку провели при комнатной температуре.

        Второй абзац сноски начинается с отступа в 4 пробела.

    [^1]: Паспорт вольтметра, класс точности 0,5.
