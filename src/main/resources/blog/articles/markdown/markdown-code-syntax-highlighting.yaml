sections:
  - id: 'inline-vs-block'
    title: 'Инлайн-код против блоков кода (Fenced code blocks)'
    html: |2-
                              <p>В технических статьях, методичках и отчетах по лабораторным работам
      код встречается постоянно (рекомендуем также наше руководство по <a
      href="/blog/programming-lab-report-code-listings-gost">оформлению листингов кода в отчетах по
      ГОСТ</a>). В Markdown предусмотрено два способа его визуализации: внутристрочный (инлайн) и
      многострочный блок (fenced block).</p>
                              <p>Для коротких переменных, имен функций или команд терминала
      используются одиночные обратные кавычки (бэктики): <code>`const a = 10`</code>. Для полноценных
      фрагментов программ применяются тройные кавычки <code>```</code> с обязательным указанием языка
      программирования.</p>
  - id: 'languages'
    title: 'Markdown подсветка кода для разных языков: таблица идентификаторов'
    html: |2-
                              <p>Чтобы активировалась <strong>Markdown подсветка кода для разных
      языков</strong>, сразу после открывающих трех бэктиков указывается короткий идентификатор языка,
      который понимают библиотеки подсветки (Prism, Highlight.js):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown</span></div>
                                  <pre><code>```python
      def calculate_energy(mass, c=299792458):
          """Расчет релятивистской энергии покоя"""
          return mass * (c ** 2)
      ```</code></pre>
                              </div>
                              <p>Наиболее востребованные идентификаторы в академической среде:</p>
                              <ul>
                                  <li><code>python</code> или <code>py</code> — Python (автоматически
      подсвечиваются декораторы, строки документации и числа);</li>
                                  <li><code>cpp</code>, <code>c</code> — C и C++ (ключевые слова,
      директивы препроцессора, указатели);</li>
                                  <li><code>javascript</code>, <code>js</code>,
      <code>typescript</code>, <code>ts</code> — веб-разработка и скрипты;</li>
                                  <li><code>bash</code>, <code>sh</code>, <code>shell</code> —
      консольные команды терминала;</li>
                                  <li><code>latex</code>, <code>tex</code> — код макросов и окружений
      TeX;</li>
                                  <li><code>json</code>, <code>yaml</code>, <code>xml</code> —
      конфигурационные файлы и форматы данных.</li>
                              </ul>
                              <p><strong>Как это выглядит в Labkeeper.</strong> Идентификатор языка
      стоит указывать, но цветной подсветки в Labkeeper нет: превью Markdown показывает блок
      моноширинным шрифтом без цвета, а в LaTeX-проекте блок кода из Markdown-сегмента становится
      обычным моноширинным блоком. Цветные ключевые слова, нумерацию строк и подпись «Листинг» в PDF
      дает пакет <code>listings</code> в LaTeX-сегменте — настройка разобрана в статье об <a
      href="/blog/programming-lab-report-code-listings-gost">оформлении листингов кода в отчетах по
      ГОСТ</a>.</p>
  - id: 'syntax-rules'
    title: 'Синтаксис кода в Markdown: отступы, экранирование и бэктики'
    html: |2-
                              <p>Если вам требуется показать сам <strong>синтаксис кода в
      Markdown</strong> (включая тройные кавычки) внутри примера, используйте внешнее обрамление из
      четырех бэктиков или делайте отступ в 4 пробела:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown</span></div>
                                  <pre><code>````markdown
      Здесь показан пример разметки:
      ```python
      print("Hello world")
      ```
      ````</code></pre>
                              </div>
                              <p>Внутри блоков с подсветкой синтаксиса любые служебные символы
      (звездочки, решетки, квадратные скобки) выводятся буквально и не воспринимаются парсером как
      разметка жирности или заголовков.</p>
  - id: 'pdf-export'
    title: 'Особенности отображения листингов при сохранении в PDF'
    html: |2-
                              <p>В распечатанном отчете длинные строки листинга не должны вылезать за
      границы листа А4. В превью <strong>Labkeeper</strong> блок кода набирается системным
      моноширинным шрифтом браузера, а длинная строка не переносится: блок прокручивается по
      горизонтали. При сохранении в PDF через печать браузера такая строка обрежется по краю листа,
      поэтому длинные инструкции переносите вручную, например после запятой или оператора.</p>
                              <p>Если нужен листинг с автоматическим переносом строк, нумерацией и
      подписью, используйте LaTeX-проект и пакет <code>listings</code> с параметрами
      <code>breaklines=true</code> и <code>numbers=left</code>.</p>
  - id: 'common-mistakes'
    title: 'Типичные ошибки при оформлении кода'
    html: |2-
                              <ul>
                                  <li><strong>Использование обычных одинарных кавычек:</strong>
      Символы <code>'''</code> не открывают блок кода в Markdown. Требуются только грависы (обратные
      кавычки <code>```</code>, клавиша Ё в английской раскладке).</li>
                                  <li><strong>Незакрытый блок:</strong> если забыть закрывающие
      <code>```</code>, весь текст до конца сегмента превратится в код.</li>
                              </ul>
tips:
  - title: 'Отказ от подсветки для простого текста'
    html: |2-
      <p>Если вы хотите показать вывод консоли или лог без цветных маркеров, используйте идентификатор
      <code>text</code> или <code>plaintext</code>.</p>
editorExample:
  markdown: |2-
    ## Пример на Python

    Язык указан после бэктиков, но в превью Labkeeper блок будет моноширинным и без цвета.

    ```python
    def mean(values):
        return sum(values) / len(values)

    print(mean([2, 4, 6]))
    ```
