sections:
  - id: 'why-spoilers'
    title: 'Зачем нужны спойлеры в документации и конспектах'
    html: |2-
                              <p>В объемных учебных пособиях, отчетах и лабораторных руководствах
      часто нужно спрятать громоздкие листинги кода, длинные дампы логов или ответы на вопросы
      самопроверки (подобные спойлеры также активно применяются в <a
      href="/blog/github-readme-template-badges-spoilers">шаблонах GitHub README с бейджами и
      спойлерами</a>), чтобы читатель не пролистывал десятки экранов скролла.</p>
  - id: 'details-syntax'
    title: 'Скрытый текст details в Markdown: базовый синтаксис'
    html: |2-
                              <p>Чтобы организовать <strong>скрытый текст details markdown</strong>,
      используется нативная пара HTML5-тегов <code>&lt;details&gt;</code> и
      <code>&lt;summary&gt;</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown / HTML</span></div>
                                  <pre><code>&lt;details&gt;
        &lt;summary&gt;Нажмите, чтобы увидеть подсказку к задаче №3&lt;/summary&gt;

        Для решения используйте закон сохранения импульса в проекции на ось OX:
        $m_1 v_1 + m_2 v_2 = (m_1 + m_2) u$
      &lt;/details&gt;</code></pre>
                              </div>
                              <p>Заголовок внутри <code>&lt;summary&gt;</code> остается видимым всегда
      и снабжается кликабельной стрелкой раскрытия, а основной контент прячется до нажатия мыши.</p>
                              <p>Спойлеры работают в превью Markdown-проекта Labkeeper. В
      LaTeX-проекте обёртка <code>&lt;details&gt;</code> и заголовок <code>&lt;summary&gt;</code>
      пропадают. Если после <code>&lt;/summary&gt;</code> есть пустая строка, тело спойлера остаётся
      обычным текстом. Без пустой строки Pandoc выбрасывает блок целиком, поэтому важный текст в
      спойлер для PDF не прячьте.</p>
  - id: 'open-state'
    title: 'Как сделать спойлер в Markdown раскрытым по умолчанию'
    html: |2-
                              <p>Разбирая вопрос, <strong>как сделать спойлер в markdown</strong>
      сразу развернутым при загрузке документа, достаточно добавить атрибут <code>open</code>:
      <code>&lt;details open&gt;</code>. Пользователь сможет свернуть блок, если он ему мешает.</p>
  - id: 'markdown-inside'
    title: 'Вложенность кода, списков и формул внутри спойлера'
    html: |2-
                              <p>Обязательно делайте пустую строку после закрывающего тега
      <code>&lt;/summary&gt;</code>! Если пустой строки нет, парсер может воспринять разметку Markdown
      (решетки заголовков, формулы TeX или <a href="/blog/markdown-footnotes">сноски в тексте
      Markdown</a>) как простой текст.</p>
tips:
  - title: 'Поведение при сохранении в PDF'
    html: |2-
      <p>Печать браузера выводит страницу как есть: закрытый спойлер попадет в PDF свернутым, и его
      содержимое пропадет. Перед печатью раскройте нужные блоки или поставьте атрибут
      <code>open</code>.</p>
editorExample:
  markdown: |2-
    # Experiment notes

    <details>
    <summary>Show measurement details</summary>

    - Temperature: 22 C
    - Trials: 5
    - Calibration: completed

    </details>

    The summary remains visible when the details are collapsed.
