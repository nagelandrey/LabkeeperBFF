sections:
  - id: 'problem'
    title: 'Почему базовый синтаксис ![alt](url) не поддерживает размер'
    html: |2-
                              <p>Классический синтаксис Джона Грубера
      <code>![Описание](image.png)</code> намеренно минималистичен: в нем вообще нет параметров ширины
      или высоты. В результате при вставке скриншота высокого разрешения (Retina или 4K) картинка
      распахивается на всю ширину экрана или вовсе вылезает за границы печатной страницы PDF.</p>
                              <p>К счастью, спецификация CommonMark разрешает бесшовную интеграцию
      HTML-тегов прямо в тело Markdown-документа.</p>
  - id: 'html-tag'
    title: 'Изменить размер картинки markdown width: использование тега img'
    html: |2-
                              <p>Самый надежный и кроссплатформенный способ, <strong>как изменить
      размер картинки markdown width</strong> — заменить стандартную скобочную запись на тег
      <code>&lt;img&gt;</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown</span></div>
                                  <pre><code>&lt;!-- Фиксированная ширина в пикселях --&gt;
      &lt;img src="screenshot.png" alt="Панель настроек" width="450" /&gt;

      &lt;!-- С ограничением по высоте --&gt;
      &lt;img src="logo.svg" alt="Логотип проекта" height="80" /&gt;</code></pre>
                              </div>
                              <p>Браузер и PDF-генераторы автоматически сохраняют пропорции
      изображения: если вы указали только <code>width="450"</code>, высота пересчитается
      пропорционально без сплющивания.</p>
                              <p>Так размер задается на GitHub, GitLab и в Obsidian. В превью
      Labkeeper картинка стоит по центру и сохраняет свой размер. Атрибут <code>width</code>
      учитывается, пока картинка не упирается в ширину колонки; <code>height</code> перекрывается
      правилом <code>height: auto</code>, а стили в атрибуте <code>style</code> не применяются. Точный
      размер в PDF задают в LaTeX-проекте командой
      <code>\includegraphics[width=0.5\textwidth]{chart.png}</code> в LaTeX-сегменте, а картинку из
      Markdown-сегмента сервер ставит по центру шириной 0,65 текста.</p>
                              <p><strong>Пример в редакторе:</strong> две копии логотипа с атрибутами
      <code>width="100"</code> и <code>width="300"</code>. На GitHub они получились бы разного
      размера, а в превью Labkeeper ширины 100 и 300 сохранятся, пока колонка не уже картинки.</p>
  - id: 'percentage-fitting'
    title: 'Подгонка изображения md html: адаптивные проценты (width="50%")'
    html: |2-
                              <p>Для адаптивных документов и мобильного чтения идеальна
      <strong>подгонка изображения md html</strong> через относительные единицы измерения:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown</span></div>
                                  <pre><code>&lt;!-- Занимает ровно половину ширины полосы чтения --&gt;
      &lt;img src="chart.png" alt="График" style="width: 50%; max-width: 600px;" /&gt;</code></pre>
                              </div>
                              <p>При таком подходе на смартфонах картинка красиво масштабируется, а на
      десктопе не растягивается до гигантских размытых размеров. В превью Labkeeper картинка стоит по
      центру и сохраняет свой размер. Атрибут <code>width</code> учитывается, пока картинка не
      упирается в ширину колонки; <code>height</code> перекрывается правилом <code>height:
      auto</code>, а стили в атрибуте <code>style</code> не применяются.</p>
  - id: 'centering-images'
    title: 'Центрирование иллюстраций и подрисуночные подписи'
    html: |2-
                              <p>Чтобы выровнять уменьшенное изображение строго по центру страницы и
      добавить красивую подпись курсивом (по аналогии со стандартами <a
      href="/blog/software-screenshots-report-gost-caption">оформления скриншотов программ в отчете
      ГОСТ</a>):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown</span></div>
                                  <pre><code>&lt;p align="center"&gt;
        &lt;img src="architecture.png" width="60%" alt="Архитектура сервиса" /&gt;&lt;br&gt;
        &lt;em&gt;Рисунок 1 — Структурная схема микросервисов&lt;/em&gt;
      &lt;/p&gt;</code></pre>
                              </div>
  - id: 'extended-syntax'
    title: 'Расширенный синтаксис в Obsidian, Kramdown и Pandoc'
    html: |2-
                              <p>Obsidian понимает компактный синтаксис пайпа:
      <code>![Скриншот|400](image.png)</code>, а kramdown, Pandoc и Quarto — атрибуты в фигурных
      скобках: <code>![Скриншот](image.png){width=400px}</code>. Это не часть CommonMark и GFM,
      поэтому на GitHub и в превью Labkeeper размер так не меняется, а атрибуты в скобках выводятся
      обычным текстом.</p>
                              <p>Если картинка нужна в PDF точного размера, используйте LaTeX-проект и
      команду <code>\includegraphics</code> в LaTeX-сегменте; оба пути получить PDF разобраны в
      инструкции по <a href="/blog/markdown-to-pdf-export">экспорту Markdown в PDF</a>.</p>
tips:
  - title: 'Векторный формат SVG'
    html: |2-
      <p>Формат <code>.svg</code> сохраняет векторную четкость схем и логотипов в превью Markdown и на
      GitHub. В LaTeX-проекте pdfLaTeX SVG не вставляет: для PDF сохраните схему в формате PDF или в
      PNG высокого разрешения.</p>
  - title: 'Пустые строки вокруг HTML'
    html: |2-
      <p>Всегда отделяйте теги <code>&lt;p align="center"&gt;</code> и <code>&lt;img&gt;</code>
      пустыми строками от предшествующего и последующего Markdown-текста.</p>
editorExample:
  markdown: |2-
    ## Размер изображения

    <img src="{{publicUrl}}/assets/img/logo.svg" alt="width 100" width="100">

    <img src="{{publicUrl}}/assets/img/logo.svg" alt="width 300" width="300">

    В превью Labkeeper ширины 100 и 300 сохранятся, пока колонка не уже картинки.
