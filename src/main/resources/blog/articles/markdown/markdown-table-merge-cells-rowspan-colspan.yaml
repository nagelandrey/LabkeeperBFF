sections:
  - id: 'limitation'
    title: 'Ограничения стандартных Markdown-таблиц (GFM)'
    html: |2-
                              <p>Стандартный синтаксис таблиц на вертикальных палочках <code>| колонка
      1 | колонка 2 |</code> строг: каждая строка обязана содержать равное число ячеек. Из-за этого
      прямое <strong>объединение ячеек в таблице markdown</strong> без использования дополнительных
      инструментов невозможно (здесь на помощь приходит <a
      href="/blog/markdown-raw-html-integration">интеграция чистого HTML в Markdown</a>).</p>
  - id: 'colspan-solution'
    title: 'Объединение по горизонтали (Colspan)'
    html: |2-
                              <p>Некоторые диалекты позволяют объединять ячейки по горизонтали,
      оставляя соседнюю ячейку пустой или заполняя ее дефисами, но самым надежным и переносимым
      способом остается использование атрибута <code>colspan</code> в теге <code>&lt;td&gt;</code> или
      <code>&lt;th&gt;</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">HTML</span></div>
                                  <pre><code>&lt;th colspan="2"&gt;Параметры эксперимента&lt;/th&gt;</code></pre>
                              </div>
  - id: 'rowspan-solution'
    title: 'Markdown таблица с Rowspan: объединение строк через HTML'
    html: |2-
                              <p>Когда требуется <strong>markdown таблица rowspan</strong> (например,
      для группировки нескольких строк измерений под одной категорией), таблица целиком оформляется
      через стандартный тег <code>&lt;table&gt;</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">HTML</span></div>
                                  <pre><code>&lt;table&gt;
        &lt;tr&gt;
          &lt;th&gt;Группа&lt;/th&gt;
          &lt;th&gt;Параметр&lt;/th&gt;
          &lt;th&gt;Значение&lt;/th&gt;
        &lt;/tr&gt;
        &lt;tr&gt;
          &lt;td rowspan="2"&gt;Серия А&lt;/td&gt;
          &lt;td&gt;Температура&lt;/td&gt;
          &lt;td&gt;293 K&lt;/td&gt;
        &lt;/tr&gt;
        &lt;tr&gt;
          &lt;td&gt;Давление&lt;/td&gt;
          &lt;td&gt;101,3 кПа&lt;/td&gt;
        &lt;/tr&gt;
      &lt;/table&gt;</code></pre>
                              </div>
                              <p>Превью <strong>Labkeeper</strong> рисует такую таблицу с границами
      ячеек, но без чередования фона строк. При печати в PDF длинная таблица переносится на следующий
      лист, а шапка повторяется на каждой странице, только если она стоит внутри тега
      <code>&lt;thead&gt;</code>.</p>
  - id: 'complex-example'
    title: 'Готовый шаблон сложной таблицы измерений'
    html: |2-
                              <p>Шаблон таблицы измерений с составной шапкой: номер опыта объединяет
      две строки, а под каждой величиной стоят значение и погрешность. Шапка вынесена в
      <code>&lt;thead&gt;</code>, чтобы повторяться на каждой странице при печати.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">HTML</span></div>
                                  <pre><code>&lt;table&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th rowspan="2"&gt;№ опыта&lt;/th&gt;
            &lt;th colspan="2"&gt;Напряжение U, В&lt;/th&gt;
            &lt;th colspan="2"&gt;Ток I, мА&lt;/th&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;th&gt;значение&lt;/th&gt;&lt;th&gt;погрешность&lt;/th&gt;
            &lt;th&gt;значение&lt;/th&gt;&lt;th&gt;погрешность&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1,20&lt;/td&gt;&lt;td&gt;0,05&lt;/td&gt;&lt;td&gt;10,0&lt;/td&gt;&lt;td&gt;0,5&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;2,35&lt;/td&gt;&lt;td&gt;0,05&lt;/td&gt;&lt;td&gt;20,0&lt;/td&gt;&lt;td&gt;0,5&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;</code></pre>
                              </div>
                              <p>Такой гибридный подход позволяет студентам сохранять скорость
      написания основного текста в Markdown, подключая HTML-таблицы только для комплексных сводных
      ведомостей. Учтите, что в LaTeX-проекте HTML-таблица из Markdown-сегмента выбрасывается целиком:
      там ячейки объединяют командами <code>\multicolumn</code> и <code>\multirow</code> (для второй
      нужен пакет <code>multirow</code>) в LaTeX-сегменте. Требования к таблицам в дипломе разобраны в
      руководстве по <a href="/blog/table-continuation-multipage-gost-diploma">переносу таблиц по
      ГОСТ</a>.</p>
tips:
  - title: 'Инструменты-генераторы таблиц'
    html: |2-
      <p>Для быстрого построения сложных HTML-таблиц с объединением ячеек удобно использовать
      визуальные редакторы таблиц, вставляя готовый код напрямую в документ.</p>
editorExample:
  markdown: |2-
    # Merged table cells

    <table>
    <tr><th rowspan="2">Sensor</th><th colspan="2">Measurement</th></tr>
    <tr><th>Value</th><th>Error</th></tr>
    <tr><td>A</td><td>10.2</td><td>0.2</td></tr>
    </table>
