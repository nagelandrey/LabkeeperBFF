sections:
  - id: 'intro'
    title: 'Что такое Task lists в Markdown'
    html: |2-
                              <p>Списки задач (<strong>Task lists</strong> или чек-листы) — это
      расширение базового формата Markdown из спецификации <strong>GitHub Flavored Markdown
      (GFM)</strong>. Оно превращает обычные маркеры списков в чек-боксы с отметками. Такие списки
      особенно популярны в open-source разработке (рекомендуем наш готовый <a
      href="/blog/github-readme-template-badges-spoilers">шаблон README.md для GitHub</a>).</p>
                              <p>В академической и исследовательской практике такие списки применяются
      повсеместно:</p>
                              <ul>
                                  <li>Для пошагового контроля хода физического или химического
      эксперимента;</li>
                                  <li>Для отслеживания замечаний научного руководителя при подготовке
      диплома;</li>
                                  <li>Для перечня реактивов, приборов и калибровочных процедур.</li>
                              </ul>
  - id: 'syntax'
    title: 'Markdown чек лист: синтаксис и базовые правила'
    html: |2-
                              <p>Освоить <strong>Markdown чек лист синтаксис</strong> предельно
      просто. Чтобы элемент списка стал задачей с чек-боксом, после маркера списка (<code>-</code>,
      <code>*</code> или <code>+</code>) добавляется пробел, а затем квадратные скобки:</p>
                              <ul>
                                  <li><code>- [ ] </code> — активная (невыполненная) задача с пустым
      квадратом;</li>
                                  <li><code>- [x] </code> (или <code>- [X] </code>) — завершенная
      задача с установленной отметкой.</li>
                              </ul>
                              <div class="article-code">
                                  <div class="article-code__header">
                                      <span class="article-code__lang">Markdown</span>
                                  </div>
                                  <pre><code>### План подготовки измерительного стенда

      - [x] Проверить контур заземления прибора
      - [x] Откалибровать термопару при температуре 20°C
      - [ ] Выполнить серию из 10 контрольных измерений
      - [ ] Зафиксировать результаты в электронном журнале</code></pre>
                              </div>
                              <p>В превью <strong>Labkeeper</strong> галочки отображаются, но кликом
      не переключаются: чтобы отметить пункт, замените в тексте <code>[ ]</code> на <code>[x]</code>.
      Отмечать пункты кликом позволяет, например, GitHub — в описаниях issues и pull requests.</p>
  - id: 'nested'
    title: 'Вложенные списки задач и группировка'
    html: |2-
                              <p>Сложные исследовательские этапы легко разбивать на подзадачи. Для
      создания вложенного уровня добавьте перед дефисом <strong>отступ в 2 или 4 пробела</strong>:</p>
                              <div class="article-code">
                                  <div class="article-code__header">
                                      <span class="article-code__lang">Markdown</span>
                                  </div>
                                  <pre><code>- [ ] Этап 1: Подготовка исследуемых образцов
        - [x] Взвешивание навесок на аналитических весах
        - [ ] Растворение в буферном растворе pH 7,4
      - [ ] Этап 2: Спектрофотометрия
        - [ ] Прогрев спектрофотометра в течение 15 минут
        - [ ] Измерение оптической плотности контрольной кюветы</code></pre>
                              </div>
  - id: 'formatting-inside'
    title: 'Форматирование внутри чек-листов (код, формулы, ссылки)'
    html: |2-
                              <p>Внутри строк чек-листа сохраняются все возможности форматирования
      Markdown: ссылки, полужирный шрифт, теги инлайн-кода (детальный разбор оформления листингов
      смотрите в статье о <a href="/blog/markdown-code-syntax-highlighting">подсветке синтаксиса кода
      в Markdown</a>) и даже математические выражения LaTeX:</p>
                              <div class="article-code">
                                  <div class="article-code__header">
                                      <span class="article-code__lang">Markdown</span>
                                  </div>
                                  <pre><code>- [x] Установить библиотеку `scipy` версии не ниже **1.10**
      - [x] Проверить критерий сходимости $R^2 \ge 0{,}98$
      - [ ] Скачать методические указания по [ссылке на кафедральный портал](https://example.com/metodichka.pdf)</code></pre>
                              </div>
  - id: 'lab-example'
    title: 'Список задач Markdown с галочками: пример для лабораторной работы'
    html: |2-
                              <p>Оформляя отчет по лабораторной работе, удобно добавить <strong>список
      задач Markdown с галочками</strong> в качестве контрольного листа допуска к выполнению
      эксперимента:</p>
                              <div class="article-code">
                                  <div class="article-code__header">
                                      <span class="article-code__lang">Markdown</span>
                                  </div>
                                  <pre><code>## Контрольный лист допуска к эксперименту

      - [x] Вводный инструктаж по технике безопасности пройден
      - [x] Теоретический расчет погрешностей выполнен
      - [ ] Схема измерений собрана и одобрена преподавателем
      - [ ] Стартовое напряжение источника питания выставлено на $U = 12\text{ В}$
      - [ ] Показания амперметра внесены в чистовой протокол</code></pre>
                              </div>
                              <p>В Markdown-проекте <strong>Labkeeper</strong> кнопка «Сохранить в
      PDF» открывает печать браузера, и чек-боксы попадают на лист такими же, как в превью. Чек-листы
      — возможность Markdown-проекта: в LaTeX-проекте Pandoc с <code>commonmark_x</code> оставляет
      пункты обычным списком с текстом <code>[x]</code> и <code>[ ]</code>. Пакет <code>amssymb</code>
      для этого не нужен, и сегмент собирается.</p>
  - id: 'pitfalls'
    title: 'Типичные ошибки при оформлении'
    html: |2-
                              <ul>
                                  <li><strong>Отсутствие пробела между скобками:</strong> Конструкция
      <code>- []</code> не будет распознана. Внутри скобок обязательно должен быть ровно один пробел:
      <code>- [ ]</code>.</li>
                                  <li><strong>Слитное написание с дефисом:</strong> <code>-[ ]</code>
      или <code>- [ ]Текст</code> без пробелов приведет к поломке разметки списка.</li>
                                  <li><strong>Русская буква «х»:</strong> Отметка выполнения требует
      исключительно латинской буквы: <code>- [x]</code> или <code>- [X]</code>.</li>
                              </ul>
tips:
  - title: 'Зачеркивание для отмененных пунктов'
    html: |2-
      <p>Если пункт плана был отменен, используйте двойную тильду: <code>- [x] ~~Предварительный
      прогрев реактора~~ (отменено регламентом)</code>.</p>
  - title: 'Автоматический трекинг выполнения на GitHub'
    html: |2-
      <p>Если чек-лист стоит в описании issue или pull request на GitHub, сайт показывает индикатор
      готовности (например, <code>4 of 6 tasks</code>) в списке задач. В обычных файлах репозитория,
      например в README.md, чек-лист отображается без такого счетчика.</p>
editorExample:
  markdown: |2-
    # План эксперимента

    - [x] Подготовить приборы
      - [x] Вольтметр
      - [ ] Амперметр
    - [ ] Проверить, что $R^2 \ge 0{,}98$
    - [ ] Оформить отчет
