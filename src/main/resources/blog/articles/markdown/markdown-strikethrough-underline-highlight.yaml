sections:
  - id: 'strikethrough'
    title: 'Зачеркнутый текст: синтаксис с двойной тильдой ~~'
    html: |2-
                              <p>Зачёркнутый текст в Markdown задаётся простым правилом GitHub
      Flavored Markdown (GFM): фрагмент с двух сторон оборачивается в двойные тильды
      <code>~~</code>.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown</span></div>
                                  <pre><code>Первоначальная гипотеза ~~не подтвердилась~~ была скорректирована в ходе эксперимента.
      Цена лицензии: ~~5000 руб.~~ Бесплатно для студентов.</code></pre>
                              </div>
                              <p>В браузере такой фрагмент компилируется в семантический HTML-тег
      <code>&lt;del&gt;</code> или <code>&lt;s&gt;</code>, отображаясь с аккуратной горизонтальной
      чертой по центру букв. Зачеркиванием удобно помечать и отмененные пункты в <a
      href="/blog/markdown-task-lists">списках задач в Markdown</a>.</p>
                              <p>Зачеркивание — возможность Markdown-проекта Labkeeper. В
      LaTeX-проекте сервер переводит <code>~~текст~~</code> в команду пакета <code>soul</code>,
      которого нет в стандартной преамбуле, и такой сегмент не соберется.</p>
  - id: 'underline'
    title: 'Как подчеркнуть текст в Markdown: безопасные способы'
    html: |2-
                              <p>В оригинальном синтаксисе Markdown намеренно нет символа для
      подчеркивания, поскольку в вебе подчеркнутый текст традиционно путают с гиперссылками (подробнее
      о специфике использования тегов читайте в статье об <a
      href="/blog/markdown-raw-html-integration">интеграции чистого HTML в Markdown</a>). Однако при
      оформлении формуляров, бланков и рефератов вопрос, <strong>как подчеркнуть текст в
      markdown</strong>, возникает регулярно.</p>
                              <p>Для этого используется прямой встроенный HTML-тег
      <code>&lt;u&gt;</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Markdown</span></div>
                                  <pre><code>Студент &lt;u&gt;Иванов Алексей Петрович&lt;/u&gt; допущен к защите работы.
      Обратите &lt;u&gt;особое внимание&lt;/u&gt; на единицы измерения в СИ.</code></pre>
                              </div>
                              <p>Тег <code>&lt;u&gt;</code> работает в превью Markdown-проекта
      <strong>Labkeeper</strong> и сохраняется при печати в PDF. В LaTeX-проекте HTML-теги из
      Markdown-сегментов выбрасываются, поэтому там подчеркивают командой <code>\underline{...}</code>
      в LaTeX-сегменте.</p>
  - id: 'highlight-marker'
    title: 'Выделение маркером: тег &lt;mark&gt; и синтаксис ==текст=='
    html: |2-
                              <p>Чтобы сымитировать желтый офисный текстовыделитель (хайлайтер), в
      зависимости от редактора используют два варианта:</p>
                              <ul>
                                  <li>В расширенных диалектах: двойные знаки равенства <code>==важный
      вывод==</code>;</li>
                                  <li>Универсальный HTML-способ: тег <code>&lt;mark&gt;ключевой
      факт&lt;/mark&gt;</code>.</li>
                              </ul>
                              <p>Это помогает акцентировать внимание научного руководителя или
      рецензента на ключевых тезисах статьи.</p>
                              <p>В Labkeeper синтаксис <code>==текст==</code> не работает и выводится
      как есть, поэтому используйте тег <code>&lt;mark&gt;</code>. Учтите, что браузер по умолчанию не
      печатает фон: чтобы выделение не пропало в PDF, включите в диалоге печати параметр «Фоновая
      графика».</p>
  - id: 'academic-style'
    title: 'Употребление в научных работах и рецензиях'
    html: |2-
                              <p>В чистовых версиях дипломов и диссертаций зачеркивание и выделение
      маркером не используют, но на этапе согласования черновиков и переписки с научным руководителем
      зачеркивание и хайлайтер незаменимы для наглядной демонстрации внесенных правок.</p>
tips:
  - title: 'Не путайте тильду со знаком подчеркивания'
    html: |2-
      <p>Одиночные знаки подчеркивания <code>_текст_</code> в Markdown делают текст <em>курсивом</em>,
      а не подчеркнутым. Для подчеркивания всегда применяйте
      <code>&lt;u&gt;текст&lt;/u&gt;</code>.</p>
editorExample:
  markdown: |2-
    ## Редактирование

    **Важный результат** и *пояснение*.

    <u>Подчеркнутый текст</u> и <mark>выделение</mark>.

    Зачёркивание двойными тильдами в пример не включено: в LaTeX-проекте оно не собирается.
