sections:
  - id: 'standard-update'
    title: 'Что изменилось в новом ГОСТ Р 7.0.100-2018'
    html: |2-
                              <p>С введением национального стандарта <strong>ГОСТ Р
      7.0.100-2018</strong> («Библиографическая запись. Библиографическое описание») правила ссылки на
      сайты и электронные документы существенно обновились:</p>
                              <ul>
                                  <li>Обозначение <code>[Электронный ресурс]</code> после заглавия
      больше не пишут. Вместо него появилась область вида содержания и средства доступа: <code>— Текст
      : электронный</code>. У сайта целиком ее обычно ставят в конце записи, а у статьи на сайте —
      перед двумя косыми чертами.</li>
                                  <li>Вместо устаревшего <code>Режим доступа: свободный</code>
      закреплен стандарт: <code>URL: https://...</code></li>
                                  <li>Сведения о дате проверки ссылки оформляются в круглых скобках
      строго по схеме: <code>(дата обращения: ДД.ММ.ГГГГ)</code>.</li>
                                  <li>Предписанные элементы записи (<code>[сайт]</code>, <code>дата
      обращения</code>, <code>Текст : электронный</code>) пишут по-русски и у иностранных
      источников.</li>
                              </ul>
                              <p>ГОСТ Р 7.0.100-2018 описывает записи в списке литературы. Для
      библиографических ссылок на сетевые электронные документы с 1 июня 2022 года действует отдельный
      ГОСТ Р 7.0.108-2022; какой стандарт применять, указывает методичка.</p>
  - id: 'structure'
    title: 'Как оформить ссылку на сайт в списке литературы гост: обязательные поля'
    html: |2-
                              <p>Общая схема того, <strong>как оформить ссылку на сайт в списке
      литературы гост</strong>, строится из следующих компонентов:</p>
                              <blockquote>
                                  Автор. Заглавие статьи / страницы / Сведения об авторах. — Текст :
      электронный // Название сайта : [сайт]. — Год (если известен). — URL: https://... (дата
      обращения: ДД.ММ.ГГГГ).
                              </blockquote>
                              <p>Для сайта целиком схема короче: <em>Название сайта : [сайт]. — URL:
      https://... (дата обращения: ДД.ММ.ГГГГ). — Текст : электронный.</em></p>
  - id: 'diploma-examples'
    title: 'Ссылка на интернет ресурс диплом: примеры сайтов, GitHub и документации'
    html: |2-
                              <p>Ниже представлены готовые шаблоны для типовых цифровых источников
      (<strong>ссылка на интернет ресурс диплом</strong>, а для юридических и законодательных баз
      данных смотрите правила описания в <a
      href="/blog/legal-regulatory-acts-bibliography-diploma-gost">библиографии нормативно-правовых
      актов по ГОСТ</a>):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Примеры описания электронных ресурсов</span></div>
                                  <pre><code>% 1. Статья на тематическом портале:
      Иванов, А. В. Архитектура микросервисов на Python / А. В. Иванов. — Текст : электронный // Хабр : [сайт]. — 2025. — URL: https://habr.com/ru/articles/891234/ (дата обращения: 12.04.2026).

      % 2. Официальная техническая документация:
      Docker Engine documentation. — Текст : электронный // Docker Docs : [сайт]. — 2026. — URL: https://docs.docker.com/engine/ (дата обращения: 18.05.2026).

      % 3. Репозиторий на GitHub:
      Labkeeper-team/Docs : документация Labkeeper. — Текст : электронный // GitHub : [сайт]. — URL: https://github.com/Labkeeper-team/Docs (дата обращения: 01.09.2026).

      % 4. Электронная версия нормативного акта (КонсультантПлюс / Гарант):
      Об образовании в Российской Федерации : Федеральный закон от 29.12.2012 № 273-ФЗ. — Текст : электронный // КонсультантПлюс : [сайт]. — URL: https://www.consultant.ru/document/cons_doc_LAW_140174/ (дата обращения: 05.09.2026).</code></pre>
                              </div>
  - id: 'latex-urldate'
    title: 'Оформление в LaTeX: thebibliography онлайн и @online в biblatex локально'
    html: |2-
                              <p>В Labkeeper список литературы собирается окружением
      <code>thebibliography</code>: запись набирается вручную, а адрес оборачивается в
      <code>\url{...}</code>, чтобы LaTeX корректно перенес его и не споткнулся о символы
      подчеркивания:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{thebibliography}{9}
      \bibitem{labkeeper} Labkeeper : онлайн-редактор LaTeX и Markdown : [сайт]. ---
        URL: \url{{{publicUrl}}} (дата обращения: 08.10.2026). --- Текст : электронный.
      \end{thebibliography}</code></pre>
                              </div>
                              <p>При локальной сборке можно использовать библиографический пакет
      <code>biblatex</code> (подробно разобранный в <a
      href="/blog/biblatex-biber-advanced-bibliography-management">руководстве по BibLaTeX и
      Biber</a>) с ГОСТ-стилем <code>biblatex-gost</code>: там электронные ресурсы описываются типом
      <code>@online</code>. В Labkeeper этот путь не работает, потому что сервер не запускает
      программу Biber:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">BibTeX (.bib)</span></div>
                                  <pre><code>@online{fastapi_docs,
          title = {FastAPI Documentation: High performance, easy to learn},
          author = {Ram{\'\i}rez, Sebasti{\'a}n},
          year = {2026},
          url = {https://fastapi.tiangolo.com/},
          urldate = {2026-09-05}
      }</code></pre>
                              </div>
                              <p>Пакет <code>biblatex-gost</code> автоматически переведет поле
      <code>urldate</code> в правильную русскую фразу «(дата обращения: 05.09.2026)».</p>
  - id: 'common-errors'
    title: 'Типичные ошибки: протокол https, дата обращения и длинные ссылки'
    html: |2-
                              <p>Рекомендации по устранению замечаний:</p>
                              <ul>
                                  <li>Всегда указывайте префикс протокола <code>https://</code> в
      URL.</li>
                                  <li>Не сокращайте ссылки через сервисы коротких ссылок (bit.ly,
      clck.ru): в научном списке литературы ссылка должна быть прямой и постоянной.</li>
                                  <li>Для переноса сверхдлинных URL в LaTeX оборачивайте адрес в
      <code>\url{...}</code>. В стандартной преамбуле Labkeeper пакет <code>hyperref</code> уже
      подключен; его настройки меняйте через <code>\hypersetup{...}</code>, а не повторным
      <code>\usepackage</code> с другими опциями — иначе сборка остановится с ошибкой Option
      clash.</li>
                              </ul>
tips:
  - title: 'Поле DOI для статей'
    html: |2-
      <p>Если у научной интернет-статьи есть цифровой идентификатор DOI, указывайте его в конце
      записи: <code>https://doi.org/10.1016/j.jneumeth.2025.109876</code>. DOI не отменяет дату
      обращения, если в записи есть URL: дата нужна рядом с адресом. Её не ставят, только когда указан
      один DOI и URL не приводится.</p>
  - title: 'Экранирование подчеркиваний в TeX'
    html: |2-
      <p>При ручной верстке списка через <code>thebibliography</code> экранируйте знаки подчеркивания
      в URL: <code>https://example.com/api\_v1</code> или оборачивайте адрес в команду
      <code>\url{...}</code>.</p>
editorExample:
  latex: |2-
    Редактор описан в~\cite{site}, пример статьи --- в~\cite{habr}.
    \begin{thebibliography}{9}
    \bibitem{site} Labkeeper : онлайн-редактор LaTeX и Markdown : [сайт]. --- URL:
    \url{{{publicUrl}}} (дата обращения: 08.10.2026). --- Текст : электронный.
    \bibitem{habr} Иванов, А.~В. Архитектура микросервисов на Python / А.~В.~Иванов. --- Текст :
    электронный // Хабр : [сайт]. --- 2025. --- URL: \url{https://habr.com/ru/articles/891234/}
    (дата обращения: 12.04.2026).
    \end{thebibliography}
