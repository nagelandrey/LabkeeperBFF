sections:
  - id: 'vak-rules'
    title: 'Технические требования журналов из перечня ВАК и РИНЦ'
    html: |2-
                              <p>ВАК и РИНЦ сами не задают поля, шрифт и интервал: эти параметры
      устанавливают правила для авторов конкретного журнала. Состав элементов статьи (сведения об
      авторах, аннотация, ключевые слова) описывает ГОСТ Р 7.0.7-2021. Типичные требования журналов из
      перечня Высшей аттестационной комиссии (ВАК) и изданий, индексируемых в Российском индексе
      научного цитирования (РИНЦ), выглядят так — но всегда сверяйтесь с правилами своего журнала:</p>
                              <ul>
                                  <li><strong>Формат листа:</strong> стандартный А4, книжная
      ориентация;</li>
                                  <li><strong>Поля страницы:</strong> по 20 мм со всех сторон (в
      некоторых изданиях: левое 25 мм, правое 15 мм, верхнее и нижнее по 20 мм);</li>
                                  <li><strong>Шрифт основного текста:</strong> Times New Roman, 14 pt
      (для сносок и таблиц допускается 12 pt);</li>
                                  <li><strong>Межстрочный интервал:</strong> полуторный (1.5) или
      одинарный (1.0 в зависимости от сборника);</li>
                                  <li><strong>Абзацный отступ (красная строка):</strong> 1,25 см
      (задается параметром абзаца, а не пробелами или клавишей Tab);</li>
                                  <li><strong>Выравнивание:</strong> по ширине страницы с обязательной
      расстановкой переносов.</li>
                              </ul>
                              <p>По смысловой структуре ведущие отечественные сборники ориентируются
      на принципы <a href="/blog/imrad-structure-scientific-article-scopus-template">международной
      структуры IMRAD</a>, выделяя четкие разделы методов и обсуждения.</p>
  - id: 'article-anatomy'
    title: 'Структура метаданных статьи: УДК, аффилиации и аннотация'
    html: |2-
                              <p>Каждая статья для РИНЦ открывается блоком обязательных
      метаданных:</p>
                              <ol>
                                  <li><strong>Индекс УДК (Универсальная десятичная
      классификация):</strong> выравнивается по левому краю без отступа (например: <code>УДК
      004.421</code>);</li>
                                  <li><strong>Инициалы и фамилия авторов:</strong> с указанием ученых
      степеней, званий и должностей;</li>
                                  <li><strong>Аффилиация (место работы/учебы):</strong> полное
      официальное название вуза или НИИ, город, страна, адрес корпоративной электронной почты;</li>
                                  <li><strong>Название статьи:</strong> полужирными прописными буквами
      по центру;</li>
                                  <li><strong>Аннотация и ключевые слова:</strong> на русском языке
      (от 150 до 250 слов);</li>
                                  <li><strong>Англоязычный блок:</strong> полное дублирование ФИО,
      аффилиации, названия (Title), Abstract и Keywords.</li>
                              </ol>
  - id: 'download-template'
    title: 'Шаблон статьи РИНЦ онлайн: готовый код для верстки'
    html: |2-
                              <p>Ниже — <strong>шаблон статьи ринц онлайн</strong> в формате LaTeX:
      скопируйте код в LaTeX-сегмент и подставьте поля, кегль и интервал из правил вашего журнала.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Шаблон РИНЦ / ВАК</span></div>
                                  <pre><code>\documentclass[a4paper,14pt]{extarticle} % класс article не знает кегль 14pt
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[english,russian]{babel} % последний язык — основной
      \usepackage[left=20mm,right=20mm,top=20mm,bottom=20mm]{geometry}
      \usepackage{setspace}
      \onehalfspacing
      \usepackage{indentfirst}
      \setlength{\parindent}{1.25cm}
      \usepackage{amsmath,amssymb}
      \usepackage{graphicx}

      \begin{document}

      \noindent УДК 004.891.2

      \begin{center}
      {\bfseries МЕТОД ОПТИМИЗАЦИИ НЕЙРОСЕТЕВЫХ АРХИТЕКТУР ДЛЯ СИСТЕМ РЕАЛЬНОГО ВРЕМЕНИ}\\
      \vspace{0.5cm}
      {\bfseries А.~А.~Иванов$^{1}$, С.~С.~Петров$^{2}$}\\
      \vspace{0.2cm}
      {\small $^{1,2}$Московский государственный технический университет имени Н.~Э.~Баумана, Москва, Россия\\
      E-mail: ivanov@bmstu.ru}
      \end{center}

      \begin{abstract} % заголовок «Аннотация» окружение печатает само
      В работе предложен алгоритм прунинга весов...
      \vspace{0.2cm}

      \noindent {\bfseries Ключевые слова:} нейронные сети, оптимизация, прунинг, параллельные вычисления
      \end{abstract}

      \section*{Введение}
      Актуальность темы обусловлена необходимостью...

      \section*{Методика исследования}
      Математическая модель описывается выражением:
      \begin{equation}
          f(x) = \sum_{i=1}^{n} w_i x_i + b
      \end{equation}

      \section*{Результаты и выводы}
      Экспериментальные исследования показали...
      \end{document}</code></pre>
                              </div>
                              <p>Окружение <code>abstract</code> само печатает заголовок «Аннотация»,
      поэтому слово внутри окружения не повторяют. Ключевые слова по ГОСТ Р 7.0.7-2021 разделяют
      запятыми и не ставят точку после последнего. Если журнал издается в две колонки, для разметки
      тела статьи часто используют пакет для <a
      href="/blog/latex-multicol-multi-column-layout-journal">многоколоночной верстки журналов в
      multicol</a>.</p>
  - id: 'online-editing'
    title: 'Оформление научной статьи по ГОСТу онлайн в Labkeeper'
    html: |2-
                              <p>Современное <strong>оформление научной статьи по госту
      онлайн</strong> в Labkeeper — это LaTeX-проект: стили заголовков, нумерацию формул и списков
      рассчитывает LaTeX, поэтому их не нужно поправлять вручную. Поля, кегль и интервал из правил
      журнала задаются один раз в преамбуле, как в шаблоне выше.</p>
                              <p>Если писать без своей преамбулы, учтите, что стандартная преамбула
      Labkeeper ставит поля всего 3–5 мм и нумерует формулу, только когда на нее есть ссылка через
      <code>\eqref</code>. Для статьи по правилам журнала начинайте проект с полной преамбулы.</p>
  - id: 'gost-citations'
    title: 'Список литературы по ГОСТ Р 7.0.5-2008 без ошибок'
    html: |2-
                              <p>В РИНЦ цитирования проверяются автоматически. Если ссылка оформлена с
      ошибкой (пропущен год, косая черта или страницы), статья может не привязаться к профилю
      цитируемого автора:</p>
                              <ul>
                                  <li><strong>Статья из журнала:</strong> Иванов И. И. Алгоритмы
      балансировки // Программные продукты и системы. 2024. Т. 37, № 2. С. 45–52.</li>
                                  <li><strong>Книга:</strong> Сидоров А. В. Математические методы
      анализа данных. М. : Наука, 2023. 312 с.</li>
                              </ul>
tips:
  - title: 'Проверяйте УДК по классификатору'
    html: |2-
      <p>УДК должен точно отражать предметную область статьи. Проверить актуальный шифр УДК можно в
      библиотеке вашего вуза или через онлайн-справочники Teacode.</p>
  - title: 'Графики для журнала'
    html: |2-
      <p>Формулы и графики, построенные в LaTeX (TikZ, pgfplots), попадают в PDF в векторном виде.
      Растровые иллюстрации готовьте с разрешением, которое указано в правилах журнала.</p>
