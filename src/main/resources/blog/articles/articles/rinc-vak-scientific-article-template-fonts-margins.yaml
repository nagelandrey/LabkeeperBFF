    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[english,russian]{babel}
    \usepackage[margin=20mm]{geometry}
    \usepackage{setspace}\onehalfspacing
    \begin{document}
    \noindent УДК 004.421
    \begin{center}\textbf{МЕТОД КАЛИБРОВКИ ДАТЧИКОВ}\\
    И.~И.~Иванов\\{\small МГТУ им. Н.~Э.~Баумана, Москва, Россия}\end{center}
    \textbf{Аннотация.} Рассмотрен метод калибровки датчиков.\par
    \textbf{Ключевые слова:} измерения, погрешность, калибровка
    \begin{otherlanguage}{english}
    \begin{center}\textbf{SENSOR CALIBRATION METHOD}\\
    I.~I.~Ivanov\\{\small Bauman Moscow State Technical University, Moscow, Russia}\end{center}
    \textbf{Abstract.} A sensor calibration method is considered.\par
    \textbf{Keywords:} measurement, uncertainty, calibration
    \end{otherlanguage}
    \section*{Введение}Постановка задачи.
    \end{document}
