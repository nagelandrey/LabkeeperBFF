sections:
  - id: 'structure'
    title: 'Анатомия титульного листа реферата по ГОСТ'
    html: |2-
                              <p>Титульный лист — это первая страница работы, которая формирует
      впечатление преподавателя о вашей аккуратности. Требования к титульному листу реферата задает
      вуз; ГОСТ 7.32 описывает титульный лист отчета о НИР, и методички часто берут его за образец.
      Обычно лист делится на 4 информационных яруса (для магистров действуют особые требования,
      описанные в статье о <a href="/blog/master-thesis-title-page-gost">титульном листе магистерской
      диссертации</a>):</p>
                              <ol>
                                  <li><strong>Верхний ярус (шапка):</strong> полное наименование
      министерства, точное официальное название университета, факультет/институт и кафедра.</li>
                                  <li><strong>Средний ярус (тема):</strong> крупными буквами вид
      работы (РЕФЕРАТ / ЭССЕ), дисциплина и формулировка темы в кавычках.</li>
                                  <li><strong>Правый ярус (сведения об авторе):</strong> ФИО студента,
      курс, номер учебной группы, а также ученая степень, должность и ФИО научного руководителя.</li>
                                  <li><strong>Нижний ярус (выходные данные):</strong> город и год
      написания работы (строго по центру в самом низу).</li>
                              </ol>
  - id: 'latex-template'
    title: 'Правильный титульник для реферата онлайн: готовый код LaTeX'
    html: |2-
                              <p>Ниже представлен проверенный <strong>правильный титульник для
      реферата онлайн</strong> с идеальным вертикальным распределением через команду
      <code>\vfill</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX (Шаблон титульного листа)</span></div>
                                  <pre><code>\begin{titlepage}
          \centering
          {\small МИНИСТЕРСТВО НАУКИ И ВЫСШЕГО ОБРАЗОВАНИЯ РОССИЙСКОЙ ФЕДЕРАЦИИ}\\[2mm]
          {\footnotesize ФЕДЕРАЛЬНОЕ ГОСУДАРСТВЕННОЕ АВТОНОМНОЕ ОБРАЗОВАТЕЛЬНОЕ УЧРЕЖДЕНИЕ ВЫСШЕГО ОБРАЗОВАНИЯ}\\[2mm]
          {\bfseries САНКТ-ПЕТЕРБУРГСКИЙ ПОЛИТЕХНИЧЕСКИЙ УНИВЕРСИТЕТ ПЕТРА ВЕЛИКОГО}\\[4mm]
          {\small Институт компьютерных наук и кибербезопасности}\\
          {\small Кафедра «Компьютерные интеллектуальные технологии»}

          \vfill

          {\bfseries\Large РЕФЕРАТ}\\[4mm]
          {\large по дисциплине: «Методы искусственного интеллекта»}\\[4mm]
          {\bfseries\large на тему: «Трансформерные архитектуры в задачах обработки естественного языка»}

          \vfill

          \begin{flushright}
          \begin{minipage}{0.48\textwidth}
              \textbf{Выполнил:}\\
              студент гр. 3530901/20001\\
              Иванов А. С.\\[3mm]
              \textbf{Проверил:}\\
              д-р техн. наук, профессор\\
              Петров В. М.
          \end{minipage}
          \end{flushright}

          \vfill

          Санкт-Петербург\\
          2026
      \end{titlepage}</code></pre>
                              </div>
                              <p>Это тело документа. Без своей преамбулы Labkeeper подставит
      стандартную, а в ней поля всего 3–5 мм, поэтому для печати начните проект с преамбулы с
      <code>geometry</code> и полями из методички (пример в редакторе показывает такую преамбулу).
      Учтите и вторую ловушку: окружение <code>titlepage</code> после себя сбрасывает счетчик страниц,
      и следующая страница получит номер 1. Если титульный лист должен считаться первой страницей,
      поставьте <code>\setcounter{page}{2}</code> сразу после <code>\end{titlepage}</code>.</p>
  - id: 'essay-features'
    title: 'Создать титульный лист для эссе: отличия от реферата'
    html: |2-
                              <p>Когда требуется <strong>создать титульный лист для эссе</strong> (по
      философии, социологии, экономике или политологии), структура в целом идентична, но слово
      «РЕФЕРАТ» заменяется на «НАУЧНОЕ ЭССЕ», а тема формулируется в виде полемического вопроса или
      тезиса.</p>
  - id: 'margins-fonts'
    title: 'Поля страницы, шрифты и выравнивание блоков'
    html: |2-
                              <p>Требования нормоконтроля к геометрии титульного листа (подробный
      разбор преамбул и команд смотрите в руководстве по <a href="/blog/latex-titlepage">созданию
      титульного листа в LaTeX</a>):</p>
                              <ul>
                                  <li><strong>Поля:</strong> левое — 30 мм, правое — 15 мм (или 10
      мм), верхнее и нижнее — по 20 мм.</li>
                                  <li><strong>Шрифт:</strong> Times New Roman (или единый шрифт
      документа), начертание прямое. В pdfLaTeX похожую гарнитуру с кириллицей дает пакет
      <code>tempora</code> вместе с <code>\usepackage[T2A]{fontenc}</code>.</li>
                                  <li><strong>Номер страницы:</strong> скрыт, но сам лист физически
      считается страницей номер 1.</li>
                              </ul>
  - id: 'common-mistakes'
    title: 'Типичные ошибки студентов при сдаче титульника'
    html: |2-
                              <p>Частые недочеты, из-за которых титульный лист приходится
      перепечатывать:</p>
                              <ul>
                                  <li>Слово «г.» после года: по образцу ГОСТ 7.32 и большинства
      методичек пишется просто «2026», без буквы «г.» и слова «год».</li>
                                  <li>Кавычки в названии университета: если в официальном названии
      вуза нет кавычек, их нельзя добавлять самостоятельно.</li>
                                  <li>Точка в конце названия темы: точка в конце заголовка работы
      категорически не ставится.</li>
                              </ul>
tips:
  - title: "Использование \\vfill"
    html: |2-
      <p>Команда <code>\vfill</code> автоматически распределяет свободное вертикальное пространство
      страницы поровну между смысловыми блоками независимо от кегля шрифта.</p>
  - title: 'Место для оценки и подписи'
    html: |2-
      <p>В блоке преподавателя можно добавить графу для росписи: <code>Оценка:
      \underline{\hspace{2cm}} Подпись: \underline{\hspace{2.5cm}}</code>.</p>
editorExample:
  latex: |2-
    \documentclass[12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[russian]{babel}
    \usepackage[a4paper,left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
    \begin{document}
    \begin{titlepage}\centering
    {\small МИНИСТЕРСТВО НАУКИ И ВЫСШЕГО ОБРАЗОВАНИЯ РФ}\\[2mm]
    {\bfseries УНИВЕРСИТЕТ}\\[2mm]
    {\small Кафедра информатики}
    \vfill
    {\bfseries\Large РЕФЕРАТ}\\[3mm]
    по дисциплине «История науки»\\[2mm]
    на тему «Развитие метрологии»
    \vfill
    \begin{flushright}\begin{minipage}{.45\textwidth}
    Выполнил: студент гр. 101\\Иванов А.~С.\\[2mm]
    Проверил: доцент Петров В.~М.
    \end{minipage}\end{flushright}
    \vfill
    Москва\\2026
    \end{titlepage}
    \end{document}
