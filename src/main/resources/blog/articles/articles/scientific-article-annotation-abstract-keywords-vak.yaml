sections:
  - id: 'purpose'
    title: 'Почему аннотация — самая важная часть статьи для индексации'
    html: |2-
                              <p>Именно аннотация и список ключевых слов попадают в открытый доступ
      научных баз данных (eLIBRARY / РИНЦ, CyberLeninka, Scopus, Web of Science, Google Scholar): по
      этим нескольким предложениям читатель решает, открывать ли полный текст и ссылаться ли на работу
      (столь же жесткие требования предъявляются и к авторефератам при <a
      href="/blog/latex-dissertation">подготовке диссертаций в LaTeX</a>).</p>
                              <p>Общие правила для аннотации задает <strong>ГОСТ Р
      7.0.99-2018</strong> «Реферат и аннотация. Общие требования»: он заменил ГОСТ 7.9-95, который в
      России отменен с 2022 года. Для статей в журналах действует <strong>ГОСТ Р 7.0.7-2021</strong>:
      аннотацию составляют по ГОСТ Р 7.0.99, ее объем не превышает 250 слов, а перед текстом пишут
      слово «Аннотация» («Abstract»). Аннотация должна быть содержательной, свободной от общих фраз и
      отражать конкретные результаты, полученные авторами.</p>
  - id: 'structure'
    title: 'Четыре обязательных элемента качественной аннотации'
    html: |2-
                              <p>Академический стандарт предписывает строгую композицию из 4 смысловых
      блоков (по 1–2 предложения на каждый):</p>
                              <ol>
                                  <li><strong>Актуальность и предмет исследования:</strong> какую
      нерешенную научно-техническую задачу решает статья.</li>
                                  <li><strong>Методология / Подход:</strong> какие методы
      математического моделирования, экспериментальные стенды или алгоритмы использовались.</li>
                                  <li><strong>Полученные результаты:</strong> конкретные факты,
      закономерности или числовые характеристики (например, <em>«повышена точность классификации на
      14%»</em>).</li>
                                  <li><strong>Практическая значимость:</strong> где и как полученные
      результаты могут быть внедрены.</li>
                              </ol>
  - id: 'gost-example'
    title: 'Аннотация к научной статье пример гост: разбор образца'
    html: |2-
                              <p>Ниже представлена эталонная <strong>аннотация к научной статье пример
      гост</strong> по технической специальности:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Пример аннотации</span></div>
                                  <pre><code>В статье рассматривается проблема оптимизации энергопотребления в беспроводных сенсорных сетях промышленного назначения. Предложен адаптивный алгоритм маршрутизации на основе нечеткой логики, учитывающий остаточный заряд узлов и качество канала связи. Проведено имитационное моделирование в среде NS-3, подтвердившее снижение потерь пакетов на 18% и увеличение времени автономной работы сети на 24% по сравнению с протоколом LEACH. Полученные результаты могут быть использованы при проектировании систем интернета вещей (IoT) для мониторинга удаленных инфраструктурных объектов.</code></pre>
                              </div>
  - id: 'keywords-selection'
    title: 'Ключевые слова для статьи вак: алгоритм подбора'
    html: |2-
                              <p>При формировании перечня <strong>ключевые слова для статьи
      вак</strong> опирайтесь на термины из <a
      href="/blog/literature-review-structure-diploma-citation">исследований литературного обзора</a>.
      По ГОСТ Р 7.0.7-2021 ключевых слов или словосочетаний должно быть от 3 до 15; точное число
      обычно задают правила журнала:</p>
                              <ul>
                                  <li>Сочетайте термины предметной области (<em>«беспроводные
      сети»</em>) с узкоспециализированными методами (<em>«нечеткая логика»</em>, <em>«протокол
      LEACH»</em>, <em>«энергоэффективность»</em>). Обобщенные и многозначные слова стандарт
      использовать не советует.</li>
                                  <li>Избегайте слишком длинных словосочетаний и причастных оборотов
      (не более 3 слов в одной фразе).</li>
                                  <li>Ключевые слова пишут после слов «Ключевые слова:», разделяют
      запятыми и ставят в именительном падеже; точку после последнего слова не ставят.</li>
                              </ul>
  - id: 'english-abstract'
    title: 'Особенности перевода на английский язык (Abstract & Keywords)'
    html: |2-
                              <p>В англоязычном Abstract избегайте дословного машинного перевода клише
      типа «В данной статье рассматривается...». Используйте стандартные международные обороты:</p>
                              <ul>
                                  <li><em>«The paper addresses the issue of...»</em></li>
                                  <li><em>«An adaptive algorithm based on... is proposed.»</em></li>
                                  <li><em>«Simulation results demonstrate a 24% increase
      in...»</em></li>
                              </ul>
tips:
  - title: 'Чего нельзя писать в аннотации'
    html: |2-
      <p>Категорически не допускается вставлять в аннотацию ссылки на библиографию [1], сложные
      формулы, аббревиатуры без расшифровки и субъективные оценки («удивительный»,
      «революционный»).</p>
  - title: 'Окружение abstract в LaTeX'
    html: |2-
      <p>В LaTeX аннотация оформляется стандартным окружением: <code>\begin{abstract} ...
      \end{abstract}</code>, которое автоматически форматирует нужные отступы и кегль шрифта.</p>
editorExample:
  latex: |2-
    \section*{Оптимизация энергопотребления сенсорных сетей}
    \textbf{Аннотация.} Предложен алгоритм маршрутизации на основе нечеткой логики. Моделирование в
    NS-3 показало рост времени автономной работы сети на 24\,\%.

    \textbf{Ключевые слова:} сенсорные сети, нечеткая логика, энергоэффективность

    \begin{otherlanguage}{english}
    \textbf{Abstract.} A fuzzy-logic routing algorithm is proposed. NS-3 simulation shows a 24\,\%
    longer network lifetime.

    \textbf{Keywords:} sensor networks, fuzzy logic, energy efficiency
    \end{otherlanguage}
