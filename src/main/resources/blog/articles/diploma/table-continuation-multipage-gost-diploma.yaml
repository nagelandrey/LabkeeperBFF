sections:
  - id: 'standard'
    title: 'Что требует ГОСТ 7.32-2017 к переносу таблиц'
    html: |2-
                              <p>В дипломных проектах по экономике, логистике, IT и машиностроению
      таблицы с результатами тестирования, спецификациями оборудования или сметами часто не помещаются
      на одну страницу формата А4 (подробнее см. руководство по <a
      href="/blog/latex-list-of-figures-tables">списку иллюстраций и таблиц в LaTeX</a>).</p>
                              <p>Согласно <strong>ГОСТ 7.32-2017</strong> (пункт 6.6.3), таблицу с
      большим количеством строк допускается переносить на другую страницу. Наименование таблицы пишут
      один раз слева над первой частью, а над следующими частями также слева пишут «Продолжение
      таблицы» с ее номером. Шапку на продолжении повторяют или заменяют строкой с номерами граф.</p>
  - id: 'gost-continuation'
    title: 'Продолжение таблицы на следующем листе гост: формулировка подписи'
    html: |2-
                              <p>Каноническое <strong>продолжение таблицы на следующем листе
      гост</strong> оформляется следующим образом:</p>
                              <ul>
                                  <li>На первом листе над таблицей слева пишется полное название:
      <em>Таблица 2.3 — Паспортные данные электродвигателей серии АИР</em>.</li>
                                  <li>На втором и последующих листах над таблицей слева, без абзацного
      отступа, пишется: <em>Продолжение таблицы 2.3</em>.</li>
                                  <li>На последнем листе некоторые вузы требуют писать <em>Окончание
      таблицы 2.3</em>; в ГОСТ 7.32 такой надписи нет, он везде использует «Продолжение таблицы».</li>
                              </ul>
  - id: 'header-columns'
    title: 'Перенос шапки таблицы диплом: текстовая шапка или нумерация граф?'
    html: |2-
                              <p>Грамотный <strong>перенос шапки таблицы диплом</strong> допускает два
      варианта:</p>
                              <ol>
                                  <li><strong>Полный повтор текста шапки:</strong> дублируются
      названия столбцов («Наименование», «Количество», «Цена»). Удобно для читателя, но отнимает
      полезную высоту страницы.</li>
                                  <li><strong>Нумерация граф (допускается ГОСТ 7.32 при делении
      таблицы на части):</strong> под основной шапкой на первом листе вводится дополнительная строка с
      номерами столбцов (1, 2, 3, 4). На всех последующих листах печатается <strong>только строка с
      цифрами 1, 2, 3, 4</strong>, что экономит место и выглядит максимально профессионально.</li>
                              </ol>
  - id: 'longtable-code'
    title: 'Готовый рабочий код шаблона таблицы в LaTeX'
    html: |2-
                              <p>Команда <code>\caption</code> внутри longtable по умолчанию дает
      подпись «Таблица 1: …» по центру. Проще всего написать наименование первой строкой шапки через
      <code>\multicolumn{4}{l}</code> — так же, как надпись «Продолжение таблицы»: обе строки встанут
      слева над таблицей. Номер таблицы задает команда <code>\refstepcounter{table}</code>, а метка
      <code>\label</code> позволяет сослаться на таблицу в тексте.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\refstepcounter{table}\label{tab:modules}
      \begin{longtable}{|c|p{7cm}|c|r|}
          % 1. ШАПКА ПЕРВОЙ СТРАНИЦЫ
          \multicolumn{4}{l}{Таблица \thetable{} --- Сравнительные характеристики модулей} \\
          \hline
          \textbf{№} & \textbf{Наименование компонента} & \textbf{Тип} & \textbf{Цена, руб.} \\
          \hline
          \small 1 & \small 2 & \small 3 & \small 4 \\ % Строка нумерации граф
          \hline
          \endfirsthead

          % 2. ШАПКА ВСЕХ СЛЕДУЮЩИХ СТРАНИЦ (ПО ГОСТ)
          \multicolumn{4}{l}{Продолжение таблицы \thetable} \\
          \hline
          \small 1 & \small 2 & \small 3 & \small 4 \\ % Только номера граф
          \hline
          \endhead

          % 3. ПОДВАЛЫ ПУСТЫЕ: каждая строка уже закрыта \hline,
          % иначе на разрыве получится двойная линия
          \endfoot
          \endlastfoot

          % СТРОКИ ДАННЫХ
          1 & Микроконтроллер STM32F401RE & Cortex-M4 & 850 \\ \hline
          2 & Преобразователь интерфейсов FT232RL & USB-UART & 420 \\ \hline
          % ... много строк ...
      \end{longtable}</code></pre>
                              </div>
  - id: 'common-pitfalls'
    title: 'Типичные ошибки при ручной верстке в Word'
    html: |2-
                              <p>В текстовых процессорах студенты часто создают разрыв страницы
      вручную и копируют кусок таблицы как отдельный объект. При малейшей правке текста выше по
      документу таблица съезжает, оставляя надпись «Продолжение таблицы» посередине листа. В LaTeX с
      пакетом <code>longtable</code> перенос пересчитывается при каждой сборке и не ломается от правок
      текста (ознакомьтесь с подробным руководством по <a
      href="/blog/latex-longtable-multipage">многостраничным таблицам longtable в LaTeX</a>).</p>
tips:
  - title: 'Разрыв таблицы вручную'
    html: |2-
      <p>Если нужно принудительно начать новую страницу внутри longtable перед смысловым блоком,
      используйте команду <code>\pagebreak</code> прямо перед нужной строкой.</p>
  - title: 'Шрифт внутри таблицы'
    html: |2-
      <p>Меньший кегль в таблице, чем в основном тексте, допускается: многие методички разрешают,
      например, 12 пт при основном тексте 14 пт. В LaTeX уменьшите шрифт командой <code>\small</code>
      перед таблицей.</p>
editorExample:
  latex: |2-
    \documentclass[12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[russian]{babel}
    \usepackage{longtable}
    \usepackage[a4paper,textheight=55mm]{geometry}
    \begin{document}
    \refstepcounter{table}
    \begin{longtable}{|c|c|}
    \multicolumn{2}{l}{Таблица \thetable{} --- Результаты измерений}\\\hline
    Время, с & Путь, м\\\hline
    1 & 2\\\hline\endfirsthead
    \multicolumn{2}{l}{Продолжение таблицы \thetable}\\\hline
    1 & 2\\\hline\endhead
    0,5 & 1,2\\\hline 1,0 & 4,9\\\hline 1,5 & 11,0\\\hline 2,0 & 19,6\\\hline 2,5 & 30,6\\\hline
    3,0 & 44,1\\\hline 3,5 & 60,0\\\hline 4,0 & 78,4\\\hline 4,5 & 99,2\\\hline 5,0 & 122,5\\\hline
    \end{longtable}
    \end{document}
