sections:
  - id: 'comparison'
    title: 'Что сравнивать в экономическом обосновании'
    html: |2-
      <p>Для расчета экономической эффективности в дипломе сравните базовый вариант
      с предлагаемым решением: сколько стоит работа до внедрения, сколько будет стоить
      после него и какие вложения потребуются. В примере ниже проект дает 90 000 руб.
      годовой экономии и возвращает первоначальные вложения за два года.</p>
      <p>Рассмотрим внедрение системы обработки заявок. Все числа условные:
      это учебная модель для экономического раздела ВКР. Состав затрат, период расчета
      и необходимые показатели определяются заданием кафедры и данными организации.</p>
      <ul>
          <li><strong>Базовый вариант:</strong> действующий процесс без внедрения системы.</li>
          <li><strong>Проектный вариант:</strong> тот же объем заявок после внедрения.</li>
          <li><strong>Разовые вложения:</strong> разработка, настройка и ввод системы в работу.</li>
          <li><strong>Дополнительные ежегодные расходы:</strong> сопровождение и эксплуатация.</li>
      </ul>
      <p>Если исходная калькуляция еще не подготовлена, начните с
      <a href="/blog/product-cost-calculation-example">примера расчета себестоимости</a>.
      Здесь задача другая: оценить изменение затрат и соотнести его с вложениями.</p>
  - id: 'inputs'
    title: 'Исходные данные учебного примера'
    html: |2-
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Показатель</th><th>Обозначение</th><th>Значение</th></tr></thead>
              <tbody>
                  <tr><td>Заявки за год</td><td>$Q$</td><td>10 000 шт.</td></tr>
                  <tr><td>Затраты на заявку до внедрения</td><td>$c_0$</td><td>150 руб.</td></tr>
                  <tr><td>Затраты на заявку после внедрения</td><td>$c_1$</td><td>138 руб.</td></tr>
                  <tr><td>Дополнительные ежегодные расходы</td><td>$C_{\text{доп}}$</td><td>30 000 руб.</td></tr>
                  <tr><td>Первоначальные вложения</td><td>$I$</td><td>180 000 руб.</td></tr>
                  <tr><td>Горизонт расчета</td><td>$n$</td><td>3 года</td></tr>
                  <tr><td>Ставка дисконтирования</td><td>$r$</td><td>10% в год</td></tr>
              </tbody>
          </table>
      </div>
      <p>Затраты на заявку не включают отдельно показанные расходы на сопровождение.
      Объем работы и качество результата в обоих вариантах одинаковы. Снижение затрат
      принято как реальное сокращение денежных выплат; высвобождение времени сотрудников
      без сокращения выплат само по себе такого денежного потока не создает.</p>
      <div class="article-note"><strong>💡 Совет:</strong> В модели не учитываются налоги,
      инфляция, амортизационные эффекты, изменение оборотного капитала и остаточная стоимость.
      Ставка 10% выбрана для примера и не является нормативом. Если эти факторы нужны
      по заданию, включите их в расчет денежных потоков.</div>
  - id: 'savings-payback'
    title: 'Годовая экономия и срок окупаемости'
    html: |2-
      <p><strong>1. Снижение затрат на обработку заявок.</strong> Разницу затрат на одну
      заявку умножаем на годовой объем:</p>
      <p>$$\Delta C = (c_0-c_1)Q = (150-138)\cdot10\,000 = 120\,000\text{ руб./год}.$$</p>
      <p><strong>2. Чистая годовая экономия.</strong> Вычитаем расходы на сопровождение:</p>
      <p>$$E = \Delta C-C_{\text{доп}} = 120\,000-30\,000 = 90\,000\text{ руб./год}.$$</p>
      <p><strong>3. Простой срок окупаемости.</strong> При постоянной положительной экономии:</p>
      <p>$$T = \frac{I}{E} = \frac{180\,000}{90\,000} = 2\text{ года}.$$</p>
      <p>Если поступления различаются по годам, вместо деления на одно значение
      последовательно суммируют денежные потоки до возмещения вложений.
      Простой срок окупаемости не учитывает стоимость денег во времени и поступления
      после окупаемости; ограничения метода разобраны в
      <a href="https://openstax.org/books/principles-finance/pages/16-1-payback-period-method">учебнике OpenStax Principles of Finance</a>.</p>
  - id: 'npv'
    title: 'NPV: как учесть время получения экономии'
    html: |2-
      <p>Для трехлетнего горизонта рассчитаем чистый дисконтированный доход
      (<strong>NPV</strong>). Вложения происходят в начальный момент, а экономия поступает
      в конце каждого года. Каждый поток $CF_t$ приводится к начальному моменту:</p>
      <p>$$NPV = -I + \sum_{t=1}^{n}\frac{CF_t}{(1+r)^t}.$$</p>
      <p>В нашем примере $CF_1=CF_2=CF_3=90\,000$ руб.:</p>
      <p>$$NPV = -180\,000 + \frac{90\,000}{1{,}1}
      + \frac{90\,000}{1{,}1^2} + \frac{90\,000}{1{,}1^3}
      \approx 43\,816{,}68\text{ руб.}$$</p>
      <p>Положительный NPV означает, что при принятых денежных потоках, горизонте
      и ставке проект возмещает вложения с учетом дисконтирования. Это результат
      модели, который нужно сопоставить с рисками и альтернативными решениями.
      Метод приведенной стоимости описан в
      <a href="https://openstax.org/books/principles-finance/pages/16-2-net-present-value-npv-method">разделе OpenStax о NPV</a>.</p>
  - id: 'editor'
    title: 'Готовый расчет в вычислительном сегменте'
    html: |2-
      <p>Вставьте код в вычислительный сегмент Labkeeper. Затраты и вложения вводятся
      в рублях, ставка — десятичной дробью. Три слагаемых NPV соответствуют трем годам:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Вычислительный сегмент</span></div>
          <pre><code>Q = 10000
      before = 150
      after = 138
      extra = 30000
      investment = 180000
      rate = 0.10
      ratePercent = rate * 100
      savings = (before - after) * Q
      annual = savings - extra
      payback = investment / annual
      pv1 = annual / (1 + rate)
      pv2 = annual / (1 + rate)^2
      pv3 = annual / (1 + rate)^3
      npv = pv1 + pv2 + pv3 - investment</code></pre>
      </div>
      <p>Кнопка «Просмотреть пример» открывает эти вычисления и LaTeX-документ
      с подстановками. Вычислительный сегмент скрыт из вывода, поэтому в PDF остаются
      исходные данные, формулы и результаты. В новом проекте по умолчанию выводятся
      три значащие цифры: NPV будет показан примерно как 43 800 руб.
      Для проверки точного значения выберите в настройках проекта режим «Без округления».
      В итоговом отчете округлите денежные суммы до копеек: здесь NPV равен 43 816,68 руб.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX-сегмент</span></div>
          <pre><code>\section*{Экономическая эффективность}
      $Q=${Q}$ заявок/год; $c_0=${before}$ и $c_1=${after}$ руб./заявку.
      Сопровождение $C=${extra}$ руб./год; вложения $I=${investment}$ руб.
      \[E=(c_0-c_1)Q-C=${annual}\text{ руб./год}\]
      \[T=\frac{I}{E}=${payback}\text{ года}\]
      За три года при ставке $r=${ratePercent}\%$:
      \[NPV=-I+\sum_{t=1}^{3}\frac{E}{(1+r)^t}=${npv}\text{ руб.}\]</code></pre>
      </div>
      <p>При другом горизонте измените число дисконтированных потоков. Если экономия
      по годам различается, вместо одной переменной <code>annual</code> задайте
      отдельные потоки. Синтаксис подстановок описан в
      <a href="/wiki/concepts/segments.html">вики о сегментах</a>.</p>
      <p>Если <code>annual</code> равна нулю или отрицательна, вложения за счет этой
      экономии не окупаются: формулу деления для <code>payback</code> в таком сценарии
      не используйте. Например, при 2 500 заявках экономия в нашей модели равна нулю.</p>
  - id: 'report'
    title: 'Как оформить результат и проверить вывод'
    html: |2-
      <p>В экономическом разделе приведите источник данных, таблицу сравнения вариантов,
      формулы с единицами измерения и вывод. Например:</p>
      <div class="article-quote">
          <p>«При годовом объеме 10 000 заявок снижение затрат составляет 120 000 руб.
          Дополнительные расходы на сопровождение равны 30 000 руб. в год, чистая годовая
          экономия — 90 000 руб. При вложениях 180 000 руб. простой срок окупаемости
          составляет два года. За три года при ставке дисконтирования 10% NPV равен
          43 816,68 руб. В принятых условиях модель показывает положительный экономический результат».</p>
      </div>
      <ul>
          <li>Сравнивается одинаковый объем работы с одинаковым качеством результата.</li>
          <li>Разовые вложения не включены повторно в ежегодные расходы.</li>
          <li>В NPV используются денежные потоки, а не выручка или бухгалтерская прибыль без корректировок.</li>
          <li>Ставка и периоды согласованы: годовым потокам соответствует годовая ставка.</li>
          <li>Деление $I/E$ применяется только при положительной постоянной экономии.</li>
      </ul>
      <p>Общие настройки документа рассмотрены в
      <a href="/blog/latex-diploma-gost">руководстве по оформлению диплома в LaTeX</a>.</p>
tips:
  - title: 'Проверьте чувствительность результата'
    html: |2-
      <p>Уменьшите объем заявок или увеличьте расходы на сопровождение и сравните показатели.
      Укажите в дипломе, какие исходные данные сильнее всего влияют на вывод.</p>
