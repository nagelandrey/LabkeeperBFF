sections:
  - id: 'purpose'
    title: 'Что обязательно выносится в приложения'
    html: |2-
                              <p>В основной части выпускной квалификационной работы (ВКР) должны
      содержаться только концептуальные схемы, ключевые формулы и выводы. В раздел
      <strong>Приложения</strong> помещается вспомогательный материал:</p>
                              <ul>
                                  <li>Полные листинги исходного кода программных комплексов.</li>
                                  <li>Акты внедрения результатов исследования на предприятиях.</li>
                                  <li>Объемные таблицы промежуточных статистических расчетов.</li>
                                  <li>Электрические принципиальные схемы, сборочные чертежи и <a
      href="/blog/software-screenshots-report-gost-caption">скриншоты программ по ГОСТ</a>.</li>
                                  <li>Тексты опросников, анкет и протоколов испытаний.</li>
                              </ul>
  - id: 'lettering-rules'
    title: 'Как нумеровать приложения в курсовой: запрещенные буквы алфавита'
    html: |2-
                              <p>Главная тонкость нормоконтроля в том, <strong>как нумеровать
      приложения в курсовой</strong> согласно ГОСТ 7.32-2017:</p>
                              <blockquote>
                                  «Приложения обозначают прописными буквами кириллического алфавита,
      начиная с А, за исключением букв <strong>Ё, З, Й, О, Ч, Ъ, Ы, Ь</strong>. После слова
      „ПРИЛОЖЕНИЕ“ следует буква, обозначающая его последовательность. Допускается обозначение
      приложений буквами латинского алфавита, за исключением букв I и O» (ГОСТ 7.32-2017, п. 6.17.4).
                              </blockquote>
                              <p>Указанные буквы исключены, так как они зрительно похожи на цифры 3,
      0, 4 или не употребляются в начале слов. Если в работе одно приложение, оно все равно
      обозначается «ПРИЛОЖЕНИЕ А».</p>
  - id: 'gost-headings'
    title: 'Оформление приложений в дипломе гост: форма заголовка'
    html: |2-
                              <p>Стандартное <strong>оформление приложений в дипломе гост</strong>
      требует начинать каждое приложение с новой страницы:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Формат шапки приложения</span></div>
                                  <pre><code>ПРИЛОЖЕНИЕ А
      (обязательное / рекомендуемое / справочное)

      Исходный код микросервиса аутентификации</code></pre>
                              </div>
                              <p>В круглых скобках под словом ПРИЛОЖЕНИЕ указывается его статус
      (обычно <em>(обязательное)</em> или <em>(справочное)</em>), а ниже по центру печатается
      содержательный заголовок.</p>
  - id: 'latex-appendix'
    title: 'Настройка окружения appendix в LaTeX с русской нумерацией'
    html: |2-
                              <p>В LaTeX команда <code>\appendix</code> сбрасывает счетчик разделов.
      Номером приложения должна стать только буква, а слово «ПРИЛОЖЕНИЕ» добавляет оформление
      заголовка: если вписать слово в сам номер
      (<code>\renewcommand{\thesection}{Приложение~\Asbuk{section}}</code>), ссылка превратится в «в
      приложении Приложение А», а содержание собьется. Рабочий вариант для класса <code>article</code>
      с пакетом <code>titlesec</code> в преамбуле:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>% В преамбуле: \usepackage{titlesec}

      \appendix
      \renewcommand{\thesection}{\Asbuk{section}}   % А, Б, В...
      \counterwithin{figure}{section}               % Рисунок А.1, Б.1
      \counterwithin{table}{section}                % Таблица А.1
      \counterwithin{equation}{section}             % (А.1)
      % «ПРИЛОЖЕНИЕ А» по центру, заголовок приложения строкой ниже
      \titleformat{\section}[display]
          {\normalfont\bfseries\filcenter}
          {ПРИЛОЖЕНИЕ~\thesection}
          {0pt}
          {}

      \clearpage % каждое приложение — с новой страницы
      \section{Исходный код клиентского приложения}\label{app:code}
      ... листинг программы ...

      \clearpage
      \section{Акт внедрения результатов исследований}
      ... скан документа ...</code></pre>
                              </div>
                              <p>Теперь <code>\ref{app:code}</code> дает букву «А», и ссылка читается
      как «в приложении А», а нумерация рисунков начинается заново в каждом приложении. Команда
      <code>\Asbuk</code> из babel пропускает буквы Ё, Й, Ъ, Ы, Ь, но не З, О и Ч, поэтому с ГОСТ она
      совпадает только для первых семи приложений (А–Ж): восьмое получит «З» вместо «И». При большем
      числе приложений задайте буквы вручную. В стандартной преамбуле Labkeeper разделы не нумеруются,
      и буквы не будет вовсе — для приложений нужна своя преамбула, как в примере в редакторе.</p>
  - id: 'listings-in-appendix'
    title: 'Размещение длинных программных листингов и таблиц'
    html: |2-
                              <p>Внутри приложений код оформляется через пакет <code>listings</code>
      (правила верстки см. в статье об <a
      href="/blog/programming-lab-report-code-listings-gost">оформлении листингов в отчете</a>) с
      уменьшенным кеглем шрифта (<code>basicstyle=\ttfamily\scriptsize</code>) и плотными
      междустрочными интервалами, чтобы рационально использовать площадь страниц.</p>
tips:
  - title: 'Сквозная нумерация страниц'
    html: |2-
      <p>Страницы приложений входят в общую сквозную нумерацию работы и продолжают нумерацию основного
      текста ВКР.</p>
  - title: 'Ссылки в основном тексте'
    html: |2-
      <p>Каждое приложение обязательно должно упоминаться в основном тексте диплома: <em>«Полный текст
      разработанного модуля приведен в приложении~А»</em>.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[russian]{babel}
    \usepackage{titlesec}
    \begin{document}
    \section{Реализация}
    Исходный код приведен в приложении~\ref{app:code}.
    \appendix
    \renewcommand{\thesection}{\Asbuk{section}}
    \titleformat{\section}[display]{\normalfont\bfseries\filcenter}{ПРИЛОЖЕНИЕ~\thesection}{0pt}{}
    \clearpage
    \section{Листинг программы}\label{app:code}
    \begin{verbatim}
    def square(x):
        return x * x
    \end{verbatim}
    \end{document}
