  - id: 'normocontrol'
    title: 'Требования нормоконтроля к подписям, датам и нумерации страниц'
    html: |2-
                              <p>Чек-лист перед сдачей документов на кафедру:</p>
                              <ul>
                                  <li><strong>Хронология дат:</strong> дата выдачи задания должна
      предшествовать началу первого этапа (обычно сентябрь или февраль), а дата сдачи — совпадать с
      датой отзыва руководителя;</li>
                                  <li><strong>Живые подписи синими чернилами:</strong> подпись
      студента, научного руководителя и заведующего кафедрой;</li>
                                  <li><strong>Отсутствие точек в конце заголовков:</strong> как и на
      титульном листе, в конце названий граф бланка точки не ставятся;</li>
                                  <li><strong>Единый шрифт:</strong> бланк печатается тем же шрифтом,
      что и весь диплом (Times New Roman 14 pt или 12 pt для таблиц).</li>
                              </ul>
  - id: 'digital-export'
    title: 'Верстка бланков в LaTeX и Markdown без съезжающих линий'
    html: |2-
                              <p>В текстовом процессоре Word линии для подписей (<code>______</code>)
      часто ломаются и съезжают на следующую страницу при смене принтера. В LaTeX и Labkeeper линии
      для рукописных подписей верстаются идеально с помощью команды
      <code>\rule{4cm}{0.4pt}</code>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX Сниппет подписи</span></div>
                                  <pre><code>\vspace{1cm}
      \noindent
      Руководитель ВКР: \rule{4cm}{0.4pt} / И.~И.~Иванов / \hfill «\rule{1cm}{0.4pt}» \rule{2.5cm}{0.4pt} 2026 г.

      \vspace{0.5cm}
      \noindent
      Студент-дипломник: \rule{4cm}{0.4pt} / П.~П.~Петров / \hfill «\rule{1cm}{0.4pt}» \rule{2.5cm}{0.4pt} 2026 г.</code></pre>
                              </div>
tips:
  - title: 'Храните подписанный скан'
    html: |2-
      <p>Сразу после того как научный руководитель и зав. кафедрой подпишут бланк задания, сделайте
      качественный скан в PDF 300 DPI — он понадобится для загрузки в электронную среду вуза
      (ЭИОС).</p>
  - title: 'Бланк в Labkeeper'
    html: |2-
      <p>Готового бланка вашего вуза в Labkeeper нет: форму задания и календарного плана выдает
      кафедра. Перенесите ее в LaTeX по образцу из примера — таблицу этапов и строки подписей — или
      вставьте скан подписанного бланка картинкой PNG, JPG или файлом PDF.</p>
