sections:
  - id: 'importance'
    title: 'Место задания и календарного графика в структуре диплома'
    html: |2-
                              <p>Выпускная квалификационная работа (ВКР) начинается вовсе не с
      введения, а с официального пакета документов. Сразу за титульным листом подшивается
      <strong>бланк задания на дипломную работу шаблон</strong> которого утверждается приказом ректора
      или выпускающей кафедры, а также календарный график выполнения этапов исследования.</p>
                              <p>Эти листы входят в общее количество страниц пояснительной записки
      (учитываются при подсчете объема), однако номер страницы на них не печатается. Несоответствие
      формулировок темы в задании и на титульном листе — частая причина замечаний на
      нормоконтроле.</p>
                              <p>Отдельного ГОСТа на задание и календарный план нет: форму бланка
      утверждает вуз, а ГОСТ 7.32 эти документы не регулирует. Поэтому ориентируйтесь на образец
      кафедры, а разделы ниже — типичный состав такого бланка. Наряду с заданием кафедра запрашивает
      <a href="/blog/supervisor-review-external-evaluation-diploma-templates">отзыв руководителя, а
      для специалитета и магистратуры — и рецензию на диплом</a>.</p>
  - id: 'assignment-template'
    title: 'Бланк задания на дипломную работу: шаблон и обязательные реквизиты'
    html: |2-
                              <p>Типовой бланк задания включает следующие строго регламентированные
      разделы:</p>
                              <ul>
                                  <li><strong>Шапка:</strong> полное официальное наименование
      министерства, вуза, института/факультета и кафедры;</li>
                                  <li><strong>ФИО студента и направление подготовки:</strong> с
      указанием кода специальности (например, 09.03.01 «Информатика и вычислительная техника»);</li>
                                  <li><strong>Тема работы и номер приказа об утверждении:</strong>
      формулировка должна буква в букву совпадать с приказом по университету;</li>
                                  <li><strong>Срок сдачи студентом законченной работы:</strong>
      календарная дата передачи на кафедру;</li>
                                  <li><strong>Исходные данные к работе:</strong> перечень
      нормативно-правовых актов, прототипов систем, технической документации или статистических
      баз;</li>
                                  <li><strong>Перечень подлежащих разработке вопросов:</strong> пункты
      теоретической, проектной и экономической частей;</li>
                                  <li><strong>Перечень графического материала:</strong> чертежи,
      презентации, схемы алгоритмов или плакаты А1.</li>
                              </ul>
                              <p>Краткую выжимку по этим пунктам также выносят в вводную часть —
      ознакомьтесь с правилами <a href="/blog/diploma-annotation-abstract-russian-english">написания
      аннотации к диплому на русском и английском</a>.</p>
  - id: 'calendar-schedule'
    title: 'Календарный план ВКР по ГОСТ: этапы, сроки и проценты готовности'
    html: |2-
                              <p>Грамотно составленный <strong>календарный план вкр гост</strong>
      оформляется в виде сводной таблицы, разбивающей весь семестр дипломного проектирования на 5–7
      последовательных стадий:</p>
                              <div class="article-table-wrapper">
                                  <table class="article-table">
                                      <thead>
                                          <tr>
                                              <th>№ п/п</th>
                                              <th>Наименование этапов ВКР</th>
                                              <th>Срок выполнения</th>
                                              <th>Отметка о выполнении (%)</th>
                                              <th>Подпись руководителя</th>
                                          </tr>
                                      </thead>
                                      <tbody>
                                          <tr>
                                              <td>1</td>
                                              <td>Утверждение темы, подбор и анализ литературы</td>
                                              <td>Февраль</td>
                                              <td>15%</td>
                                              <td>Подпись</td>
                                          </tr>
                                          <tr>
                                              <td>2</td>
                                              <td>Аналитическая глава: постановка задачи и выбор
      методов</td>
                                              <td>Март</td>
                                              <td>35%</td>
                                              <td>Подпись</td>
                                          </tr>
                                          <tr>
                                              <td>3</td>
                                              <td>Проектная/практическая часть: реализация и
      тестирование</td>
                                              <td>Апрель</td>
                                              <td>70%</td>
                                              <td>Подпись</td>
                                          </tr>
                                          <tr>
                                              <td>4</td>
                                              <td>Экономическое обоснование и безопасность
      жизнедеятельности</td>
                                              <td>Май</td>
                                              <td>85%</td>
                                              <td>Подпись</td>
                                          </tr>
                                          <tr>
                                              <td>5</td>
                                              <td>Оформление пояснительной записки, нормоконтроль,
      отзыв</td>
                                              <td>Июнь</td>
                                              <td>100%</td>
                                              <td>Подпись</td>
                                          </tr>
