sections:
  - id: 'humanitarian-specifics'
    title: 'Почему в праве и истории требуют именно постраничные сноски'
    html: |2-
                              <p>В точных и инженерных науках доминируют квадратные скобки со ссылкой
      на общий список литературы в конце отчета (<code>[14, с. 52]</code>). Однако в юриспруденции,
      истории, политологии и филологии стандартом являются <strong>подстрочные постраничные
      сноски</strong> (внизу каждого листа под чертой).</p>
                              <p>Это связано с тем, что историк или юрист часто комментирует архивный
      документ, приводит выдержку из судебного решения или цитирует нормативный акт прямо по ходу
      чтения текста (см. также правила составления <a
      href="/blog/legal-regulatory-acts-bibliography-diploma-gost">списка нормативно-правовых актов в
      дипломе</a>), не заставляя читателя листать 80 страниц до конца диплома.</p>
  - id: 'how-it-works'
    title: 'Постраничные сноски в курсовой гост: базовые правила'
    html: |2-
                              <p>Грамотные <strong>постраничные сноски в курсовой гост</strong>
      оформляются по ГОСТ Р 7.0.5-2008 (если вы готовите черновики в разметке Markdown, обратите
      внимание на синтаксис <a href="/blog/markdown-footnotes">сносок в тексте Markdown</a>):</p>
                              <ul>
                                  <li><strong>Знак сноски:</strong> арабская цифра верхним индексом
      без скобки ($^1$, $^2$, $^3$);</li>
                                  <li><strong>Место знака:</strong> ставится непосредственно за словом
      или цитатой <strong>до знака препинания</strong> (например: <em>«по мнению ученых¹.»</em>);
      исключение составляет вопросительный и восклицательный знаки;</li>
                                  <li><strong>Шрифт сноски:</strong> меньше основного текста, обычно
      10–12 пт при основном тексте 14 пт — точный кегль задает методичка;</li>
                                  <li><strong>Интервал:</strong> одинарный межстрочный внутри сноски
      при полуторном в основном документе.</li>
                              </ul>
  - id: 'tam-zhe-rule'
    title: 'Оформление сносок внизу страницы диплом: оборот «Там же» (Ibidem)'
    html: |2-
                              <p>Классическое <strong>оформление сносок внизу страницы диплом</strong>
      при повторном цитировании того же источника подряд на одной странице:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Пример повторной сноски</span></div>
                                  <pre><code>¹ Смирнов А. В. Уголовный процесс : учебник. — М. : Кнорус, 2024. — С. 142.
      ² Там же. — С. 145.
      ³ Там же.</code></pre>
                              </div>
                              <p>Оборот «Там же» заменяет повтор длинного описания автора и названия
      книги. Для иностранных изданий используется латинский аналог <em>Ibid.</em> (Ibidem).</p>
  - id: 'latex-footnote-setup'
    title: 'Команда footnote и сброс нумерации на каждой странице в LaTeX'
    html: |2-
                              <p>В LaTeX вставка подстрочной сноски выполняется командой
      <code>\footnote{...}</code>. По умолчанию LaTeX ведет сквозную нумерацию сносок по всему
      документу (от 1 до 200). ГОСТ Р 7.0.5-2008 допускает и сквозную нумерацию, и нумерацию в
      пределах главы или страницы; постраничная — традиция многих гуманитарных кафедр, поэтому
      сверьтесь с методичкой. Для постраничной нумерации (на каждой новой странице счетчик начинается
      с 1) подключите пакет <strong>footmisc</strong>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage[perpage,bottom]{footmisc}

      % perpage — сбрасывать счетчик сносок на 1 на каждой новой странице
      % bottom  — всегда прижимать сноски к нижнему краю листа</code></pre>
                              </div>
                              <p>Пакет подключается в преамбуле. В Labkeeper любая команда
      <code>\usepackage</code> отключает стандартную преамбулу, поэтому начните проект с полной
      преамбулы: класс документа, кириллица, поля и <code>footmisc</code>, как в примере в
      редакторе.</p>
  - id: 'separator-line'
    title: 'Требования к разделительной горизонтальной черте'
    html: |2-
                              <p>ГОСТ 7.32-2017 требует отделять сноску от текста короткой сплошной
      тонкой горизонтальной линией с левой стороны страницы, но точной длины не задает; методички
      обычно называют 30–50 мм. В LaTeX эта черта генерируется автоматически макросом
      <code>\footnoterule</code>.</p>
tips:
  - title: 'Сноски внутри таблиц'
    html: |2-
      <p>Внутри окружения <code>tabular</code> стандартная команда <code>\footnote</code> не
      отображается. Используйте окружение <code>threeparttable</code> или связку
      <code>\footnotemark</code> в ячейке и <code>\footnotetext{...}</code> сразу под таблицей.</p>
  - title: 'Неразрывный пробел перед сноской'
    html: |2-
      <p>Никогда не ставьте пробел перед знаком сноски: <code>слово\footnote{...}</code>, иначе номер
      сноски может оторваться и перелететь в начало следующей строки.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[russian]{babel}
    \usepackage[perpage]{footmisc}
    \begin{document}
    Порядок расследования описан в учебнике\footnote{Смирнов А.~В. Уголовный процесс : учебник. ---
    М. : Кнорус, 2024. --- С.~142.}. Сроки установлены там же\footnote{Там же. --- С.~145.}.
    \newpage
    На новой странице нумерация сносок начинается заново\footnote{Иванов И.~И. История государства и
    права. --- М., 2023. --- С.~15.}.
    \end{document}
