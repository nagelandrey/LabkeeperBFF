sections:
  - id: 'eskd-standard'
    title: 'Стандарты ЕСКД: геометрия листа А4 и поля рамки'
    html: |2-
                              <p>Если методичка требует оформлять пояснительную записку ВКР по
      правилам Единой системы конструкторской документации (ЕСКД) — так часто бывает в инженерных,
      строительных, энергетических и машиностроительных вузах, — лист получает рамку и основную
      надпись. Без такого требования записку оформляют по ГОСТ 7.32 без рамок (обзор стандартов — в
      статье о <a href="/blog/latex-eskd">рамках и штампах ЕСКД в LaTeX</a>):</p>
                              <ul>
                                  <li><strong>Поля чертежной рамки:</strong> левое поле — 20 мм (для
      подшивки в переплет), верхнее, правое и нижнее — по 5 мм. Рамка показана на формах основной
      надписи ГОСТ 2.104, а размеры листов задает ГОСТ 2.301.</li>
                                  <li><strong>Первый лист записки</strong> (обычно содержание):
      «большой штамп» 185 × 40 мм (Форма 2) с подписями разработчика, проверяющего и
      нормоконтролера.</li>
                                  <li><strong>Все последующие листы:</strong> «малый штамп» 185 × 15
      мм (Форма 2а) с обозначением документа и номером листа.</li>
                              </ul>
                              <p>Основные надписи много лет задавал ГОСТ 2.104-2006, и методички часто
      ссылаются на него. С 1 марта 2024 года в России вместо него действует ГОСТ Р 2.104-2023: формы 2
      и 2а в нем сохранились, добавилась форма 2б для двусторонней печати. Размеры граф сверяйте с
      образцом кафедры.</p>
  - id: 'tikz-frame'
    title: 'Рамка а4 для диплома гост онлайн: рамка и штампы на TikZ'
    html: |2-
                              <p>Каноническая <strong>рамка а4 для диплома гост онлайн</strong>
      рисуется пакетом TikZ в обычном классе: хук <code>shipout/background</code> накладывает рисунок
      на каждый лист, а проверка <code>\ifnum\value{page}=1</code> выбирает форму штампа. Координаты
      задаются в миллиметрах от левого нижнего угла листа. Код ниже — каркас: рамка, основные линии
      штампов и графы обозначения, наименования и номера листа.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[russian]{babel}
      \usepackage[left=25mm,right=10mm,top=15mm,bottom=25mm]{geometry}
      \usepackage{tikz}
      \pagestyle{empty} % номер листа печатается в штампе

      \newcommand{\docnum}{ВКР 13.03.02.015 ПЗ}
      \newcommand{\doctitle}{Электроснабжение цеха}

      \AddToHook{shipout/background}{%
        \begin{tikzpicture}[remember picture,overlay,x=1mm,y=1mm]
        \begin{scope}[shift={(current page.south west)},line width=0.5mm]
          \draw (20,5) rectangle (205,292); % рамка 20-5-5-5 мм
          \ifnum\value{page}=1
            % Форма 2: 185 x 40 мм
            \draw (20,45) -- (205,45) (85,5) -- (85,45)
                  (85,30) -- (205,30) (155,5) -- (155,30);
            \node[font=\large] at (145,37.5) {\docnum};
            \node[align=center] at (120,17.5) {\doctitle};
            \node[font=\small] at (180,22.5) {Лист \thepage};
          \else
            % Форма 2а: 185 x 15 мм
            \draw (20,20) -- (205,20) (85,5) -- (85,20) (195,5) -- (195,20);
            \node at (140,12.5) {\docnum};
            \node[font=\small] at (200,12.5) {\thepage};
          \fi
        \end{scope}
        \end{tikzpicture}}

      \begin{document}
      \enlargethispage{-25mm} % на первом листе штамп выше: 40 мм вместо 15
      \section{Введение}
      Текст пояснительной записки...
      \end{document}</code></pre>
                              </div>
                              <p>Полную сетку граф формы 2 (Изм., Лист, № докум., Подп., Дата,
      Разраб., Пров., Н. контр., Утв., Лит., Листов) с размерами по ГОСТ смотрите в шаблоне статьи о
      <a href="/blog/latex-eskd">рамках и штампах ЕСКД в LaTeX</a>.</p>
                              <p><strong>Пример в редакторе</strong> открывает сокращенный вариант
      этого кода: первый лист с формой 2 и второй с формой 2а. Это учебный пример геометрии листа, а
      не готовый нормативный бланк.</p>
  - id: 'stamp-forms'
    title: 'Основная надпись вкр техническая: различия Формы 2 и Формы 2а'
    html: |2-
                              <p>Правильная <strong>основная надпись вкр техническая</strong>
      различается по листам:</p>
                              <ul>
                                  <li><strong>Форма 2</strong> (185 × 40 мм) стоит на первом листе
      записки. В ней есть графы подписей, наименование документа, литера, номер листа и общее число
      листов. Штамп высокий, поэтому на первом листе текст поднимают командой
      <code>\enlargethispage{-25mm}</code>.</li>
                                  <li><strong>Форма 2а</strong> (185 × 15 мм) стоит на всех следующих
      листах: обозначение документа и номер листа.</li>
                                  <li>Номер листа (графа 7) подставляет <code>\thepage</code>, поэтому
      обычный номер в подвале отключают командой <code>\pagestyle{empty}</code>. Общее число листов
      (графа 8) указывают вручную или выводят через <code>\pageref{LastPage}</code> пакета
      <code>lastpage</code>.</li>
                              </ul>
  - id: 'fields-filling'
    title: 'Заполнение граф штампа (ФИО, шифр, литера)'
    html: |2-
                              <p>Данные штампа удобно держать в командах в начале преамбулы и
      подставлять в узлы TikZ: при смене темы или шифра правится одна строка. Штамп содержит литеру
      документа (графа 4): для дипломных работ обычно указывают «У» (учебный документ). Массивные
      расчеты и спецификации выносят в <a
      href="/blog/diploma-appendices-listings-diagrams-gost">приложения диплома со схемами и
      чертежами</a>.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\newcommand{\docnum}{ВКР 13.03.02.015 ПЗ} % обозначение документа
      \newcommand{\docauthor}{Иванов}           % графа «Разраб.»
      \newcommand{\docchecker}{Петров}          % графа «Пров.»
      \newcommand{\docletter}{У}                % литера

      % внутри ветки формы 2:
      \node[font=\small] at (157.5,22.5) {\docletter};</code></pre>
                              </div>
  - id: 'eskdx-legacy'
    title: 'Класс eskdx: почему он не подходит для онлайн-сборки'
    html: |2-
                              <p>Раньше рамки и штампы ЕСКД автоматизировал класс
      <code>eskdtext</code> из комплекта <strong>eskdx</strong>: он сам заполнял графы и менял форму 2
      на форму 2а. Комплект давно не обновлялся, и в TeX Live 2025 без правок не собирается, поэтому в
      Labkeeper используйте TikZ из раздела выше. Подробности — в статье о <a
      href="/blog/latex-eskd">рамках и штампах ЕСКД в LaTeX</a>.</p>
tips:
  - title: 'Листы без рамки (Приложения)'
    html: |2-
      <p>Хук <code>shipout/background</code> рисует рамку на каждом листе. Если на части листов она не
      нужна, заведите флаг <code>\newif\ifeskdframe \eskdframetrue</code>, оберните содержимое хука в
      <code>\ifeskdframe ... \fi</code> и перед нужным листом поставьте
      <code>\clearpage\eskdframefalse</code>.</p>
  - title: 'Толщина основных и тонких линий'
    html: |2-
      <p>Линии рамки и штампа выполняют по ГОСТ 2.303: основная сплошная линия толще тонкой в 2–3
      раза. В TikZ задайте толщину явно, например <code>line width=0.5mm</code> для основных линий и
      <code>0.25mm</code> для тонких.</p>
