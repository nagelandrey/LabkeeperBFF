sections:
  - id: 'requirements'
    title: 'Отличия титульного листа магистратуры от бакалавриата'
    html: |2-
                              <p>В отличие от бакалаврской выпускной квалификационной работы,
      магистерскую ВКР во многих вузах называют <strong>«Магистерская диссертация»</strong>; точное
      название вида работы берите из методички. К ней предъявляются повышенные академические
      требования (подобно строгим правилам при <a href="/blog/latex-dissertation">подготовке
      кандидатской диссертации в LaTeX</a>):</p>
                              <ul>
                                  <li>Обязательное указание кода и наименования направления подготовки
      (например, <em>09.04.01 «Информатика и вычислительная техника»</em>);</li>
                                  <li>Указание наименования магистерской программы (профиля):
      например, <em>«Интеллектуальные системы обработки информации»</em>;</li>
                                  <li>Наличие официального грифа «К защите допустить» с подписью
      заведующего выпускающей кафедрой;</li>
                                  <li>Указание ученой степени и звания научного руководителя (д-р
      техн. наук, профессор).</li>
                              </ul>
  - id: 'structure'
    title: 'Титульный лист магистерской вкр гост: обязательные блоки'
    html: |2-
                              <p>Канонический <strong>титульный лист магистерской вкр гост</strong>
      компонуется по пяти смысловым ярусам (в отличие от более простых <a
      href="/blog/essay-report-titlepage-format">титульных листов студенческих рефератов и
      отчетов</a>):</p>
                              <ol>
                                  <li><strong>Шапка:</strong> Минобрнауки РФ, полное наименование
      вуза, институт/факультет, кафедра.</li>
                                  <li><strong>Гриф допуска:</strong> в правом верхнем углу блок «К
      защите допустить / Зав. кафедрой / подпись, дата».</li>
                                  <li><strong>Центральный блок:</strong> крупным шрифтом МАГИСТЕРСКАЯ
      ДИССЕРТАЦИЯ, тема работы в кавычках, направление подготовки и магистерская программа.</li>
                                  <li><strong>Сведения об авторе и руководителях:</strong> ФИО
      магистранта, данные руководителя и внешнего рецензента.</li>
                                  <li><strong>Город и год:</strong> строго по центру внизу листа.</li>
                              </ol>
  - id: 'latex-template'
    title: 'Шаблон титульника диссертации онлайн: готовый код LaTeX'
    html: |2-
                              <p>Ниже приведен код, который заменяет <strong>шаблон титульника
      диссертации онлайн</strong>: скопируйте его в LaTeX-сегмент проекта или откройте сокращенную
      версию кнопкой примера.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{titlepage}
      \thispagestyle{empty}
      \begin{center}
          {\small МИНИСТЕРСТВО НАУКИ И ВЫСШЕГО ОБРАЗОВАНИЯ РОССИЙСКОЙ ФЕДЕРАЦИИ}\\[2mm]
          {\bfseries САНКТ-ПЕТЕРБУРГСКИЙ ГОСУДАРСТВЕННЫЙ УНИВЕРСИТЕТ}\\[3mm]
          {\small Институт информационных технологий и анализа данных}\\
          {\small Кафедра системного программирования}
      \end{center}

      \vspace{5mm}
      \hfill
      \begin{minipage}{0.42\textwidth}
          \small
          \textbf{К ЗАЩИТЕ ДОПУСТИТЬ}\\
          Зав. кафедрой, д.т.н., проф.\\
          \underline{\hspace{2.5cm}} А.~В.~Смирнов\\
          «\underline{\hspace{0.8cm}}» \underline{\hspace{2cm}} 2026 г.
      \end{minipage}

      \vfill
      \begin{center}
          {\Large\bfseries МАГИСТЕРСКАЯ ДИССЕРТАЦИЯ}\\[5mm]
          {\large на тему: «Методы распределенного машинного обучения в гетерогенных вычислительных средах»}\\[6mm]
          {\small Направление подготовки: 09.04.01 Информатика и вычислительная техника\\
          Магистерская программа: Распределенные интеллектуальные системы}
      \end{center}

      \vfill
      \hfill
      \begin{minipage}{0.45\textwidth}
          \small
          \textbf{Выполнил магистрант:}\\
          Кузнецов Михаил Сергеевич\\
          Группа: 22.М04-мм\\[3mm]
          \textbf{Научный руководитель:}\\
          д-р физ.-мат. наук, профессор\\
          Васильев Олег Игоревич
      \end{minipage}

      \vfill
      \begin{center}
          Санкт-Петербург\\
          2026
      \end{center}
      \end{titlepage}</code></pre>
                              </div>
                              <p>Это тело документа. Без своей преамбулы Labkeeper подставит
      стандартную, а в ней поля всего 3–5 мм, поэтому для печати начните проект с преамбулы: класс,
      кириллица и <code>geometry</code> с полями из методички (пример в редакторе показывает такую
      преамбулу). Окружение <code>titlepage</code> само убирает номер с титульного листа, но после
      себя сбрасывает счетчик: следующая страница получит номер 1. Если по методичке титульный лист
      считается первой страницей, поставьте <code>\setcounter{page}{2}</code> сразу после
      <code>\end{titlepage}</code>.</p>
  - id: 'signature-block'
    title: 'Блок виз и подписей: научный руководитель, рецензент, зав. кафедрой'
    html: |2-
                              <p>В некоторых университетах на титульном листе диссертации также
      размещается графа нормоконтролера: <em>«Нормоконтроль пройден / подпись / дата»</em>.
      Обязательно сверьтесь с образцом в методичке вашей кафедры перед печатью.</p>
  - id: 'check-list'
    title: 'Чек-лист перед печатью чистовика'
    html: |2-
                              <p>Перед сдачей диссертации убедитесь:</p>
                              <ul>
                                  <li>Тема на титульном листе <strong>буква в букву</strong> совпадает
      с темой в приказе об утверждении тем ВКР;</li>
                                  <li>Код специальности указан в формате ХХ.04.ХХ (для магистратуры
      цифра ступени всегда 04);</li>
                                  <li>На титульном листе нет видимого номера страницы (скрыт через
      <code>\thispagestyle{empty}</code>).</li>
                              </ul>
tips:
  - title: 'Поля титульного листа'
    html: |2-
      <p>По ГОСТ 7.32, на который обычно ссылаются методички ВКР, левое поле равно 30 мм, правое — 15
      мм, верхнее и нижнее — по 20 мм. У кандидатской диссертации по ГОСТ Р 7.0.11 поля другие,
      например левое — 25 мм.</p>
  - title: 'Цвет печати'
    html: |2-
      <p>Многие вузы требуют печатать титульный лист черным цветом на белой бумаге. Плотность бумаги и
      допустимость цветного логотипа уточните в методичке.</p>
