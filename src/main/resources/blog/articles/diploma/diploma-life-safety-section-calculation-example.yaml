sections:
  - id: 'scope'
    title: 'Что должен раскрывать раздел БЖД'
    html: |2-
      <p>Раздел «Безопасность жизнедеятельности» связывает условия выполнения дипломного
      проекта с конкретными факторами воздействия и способами их снижения. Начните
      с рабочего места или процесса, который относится к вашей теме: например,
      рабочего места оператора информационной системы или участка с оборудованием.</p>
      <p>Название раздела, обязательные подразделы и расчетное задание уточните
      в методичке кафедры. Универсального раздела «БЖД по ГОСТ» для всех дипломов нет:
      требования к оформлению документа и требования к условиям работы решают разные задачи.</p>
      <p>Ниже разобран авторский учебный расчет общего освещения. Он показывает метод
      и оформление, а не подтверждает безопасность реального рабочего места.
      Для своей работы используйте сведения об объекте, действующие требования
      для выбранного вида деятельности и согласованный с руководителем метод расчета.</p>
  - id: 'structure'
    title: 'Структура: рабочее место, факторы и меры'
    html: |2-
      <ol>
          <li><strong>Объект анализа:</strong> помещение, оборудование, операции и время работы.</li>
          <li><strong>Факторы:</strong> источники воздействия, имеющиеся измерения и данные документации.</li>
          <li><strong>Критерии оценки:</strong> применимые требования с указанием документа и пункта.</li>
          <li><strong>Меры:</strong> технические и организационные решения для выявленных факторов.</li>
          <li><strong>Расчетное обоснование:</strong> исходные данные, формулы, результат и ограничения.</li>
          <li><strong>Вывод:</strong> что проверено и какие дополнительные сведения нужны.</li>
      </ol>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Фактор</th><th>Какие данные собрать</th><th>Что обосновывать в разделе</th></tr></thead>
              <tbody>
                  <tr><td>Освещение</td><td>Размеры помещения, рабочая поверхность, характеристики светильников.</td><td>Выбор схемы освещения и проверку расчетных показателей.</td></tr>
                  <tr><td>Шум оборудования</td><td>Источники, режим работы и результаты измерений.</td><td>Меры снижения воздействия, относящиеся к конкретному источнику.</td></tr>
                  <tr><td>Работа за компьютером</td><td>Задачи оператора, расположение оборудования и организация рабочего места.</td><td>Решения по размещению оборудования и организации работы.</td></tr>
              </tbody>
          </table>
      </div>
      <p>Выбирайте факторы по объекту исследования. Не переносите в диплом перечень
      опасностей из чужого производства, если они не относятся к вашему процессу.
      Числовые утверждения подтверждайте измерениями, паспортами или расчетом.</p>
  - id: 'inputs'
    title: 'Исходные данные для расчета освещения'
    html: |2-
      <p>Рассмотрим помещение длиной 8 м и шириной 6 м. Применим учебную модель
      метода коэффициента использования светового потока для общего освещения
      горизонтальной поверхности. Метод изложен в разделе 3.2
      <a href="https://uust.ru/media/uploads/MainSite/Ob%20universitete/Izdateli/El_izd/2022-157.pdf">практикума УГАТУ «Безопасность жизнедеятельности»</a>.</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Показатель</th><th>Обозначение</th><th>Учебное значение</th></tr></thead>
              <tbody>
                  <tr><td>Длина и ширина</td><td>$a$, $b$</td><td>8 м; 6 м</td></tr>
                  <tr><td>Заданная минимальная освещенность</td><td>$E_{\text{зад}}$</td><td>300 лк</td></tr>
                  <tr><td>Световой поток одного светильника</td><td>$\Phi$</td><td>4 000 лм</td></tr>
                  <tr><td>Коэффициент использования</td><td>$\eta$</td><td>0,60</td></tr>
                  <tr><td>Коэффициент запаса</td><td>$k$</td><td>1,50</td></tr>
                  <tr><td>Отношение средней освещенности к минимальной</td><td>$z$</td><td>1,10</td></tr>
              </tbody>
          </table>
      </div>
      <div class="article-note"><strong>💡 Совет:</strong> Все значения в таблице условные.
      300 лк не объявляются универсальной нормой для любого рабочего места.
      Для проекта обоснуйте целевую освещенность и коэффициенты; значение
      <code>eta</code> задается долей единицы, а не числом процентов.</div>
      <p>Коэффициент использования зависит от светильника, геометрии помещения
      и отражающих свойств поверхностей. В расчетных материалах укажите источник
      выбранного значения и поясните область применения модели.</p>
  - id: 'calculation'
    title: 'Пример расчета числа светильников'
    html: |2-
      <p><strong>1. Площадь помещения:</strong></p>
      <p>$$S=ab=8\cdot6=48\text{ м}^2.$$</p>
      <p><strong>2. Расчетное число светильников.</strong> Здесь $\Phi$ — поток всего
      светильника; отдельно умножать его на число ламп не нужно:</p>
      <p>$$N_{\text{расч}}=\frac{E_{\text{зад}}Skz}{\Phi\eta}
      =\frac{300\cdot48\cdot1{,}5\cdot1{,}1}{4000\cdot0{,}6}=9{,}9.$$</p>
      <p>Принимаем целое число $N=10$, округляя результат вверх.
      Обычное округление до ближайшего целого здесь не подходит: оно может уменьшить
      число светильников ниже расчетного.</p>
      <p><strong>3. Обратная проверка выбранного количества:</strong></p>
      <p>$$E_{\text{расч}}=\frac{N\Phi\eta}{Skz}
      =\frac{10\cdot4000\cdot0{,}6}{48\cdot1{,}5\cdot1{,}1}
      \approx303{,}03\text{ лк}.$$</p>
      <p>В принятой модели результат не ниже заданных 300 лк. Он не проверяет
      фактическое распределение освещенности по точкам, слепящее действие, пульсацию
      и затенение оборудованием. В реальном проекте нужны схема размещения,
      подходящая методика и проверка остальных требуемых показателей.</p>
  - id: 'editor'
    title: 'Вычислительный сегмент и оформление в LaTeX'
    html: |2-
      <p>Вычислительный сегмент считает дробное число светильников и проверяет
      выбранное целое <code>N</code>. Оно задается отдельно: после изменения данных
      выберите целое значение не меньше <code>needed</code> и проверьте результат.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Вычислительный сегмент</span></div>
          <pre><code>a = 8
      b = 6
      target = 300
      flux = 4000
      eta = 0.60
      k = 1.50
      z = 1.10
      N = 10
      area = a * b
      needed = target * area * k * z / (flux * eta)
      calculated = N * flux * eta / (area * k * z)
      difference = calculated - target</code></pre>
      </div>
      <p>Кнопка «Просмотреть пример» открывает вычисления и LaTeX-сегмент с исходными
      данными, формулой и обратной проверкой. Вычислительный сегмент скрыт из вывода.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX-сегмент</span></div>
          <pre><code>\section*{Расчет освещения}
      $S=${area}$ м$^2$, $E_0=${target}$ лк, $\Phi=${flux}$ лм.
      $\eta=${eta}$, $k=${k}$, $z=${z}$.
      \[N_0=\frac{E_0Skz}{\Phi\eta}=${needed}\]
      Принято $N=${N}$ светильников.
      \[E=\frac{N\Phi\eta}{Skz}=${calculated}\text{ лк}\]
      Разность с заданием: ${difference} лк.</code></pre>
      </div>
      <p>Если разность отрицательна, выбранное количество не выполняет условие модели.
      При нулевых площади или коэффициенте использования формулы неприменимы.
      Исходные величины должны быть положительными; порядок подстановок описан
      в <a href="/wiki/concepts/segments.html">вики о сегментах</a>.</p>
  - id: 'conclusion'
    title: 'Как сформулировать вывод и проверить раздел'
    html: |2-
      <div class="article-quote">
          <p>«Для учебного помещения площадью 48 м² расчетное число светильников
          составило 9,9; принято 10. При заданных коэффициентах расчетная оценка
          освещенности равна 303,03 лк при целевом значении 300 лк. Результат относится
          к выбранной модели общего освещения; размещение светильников и остальные
          светотехнические показатели подлежат отдельной проверке».</p>
      </div>
      <ul>
          <li>Объект и факторы связаны с темой диплома.</li>
          <li>Для критериев и коэффициентов приведены источники и условия применения.</li>
          <li>Не перепутаны люксы, люмены, площадь и доли единицы.</li>
          <li>Целое число светильников проверено обратной подстановкой.</li>
          <li>Вывод отделяет результат модели от проверки реального рабочего места.</li>
      </ul>
      <p>Общие правила верстки смотрите в
      <a href="/blog/latex-diploma-gost">руководстве по оформлению диплома</a>,
      а итоговые результаты работы можно связать с
      <a href="/blog/diploma-conclusion-structure-example">заключением ВКР</a>.</p>
tips:
  - title: 'Прикладывайте схему помещения'
    html: |2-
      <p>На схеме обозначьте рабочую поверхность и выбранное расположение светильников.
      Таблица исходных данных должна соответствовать этой схеме.</p>
  - title: 'Проверяйте округление после выбора оборудования'
    html: |2-
      <p>Не подменяйте выбор целого количества светильников округлением отображения чисел.
      После выбора оборудования пересчитайте результат с его паспортными характеристиками.</p>
