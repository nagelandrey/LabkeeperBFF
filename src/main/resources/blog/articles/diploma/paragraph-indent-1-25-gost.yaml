sections:
  - id: 'gost-requirement'
    title: 'Что требует ГОСТ 7.32 к абзацному отступу'
    html: |2-
                              <p>В тексте отчетов о НИР и пояснительных записок к дипломным проектам
      абзацный отступ (красная строка) задан ГОСТ 7.32-2017 жестко:</p>
                              <blockquote>
                                  «Абзацный отступ должен быть одинаковым по всему тексту отчета и
      равен 1,25 см».
                              </blockquote>
                              <p>У кандидатской диссертации свой стандарт — ГОСТ Р 7.0.11-2011, и
      отступ там задан иначе: пять знаков.</p>
                              <p>Нормоконтролеры часто измеряют этот параметр буквально линейкой по
      распечатанному экземпляру. Любые отклонения (отступы табуляцией, пробелами или стандартный
      англо-американский отступ LaTeX в 15–20 pt) приводят к возврату работы на доработку.</p>
  - id: 'parindent-setup'
    title: 'Абзацный отступ 1.25 вкр онлайн: параметр parindent'
    html: |2-
                              <p>В LaTeX точный <strong>абзацный отступ 1.25 вкр онлайн</strong>
      задается системной переменной <code>\parindent</code> в преамбуле документа (наряду с
      правильными полями листа, которые настраиваются через <a
      href="/blog/latex-geometry-margins-gost">пакет geometry для полей по ГОСТ</a>):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>% Установка абзацного отступа ровно 1.25 см по ГОСТ
      \setlength{\parindent}{1.25cm}</code></pre>
                              </div>
                              <p>После этой директивы каждый новый абзац (начинающийся с пустой строки
      в коде TeX) автоматически сдвигается ровно на 12.5 мм.</p>
  - id: 'indentfirst-problem'
    title: 'Красная строка 1.25 см диплом: пакет indentfirst для первого абзаца'
    html: |2-
                              <p>В англоязычной типографической традиции первый абзац после любого
      заголовка (<code>\section</code>, <code>\subsection</code>, <code>\chapter</code>) печатается
      <em>без красной строки</em> (слева вровень с заголовком). По этой причине базовый LaTeX
      подавляет отступ в первом абзаце.</p>
                              <p>В русской традиции <strong>красная строка 1.25 см диплом</strong>
      обязательна <strong>во всех абзацах без исключения</strong>, включая самый первый после названия
      главы. Для исправления подключите стандартный пакет <strong>indentfirst</strong>:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\usepackage{indentfirst} % Принудительный отступ 1.25 см даже в первом абзаце</code></pre>
                              </div>
                              <p>Одна строчка подключения пакета решает проблему глобально во всем
      документе.</p>
  - id: 'parskip-spacing'
    title: 'Межабзацный интервал parskip: никаких промежутков между абзацами'
    html: |2-
                              <p>В веб-верстке и американских документах принято разделять абзацы
      вертикальными отступами (блочный стиль). В русских отчетах и дипломах абзацы отделяют только
      красной строкой, а вертикальный промежуток между абзацами внутри подраздела не делают.</p>
                              <p>В коде LaTeX пустая строка и есть разделитель абзацев, поэтому
      ставить ее нужно. Лишний промежуток появляется не от нее, а от ненулевого параметра
      <code>\parskip</code> — например, после подключения пакета <code>parskip</code>.</p>
                              <p>Убедитесь, что параметр <code>\parskip</code> обнулен:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\setlength{\parskip}{0pt} % Никаких лишних вертикальных отступов между абзацами</code></pre>
                              </div>
  - id: 'justification'
    title: 'Выравнивание по ширине полосы набора (Justify)'
    html: |2-
                              <p>Текст ВКР обязательно выравнивается «по ширине» (justified) с
      включенным автоматическим переносом слов (подробное сравнение качества типографики смотрите в
      материале о <a href="/blog/justified-text-spacing-hyphenation-latex-vs-word">выравнивании по
      ширине и переносах в LaTeX против Word</a>). В LaTeX это поведение является стандартом по
      умолчанию, что гарантирует аккуратные ровные границы текста слева и справа.</p>
tips:
  - title: 'Принудительное отключение отступа'
    html: |2-
      <p>Если в конкретной строке (например, перед формулой или подписью) отступ не нужен, используйте
      команду <code>\noindent</code> в начале строки.</p>
  - title: 'Отступ в списках по ГОСТ'
    html: |2-
      <p>Чтобы маркер списков <code>enumerate</code> и <code>itemize</code> стоял на месте красной
      строки 1,25 см, используйте пакет <code>enumitem</code>:
      <code>\setlist{labelindent=1.25cm,leftmargin=*}</code>. Параметр <code>leftmargin</code> сам по
      себе сдвигает текст пункта, а не маркер.</p>
editorExample:
  latex: |2-
    \documentclass[a4paper,12pt]{article}
    \usepackage[T2A]{fontenc}
    \usepackage[utf8]{inputenc}
    \usepackage[english,russian]{babel}
    \usepackage{amsmath,graphicx}
    \usepackage{indentfirst}\setlength{\parindent}{1.25cm}
    \begin{document}
    \section*{Абзацный отступ}
    Первый абзац начинается с отступа.

    Второй абзац имеет тот же отступ 1,25 см.
    \end{document}
