sections:
  - id: 'purpose'
    title: 'Главная цель литературного обзора (Главы 1 ВКР)'
    html: |2-
                              <p>Первая глава дипломной или диссертационной работы («Аналитический
      обзор литературы» или «Анализ состояния предметной области») призвана доказать научную и
      практическую необходимость вашего исследования (аналогично тому, как формулируются <a
      href="/blog/scientific-article-annotation-abstract-keywords-vak">аннотация и ключевые слова
      научной статьи ВАК</a>).</p>
                              <p>Типичная ошибка студентов — превращать обзор в простое механическое
      перечисление: <em>«Иванов в [1] исследовал то-то, а Петров в [2] написал про это»</em>.
      Качественный обзор — это <strong>критический сравнительный анализ</strong> достоинств и
      недостатков существующих алгоритмов, методик или систем.</p>
  - id: 'structure-rules'
    title: 'Структура литературного обзора диплом: от общего к частному'
    html: |2-
                              <p>Каноническая <strong>структура литературного обзора диплом</strong>
      строится по принципу сужающейся воронки (3 подраздела):</p>
                              <ol>
                                  <li><strong>1.1. Современное состояние предметной области:</strong>
      глобальный контекст, отраслевые тренды, статистика и масштаб решаемой проблемы.</li>
                                  <li><strong>1.2. Анализ существующих подходов и аналогов:</strong>
      подробный разбор 3–5 альтернативных решений, используемых в индустрии или науке.</li>
                                  <li><strong>1.3. Выводы по первой главе и постановка задач:</strong>
      четкое резюме о том, каких возможностей не хватает существующим аналогам, и формулировка цели
      вашей дипломной работы.</li>
                              </ol>
  - id: 'citation-formatting'
    title: 'Оформление ссылок в обзоре литературы: синтез вместо пересказа'
    html: |2-
                              <p>Грамотное <strong>оформление ссылок в обзоре литературы</strong>
      использует группировку ученых по научным направлениям:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Академический стиль цитирования</span></div>
                                  <pre><code>Вопросам оптимизации трафика в сенсорных сетях посвящены работы отечественных и зарубежных авторов. В частности, в исследованиях Смирнова А. В. [12] и Васильева К. М. [15] показано, что применение динамической кластеризации позволяет сократить энергопотребление на 20%. Однако алгоритм [15] обладает высокой вычислительной сложностью и неприменим на маломощных микроконтроллерах STM32, тогда как решение [12] остаётся достаточно простым...</code></pre>
                              </div>
                              <p>Такой синтаксис демонстрирует глубокое владение материалом и
      подчеркивает ценность предлагаемой вами разработки. Номера в квадратных скобках LaTeX подставит
      сам: запишите источники в окружении <code>thebibliography</code> и ставьте отсылки командой
      <code>\cite{smirnov2024, vasiliev2025}</code>, которая выведет номера вида «[12, 15]». При
      локальной сборке ту же работу делает <a
      href="/blog/biblatex-biber-advanced-bibliography-management">пакет biblatex и biber для
      управления библиографией</a>.</p>
  - id: 'comparison-matrices'
    title: 'Сравнительные аналитические таблицы существующих решений'
    html: |2-
                              <p>Кульминация литературного обзора — сравнительная сводная таблица
      аналогов по ключевым критериям (производительность, стоимость, точность, поддержка ГОСТ). Такая
      таблица в первой главе наглядно показывает пробел, который закрывает ваша работа, и повышает
      шансы на высокую оценку рецензента.</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\noindent Таблица 1.1 --- Сравнение существующих решений\\[2mm]
      \begin{tabular}{|l|c|c|c|}
      \hline
      Критерий & Решение~\cite{smirnov2024} & Решение~\cite{vasiliev2025} & Решение~\cite{petrov2023} \\
      \hline
      Работа в реальном времени & $-$ & $+$ & $-$ \\
      Низкая вычислительная сложность & $+$ & $-$ & $-$ \\
      Открытый исходный код & $+$ & $-$ & $+$ \\
      \hline
      \end{tabular}</code></pre>
                              </div>
                              <p>Последняя строка выводов к таблице формулирует требование к вашей
      разработке: ни одно из решений не сочетает работу в реальном времени с низкой сложностью.</p>
  - id: 'conclusion-gap'
    title: 'Формулирование «научного пробела» и постановка задач ВКР'
    html: |2-
                              <p>В конце обзора формулируется вывод:</p>
                              <blockquote>
                                  «Проведенный анализ показал, что существующие программные комплексы
      [1–6] не обеспечивают требуемую скорость обработки данных в реальном времени. Таким образом,
      разработка гибридного алгоритма сжатия является актуальной задачей».
                              </blockquote>
tips:
  - title: 'Баланс свежести источников'
    html: |2-
      <p>Многие вузы рекомендуют, чтобы 40–50% цитируемых научных статей были опубликованы за
      последние 3–5 лет (Scopus, ВАК, РИНЦ). Точное требование указано в методичке кафедры.</p>
  - title: 'Автоматические ссылки в LaTeX'
    html: |2-
      <p>Используйте <code>\cite{smirnov2024, vasiliev2025}</code>: номера в квадратных скобках
      подставит LaTeX. В окружении <code>thebibliography</code> номер задает порядок записей
      <code>\bibitem</code>, поэтому после перестановки абзацев проверьте, что записи по-прежнему идут
      в порядке первого упоминания.</p>
editorExample:
  latex: |2-
    \section*{1.2 Анализ существующих подходов}
    Динамической кластеризации посвящены работы~\cite{smirnov,vasiliev}: у Смирнова она проще, у
    Васильева тяжелее.

    \begin{tabular}{|l|c|c|}\hline
    Критерий & \cite{smirnov} & \cite{vasiliev}\\\hline
    Реальное время & $-$ & $+$\\
    Малая сложность & $+$ & $-$\\\hline
    \end{tabular}
    \begin{thebibliography}{9}
    \bibitem{smirnov} Смирнов, А.~В. Кластеризация сенсорных сетей. --- М., 2024.
    \bibitem{vasiliev} Васильев, К.~М. Энергосбережение в~сетях. --- СПб., 2025.
    \end{thebibliography}
