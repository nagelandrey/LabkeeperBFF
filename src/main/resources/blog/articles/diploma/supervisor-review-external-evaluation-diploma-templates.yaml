sections:
  - id: 'differences'
    title: 'В чем разница между отзывом руководителя и рецензией'
    html: |2-
                              <p>К защите перед государственной экзаменационной комиссией (ГЭК)
      готовят два документа: <strong>отзыв научного руководителя</strong> и <strong>рецензию</strong>
      внешнего эксперта. Отзыв руководителя нужен всегда. Рецензия по порядку ГИА (приказ Минобрнауки
      России № 636, п. 35) обязательна для программ специалитета и магистратуры, а для бакалавриата ее
      требует или не требует сам вуз. Нередко студенты путают назначение этих документов:</p>
                              <ul>
                                  <li><strong>Отзыв руководителя:</strong> оценивает личностные
      качества дипломника, его трудолюбие, дисциплину, степень самостоятельности при решении
      поставленных задач и умение работать с литературой.</li>
                                  <li><strong>Рецензия:</strong> независимая внешняя экспертная оценка
      самого содержания пояснительной записки, глубины проработки темы, практической ценности
      разработки и обоснованности выводов. Для специалитета и магистратуры рецензент не должен
      работать на кафедре, факультете или в организации, где выполнена работа; требования к его
      степени и должности задает вуз.</li>
                              </ul>
                              <p>Наряду с отзывом и рецензией в обязательный пакет документов входит
      утвержденная форма <a href="/blog/diploma-assignment-form-calendar-schedule-gost">бланка задания
      и календарного плана ВКР</a>.</p>
  - id: 'supervisor-review'
    title: 'Отзыв руководителя ВКР: пример и структура характеристики'
    html: |2-
                              <p>Ниже представлен классический <strong>отзыв руководителя вкр
      пример</strong> которого подходит для технических, экономических и гуманитарных
      специальностей:</p>
                              <div class="article-quote">
                                  <p><strong>Пример структуры отзыва:</strong><br>
                                  «Студент Иванов И. И. в период подготовки выпускной квалификационной
      работы на тему "Разработка распределенной микросервисной системы..." проявил высокую
      инициативность и глубокие инженерные знания. Дипломник самостоятельно провел сравнительный
      анализ архитектурных паттернов, освоил стек Go/gRPC/PostgreSQL и реализовал рабочий прототип
      системы.<br><br>
                                  Работа выполнялась строго в соответствии с календарным графиком.
      Иванов И. И. продемонстрировал навыки самостоятельного поиска англоязычной научно-технической
      документации. Считаю, что выпускная работа удовлетворяет всем требованиям ГОСТ и профильного
      стандарта, а ее автор заслуживает присвоения квалификации бакалавра с оценкой "отлично".»</p>
                              </div>
                              <p>При подготовке отзыва научный руководитель обычно сверяется с
      выжимкой результатов из <a href="/blog/diploma-annotation-abstract-russian-english">аннотации и
      Abstract к диплому</a>.</p>
  - id: 'external-review'
    title: 'Бланк рецензии на дипломную работу: шаблон и формулировка замечаний'
    html: |2-
                              <p>Используя стандартный <strong>бланк рецензии на дипломную работу
      шаблон</strong> должен содержать обязательный пункт: <em>«Замечания по работе»</em>. Рецензия
      без замечаний выглядит подозрительно для членов ГЭК и может вызвать дополнительные каверзные
      вопросы на защите.</p>
                              <p>Грамотные замечания должны быть конкретными и проверяемыми:</p>
                              <ul>
                                  <li><em>Корректно:</em> «В главе 2 следовало бы более подробно
      осветить результаты нагрузочного тестирования при пиковых запросах более 5000 RPS».</li>
                                  <li><em>Корректно:</em> «На рисунках 3.2 и 3.4 размер шрифта в
      диаграммах классов мелковат для комфортного чтения без масштабирования».</li>
                                  <li><em>Некорректно:</em> голословные оценки вроде «Тема работы не
      раскрыта» без указания, в чем именно проблема.</li>
                              </ul>
                              <p>Если в работе есть реальная ошибка, рецензент обязан ее назвать — с
      номером формулы, страницы или раздела: рецензия нужна комиссии именно для объективной
      оценки.</p>
  - id: 'cliches-ratings'
    title: 'Клише для описания самостоятельности и научной новизны'
    html: |2-
                              <p>Готовые языковые клише для составления проекта отзыва или
      рецензии:</p>
                              <ul>
                                  <li>«Тема ВКР является актуальной в связи с возрастающими
      требованиями к импортозамещению программного обеспечения...»</li>
                                  <li>«Автором предложен оригинальный алгоритм оптимизации
      маршрутизации, обладающий научной новизной...»</li>
                                  <li>«Практическая значимость работы подтверждается актом внедрения
      программного модуля в производственный процесс ООО "Вектор"...»</li>
                                  <li>«Оформление пояснительной записки полностью соответствует
      требованиям ГОСТ 7.32-2017...»</li>
                              </ul>
  - id: 'signatures-stamps'
    title: 'Печати, подписи и оформление перед защитой ГЭК'
    html: |2-
                              <p>Во многих вузах подпись внешнего рецензента требуют <strong>заверить
      печатью организации</strong> (отделом кадров предприятия или канцелярией вуза), и без нее
      кафедра может не принять рецензию. Это требование отдельных вузов, а не федерального порядка
      ГИА, поэтому уточните его в положении о ВКР своего вуза. Порядок ГИА требует ознакомить студента
      с отзывом и рецензией не позднее чем за 5 календарных дней до защиты.</p>
tips:
  - title: 'Подготовьте рыбу отзыва заранее'
    html: |2-
      <p>Научные руководители часто заняты. Вежливо предложите руководителю готовую «рыбу» (черновик)
      отзыва с описанием ваших реальных этапов работы — это ускорит подписание.</p>
  - title: 'Проверяйте формулировку темы'
    html: |2-
      <p>Тема в шапке отзыва и рецензии должна с точностью до буквы и знаков препинания совпадать с
      темой на титульном листе и в приказе ректора.</p>
editorExample:
  markdown: |2-
    # Отзыв руководителя

    **Студент:** Иванов И. И.
    **Тема:** Разработка системы мониторинга серверов

    ## Актуальность
    Тема связана с ростом нагрузки на облачные сервисы.

    ## Самостоятельность
    Студент сам выбрал архитектуру и реализовал прототип.

    ## Замечания
    Нагрузочное тестирование описано кратко.

    ## Вывод
    Работа соответствует требованиям и заслуживает оценки «отлично».
