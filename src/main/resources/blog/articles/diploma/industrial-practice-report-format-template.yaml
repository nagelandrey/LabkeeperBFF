sections:
  - id: 'requirements'
    title: 'С чего начать: программа практики и методичка'
    html: |2-
      <p>Отчет по производственной практике показывает, какие задачи студент выполнил
      в организации и какие результаты получил. Обычно он включает титульный лист,
      содержание, введение, основную часть, заключение, список источников и приложения.
      Точный состав и оформление возьмите из программы практики и методички кафедры.</p>
      <p>Подготовьте индивидуальное задание, даты прохождения практики и требования к сдаче.
      Уточните, какие документы подаются отдельно: дневник, отзыв руководителя,
      аттестационный лист. Например, в
      <a href="https://edu.tusur.ru/publications/6325">методических указаниях ТУСУРа по направлению 27.03.04</a>
      предусмотрены собственные формы и ориентировочная структура отчета.
      Использовать бланк другого направления без сверки с кафедрой не стоит.</p>
      <div class="article-note"><strong>💡 Совет:</strong> ГОСТ 7.32-2017 посвящен отчетам
      о научно-исследовательской работе. Если методичка ссылается на него, используйте
      соответствующие правила оформления. Единого титульного листа и обязательного
      числа страниц для всех студенческих практик этот стандарт не задает.</div>
  - id: 'structure'
    title: 'Структура отчета по производственной практике'
    html: |2-
      <p>Сначала сопоставьте разделы с индивидуальным заданием. Для технической или
      IT-практики можно использовать следующий каркас:</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Раздел</th><th>Что включить</th></tr></thead>
              <tbody>
                  <tr><td>Титульный лист</td><td>Вуз, кафедра, вид практики, организация, сроки, студент и руководители.</td></tr>
                  <tr><td>Содержание</td><td>Названия разделов и номера страниц.</td></tr>
                  <tr><td>Введение</td><td>Цель, задачи, место и период практики.</td></tr>
                  <tr><td>Характеристика организации</td><td>Профиль подразделения и процесс, в котором студент участвовал.</td></tr>
                  <tr><td>Выполнение задания</td><td>Исходные данные, методы, этапы и личный вклад.</td></tr>
                  <tr><td>Результаты</td><td>Полученные документы, расчеты, схемы, программы или результаты испытаний.</td></tr>
                  <tr><td>Заключение</td><td>Какие задачи решены, что осталось выполнить и какие навыки получены.</td></tr>
                  <tr><td>Источники и приложения</td><td>Использованные материалы и подтверждения результатов, на которые есть ссылки в тексте.</td></tr>
              </tbody>
          </table>
      </div>
      <p>Историю предприятия сократите до сведений, нужных для понимания вашей задачи.
      Если задание связано с обработкой заявок, опишите работу соответствующего
      подразделения и используемые инструменты, а не все направления деятельности организации.</p>
  - id: 'content'
    title: 'Как описать выполненную работу и результаты'
    html: |2-
      <p>Удобная последовательность для основной части: <strong>задача → исходные данные →
      действия → результат → проверка</strong>. Для каждого пункта задания покажите
      конкретный итог и поясните, какая часть работы выполнена лично вами.</p>
      <div class="article-quote">
          <p><strong>Учебный пример описания:</strong> «Для проверки обработки заявок
          подготовлены десять тестовых сценариев: создание, изменение статуса и поиск записи.
          В трех сценариях выявлены ошибки валидации, результаты переданы руководителю.
          После исправления все десять сценариев выполнены повторно; журнал проверки
          приведен в приложении А».</p>
      </div>
      <p>Это пример формулировки, а не сведения о реальной практике. В своем отчете
      приведите фактически выполненные действия и результаты. Для программных задач
      используйте <a href="/blog/programming-lab-report-code-listings-gost">оформленные листинги кода</a>,
      для иллюстраций — <a href="/blog/software-screenshots-report-gost-caption">скриншоты с подписями</a>.</p>
      <p>До включения внутренних документов и данных организации согласуйте их использование
      с руководителем. При необходимости замените персональные данные и коммерческие
      показатели обезличенными примерами, отметив это в тексте.</p>
  - id: 'template'
    title: 'Готовый LaTeX-шаблон отчета'
    html: |2-
      <p>Ниже — самостоятельный документ для LaTeX-сегмента Labkeeper. Он задает
      титульный лист, содержание и основные разделы. Поля, кегль, интервал и состав
      реквизитов служат исходным образцом: перед заполнением сверьте их с методичкой.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \usepackage{setspace}
      \usepackage{indentfirst}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \begin{document}
      \begin{titlepage}
          \centering
          Название университета\par
          Название кафедры\par
          \vfill
          \textbf{ОТЧЕТ}\par
          по производственной практике\par
          \medskip
          Место практики: название организации\par
          Сроки: 01.06.2026 --- 28.06.2026\par
          \vfill
          \begin{flushright}
              Студент: ФИО, группа\par
              Руководитель от вуза: ФИО\par
              Руководитель от организации: ФИО
          \end{flushright}
          \vfill
          Москва --- 2026
      \end{titlepage}
      \setcounter{page}{2}
      \tableofcontents
      \clearpage
      \section*{Введение}
      \addcontentsline{toc}{section}{Введение}
      Укажите цель, задачи и сроки практики.
      \section{Характеристика организации}
      Опишите подразделение и исследуемый процесс.
      \section{Выполнение индивидуального задания}
      \subsection{Исходные данные и методы}
      Укажите источники данных и инструменты.
      \subsection{Полученные результаты}
      Опишите личный вклад и проверку результата.
      \section*{Заключение}
      \addcontentsline{toc}{section}{Заключение}
      Сопоставьте результаты с задачами практики.
      \section*{Список использованных источников}
      \addcontentsline{toc}{section}{Список использованных источников}
      Добавьте источники, на которые ссылаетесь в тексте.
      \clearpage
      \section*{Приложение А. Материалы практики}
      \addcontentsline{toc}{section}{Приложение А. Материалы практики}
      Разместите материалы, подтверждающие результаты.
      \end{document}</code></pre>
      </div>
      <p>Замените подписи-подсказки своим текстом и удалите ненужные разделы.
      Для подписей руководителей и дополнительных реквизитов используйте утвержденный
      бланк кафедры. Кнопка «Просмотреть пример» открывает самостоятельный документ
      с титульным листом, отдельным оглавлением и основными разделами.
      В редакторе открывается полный шаблон из статьи с реквизитами организации,
      сроками, двумя руководителями, ненумерованными введением и заключением.
      Этот же шаблон доступен
      <a href="/assets/examples/industrial-practice-report.tex" download>для скачивания в формате .tex</a>.</p>
      <p>После изменения структуры пересоберите PDF и проверьте номера в содержании.
      Подробнее о настройке — в статьях про
      <a href="/blog/automatic-table-of-contents-diploma-gost">автоматическое оглавление</a> и
      <a href="/blog/latex-geometry-margins-gost">поля страницы в LaTeX</a>.</p>
  - id: 'prediploma'
    title: 'Что меняется для преддипломной практики'
    html: |2-
      <p>Для преддипломной практики свяжите выполненные задачи с темой ВКР.
      Вместо общего знакомства с организацией покажите, какие материалы собраны
      для диплома: требования, исходные данные, сравнение решений, прототип или
      результаты эксперимента. Конкретный набор определяется программой практики.</p>
      <ol>
          <li>Во введении укажите связь цели практики с задачей дипломного проекта.</li>
          <li>В основной части опишите собранные данные, методы и ограничения.</li>
          <li>В заключении перечислите результаты, которые будут использованы в ВКР,
          и работу, которую предстоит завершить.</li>
      </ol>
      <p>Если предусмотрено экономическое обоснование, можно подготовить
      <a href="/blog/diploma-economic-efficiency-calculation-example">расчет экономической эффективности</a>.
      Не добавляйте его только ради объема: раздел должен отвечать индивидуальному заданию.</p>
  - id: 'checklist'
    title: 'Проверка оформления и комплекта документов'
    html: |2-
      <ul>
          <li>Вид практики, организация и даты совпадают с заданием и дневником.</li>
          <li>Каждая задача задания отражена в основной части и заключении.</li>
          <li>Титульный лист, поля, шрифт и интервал соответствуют методичке кафедры.</li>
          <li>Оглавление содержит актуальные страницы, рисунки и таблицы имеют подписи.</li>
          <li>На приложения есть ссылки в основной части; большие материалы не перегружают текст.</li>
          <li>Подготовлены требуемые отзыв, дневник и другие сопроводительные документы.</li>
          <li>Итоговый PDF проверен на переносы строк, пустые страницы и читаемость иллюстраций.</li>
      </ul>
      <p>Порядок оформления приложений разобран в
      <a href="/blog/diploma-appendices-listings-diagrams-gost">отдельном руководстве</a>.
      Область применения ГОСТ 7.32-2017 можно проверить в
      <a href="https://protect.gost.ru/gost/details/7d280e43-7036-4a69-8e6e-d15867028343">официальной карточке Росстандарта</a>.</p>
tips:
  - title: 'Заполняйте отчет по мере прохождения практики'
    html: |2-
      <p>Фиксируйте выполненные задачи, даты и подтверждающие материалы в течение практики.
      Эти записи помогут согласовать отчет с дневником и избежать пропусков.</p>
  - title: 'Выносите подтверждающие материалы в приложения'
    html: |2-
      <p>В основной части оставьте ключевые результаты. Длинные листинги, протоколы
      испытаний и вспомогательные таблицы вынесите в приложения со ссылками из текста.</p>
