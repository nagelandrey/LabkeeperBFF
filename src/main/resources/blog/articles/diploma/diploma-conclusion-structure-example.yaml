sections:
  - id: 'purpose'
    title: 'Что должно показать заключение ВКР'
    html: |2-
      <p>Заключение отвечает на вопросы: что получено в работе, насколько решены задачи
      и в каких условиях применим результат. Фразы «тема изучена» и «цель достигнута»
      недостаточно: читателю нужны конкретные итоги анализа, разработки или исследования.</p>
      <p>Например, в
      <a href="https://www.muctr.ru/upload/sveden/files/003437.pdf">методических рекомендациях РХТУ им. Д. И. Менделеева</a>
      заключение связывается с целью и задачами исследования; выводы по главам предлагается
      обобщать, а не дублировать. Точный объем, состав и оформление проверьте по методичке
      своей кафедры. Универсальное требование «строго две страницы по ГОСТ» здесь не подходит.</p>
      <p>В отличие от <a href="/blog/how-to-write-lab-report-conclusion-examples">вывода к лабораторной работе</a>,
      который часто подводит итог отдельного опыта, заключение ВКР объединяет результаты
      нескольких этапов работы. Оно должно показать их общий смысл для заявленной цели.</p>
  - id: 'structure'
    title: 'Структура: цель, результаты, ограничения и рекомендации'
    html: |2-
      <p>Используйте следующую последовательность как рабочий каркас, а не как обязательные
      подзаголовки. Итоговый текст можно оформить несколькими связанными абзацами.</p>
      <ol>
          <li><strong>Ответ на цель:</strong> какое решение, объяснение или разработку удалось получить.</li>
          <li><strong>Результаты по задачам:</strong> что установлено, рассчитано, создано и проверено.
          Не заменяйте результат перечислением действий.</li>
          <li><strong>Значение результата:</strong> для какой задачи он полезен и чем это подтверждено.</li>
          <li><strong>Ограничения:</strong> какие данные, условия и допущения ограничивают выводы.</li>
          <li><strong>Рекомендации и продолжение:</strong> как использовать результат и что еще предстоит проверить.</li>
      </ol>
      <div class="article-note"><strong>💡 Совет:</strong> Не вводите в заключении новые
      результаты, расчеты и доказательства. Если важный вывод появился только при написании
      финала, сначала обоснуйте его в основной части и затем включите в итоговый текст.</div>
      <p>Научную новизну, внедрение и экономический эффект заявляйте только при наличии
      оснований. Для оценки затрат или эффекта нужны исходные данные и расчет;
      пример оформления есть в статье про
      <a href="/blog/diploma-economic-efficiency-calculation-example">экономическую эффективность в дипломе</a>.</p>
  - id: 'evidence'
    title: 'Как связать задачи с доказанными результатами'
    html: |2-
      <p>Перед написанием составьте рабочую таблицу. В первую колонку перенесите задачи
      из введения, во вторую — подтверждения из готовых разделов, в третью — итоговый вывод.
      В само заключение эту таблицу переносить необязательно.</p>
      <p>Ниже — полностью условная ВКР о прототипе учета заявок. Предполагается, что все
      перечисленные материалы уже представлены в ее основной части.</p>
      <div class="article-table-wrapper">
          <table class="article-table">
              <thead><tr><th>Задача</th><th>Подтверждение</th><th>Что сообщить в заключении</th></tr></thead>
              <tbody>
                  <tr><td>Определить требования</td><td>Описание сценариев регистрации, изменения статуса и поиска</td><td>Выделены три группы функциональных требований.</td></tr>
                  <tr><td>Спроектировать хранение данных</td><td>Модель заявки и переходы между тремя статусами</td><td>Получена модель, сохраняющая сведения о заявке и ее состоянии.</td></tr>
                  <tr><td>Разработать прототип</td><td>Реализация трех групп функций</td><td>Создан прототип регистрации, изменения статуса и поиска заявок.</td></tr>
                  <tr><td>Проверить функции</td><td>Протокол: четыре сценария регистрации, три изменения статуса и три поиска</td><td>Все десять сценариев завершились ожидаемым результатом в условиях учебного стенда.</td></tr>
              </tbody>
          </table>
      </div>
      <p>Если по задаче нет подтверждения, не отмечайте ее выполненной автоматически.
      Укажите, какая часть решена и почему остальная осталась за пределами работы.
      Протоколы и подробные результаты удобно оформить как
      <a href="/blog/diploma-appendices-listings-diagrams-gost">приложения к ВКР</a> со ссылками из основной части.</p>
  - id: 'example'
    title: 'Учебный пример заключения к дипломному проекту'
    html: |2-
      <p>Цель условной работы — разработать и функционально проверить прототип учета заявок.
      Задачи и подтверждения заданы в таблице выше. Организация, результаты проверки
      и материалы этого примера вымышлены; это образец формулировок, а не отчет о реальном внедрении.</p>
      <div class="article-quote">
          <p>В работе разработан прототип учета заявок, обеспечивающий регистрацию,
          изменение статуса и поиск записей. Полученное решение позволяет представить
          основные операции учета в едином программном интерфейсе.</p>
          <p>При анализе задачи выделены три группы функциональных требований.
          Спроектирована модель заявки с тремя статусами и допустимыми переходами между ними.
          На ее основе реализованы функции регистрации, изменения статуса и поиска.</p>
          <p>Функциональная проверка на учебном стенде включала десять сценариев:
          четыре для регистрации, три для изменения статуса и три для поиска.
          Во всех сценариях получен ожидаемый результат. Тем самым подтверждена работа
          реализованных функций в проверенных условиях; цель разработки и функциональной
          проверки прототипа достигнута в заданных границах.</p>
          <p>Прототип может служить основой для последующей опытной эксплуатации.
          Проверка проводилась с одним пользователем и учебными данными, поэтому ее результаты
          не подтверждают производительность при одновременной работе сотрудников.
          Дальнейшее развитие предполагает разграничение прав доступа и нагрузочные испытания.
          Внедрение и сокращение времени обработки заявок в данной работе не оценивались.</p>
      </div>
      <p>Здесь нет обещания «повысить эффективность на 30 %»: функциональная проверка
      сама по себе не доказывает экономию времени. Для исследовательской ВКР вместо функций
      прототипа подставьте проверенные положения, результаты анализа или экспериментов
      и укажите границы их применимости.</p>
  - id: 'latex'
    title: 'Готовый LaTeX-шаблон заключения'
    html: |2-
      <p>Код ниже — самостоятельный документ для LaTeX-сегмента Labkeeper с оглавлением
      и учебным заключением на следующей странице. Класс <code>extarticle</code> поддерживает
      14 pt, <code>tempora</code> задает шрифт семейства Times, <code>indentfirst</code> сохраняет
      красную строку после заголовка. Параметры оформления сверьте с методичкой.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\documentclass[a4paper,14pt]{extarticle}
      \usepackage[T2A]{fontenc}
      \usepackage[utf8]{inputenc}
      \usepackage[russian]{babel}
      \usepackage{tempora,setspace,indentfirst}
      \usepackage[left=30mm,right=15mm,top=20mm,bottom=20mm]{geometry}
      \onehalfspacing
      \setlength{\parindent}{1.25cm}
      \begin{document}
      \noindent\textit{Учебный пример. Результаты и условия проверки вымышлены.}
      \tableofcontents
      \clearpage
      \section*{\centering\normalsize ЗАКЛЮЧЕНИЕ}
      \addcontentsline{toc}{section}{Заключение}
      В работе разработан прототип учета заявок, обеспечивающий регистрацию,
      изменение статуса и поиск записей. Полученное решение позволяет представить
      основные операции учета в едином программном интерфейсе.

      При анализе задачи выделены три группы функциональных требований.
      Спроектирована модель заявки с тремя статусами и допустимыми переходами между ними.
      На ее основе реализованы функции регистрации, изменения статуса и поиска.

      Функциональная проверка на учебном стенде включала десять сценариев:
      четыре для регистрации, три для изменения статуса и три для поиска.
      Во всех сценариях получен ожидаемый результат. Тем самым подтверждена работа
      реализованных функций в проверенных условиях; цель разработки и функциональной
      проверки прототипа достигнута в заданных границах.

      Прототип может служить основой для последующей опытной эксплуатации.
      Проверка проводилась с одним пользователем и учебными данными, поэтому ее результаты
      не подтверждают производительность при одновременной работе сотрудников.
      Дальнейшее развитие предполагает разграничение прав доступа и нагрузочные испытания.
      Внедрение и сокращение времени обработки заявок в данной работе не оценивались.
      \end{document}</code></pre>
      </div>
      <p><a href="/assets/examples/diploma-conclusion.tex" download>Скачайте полный пример в формате .tex</a>.
      Кнопка «Просмотреть пример» открывает тот же полный самостоятельный документ,
      который приведен выше и доступен для скачивания.</p>
      <p>В готовой ВКР перенесите заголовок, <code>\addcontentsline</code> и свой текст
      заключения после основной части. Преамбулу и второе оглавление добавлять не нужно;
      перед заключением оставьте <code>\clearpage</code>. Звездочка у <code>\section*</code>
      убирает номер раздела, а <code>\addcontentsline</code> добавляет его в содержание.
      После сборки проверьте страницу в оглавлении; подробнее — в руководстве про
      <a href="/blog/automatic-table-of-contents-diploma-gost">автоматическое оглавление ВКР</a>.</p>
  - id: 'checklist'
    title: 'Что проверить перед сдачей ВКР'
    html: |2-
      <ul>
          <li>На каждую задачу из введения дан конкретный ответ, включая частично решенные задачи.</li>
          <li>Цифры и формулировки согласованы с таблицами, расчетами и протоколами основной части.</li>
          <li>Не появились новые результаты, источники аргументации или расчеты без обоснования в главах.</li>
          <li>Практическая значимость отделена от доказанного внедрения и измеренного эффекта.</li>
          <li>Указаны ограничения; планы на будущее не выданы за выполненную работу.</li>
          <li>Объем и заголовок соответствуют методичке, запись в оглавлении ведет на нужную страницу.</li>
      </ul>
      <p>Прочитайте заключение вместе с введением. Если цель предполагает внедрение,
      а получен только прототип, этот разрыв нужно обсудить с руководителем и честно
      отразить в оценке выполнения задач.</p>
tips:
  - title: 'Пишите результат вместо действия'
    html: |2-
      <p>Вместо «проведен анализ требований» уточните, какие требования выделены
      и как они повлияли на решение. Одна конкретная связь полезнее нескольких общих фраз.</p>
  - title: 'Не копируйте выводы по главам подряд'
    html: |2-
      <p>Уберите повторения и объедините промежуточные итоги в ответ на цель работы.
      Оставьте те детали, без которых нельзя понять результат и условия его применения.</p>
