sections:
  - id: 'legal-hierarchy'
    title: 'Юридическая сила и порядок перечисления законов'
    html: |2-
                              <p>В дипломных работах по юриспруденции, государственному управлению,
      экономике и информационной безопасности список литературы традиционно открывается разделом
      нормативно-правовых актов (НПА), что тесно связано с <a
      href="/blog/footnotes-bottom-page-law-history-coursework-gost">постраничными сносками в курсовых
      работах по праву</a>.</p>
                              <p>Методички обычно требуют перечислять нормативные акты <strong>не по
      алфавиту, а по их юридической силе</strong> от высших к низшим. Нарушение этого порядка
      (например, ведомственный приказ выше федерального закона) нормоконтроль считает ошибкой.</p>
  - id: 'acts-in-diploma'
    title: 'Список нормативных актов в дипломе гост: строгая иерархия'
    html: |2-
                              <p>Канонический <strong>список нормативных актов в дипломе гост</strong>
      строится в следующей последовательности:</p>
                              <ol>
                                  <li>Конституция Российской Федерации — она обладает высшей
      юридической силой;</li>
                                  <li>Международные договоры Российской Федерации: по ст. 15
      Конституции они входят в правовую систему страны, и методички обычно ставят их сразу после
      Конституции;</li>
                                  <li>Федеральные конституционные законы (ФКЗ);</li>
                                  <li>Кодексы РФ (в алфавитном порядке);</li>
                                  <li>Федеральные законы РФ (ФЗ) — в хронологическом порядке
      принятия;</li>
                                  <li>Указы и распоряжения Президента РФ;</li>
                                  <li>Постановления и распоряжения Правительства РФ;</li>
                                  <li>Акты министерств и ведомств (приказы Минцифры,
      Минобрнауки);</li>
                                  <li>Региональные законы и постановления субъектов РФ.</li>
                              </ol>
                              <p>Стандарты (ГОСТ), своды правил (СП) и СНиП не являются нормативными
      правовыми актами. Их помещают отдельной группой после НПА или в общий список литературы — как
      требует методичка.</p>
  - id: 'laws-formatting'
    title: 'Оформление законов в списке литературы: Конституция, ФЗ, приказы'
    html: |2-
                              <p>Ниже представлены проверенные образцы (<strong>оформление законов в
      списке литературы</strong> по актуальному ГОСТ Р 7.0.100-2018):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Примеры описания законов</span></div>
                                  <pre><code>1. Конституция Российской Федерации : принята всенародным голосованием 12 декабря 1993 г. с изменениями, одобренными в ходе общероссийского голосования 1 июля 2020 г. // Российская газета. — 2020. — 4 июля.

      2. Гражданский кодекс Российской Федерации (часть первая) : Федеральный закон от 30 ноября 1994 г. № 51-ФЗ : в редакции от 24 июля 2023 г. // Собрание законодательства РФ. — 1994. — № 32. — Ст. 3301.

      3. Об информации, информационных технологиях и о защите информации : Федеральный закон от 27 июля 2006 г. № 149-ФЗ : в редакции от 12 декабря 2023 г. // Российская газета. — 2006. — 29 июля.</code></pre>
                              </div>
  - id: 'electronic-databases'
    title: 'Ссылки на системы КонсультантПлюс и Гарант'
    html: |2-
                              <p>Если закон взят из справочно-правовых систем, в конце описания
      указывают источник доступа (по общим правилам <a
      href="/blog/electronic-resources-bibliography-gost-7-0-100">описания электронных ресурсов по
      ГОСТ 7.0.100</a>):</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">Ссылка на СПС</span></div>
                                  <pre><code>4. О персональных данных : Федеральный закон от 27 июля 2006 г. № 152-ФЗ. — Текст : электронный // КонсультантПлюс : [сайт]. — URL: https://www.consultant.ru/document/cons_doc_LAW_61801/ (дата обращения: 02.09.2026).</code></pre>
                              </div>
  - id: 'latex-subsections'
    title: 'Как разделить список литературы на разделы в LaTeX'
    html: |2-
                              <p>Фильтры пакета <code>biblatex</code> вроде
      <code>\printbibliography[type=legislation]</code> требуют запуска программы Biber, поэтому
      работают только при локальной сборке. В Labkeeper список собирается окружением
      <code>thebibliography</code>, а подзаголовки «Нормативные правовые акты» и «Литература» внутри
      него делают строками <code>\item[]</code> без номера. Нумерация записей при этом остается
      сквозной:</p>
                              <div class="article-code">
                                  <div class="article-code__header"><span
      class="article-code__lang">LaTeX</span></div>
                                  <pre><code>\begin{thebibliography}{99}
      \item[] \textbf{Нормативные правовые акты}
      \bibitem{const} Конституция Российской Федерации : принята всенародным
        голосованием 12~декабря 1993~г. с~изменениями, одобренными в~ходе
        общероссийского голосования 1~июля 2020~г. // Российская газета. ---
        2020. --- 4~июля.
      \bibitem{fz152} О персональных данных : Федеральный закон от 27~июля
        2006~г. №~152-ФЗ. --- Текст : электронный // КонсультантПлюс : [сайт]. ---
        URL: \url{https://www.consultant.ru/document/cons_doc_LAW_61801/}
        (дата обращения: 02.09.2026).
      \item[] \textbf{Литература}
      \bibitem{ivanov} Иванов, И.~И. Защита персональных данных / И.~И.~Иванов.
        --- Москва : Юрайт, 2024. --- 256~с.
      \end{thebibliography}</code></pre>
                              </div>
                              <p>Адрес с символами подчеркивания оборачивайте в
      <code>\url{...}</code>: иначе LaTeX примет <code>_</code> за нижний индекс и остановит
      сборку.</p>
tips:
  - title: 'Обязательное указание редакции'
    html: |2-
      <p>Всегда указывайте актуальную редакцию закона (<em>«в ред. от ДД.ММ.ГГГГ»</em>), чтобы
      нормоконтролер видел, что вы анализировали действующую версию документа.</p>
  - title: 'Сквозная нумерация списка'
    html: |2-
      <p>Даже если список разбит на подразделы (НПА, монографии, сайты), нумерация пунктов [1], [2],
      [3]... должна оставаться единой сквозной от начала до конца.</p>
editorExample:
  latex: |2-
    Основы заданы в~\cite{const,fz152}.
    \begin{thebibliography}{9}
    \item[] \textbf{Нормативные правовые акты}
    \bibitem{const} Конституция Российской Федерации : принята всенародным голосованием 12~декабря
    1993~г. // Российская газета. --- 2020. --- 4~июля.
    \bibitem{fz152} О персональных данных : Федеральный закон от 27.07.2006 №~152-ФЗ // Собрание
    законодательства РФ. --- 2006. --- №~31. --- Ст.~3451.
    \item[] \textbf{Литература}
    \bibitem{ivanov} Иванов, И.~И. Защита персональных данных. --- Москва : Юрайт, 2024. --- 256~с.
    \end{thebibliography}
