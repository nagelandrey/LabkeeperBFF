  - id: 'migration-steps'
    title: 'Пошаговый переход на Labkeeper без потери наработок'
    html: |2-
                              <p>Если часть работы уже написана в Word, не обязательно перепечатывать
      ее заново:</p>
                              <ol>
                                  <li>Создайте в Labkeeper LaTeX-проект: в нем Markdown-сегменты
      собираются в настоящий PDF с полями, нумерацией страниц и сносками;</li>
                                  <li>Первым поставьте LaTeX-сегмент с преамбулой — класс документа,
      кириллица, поля <code>geometry</code> по методичке и <code>\begin{document}</code> (как это
      устроено, разобрано в инструкции по <a href="/blog/markdown-to-pdf-export">экспорту Markdown в
      PDF</a>);</li>
                                  <li>Скопируйте текст глав в Markdown-сегменты и замените заголовки
      на решетки <code>##</code>;</li>
                                  <li>Формулы из Word перенаберите в синтаксисе LaTeX между знаками
      доллара <code>$...$</code>: сами они не переносятся (подробнее — в статье о <a
      href="/blog/latex-word-to-latex">переносе документа из Word в LaTeX</a>);</li>
                                  <li>Нажмите «Выполнить»: PDF соберется на сервере и будет выглядеть
      одинаково на любом компьютере и принтере.</li>
                              </ol>
                              <p><strong>Пример в редакторе</strong> открывает такой гибрид:
      LaTeX-сегмент с оглавлением и Markdown-сегмент с текстом работы.</p>
                              <p>А для форматирования просторных таблиц без слипающихся строк
      воспользуйтесь простым приемом по <a
      href="/blog/latex-arraystretch-table-row-height-spacing">настройке интервалов в таблицах через
      arraystretch</a>.</p>
tips:
  - title: 'Используйте Git для диплома'
    html: |2-
      <p>Храня текст работы в текстовом формате, вы можете делать коммиты после каждого написанного
      раздела и никогда не потеряете наработки при сбое жесткого диска.</p>
  - title: 'Работайте в Labkeeper'
    html: |2-
      <p>Labkeeper сочетает простоту Markdown для быстрого набора текста с типографикой LaTeX: пишите
      текст в Markdown-сегментах LaTeX-проекта, а поля и шрифт задайте один раз в преамбуле.</p>
