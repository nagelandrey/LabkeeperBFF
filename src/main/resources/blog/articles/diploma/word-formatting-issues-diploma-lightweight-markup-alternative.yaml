sections:
  - id: 'word-pain'
    title: 'Классический студенческий кошмар за ночь до защиты'
    html: |2-
                              <p>Знакомая ситуация: вы потратили полгода на написание дипломной
      работы, внесли последние правки в 80-страничный документ Microsoft Word, нажали «Сохранить» и
      открыли файл на флешке в вузовской типографии. И в этот момент происходит катастрофа:
      <strong>съезжает текст в ворде при дипломе</strong>, рисунок 14 улетает на три листа вперед,
      оставляя огромную белую дыру, формулы превращаются в битые растровые картинки, а нумерация
      страниц начинается заново с третьей главы.</p>
                              <p>Причина не в вашей неопытности, а в самой концепции классических
      офисных WYSIWYG-редакторов («What You See Is What You Get»).</p>
  - id: 'why-breaks'
    title: 'Почему съезжает текст в Ворде при дипломе: архитектурные причины'
    html: |2-
                              <p>Почему Word системно ломается на объемных научных документах:</p>
                              <ul>
                                  <li><strong>Зависимость от установленного принтера:</strong> Word
      динамически пересчитывает переносы строк и страниц на основе драйвера текущего принтера по
      умолчанию. Открыли документ на другом ноутбуке — верстка необратимо «поплыла»;</li>
                                  <li><strong>Скрытый мусор форматирования:</strong> при копировании
      кусков текста из браузера или PDF тянутся невидимые стили, неразрывные пробелы и сбойные стили
      абзацев;</li>
                                  <li><strong>Непредсказуемая привязка объектов («Якоря»):</strong>
      плавающие изображения в Word привязаны к невидимому символу абзаца. Добавили одно слово в начале
      главы — и картинка перескакивает через две страницы;</li>
                                  <li><strong>Слабый математический движок:</strong> встроенный
      редактор формул часто конфликтует со шрифтами при конвертации в PDF на разных версиях Windows и
      macOS.</li>
                              </ul>
  - id: 'markup-alternative'
    title: 'Альтернатива Word для написания диплома: подход «Текст как код»'
    html: |2-
                              <p>Единственная надежная <strong>альтернатива word для написания
      диплома</strong> — переход на парадигму разделения контента и оформления (WYSIWYM — «What You
      See Is What You Mean»), реализованную в Markdown и LaTeX.</p>
                              <p>Вы пишете чистый смысловой текст с понятной семантической разметкой
      (<code># Глава 1</code>, <code>$$E=mc^2$$</code>, <code>![Рисунок 1.2](fig.png)</code>), а
      компилятор LaTeX сам рассчитывает взаимное расположение текста, таблиц и иллюстраций. При этом
      вы автоматически получаете все преимущества <a
      href="/blog/latex-hyperref-pdf-bookmarks-navigation">интерактивной навигации и закладок в
      PDF</a>.</p>
