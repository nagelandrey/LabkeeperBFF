sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Слева замените образец измерений, справа смотрите PDF.</li>
      </ol>
      <p>Это отчёт по лабораторной №3.7.1, а не журналная статья. Класс документа — <code>article</code>, поле задаёт <code>geometry</code> с <code>a4paper</code> и <code>total={6in, 9.4in}</code>. Расчёты лежат в вычислительных блоках, округление проекта — три знака.</p>
  - id: description
    title: 'Что видно в PDF'
    html: |2-
      <p>На титуле стоит «Лабораторная работа №3.7.1», подзаголовок «Скин-эффект в полом цилиндре», автор образца Иванов И.И. и дата <code>\today</code>. Номер страницы на титуле скрыт командой <code>\pagenumbering{gobble}</code>, после <code>\maketitle</code> нумерация снова арабская.</p>
      <p>Цель работы в тексте: исследование проникновения переменного магнитного поля в медный полый цилиндр. Дальше идут такие разделы:</p>
      <ul>
          <li><strong>Теоретическая часть.</strong> Скин-эффект для полупространства, скин-эффект в тонком полом цилиндре и процесс измерения. Рисунки: <code>images/skin_effect_halfspace.png</code>, <code>images/hollow_cylinder_fields.png</code>, <code>images/cylinder_wall.png</code>, <code>images/measurement_setup.png</code>.</li>
          <li><strong>Ход работы.</strong> Проводимость через отношение амплитуд, через разность фаз на низких и высоких частотах, через изменение индуктивности, затем отношение магнитных полей.</li>
          <li><strong>Вывод.</strong></li>
      </ul>
      <p>Отношение амплитуд в образце записано как <code>\frac{\abs{H_1}}{\abs{H_0}} = c \cdot \frac{U}{\nu I} = c \xi</code> с меткой <code>eq:otnoshenie_amplitud</code>. Векторные величины набраны пакетом <code>physics</code> с опцией <code>arrowdel</code>.</p>
  - id: commands
    title: 'Какие фрагменты править'
    html: |2-
      <p>Титул и преамбула собраны в первом фрагменте. Графики строит <code>pgfplots</code> с <code>compat=1.9</code>.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\documentclass{article}
      \usepackage[a4paper, total={6in, 9.4in}]{geometry}
      \usepackage[arrowdel]{physics}
      \usepackage{pgfplots}
      \pgfplotsset{compat=1.9}

      \title{\begin{center}Лабораторная работа №3.7.1\end{center}
      Скин-эффект в полом цилиндре}
      \author{Иванов И.И.}
      \date{\today}</code></pre>
      </div>
      <ul>
          <li>Замените автора и подписи к рисункам. Файлы рисунков лежат в <code>images/</code>, имена в <code>\includegraphics</code> менять не нужно, если картинки те же.</li>
          <li>Числа измерений правят в вычислительных блоках рядом с текстом. В PDF попадают только видимые фрагменты.</li>
          <li>Подписи «Скин-эффект в полупространстве», «Эл-магнитные поля в цилиндре», «Стенка цилиндра» и «Установка» уже стоят у рисунков.</li>
      </ul>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Проверьте, что все четыре рисунка нашлись, формулы с <code>\vb*</code> и <code>\abs</code> собрались и что в выводе стоит проводимость, посчитанная по вашим точкам, а не по образцу.</p>
