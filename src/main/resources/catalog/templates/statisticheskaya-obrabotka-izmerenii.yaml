sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Слева замените ряд сопротивлений, справа смотрите PDF.</li>
      </ol>
      <p>Это Markdown-проект. Одно присваивание в образце скрывает подстановку и показывает только значение. Округление проекта — пять знаков.</p>
  - id: description
    title: 'Что видно в PDF'
    html: |2-
      <p>Заголовок: «Лабораторная работа 1.1.3 Статистическая обработка результатов многократных измерений». В образце указаны Михаил Колтаков и дата 7 сентября 2020 г.</p>
      <ul>
          <li><strong>Цель работы:</strong> применение методов обработки экспериментальных данных при измерении сопротивлений.</li>
          <li><strong>В работе используются:</strong> набор резисторов (270 штук), универсальный цифровой вольтметр в режиме измерения сопротивлений постоянному току.</li>
          <li><strong>Теория к работе.</strong> Погрешностью омметра предлагают пренебречь: точность до сотых долей процента меньше разброса номиналов.</li>
          <li><strong>Теория статистики.</strong> Среднее <code>R_{ср} = 1/N \cdot \sum_{k=1}^N R_i</code> и плотность нормального распределения.</li>
          <li><strong>Ход работы.</strong> Таблица <code>table(R)</code>, число резисторов, минимум и максимум, две ширины интервала и две гистограммы.</li>
      </ul>
  - id: commands
    title: 'Какие фрагменты править'
    html: |2-
      <p>Среднее и выборочное отклонение в образце считаются так. Плотность для гистограммы — отдельным блоком <code>y_i</code>.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Расчёт</span></div>
          <pre><code>R_среднее = sum(R_i) / N
      sigma = sqrt(sum((R_i - R_среднее)^2)/N)

      Delta_R_1 = (R_max - R_min) / m_1
      Delta_R_2 = (R_max - R_min) / m_2</code></pre>
      </div>
      <ul>
          <li>Кривая на гистограмме задана AsciiMath: <code>y = 1/(sqrt{2 pi} sigma) e^(-(R - R_{ср})^2 /(4 sigma^2))</code>. В вычислительном блоке в знаменателе экспоненты стоит <code>2 * sigma^2</code>, а не 4: в образце эти две записи различаются, править нужно обе, если меняете формулу.</li>
          <li>Текст хода работы подставляет <code>N</code>, <code>R_max</code>, <code>R_min</code>, <code>m_1</code> и <code>m_2</code> через <code>${...}</code>.</li>
      </ul>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Проверьте, что обе гистограммы построены по вашему ряду из 270 значений и что среднее совпадает с суммой, делённой на <code>N</code>.</p>
