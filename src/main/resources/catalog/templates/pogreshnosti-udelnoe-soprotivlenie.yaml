    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Слева замените измерения диаметра и тока, справа смотрите PDF.</li>
      </ol>
      <p>Это Markdown-проект. Часть присваиваний скрыта из PDF: у них выключены формула, подстановка или погрешность. Округление проекта — до первой значащей цифры.</p>
  - id: description
    title: 'Что видно в PDF'
    html: |2-
      <p>Заголовок: «Лабораторная работа 1.1.1 Определение систематических и случайных погрешностей при измерении удельного сопротивления нихромовой проволоки». В образце указаны Михаил Колтаков и дата 21 сентября 2020 г.</p>
      <ul>
          <li><strong>Цель работы.</strong> Измерить удельное сопротивление и вычислить систематические и случайные погрешности линейки, штангенциркуля, микрометра, амперметра, вольтметра и моста постоянного тока.</li>
          <li><strong>Оборудование.</strong> Линейка, штангенциркуль, микрометр, отрезок проволоки из нихрома, амперметр, вольтметр, источник ЭДС, мост постоянного тока, реостат.</li>
          <li><strong>Теория.</strong> Величины <code>\rho</code>, <code>d</code>, <code>l</code>, <code>R_{пр}</code>, <code>R_A</code>, <code>R_V</code>, <code>R</code>, ЭДС источника и показание вольтметра.</li>
          <li>Диаметр измеряют дважды. Для штангенциркуля в тексте оставлена только систематическая погрешность, для микрометра — и систематическая, и случайная.</li>
          <li><strong>Вывод.</strong> В образце сказано, что полученное удельное сопротивление входит в допустимые значения для нихрома. Итог выведен строкой <code>\rho =</code> и подстановкой <code>${rho}</code> в Ом·см.</li>
          <li>График вольт-амперных характеристик для длин 20, 30 и 50: линии и точки.</li>
      </ul>
  - id: commands
    title: 'Какие фрагменты править'
    html: |2-
      <p>Таблица диаметров уже задана так. Дальше среднее по каждому ряду подставляется в текст.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Расчёт</span></div>
          <pre><code>table(n, d_1, d_2, name_1 = "№", name_2 = "$d_1$, мм", name_3 = "$d_2$, мм")</code></pre>
      </div>
      <ul>
          <li>Строка <code>d_1 = d_1_сред # sigma_circul</code> задаёт диаметр по штангенциркулю и его систематическую погрешность.</li>
          <li>График называет серии <code>L = 20</code>, <code>L = 30</code> и <code>L = 50</code>. У каждой есть линия (<code>V_20_</code>, <code>V_30_</code>, <code>V_50_</code>) и точки (<code>V_20</code>, <code>V_30</code>, <code>V_50</code>).</li>
      </ul>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
