    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Начните подготовку: слева — исходный код LaTeX, справа — окно просмотра PDF.</li>
      </ol>
  - id: description
    title: 'Описание шаблона научной статьи с примерами'
    html: |2-
      <p>В редакторе продолжите изменения в поле Файлы. Создайте папку с фамилией первого автора (например, Phamiliya).</p>
      <p>Скопируйте для дальнейшего редактирования содержимое файла <code>Zinina.tex</code>, заменив название (например, <code>Phamiliya.tex</code>), и продолжайте работу в нем.</p>
      <p>В файле <code>ZhurnalSVMO2020_23_1.tex</code> укажите путь к файлу Вашей рукописи:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX ZhurnalSVMO2020_23_1.tex</span></div>
          <pre><code>\input{Phamiliya/Phamiliya.tex} % Образец статьи на расском языке</code></pre>
      </div>
      <p>Для статьи на русском языке также готовится перевод на английский язык следующих элементов:</p>
      <ul>
          <li>название рукописи;</li>
          <li>авторы, аффилиация;</li>
          <li>аннотация, ключевые слова;</li>
          <li>ссылка на публикацию;</li>
          <li>об авторах;</li>
          <li>подписи к рисункам и таблицам;</li>
          <li>список литературы.</li>
      </ul>
      <p>Первая страница оформляется целиком благодаря одной команде <code>\headerRus{УДК}{Название}{Авторы}{Авторы и аффилиация}{аффилиация}{Аннотация.}{ключевые слова}{Titlename}{Authors}</code>. Каждые метаданные указываются в своих фигурных скобках.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\headerRus{515.163}
      {Классификация надстроек над декартовыми произведениями меняющих ориентацию диффеоморфизмов окружности}
      {С.\,Х. Зинина, П.\,И. Починка}
      {С.\,Х. Зинина\superscript{1}, П.\,И. Починка\superscript{2}}
      {\superscript{1} \textit{ФГБОУ ВО «МГУ им. Н. П. Огарёва» (г. Саранск, Российская Федерация)} \superscript{2} \textit{Национальный исследовательский университет &lt;&lt;Высшая школа экономики&gt;&gt; (г.~Нижний Новгород, Российская Федерация)}
      }
      {Аннотация.}
      {ключевые слова}
      {Titlename}
      {A. Author, A. A. Author}</code></pre>
      </div>
      <p><strong>Цитирование рукописи</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\forCitationRus{Зинина С. Х., Починка П. И.}{Классификация надстроек над декартовыми произведениями меняющих ориентацию диффеоморфизмов окружности}</code></pre>
      </div>
      <p><strong>Об авторах</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\textbf{Зинина Светлана Халиловна}, аспирант кафедры прикладной математики, дифференциальных уравнений и теоретической механики, ФГБОУ ВО «МГУ им. Н.~П.~Огарёва» (430005, Россия, г. Саранск, ул. Большевистская, д. 68/1), ORCID: http://orcid.org/0000-0003-3002-281X, kapkaevasvetlana@yandex.ru

      \textbf{Починка Павел Ильич}, студент факультета информатики, математики и компьютерных наук, Национальный исследовательский университет &lt;&lt;Высшая школа экономики&gt;&gt;
      }

      \parbox{13cm}
      {\small
      (603150, Россия, г. Нижний Новгород, ул. Б. Печерская, д. 25/12), ORCID: https://orcid.org/0000-0002-6377-747X, pavel-pochinka@yandex.ru
      }</code></pre>
      </div>
      <p>Аналогичный англоязычный блок:</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX \headerEn</span></div>
          <pre><code>\headerEn{57N10}{Classification of suspensions over cartesian products of~orientation-reversing diffeomorphisms of a circle}
      {S. Kh. Zinina, P. I. Pochinka}
      {S. Kh. Zinina\superscript{1}, P. I. Pochinka\superscript{2}}
      {\superscript{1} \textit{National Research Mordovia State University (Saransk, Russian Federation)}\\
      \superscript{2} \textit{Higher School of Economics (Nizhny Novgorod, Russian Federation)}}
      {This paper introduces class $G$ containing Cartesian products of orientation-changing rough transformations of the circle and studies their dynamics. As it is known from the paper of A.G. Maier non-wandering set of orientation-changing diffeomorphism of the circle consists of $2q$ periodic points, where $q$ is some natural number. So Cartesian products of two such diffeomorphisms has $4q_1q_2$ periodic points where $q_1$ corresponds to the first transformation and $q_2$ corresponds to the second one. The authors describe all possible types of the set of periodic points, which contains $2q_1q_2$ saddle points, $q_1q_2$ sinks, and $q_1q_2$ sources; $4$ points from mentioned $4q_1q_2$ periodic ones are fixed, and the remaining $4q_1q_2-4$ points have period $2$. In the theory of smooth dynamical systems, a very useful result is that, given a diffeomorphism $f$ of a manifold, one can construct a flow on a manifold with dimension one greater; this flow is called the suspension over $f$. The authors introduce the concept of suspension over diffeomorphisms of class $G$, describe all possible types of suspension orbits and the number of these orbits. Besides that, the authors prove a theorem on the topology of the manifold on which the suspension is given. Namely, the carrier manifold of the flows under consideration is homeomorphic to the closed 3-manifold $\mathbb T^2 \times [0,1]/\varphi$, where $\varphi :\mathbb T^ 2 \to \mathbb T^2$. The main result of the paper says that suspensions over diffeomorphisms of the class $G$ are topologically equivalent if and only if corresponding diffeomorphisms are topologically conjugate. The idea of the proof is to show that the topological equivalence of the suspensions $\phi^t$ and $\phi'^t$ implies the topological conjugacy of $\phi$ and $\phi'$.}
      {rough systems of differential equations, rough circle transformations, orientation-reversing circle transformations, Cartesian product of circle transformations, suspension over a diffeomorphism}</code></pre>
      </div>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
