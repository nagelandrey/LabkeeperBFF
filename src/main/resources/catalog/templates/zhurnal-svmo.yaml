  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в интерфейсе Labkeeper. Встроенный компилятор соберет документ и отобразит PDF-файл в окне предпросмотра.</p>
      <p>В Labkeeper встроены инструменты искусственного интеллекта, которые помогают находить и исправлять ошибки верстки за один клик прямо в интерфейсе редактора. Используйте встроенного AI-агента для исправления ошибок.</p>
  - id: submit
    title: 'Отправка статьи в редакцию журнала'
    html: |2-
      <p>Удалите ненужные файлы в проекте, относящиеся к демонстрационным шаблонным (например, <code>ZhurnalSVMO2020_23_1.tex</code>, <code>ZhurnalSVMO2020_23_1.pdf</code>, папку <code>Zinina</code>).</p>
      <p>Скачайте проект и отправьте в редакцию согласно разделу <a href="https://journal.svmo.ru/site/index">«Руководство для авторов»</a> на сайте «Журнал Средневолжского математического общества».</p>
