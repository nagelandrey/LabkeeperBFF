sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Слева замените таблицы образца, справа смотрите PDF.</li>
      </ol>
      <p>В каталоге примеров проект подписан как 3.1.3, а на титуле самого отчёта стоит «Работа 2.1.1». Класс документа — <code>article</code>, опции <code>a4paper</code> и <code>12pt</code>. Поля: слева и справа 2 см, сверху 2 см, снизу 3 см. Заголовки без номера: перед ними стоит звёздочка. Округление проекта — до первой значащей цифры.</p>
  - id: description
    title: 'Что видно в PDF'
    html: |2-
      <p>Автор образца — Иванов Иван, группа 825. После <code>\maketitle</code> идёт новая страница.</p>
      <ul>
          <li><strong>Цель работы.</strong> Определить характеристики шарообразных неодимовых магнитов и измерить горизонтальную и вертикальную составляющие индукции магнитного поля Земли и магнитное наклонение.</li>
          <li><strong>В работе используются:</strong> 12 одинаковых неодимовых шариков, тонкая нить, медная проволока диаметром 0,5–0,6 мм, электронные весы, секундомер, измеритель магнитной индукции АТЕ-8702, штангенциркуль, брусок 25×30×60 мм, деревянная линейка, штатив, ещё около 20 шариков, набор гирь и разновесов.</li>
          <li><strong>Теоретическая справка.</strong> Точечный магнитный диполь, неодимовые магниты, момент по колебаниям и по силе сцепления, горизонтальная и вертикальная составляющие, магнитное наклонение.</li>
          <li><strong>Ход работы.</strong> Три подраздела с теми же измерениями и таблицы периодов и моментов.</li>
          <li><strong>Используемая литература.</strong></li>
      </ul>
      <p>Магнитный момент витка в образце записан как <code>\vec{P_m} = \dfrac{I}{c}\vec{S}</code>.</p>
  - id: commands
    title: 'Какие фрагменты править'
    html: |2-
      <p>Таблица горизонтальной составляющей уже задана так. Столбцы — число шариков, время, число колебаний и период.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Расчёт</span></div>
          <pre><code>table(horizontal_ball_count, total_time_s, oscillation_count, horizontal_period_s_display, name_1="$n$", name_2="$t$, с", name_3="$N$", name_4="$T$, с", orientation="horizontal")</code></pre>
      </div>
      <ul>
          <li>Вертикальная составляющая собрана в таблицу <code>vertical_ball_count</code>, <code>balance_mass_g_display</code>, <code>lever_arm_cm_display</code>, <code>vertical_moment_dyn_cm_display</code>. Подписи: <code>n</code>, <code>m</code> в граммах, <code>r</code> в сантиметрах, <code>M</code> в дин·см.</li>
          <li>Интервалы заголовков задаёт <code>titlesec</code>: <code>\titlespacing{\section}{\parindent}{5mm}{5mm}</code> и то же для <code>\subsection</code>.</li>
          <li>Графики рисует <code>pgfplots</code> с <code>compat=1.9</code>. Счётчик графиков — <code>\newcounter{graph}</code>.</li>
      </ul>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Проверьте обе составляющие поля и наклонение: в таблицах должны быть ваши периоды и массы, а не образец.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>В проекте уже собраны теория диполя, список приборов и таблицы колебаний. Остаётся подставить свои измерения.</p>
