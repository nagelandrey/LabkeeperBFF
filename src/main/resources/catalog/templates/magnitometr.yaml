sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Слева замените таблицы образца, справа смотрите PDF.</li>
      </ol>
      <p>Класс документа — <code>article</code>, опции <code>a4paper</code> и <code>12pt</code>. В комментарии к классу сказано, что <code>leqno</code> включает нумерацию формул слева. Номера видны только у формул, на которые есть ссылка: <code>\mathtoolsset{showonlyrefs=true}</code>. Округление проекта — до первой значащей цифры.</p>
  - id: description
    title: 'Что видно в PDF'
    html: |2-
      <p>Титул без названия вуза: строка «УЧЕБНОЕ ЗАВЕДЕНИЕ», предмет «Физика», «Отчёт о выполнении лабораторной работы». Автор образца — Иванов Иван Иванович, дата «Октябрь 2022».</p>
      <p>Аннотация: исследован магнитометр, измерена горизонтальная составляющая магнитного поля Земли и по двум способам сопоставлены единицы тока СИ и СГС.</p>
      <ul>
          <li><strong>Теоретические сведения.</strong> Общие сведения о магнитометре, экспериментальная установка, определение горизонтальной составляющей и электродинамической постоянной. В тексте эталонные магнитометры указаны с точностью <code>10^{-6}</code> Э.</li>
          <li><strong>Установка.</strong> Круговые витки К, в центре кольца радиуса <code>R</code> на нити подвешена стрелка С, крыльчатка погружена в масло. Рисунок с меткой <code>fig:setup</code>.</li>
          <li><strong>Оборудование и инструментальные погрешности.</strong></li>
          <li><strong>Результаты.</strong> Горизонтальная составляющая и электродинамическая постоянная, затем «Полученные значения» и «Выводы».</li>
      </ul>
  - id: commands
    title: 'Какие фрагменты править'
    html: |2-
      <p>Первая таблица отклонений уже задана так. Столбцы — номер измерения и два положения в сантиметрах.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Расчёт</span></div>
          <pre><code>table(measurement_1, x1_plus_cm, x1_minus_cm, name_1="№ измерения", name_2="x1+, см", name_3="x1-, см", orientation="horizontal")</code></pre>
      </div>
      <ul>
          <li>Вторая серия называется так же, но столбцы <code>x2+, см</code> и <code>x2-, см</code>, переменные <code>measurement_2</code>, <code>x2_plus_cm</code>, <code>x2_minus_cm</code>.</li>
          <li>Между таблицами стоят формулы AsciiMath и короткие фрагменты Markdown: их правят отдельно от LaTeX-разделов.</li>
          <li>Ссылки в PDF синие: <code>\hypersetup{colorlinks=true,urlcolor=blue}</code>.</li>
      </ul>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Проверьте обе серии отклонений и что в выводах стоят ваши значения горизонтальной составляющей и электродинамической постоянной.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>В проекте уже собраны описание установки, две таблицы отклонений и выводы. Остаётся подставить свои измерения.</p>
