      2020, vol.~65, no.~3, pp.~909--924.

      \bibitem{Waarde2020} Waarde, H.J., Eising, J., Trentelman, H.L., and Camlibel, M.K.,
      Data Informativity: a New Perspective on Data-Driven Analysis and Control,
      \textit{IEEE Trans. Automat. Control}, 2020, vol.~65, no.~11, pp.~4753--4768.

      \bibitem{Slemma} Waarde, H.J., Camlibel, M.K., and Mesbahi, M., From Noisy Data
