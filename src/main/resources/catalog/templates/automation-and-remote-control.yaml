  - id: description
    title: 'Описание шаблона, примеры оформления ключевых элементов'
    html: |2-
      <p>Правильное оформление статьи РАН в LaTeX — залог быстрой проверки рукописи рецензентами.
      Шаблон предназначен для подготовки научной статьи на английском языке для подачи в журнал
      «Автоматика и телемеханика».</p>
      <p>Стилевой файл журнала «Автоматика и телемеханика», «Automation and Remote Control» и основной
      tex-файл шаблона ARC-Example.tex содержит привычные для редактирования разделы: название статьи,
      информация об авторах, аффилиация.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX название статьи, аффилиация</span></div>
          <pre><code>\title{Design of Generalized $H_{\infty}$-suboptimal Controllers\\ Based on Experimental
      and A Priori Data}%

      \author{I. I.~Ivanov (ivanov@yandex.ru)
      \\
      (Lobachevsky University, Nizhny Novgorod, Russia),
      \\
      P. P.~Petrov (petrov@yandex.ru)
      \\
      (St. Petersburg State  University, St.~Petersburg, Russia ),
      \\
      S. S. Sidorov (sidorov@Yandex.ru)
      \\
      (Trapeznikov Institute of Control Sciences, Russian Academy of Sciences,\\ Moscow, Russia)}</code></pre>
      </div>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX аннотация, ключевые слова</span></div>
          <pre><code>\begin{abstract}
      This paper considers a linear continuous- or discrete-time dynamic object in the absence of its mathematical model. ...

      \KeyWords generalized $H_{\infty}$ norm, uncertainty, robust control, experimental data, dual systems, linear matrix inequalities
      \end{abstract}</code></pre>
      </div>
      <p>Примеры оформления ключевых элементов:</p>
      <p><strong>Математические формулы</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX выносная формула с номером</span></div>
          <pre><code>\begin{gather} \label{Gamma}
      \Gamma=\widehat \Omega+\widetilde \Phi [\widehat \Phi^{\rm T}(\widehat \Phi \widehat \Phi^{\rm T})^{-1} \widehat \Phi-I] \widetilde \Phi^{\rm T} \ge 0,
      \end{gather}</code></pre>
      </div>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX выносная формула с номером с двумя выровненными равенствами</span></div>
          <pre><code>\begin{gather}\label{eqsys}
      \begin{split}
      &amp;\partial x(t)=A x(t)+B u(t)+w(t), \quad x(0)=x_0,\\[.2em]
      &amp;z(t)=C x(t)+D u(t)
      \end{split}
      \end{gather}</code></pre>
      </div>
      <div style="background-color: #f2f9f3; border-left: 4px solid #2da44e; border-radius: 0 6px 6px 0; padding: 16px; margin: 16px 0;">
          <div style="font-weight: bold; color: #1a7f37; margin-bottom: 8px;">Обратите внимание</div>
          <p style="margin: 0;">Не все выносные формулы должны иметь номер. Нумеруйте только те формулы, на которые есть ссылка в тексте.</p>
      </div>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX выносная формула без номера</span></div>
          <pre><code>\begin{gather*}
      \Phi=\left(x_{0} \cdots x_{N-1}\right), \quad  \Phi_+=\left(x_{1} \cdots x_{N}\right),\\[.3em]
      U=\left(u_{0} \cdots u_{N-1}\right), \quad W=\left(w_{0} \cdots w_{N-1}\right), \quad Z=\left(z_{0} \cdots z_{N-1}\right).
      \end{gather*}</code></pre>
      </div>
      <p><strong>Иллюстрации (графики и схемы)</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX рисунок формата .eps с заголовком</span></div>
          <pre><code>\begin{figure}[t]
      \centering{\includegraphics[width=113mm]{Fig-3.eps}}
      {\caption{The guaranteed estimates of the $H_{\infty}$ norm as functions of the disturbance level in experimental data for different types of available information.}}
      \end{figure}</code></pre>
      </div>
      <p><strong>Заголовок и подзаголовок</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX section и subsection</span></div>
          <pre><code>\section{Introduction}
      \section{Problem Statement}
      \subsection{Ccccccccc Vvvvvvv}</code></pre>
      </div>
      <div style="background-color: #f2f9f3; border-left: 4px solid #2da44e; border-radius: 0 6px 6px 0; padding: 16px; margin: 16px 0;">
          <div style="font-weight: bold; color: #1a7f37; margin-bottom: 8px;">Обратите внимание</div>
          <p style="margin: 0;">Вне зависимости от написания текста внутри фигурных скобок в результате применяется перевод в верхний регистр (текст — ТЕКСТ). Во многих журналах встречается и капитализация символов в заголовках, подзаголовках, а также в библиографии (в названиях литературы и названиях журналов).</p>
      </div>
      <p><strong>Лемма, теорема, утверждение</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX теоремоподобные окружения</span></div>
          <pre><code>\begin{lemma} \label{bfDelta}
      If the information matrix...
      \end{lemma}

      \begin{corollary}
      For ${v(t) \,\equiv\, 0},$ the $\gamma_0$ norm...
      \end{corollary}

      \begin{proposition}\label{prop:02}%
      For any ${m\in\mathbb{Z\vphantom{\overline{Z}}}^{\hspace*{.08em}+}\setminus0},$...
      \end{proposition}</code></pre>
      </div>
      <div style="background-color: #f2f9f3; border-left: 4px solid #2da44e; border-radius: 0 6px 6px 0; padding: 16px; margin: 16px 0;">
          <div style="font-weight: bold; color: #1a7f37; margin-bottom: 8px;">Обратите внимание</div>
          <p style="margin: 0;">Полный список теоремоподобных окружений можно подглянуть в файле <code>iitparc.cls</code>. Например, <code>\newtheorem*{proof}{Proof}{\bfseries}{\rm}</code>, можем использовать в тексте статьи <code>\begin{proof}</code> Текст доказательства. <code>\end{proof}</code></p>
      </div>
      <p><strong>Список литературы и ссылка в тексте</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX библиография и ссылка на источник в тексте</span></div>
          <pre><code>\begin{thebibliography}{30}

      \bibitem{Qrodzovskiy} Grodzovskii, G.L., Ivanov, Yu.N., and
      Tokarev, V.V., \textit{Mekhanika kosmicheskogo poleta. Problemy
      optimizatsii} (Mechanics of Space Flight. Optimization
      Problems), Moscow: Nauka, 1975.

      \bibitem{Xayrer} Hairer, E., Norsett, S.P., and Wanner, G.,
      \textit{Solving Ordinary Differential Equations: I. Nonstiff
      Problems\/}, Berlin: Springer, 1987. Translated under the title
      \textit{Resheniye obyknovennykh differentsial'nykh uravnenii\/},
      Moscow: Mir, 1990.

      \bibitem{WillemsPersistent2005} Willems, J.C., Rapisarda, P., Markovsky, I., and
      De Moor, B., A Note on Persistency of Excitation, \textit{Syst. Control Lett.},
      2005, vol.~54, pp.~325--329.

      \bibitem{Persis2020} De Persis, C. and Tesi, P., Formulas for Data-Driven Control:
