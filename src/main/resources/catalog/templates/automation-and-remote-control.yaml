      In~\cite{Scherer2023,KoStAT23}, the state feedback...</code></pre>
      </div>
      <div style="background-color: #f2f9f3; border-left: 4px solid #2da44e; border-radius: 0 6px 6px 0; padding: 16px; margin: 16px 0;">
          <div style="font-weight: bold; color: #1a7f37; margin-bottom: 8px;">Обратите внимание</div>
          <p style="margin: 0;">Перед командой <code>\cite{}</code> используется символ <code>~</code> (тильда) сразу после предыдущего слова как неразрывный пробел. Он запрещает перенос строки, устанавливая пробел заданной ширины, чтобы ссылка не была перенесена на новую строку и не оторвалась от контекста.</p>
          <p style="margin: 8px 0 0;">Правильно: <code>Word~\cite{}</code>. Неправильно: <code>Word \cite{}</code>. <code>Word\cite{}</code>. <code>Word \~\cite{}</code>. <code>Word ~ \cite{}</code>. <code>Word\~ \cite{}</code>. <code>Word\cite{}</code>.</p>
      </div>
