sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Слева замените ряды импульсов, справа смотрите PDF.</li>
      </ol>
      <p>Это Markdown-проект, не сплошной LaTeX-файл. Текст, формулы AsciiMath и вычислительные блоки чередуются. Округление проекта — три знака.</p>
  - id: description
    title: 'Что видно в PDF'
    html: |2-
      <p>Заголовок: «Лабораторная работа 1.1.4 Измерение интенсивности радиационного фона». В образце указаны Балдин Виктор, группа Б01-303 и дата 21 октября 2023 г.</p>
      <ul>
          <li><strong>Аннотация.</strong> Цель — статистические закономерности при измерении фона. Оборудование: счётчик Гейгера-Мюллера (CTC-6), блок питания, компьютер с интерфейсом связи со счётчиком.</li>
          <li><strong>Теоретические сведения.</strong> Число частиц за 10 и за 40 секунд. Для короткого интервала в тексте рекомендован закон Пуассона, для длинного — нормальное распределение.</li>
          <li>Две одинаковые обработки: таблица импульсов, гистограмма, среднее, дисперсия и <code>epsilon = 1 / sqrt(n_среднее * N)</code>.</li>
          <li><strong>Обсуждение результатов.</strong> Теоретическое отклонение <code>\sigma = \sqrt{\overline n}</code> сравнивается с опытом в отдельной таблице.</li>
      </ul>
  - id: commands
    title: 'Какие фрагменты править'
    html: |2-
      <p>Гистограмма для 10 секунд уже задана так. Для 40 секунд тот же вызов использует <code>n_imp_40</code>, <code>w_2</code> и <code>size_1 = 2</code>.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Расчёт</span></div>
          <pre><code>plot(
        title = "Гистограмма распределения для 10 секунд",
        x_1 = n_imp_10, y_1 = w_1, type_1 = "histogram", size_1 = 1
      )</code></pre>
      </div>
      <ul>
          <li>Таблица опыта: столбцы «Число импульсов», «Число случаев», «Доля случаев», ориентация <code>vertical</code>, <code>limit=40</code>.</li>
          <li>Среднее и отклонение выводятся формулами AsciiMath <code>n_(среднее_1) = ${n_среднее_1}</code> и <code>sigma_(n_1) = ${sigma_1}</code>.</li>
          <li>В обсуждении таблица сравнивает <code>sigma_1</code> с <code>sqrt(n_среднее_1)</code> и то же для 40 секунд. В заголовке столбца образца написано <code>\sigma_{эксперемент}</code> — так и стоит в проекте.</li>
      </ul>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Проверьте обе гистограммы и что в обсуждении экспериментальная сигма сравнивается с корнем из среднего по вашим рядам.</p>
