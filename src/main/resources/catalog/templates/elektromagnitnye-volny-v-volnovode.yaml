sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Слева замените таблицы образца, справа смотрите PDF.</li>
      </ol>
      <p>Класс документа — <code>article</code> с опцией <code>a4paper</code>. Поля <code>geometry</code>: слева 30 мм, сверху 20 мм, справа 20 мм, снизу 20 мм, <code>footskip=10mm</code>. Округление проекта — три знака.</p>
  - id: description
    title: 'Что видно в PDF'
    html: |2-
      <p>Титул набран средой <code>titlepage</code>: «Московский физико-технический институт», название «Электромагнитные волны в волноводах», строка «выполнил студент 653 группы ФФКЭ», автор образца Иванов И.И., «Долгопрудный, 2017 г.».</p>
      <p>Дальше идут такие разделы:</p>
      <ul>
          <li><strong>Цель работы.</strong> Ознакомление с методами получения и анализа электромагнитных волн СВЧ-диапазона.</li>
          <li><strong>В работе используются:</strong> генератор СВЧ типа Г4-83, измерительная линия Р1-28, усилитель 28 ИМ, заглушка, отрезок волновода с поглощающей нагрузкой, отрезки волноводов различных сечений, детекторная головка.</li>
          <li><strong>Теоретические положения.</strong> Концепция Бриллюэна и рисунок <code>images/plane_wave_reflection.png</code> с подписью «Отражение плоской волны от проводящей плоскости».</li>
          <li><strong>Экспериментальная установка.</strong> Волны при частоте выше критической и ниже критической.</li>
          <li><strong>Выполнение работы.</strong> Структура волн выше критической частоты и затухание ниже критической. Таблицы зонда и графики строятся вычислительными блоками.</li>
          <li><strong>Вывод.</strong></li>
      </ul>
  - id: commands
    title: 'Какие фрагменты править'
    html: |2-
      <p>Таблица и график зонда уже заданы так. Подписи осей и названия столбцов меняют в этих вызовах, числа — в данных, на которые они ссылаются.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Расчёт</span></div>
          <pre><code>table(detector_voltage_mV_display, probe_position_mm_display, name_1="$U$, мВ", name_2="$z$, мм", orientation="vertical")

      plot(title="Зависимость показаний вольтметра от положения зонда", x_name="z, мм", y_name="U, мВ", x_1=probe_position_mm, y_1=detector_voltage_mV, type_1="scatter", color_1="blue", x_2=probe_position_mm, y_2=detector_voltage_mV_line, type_2="line", color_2="blue")</code></pre>
      </div>
      <ul>
          <li>Ниже критической частоты таблица связывает ослабление <code>generator_attenuation_dB_display</code> и длину <code>guide_length_cm_display</code>. График называется «Зависимость ослабления входящего сигнала от длины волновода».</li>
          <li>Отдельный график «Определение характера детектирования зонда» откладывает <code>ln(|z| / 1 мм)</code> и <code>ln(U / 1 мВ)</code> слева и справа от узла.</li>
      </ul>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Проверьте титул, список приборов и что оба режима — выше и ниже критической частоты — показывают ваши точки, а не образец.</p>
