sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Слева замените образец «Your Name Here», справа смотрите PDF.</li>
      </ol>
      <p>Класс — <code>altacv</code> версии 1.7.4 (30 июля 2025, LianTze Lim), опции <code>10pt</code>, <code>a4paper</code>, <code>withhyper</code>.
      Шаблон собирается pdfLaTeX, XeLaTeX и LuaLaTeX. Поля: слева и справа 1,25 см, сверху и снизу 1,5 см, промежуток колонок 1,2 см.</p>
  - id: description
    title: 'Что внутри шаблона'
    html: |2-
      <p>Шапка: имя, строка должности <code>\tagline</code> и круглое фото справа, файл <code>Globe_High</code> шириной 2,8 см.
      Обычное прямоугольное фото включается опцией класса <code>normalphoto</code>. В блок контактов уже внесены почта, телефон, адрес, локация, сайт, X, LinkedIn, GitHub, ORCID, GitLab и Mastodon. Лишние строки можно удалить.</p>
      <p>Текст стоит в двух колонках <code>paracol</code>, отношение ширины 6:4. Левая колонка:</p>
      <ul>
          <li><strong>Experience</strong> — две должности через <code>\cvevent</code>, у каждой срок, место и список обязанностей.</li>
          <li><strong>Projects</strong> — два проекта: у первого маркированный список, у второго короткая аннотация.</li>
          <li><strong>A Day of My Life</strong> — круговая диаграмма <code>\wheelchart</code>: сон, вечерняя работа над текстом, дневная работа, спорт и семья.</li>
          <li><strong>Publications</strong> — книги, журнальные статьи и труды конференций. Записи берутся из <code>sample.bib</code>, в образец включены все через <code>\nocite{*}</code>.</li>
      </ul>
      <p>Правая колонка:</p>
      <ul>
          <li><strong>My Life Philosophy</strong> — цитата-заглушка в одну фразу.</li>
          <li><strong>Most Proud of</strong> — три достижения с иконками через <code>\cvachievement</code>.</li>
          <li><strong>Strengths</strong> — теги: Hard-working, Eye for detail, Motivator &amp; Leader, C++, Embedded Systems, Statistical Analysis.</li>
          <li><strong>Languages</strong> — English 5, Spanish 4, German 3,5. Дробные оценки поддерживаются.</li>
          <li><strong>Education</strong> — Ph.D., M.Sc. и B.Sc. с годами и названием диссертации у первой степени.</li>
          <li><strong>Referees</strong> — два рекомендателя: имя, институт, почта и адрес.</li>
      </ul>
  - id: commands
    title: 'Какие команды править'
    html: |2-
      <p>Цвета уже заданы: акценты PastelRed <code>#8F0D0D</code>, заголовки DarkPastelRed, линейки GoldenEarth, текст LightGrey. Имя — чёрное, шрифт шапки на pdfLaTeX — Lato и Roboto, на XeLaTeX и LuaLaTeX — Roboto Slab и Lato.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\name{Your Name Here}
      \tagline{Your Position or Tagline Here}
      \photoR{2.8cm}{Globe_High}
      \personalinfo{%
        \email{your_name@email.com}
        \phone{000-00-0000}
        \location{Location, COUNTRY}
        \homepage{www.homepage.com}
        \linkedin{your_id}
        \github{your_id}
      }
      \makecvheader
      \columnratio{0.6}
      \begin{paracol}{2}
      \cvsection{Experience}
      \cvevent{Job Title 1}{Company 1}{Month 20XX -- Ongoing}{Location}
      \switchcolumn
      \cvsection{Education}
      \end{paracol}</code></pre>
      </div>
      <ul>
          <li>Своё имя в публикациях перечисляют в <code>\mynames</code>. Пробел в имени кодируют как <code>\bibnamedelima</code>, после последнего имени пробел не ставят.</li>
          <li>Числовой стиль списка подключён файлом <code>pubs-num</code>. Автор-год (APA) лежит в закомментированном <code>pubs-authoryear</code>: чтобы переключить стиль, замените <code>\input</code>.</li>
          <li>Маркер списка — <code>\cvItemMarker</code>, оценка навыка — кружок <code>\cvRatingMarker</code>. Иконки даты и места для <code>\cvevent</code> в образце закомментированы.</li>
          <li>Для языка кроме английского задайте <code>\locationname</code> и <code>\datename</code>, иначе при копировании из PDF вместо слов попадут подписи иконок.</li>
          <li>Теги <code>\cvtag</code> рассчитаны на короткие подписи. Длинную фразу лучше отдать в список, а не в плашку.</li>
      </ul>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Публикации собираются из <code>sample.bib</code>, фото лежит отдельным файлом рядом с классом <code>altacv.cls</code>.</p>
      <p>Проверьте, что колонки не наезжают друг на друга и что диаграмма не перекрывает следующий раздел. Разрыв только текущей колонки даёт <code>\newpage</code> внутри <code>paracol</code>. Если резюме уезжает на лишнюю страницу, сократите публикации или уберите диаграмму.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>В проекте уже собраны класс AltaCV, пример библиографии и двухколоночная вёрстка. Остаётся подставить свои данные.</p>
