  - id: description
    title: 'Описание шаблона научной статьи с примерами'
    html: |2-
      <p><strong>Рубрика журнала и название</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\title{РУБРИКА ЖУРНАЛА
      %ТЕОРЕТИЧЕСКАЯ И МАТЕМАТИЧЕСКАЯ ФИЗИКА
      %ФИЗИКА АТОМНОГО ЯДРА И ЭЛЕМЕНТАРНЫХ ЧАСТИЦ
      %РАДИОФИЗИКА, ЭЛЕКТРОНИКА, АКУСТИКА
      %ОПТИКА И СПЕКТРОСКОПИЯ. ЛАЗЕРНАЯ ФИЗИКА
      %ФИЗИКА КОНДЕНСИРОВАННОГО СОСТОЯНИЯ ВЕЩЕСТВА
      %ХИМИЧЕСКАЯ ФИЗИКА, ФИЗИЧЕСКАЯ КИНЕТИКА И ФИЗИКА ПЛАЗМЫ
      %БИОФИЗИКА И МЕДИЦИНСКАЯ ФИЗИКА
      %АСТРОНОМИЯ, АСТРОФИЗИКА И КОСМОЛОГИЯ
      %ФИЗИКА ЗЕМЛИ, АТМОСФЕРЫ И ГИДРОСФЕРЫ
      %ИНЖЕНЕРНАЯ ФИЗИКА
      \\[20pt]
      Название статьи\\ можно перенести на вторую строку }</code></pre>
      </div>
      <p><strong>Аффилиация</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\def\addressa{Название организации\\ адрес организации}
      \def\addressb{Название организации\\ адрес организации}

      \author{\firstname{И.О.}~\surname{Фамилия}}
      \email[E-mail:]{ivanovmail@mail.ru }
      \affiliation{\addressa}
      \author{\firstname{И.О.}~\surname{Фамилия}}
      \affiliation{\addressb}
      \author{\firstname{И.О.}~\surname{Фамилия}}
      \affiliation{\addressa}
      \affiliation{\addressb}</code></pre>
      </div>
      <p><strong>Аннотация и ключевые слова</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\begin{abstract}
      Аннотация должна кратно отражать постановку задачи, суть статьи и основные результаты.
      \end{abstract}

      \pacs{номера PACS см. \href{https://ufn.ru/ru/pacs/}{https://ufn.ru/ru/pacs/}}\par
      \keywords{ключевые слова с маленькой буквы, через
      запятую, с точкой в конце.  \\[5pt]}</code></pre>
      </div>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX section и subsection</span></div>
          <pre><code>\section{Введение}\label{intro}
      \section{\label{sec:level1}Название раздела (без точки в конце)}
      \subsection{Цитирование}
      \subsubsection{Example citations}</code></pre>
      </div>
      <p><strong>Математические символы и формулы</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX eqnarray</span></div>
          <pre><code>\begin{eqnarray}
      \chi_+(p)\alt{\bf [}2|{\bf p}|(|{\bf p}|+p_z){\bf ]}^{-1/2}
      \left(
      \begin{array}{c}
