sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Слева замените числа образца, справа смотрите PDF.</li>
      </ol>
      <p>Класс документа — <code>article</code>, опции <code>a4paper</code> и <code>12pt</code>. Поля <code>geometry</code>: сверху 1,3 см, снизу 2 см, слева и справа 1,5 см. Дата на титуле — <code>\today</code>. Округление проекта — до первой значащей цифры.</p>
  - id: description
    title: 'Что видно в PDF'
    html: |2-
      <p>Титул: «Физтех-школа физики и исследований им. Ландау», «Отчёт о выполнении лабораторной работы 3.2.2», «Резонанс напряжений». Автор образца — Иванов Иван Иванович, группа Б02-012, город Москва.</p>
      <p>Дальше идут такие разделы:</p>
      <ul>
          <li><strong>Введение.</strong> Цель: изучение последовательной цепи переменного тока, наблюдение резонанса напряжений. Приборы: регулировочный автотрансформатор, катушка индуктивности с выдвижным сердечником, магазин ёмкостей, реостат, резистор, амперметр, три вольтметра, ваттметр, осциллограф, универсальный мост.</li>
          <li><strong>Теоретические сведения.</strong> Цепь из резистора <code>R</code> и катушки с импедансом <code>Z_L = r_L + i \Omega L</code>. Рисунок <code>images/ohm_law_setup.png</code>, подпись «Схема установки для изучения закона Ома в цепи переменного тока».</li>
          <li><strong>Экспериментальная установка.</strong></li>
          <li><strong>Ход работы.</strong> Закон Ома в цепи переменного тока и резонанс напряжений. Таблицы собирают ток, напряжения, мощность, сопротивление и индуктивность катушки.</li>
          <li><strong>Вывод.</strong></li>
      </ul>
  - id: commands
    title: 'Какие фрагменты править'
    html: |2-
      <p>Первая таблица хода работы уже задана так. Столбцы — положение сердечника, ток, три напряжения и мощность.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">Расчёт</span></div>
          <pre><code>table(x_mm_display, I_A_display, U_R_V_display, U_L_V_display, U_RL_V_display, P_L_W_display, name_1="$x$, мм", name_2="$I$, А", name_3="$U_R$, В", name_4="$U_L$, В", name_5="$U_{R+L}$, В", name_6="$P_L$, Вт", orientation="vertical")</code></pre>
      </div>
      <ul>
          <li>Вторая таблица добавляет <code>r_L</code>, погрешность <code>r_L</code>, индуктивность <code>L</code> и её погрешность.</li>
          <li>Напряжения в теории записаны комплексными: <code>\widehat U_R = \widehat IR</code>, <code>\widehat U_L = \widehat I(r_L + i\Omega L)</code>.</li>
          <li>Графики рисует <code>pgfplots</code> с <code>compat=1.9</code>.</li>
      </ul>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Проверьте, что на резонансном участке напряжения и ток согласованы с вашими точками и что погрешности округлены до первой значащей цифры.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
      <p>В проекте уже собраны теория закона Ома, список приборов и таблицы резонанса. Остаётся подставить свои измерения.</p>
