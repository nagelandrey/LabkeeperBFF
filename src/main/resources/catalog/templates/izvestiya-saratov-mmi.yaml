      <p><strong>Аннотация и ключевые слова</strong></p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\ruabstract{В аннотации кратко излагаются основные результаты исследования без общих фраз. Основные требования:

      --	аннотация должна отражать содержание статьи, сохраняя ее структуру "--- введение, цели и задачи, методы исследования, результаты, заключение (выводы);

      -- оптимальный объем 200--250 слов;

      -- содержание аннотации не должно дословно повторять название или часть статьи;

      -- ссылки на список литературы, номера формул, теорем и пр. в аннотации недопустимы;

      -- избегайте формул, особенно сложных, так как  это  часто приводит к некорректному представлению статьи в различных базах данных и системах цитирования;

      --  не используйте длинные сложноподчиненные предложения, особенно имеющие двоякие толкования;

      -- следует избегать лишних вводных фраз (например, &lt;&lt;автор статьи рассматривает...&gt;&gt;). Исторические справки, если они не составляют основное содержание документа, описание ранее опубликованных работ и общеизвестные положения в аннотации не приводятся;

      --	аннотации на русском и английском языках не должны значительно отличатся по содержанию.

      Помните, что  качество перевода аннотации на английский язык в том числе зависит от качества текста на русском языке. Хорошо написанная аннотация повышает шансы статьи быть процитированной.}

      \rukeywords{ключевые слова служат ориентиром для читателя и используются для поиска статей в электронных базах. Рекомендуемое количество ключевых слов "--- 5--8, которые приводятся через запятую, без точки на конце}</code></pre>
      </div>
