sections:
  - id: start
    title: 'Как начать работу?'
    html: |2-
      <ol>
          <li>Войдите в личный кабинет онлайн-редактора Labkeeper.</li>
          <li>Создайте проект из шаблона.</li>
          <li>Слева замените измерения образца, справа смотрите PDF.</li>
      </ol>
      <p>Класс документа — <code>article</code>, опции <code>a4paper</code> и <code>12pt</code>. Поля: сверху 1,3 см, снизу 2 см, слева и справа 1,5 см. Формулы показывает <code>mathtools</code> с <code>showonlyrefs</code>, векторы можно набирать пакетом <code>physics</code>. Округление проекта — три знака.</p>
  - id: description
    title: 'Что видно в PDF'
    html: |2-
      <p>Титул: «Отчёт о выполнении лабораторной работы 4.1.1», «Изучение центрированных оптических систем». Автор образца — Иванов Иван Иванович, февраль 2023.</p>
      <p>Аннотация: системы из линз разной толщины, методы фокусных расстояний и аберрации плосковыпуклой сферической линзы.</p>
      <ul>
          <li><strong>Теоретические сведения.</strong> Способы определения фокусных расстояний, аберрации реальных систем, экспериментальная установка.</li>
          <li><strong>Тонкая собирающая линза.</strong> Формула <code>\frac{1}{a} + \frac{1}{a'} = \frac{1}{f}</code> с меткой <code>convergingLens</code>.</li>
          <li><strong>Оборудование и инструментальные погрешности.</strong></li>
          <li><strong>Результаты.</strong> Фокусные расстояния тонких линз, параметры сложной системы, продольная сферическая аберрация, хроматическая аберрация.</li>
          <li><strong>Обсуждение результатов и выводы.</strong></li>
      </ul>
  - id: commands
    title: 'Какие фрагменты править'
    html: |2-
      <p>Формула тонкой линзы в образце записана так. Расстояния <code>a</code> и <code>a'</code> и фокус <code>f</code> подставляют по своим измерениям.</p>
      <div class="article-code">
          <div class="article-code__header"><span class="article-code__lang">LaTeX</span></div>
          <pre><code>\begin{equation} \label{convergingLens}
        \frac{1}{a} + \frac{1}{a'} = \frac{1}{f},
      \end{equation}</code></pre>
      </div>
      <ul>
          <li>Таблицы оформлены пакетами <code>tabularx</code>, <code>longtable</code> и <code>booktabs</code>. Среду <code>table</code> переопределяет <code>\restylefloat{table}</code>.</li>
          <li>Расчёты фокусных расстояний и аберраций лежат в видимом вычислительном блоке сразу после текста результатов.</li>
          <li>Ссылки цветные: подключён <code>xcolor</code> с опцией <code>rgb</code> и <code>hyperref</code>.</li>
      </ul>
  - id: compile
    title: 'Компиляция и проверка'
    html: |2-
      <p>Нажмите кнопку компиляции в Labkeeper. Проверьте четыре серии результатов: тонкие линзы, сложная система, сферическая и хроматическая аберрации.</p>
  - id: link
    title: 'Ссылка на шаблон'
    html: |2-
